原因，无法清偿债务（选项BE当选）；（2）法定代表人下落不明且无其他人员负责管理财 产，无法清偿债务（选项A不当选）；（3）经人民法院强制执行，无法清偿债务（选项C当 选）；（4）长期亏损且经营扭亏困难，无法清偿债务（选项D当选）；（5）导致债务人丧 失清偿能力的其他情形。"},{"id":"14.23","chapter":14,"chapter_name":"破产法","type":"多选","question":"法院裁定受理破产申请后的法律后果包括（　）。","options":{"A":"有关债务人财产的保全措施应当解除","B":"有关债务人财产的执行程序应当终止","C":"有关债务人的刑事诉讼应当中止","D":"债务人法定代表人未经人民法院许可，不得离开住所地","E":"有关债务人的仲裁应当中止"},"answer":"ADE","explanation":"本题考查破产申请受理的法律效力。选项A当选、选项B不当选，人民 人民 法院受理破产申请后，有关债务人财产的保全措施应当解除，执行程序应当中止 法院受理破产申请后，有关债务人财产的保全措施应当解除，执行程序应当中止。选项C不 当选、选项E当选，人民法院受理破产申请后，已经开始而尚未终结的有关债务人的民事诉 讼或者仲裁应当中止；在管理人接管债务人的财产后，该诉讼或者仲裁继续进行。有关债务 人的行政诉讼或者刑事诉讼，不受破产程序的影响。选项D当选，债务人的有关人员（法定 代表人、财务管理人员和经理、监事等其他管理人员）自人民法院受理破产申请的裁定送达 债务人之日起至破产程序终结之日，未经人民法院许可，不得离开住所地。"},{"id":"14.24","chapter":14,"chapter_name":"破产法","type":"多选","question":"根据《企业破产法》的规定，下列属于管理人职责的有（　）。","options":{"A":"拟订破产财产变价方案","B":"决定是否解除双方均未履行完毕的合同","C":"代表破产企业参加民事诉讼","D":"决定破产分配方案","E":"决定债务人的内部管理事务"},"answer":"ABCE","explanation":"本题考查破产管理人职责。管理人履行下列职责：（1）接管债务人的 财产、印章和账簿、文书等资料；（2）调查债务人财产状况，制作财产状况报告；（3）决 定债务人的内部管理事务（选项E当选）；（4）决定债务人的日常开支和其他必要开支； （5）在第一次债权人会议召开之前，决定继续或者停止债务人的营业（应经人民法院许 可）；（6）管理和处分债务人的财产；（7）代表债务人参加诉讼、仲裁或者其他法律程序 （选项C当选）；（8）提议召开债权人会议；（9）人民法院认为管理人应当履行的其他职 责。选项B当选，人民法院受理破产申请后，管理人对破产申请受理前成立而债务人和对方 当事人均未履行完毕的合同有权决定解除或者继续履行。选项A当选、选项D不当选，管理 人有权拟订破产财产变价、分配方案。"},{"id":"14.25","chapter":14,"chapter_name":"破产法","type":"多选","question":"根据《企业破产法》的规定，在第一次债权人会议召开之前，管理人实施的下列行为中，应当经人民法院许可的有（　）。","options":{"A":"设定财产担保","B":"转让全部库存","C":"决定继续债务人的营业","D":"决定债务人的日常开支和其他必要开支","E":"履行债务人和对方当事人均未履行完毕的合同"},"answer":"ABCE","explanation":"本题考查管理人的职权。在第一次债权人会议召开之前，管理人决定 继续或者停止债务人的营业或者有《企业破产法》第69条规定行为之一的，应当经人民法院 许可（选项C当选）。《企业破产法》第69条规定如下：（1）涉及土地、房屋等不动产权 益的转让；（2）探矿权、采矿权、知识产权等财产权的转让；（3）全部库存或者营业的转 让（选项B当选）；（4）借款；（5）设定财产担保（选项A当选）；（6）债权和有价证券 的转让；（7）履行债务人和对方当事人均未履行完毕的合同（选项E当选）；（8）放弃权 利；（9）担保物的取回；（10）对债权人利益有重大影响的其他财产处分行为。 提示：在第一次债权人会议召开后，对于上述行为，管理人实施前应当及时报告债权人委员 会，未设立债权人委员会的，应当及时报告人民法院。"},{"id":"14.26","chapter":14,"chapter_name":"破产法","type":"多选","question":"下列关于破产债权申报的说法中，正确的有（　）。","options":{"A":"连带债权人可以由其中一人代表全体连带债权人申报债权","B":"债权人在确定的债权申报期限内未申报债权的，可以在破产财产最后分配前补充申报","C":"债权人在确定的债权申报期限内未申报债权的，可以在破产财产最后分配后补充申报","D":"诉讼、仲裁未决的债权，债权人可以进行申报","E":"债权人在确定的债权申报期限内未申报债权的，破产财产最后分配前已经进行的分配，不再对其补充分配"},"answer":"ABDE","explanation":"本题考查破产债权的申报。选项A当选，连带债权人可以由其中一人 代表全体连带债权人申报债权，也可以共同申报债权。选项BE当选、选项C不当选，债权人 应当在人民法院确定的债权申报期限内向管理人申报债权，未在规定期限申报债权的，可 以在破产财产最后分配前补充申报，但此前已经进行的分配，不再对其补充分配。选项D当 选，附条件、附期限的债权和诉讼、仲裁未决的债权，债权人可以进行申报。"},{"id":"14.27","chapter":14,"chapter_name":"破产法","type":"多选","question":"甲公司因经营管理不善，长期亏损，不能清偿到期债务，遂于2024年6月20日，向法院提出破产申请，法院于2024年6月25日裁定受理此案并予以公告。根据《企业破产法》的规定， 下列关于法院与管理人的做法中，正确的有（　）。","options":{"A":"法院确定债权申报期限为2024 年7 月1 日至2024 年7 月25 日","B":"管理人发现甲公司于2023 年11 月1 日无偿转让150 万元财产，遂向法院申请予以撤销，追回财产"},"answer":"BCDE","explanation":"本题考查破产债权的申报。选项A不当选，债权申报期限自人民法院 发布受理破产申请公告之日起计算，最短不得少于30日，最长不得超过3个月，本题中，债 权申报期起算时间并不是人民法院发布受理破产申请公告之日，法院做法不正确。选项B当 选，人民法院受理破产申请前1年内，债务人无偿转让财产的，管理人有权请求人民法院予 以撤销。选项CD当选，人民法院受理破产申请后，管理人对破产申请受理前成立而债务人和 对方当事人均未履行完毕的合同有权决定解除或者继续履行，并通知对方当事人。选项E当 选，人民法院受理破产申请后，债务人财产致人损害所产生的债务，该费用属于共益债务， 其清偿顺位劣于破产费用。"},{"id":"14.28","chapter":14,"chapter_name":"破产法","type":"多选","question":"根据《企业破产法》及司法解释的规定，不属于债务人财产的有（　）。","options":{"A":"债务人为他人保管的财产","B":"他人抵押给债务人的财产","C":"债务人以分期付款方式购买但尚未办理过户的房屋","D":"债务人已依法设定担保物权的特定财产","E":"破产申请受理后，依法执行回转的财产"},"answer":"ABC","explanation":"本题考查债务人财产。选项A当选，债务人基于保管关系占有的他人财 产不属于债务人财产。选项B当选，他人抵押给债务人的财产，所有权并不属于债务人，不 应认定为债务人财产。选项C当选，尚未办理过户的房屋，所有权不属于债务人，不应认定 为债务人财产。选项D不当选，债务人已依法设定担保物权的特定财产，所有权仍属于债务 人，应认定为债务人财产。选项E不当选，破产申请受理后，依法执行回转的财产，应当认 定为债务人财产。 提示：债务人以分期付款方式购买但尚未办理过户的房屋，属于双方均未履行完毕的合同， 在破产申请受理后，管理人可以决定解除或继续履行。"},{"id":"14.29","chapter":14,"chapter_name":"破产法","type":"多选","question":"根据《企业破产法》及相关规定，下列关于重整计划的说法中，正确的有（　）。","options":{"A":"债权人会议表决通过的重整计划，人民法院应当予以批准","B":"重整计划草案未获得法院批准的，法院应宣告债务人破产","C":"重整计划草案应由管理人制作","D":"重整计划执行人不执行重整计划的，经利害关系人请求，法院应当更换执行人继续执行重整计划","E":"债权人依照债权分类，对重整计划分组进行表决"},"answer":"BE","explanation":"本题考查重整计划。选项A不当选，人民法院经审查认为表决通过的重整 计划不符合有关规定的，应当裁定不予批准并终止重整程序。选项B当选，重整计划草案未 获得通过且未获得强制批准的，或者已通过的重整计划未获得批准的，人民法院应当裁定终 止重整程序，并宣告债务人破产。选项C不当选，债务人自行管理财产和营业事务的，由债 务人制作重整计划草案。管理人负责管理财产和营业事务的，由管理人制作重整计划草案。 选项D不当选，债务人不能执行或者不执行重整计划的，人民法院经管理人或者利害关系人 请求，应当裁定终止重整计划的执行，并宣告债务人破产。但为重整计划的执行提供的担保 继续有效。选项E当选，依照债权分类，参加讨论重整计划草案债权人会议的各类债权的债 权人，按担保债权组、职工债权组、税款债权组、普通债权组四个组别分组对重整计划草案 进行表决。"},{"id":"14.30","chapter":14,"chapter_name":"破产法","type":"多选","question":"根据《企业破产法》的规定，人民法院应当裁定重整程序终止的情形有（　）。","options":{"A":"债务人的行为致使管理人无法执行职务","B":"债务人或管理人未按期提出重整计划草案","C":"已通过的重整计划未获批准","D":"人民法院裁定批准重整计划草案","E":"因客观原因影响重整计划执行，但又不至于因此中止重整计划执行"},"answer":"ABCD","explanation":"本题考查重整程序的终止。导致重整程序终止的情形包括：（1）在 重整期间，债务人的经营状况和财产状况继续恶化，缺乏挽救的可能性；（2）在重整期 间，债务人有欺诈、恶意减少债务人财产或者其他显著不利于债权人的行为；（3）在重整 期间，由于债务人的行为致使管理人无法执行职务的，经管理人或者利害关系人请求，人民 法院审理确认后，应当裁定终止重整程序，并宣告债务人破产（选项A当选）；（4）债务人 或者管理人未按期提出重整计划草案的，人民法院应当裁定终止重整程序，并宣告债务人破 产（选项B当选）；（5）人民法院裁定批准重整计划草案的，应当裁定终止重整程序，并予 以公告（选项D当选）；（6）重整计划草案未获得通过且未获批准，或者已通过的重整计划 未获得批准，人民法院应当裁定终止重整程序，并宣告债务人破产（选项C当选）；（7）人 民法院经审查认为表决通过的重整计划不符合有关规定的，应当裁定不予批准并终止重整程 第十四章  破产法| 答案与解析 序。选项E不当选，因客观原因影响重整计划执行，但又不至于因此中止重整计划执行的， 不导致重整程序的终止。"},{"id":"14.31","chapter":14,"chapter_name":"破产法","type":"多选","question":"根据《企业破产法》的规定，下列关于和解与和解协议的说法中，正确的有（　）。","options":{"A":"和解以债权人向人民法院提出和解申请为前提","B":"和解协议须由人民法院裁定认可","C":"和解协议须经债权人会议决议通过","D":"人民法院裁定终止和解协议执行的，为和解协议的执行提供的担保无效","E":"按照和解协议减免的债务，自和解协议执行完毕时起，债务人不再承担清偿责任"},"answer":"BCE","explanation":"本题考查和解协议。选项A不当选，和解以债务人 债务人向人民法院提出和解 申请为前提。选项BC当选，和解协议经债权人会议决议通过后，须经人民法院裁定认可。 选项D不当选，人民法院裁定终止和解协议的，为和解协议的执行提供的担保继续有效。 选项E当选，按照和解协议减免的债务，自和解协议执行完毕时起，债务人不再承担清偿 责任。"},{"id":"14.32","chapter":14,"chapter_name":"破产法","type":"多选","question":"共益债务是指人民法院受理破产申请后，为了全体债权人的共同利益及破产程序顺利进行而发生的债务。根据《企业破产法》的规定，属于共益债务的有（　）。","options":{"A":"因管理人请求对方当事人履行双方均未履行完毕的合同所产生的债务","B":"因债务人不当得利所产生的债务","C":"为债务人继续营业而应支付的社会保险费用","D":"管理人执行职务的费用、报酬","E":"为债务人继续营业而支付的劳动报酬三、综合分析题"},"answer":"ABCE","explanation":"本题考查共益债务。共益债务，是指人民法院受理破产申请后，为了 全体债权人的共同利益以及破产程序顺利进行而发生的应由债务人财产负担的债务总称。包 括：（1）因管理人或者债务人请求对方当事人履行双方均未履行完毕的合同所产生的债务 （选项A当选）；（2）债务人财产受无因管理所产生的债务；（3）因债务人不当得利所产 生的债务（选项B当选）；（4）为债务人继续营业而应支付的劳动报酬和社会保险费用以及 由此产生的其他债务（选项CE当选）；（5）管理人或者相关人员执行职务致人损害所产生 的债务；（6）债务人财产致人损害所产生的债务。选项D不当选，管理人执行职务的费用、 报酬属于破产费用。 三、综合分析题"},{"id":"14.33","chapter":14,"chapter_name":"破产法","type":"综合","question":"甲公司为丙公司的全资子公司，于1992年11月经乙市市场监督管理局核准成立，注册资本人民币1 000万元。甲公司自开始经营以来内部管理一直存在严重问题，长年亏损，2017年度审计报 告显示甲公司资产负债率超出100%。甲公司有签订劳动合同的职工27人，至今拖欠职工工资、社 保费用和医疗保险费用。截至2018年4月，甲公司尚欠王某3 000万元、张某和周某各2 000万元无法 偿还。王某遂向乙市中级人民法院申请甲公司破产。乙市中级人民法院认为：申请人王某对被申请 人甲公司享有债权，事实清楚。现有证据显示，甲公司已不能清偿到期债务且明显缺乏清偿能力。 该法院遂裁定受理王某提出的破产申请，并于2018年5月8日向甲公司送达了通知书、破产申请材料 等。甲公司于2018年5月15日向该法院提交了书面意见，明确表示同意进行破产清算。该法院指定 丁律师事务所作为甲公司破产管理人。经破产管理人核实：甲公司对戊公司有1 000万元到期债权 尚未要求戊公司偿还，李某持有甲公司汽车一辆。此外，甲公司债权人周某于2018年3月1日向乙市 某基层人民法院起诉，请求甲公司偿还2 000万元借款。该基层人民法院当日受理周某的起诉，并 依周某申请对甲公司办公楼进行了财产保全。该案尚未结案。2018年6月10日，陈某因甲公司合同 违约，向该基层法院起诉要求甲公司承担违约赔偿责任。","sub_questions":[{"sub_num":1,"text":"除王某外，下列主体中，可以作为甲公司破产申请人的有（    ）。","options":{"A":"戊公司","B":"乙市工商局","C":"张某","D":"周某","E":"甲公司"},"answer":"CDE","explanation":"本题考查破产申请。破产申请人包括债务人（选项E当选）、债 权人（选项CD当选）、依法对债务人负有清算责任的人以及国务院金融监督管理机构。"},{"sub_num":2,"text":"乙市中级人民法院受理破产申请产生的法律后果有（    ）。","options":{"A":"办公楼的财产保全应当解除","B":"李某应当向管理人交付汽车","C":"周某起诉甲公司的诉讼应当终止","D":"该基层法院应驳回陈某的诉讼请求","E":"戊应当向管理人清偿"},"answer":"ABE","explanation":"本题考查破产申请受理的法律后果。选项A当选，人民法院受理 破产申请后，有关债务人财产的保全措施应当解除，执行程序应当中止。选项BE当选，人 民法院受理破产申请后，债务人的债务人或者财产持有人应当向管理人清偿债务或者交付 财产。选项C不当选，破产申请受理时案件尚未审结的，人民法院应当中止审理。选项D不 当选，破产申请受理后，债权人就债务人财产向人民法院提起民事诉讼的，人民法院不予 受理。"},{"sub_num":3,"text":"在法院受理破产申请后，宣告破产前，下列主体可以申请破产重整的有（    ）。","options":{"A":"王某","B":"丙公司","C":"周某","D":"丁律师事务所","E":"甲公司"},"answer":"BE","explanation":"本题考查重整申请人。选项BE当选，债权人 债权人（王某）申请 申请对债务人 （甲公司）进行破产清算的，债务人 债务人（甲公司）、出资额占债务人注册资本1/ 出资额占债务人注册资本1/10以 10以上的出资 上的出资 人（丙公司）可以在人民法院受理破产申请后、宣告债务人破产前向人民法院申请对债务人 进行重整，启动重整程序。"},{"sub_num":4,"text":"若甲公司破产重整不成功，经乙市中级人民法院裁定甲公司进入破产清算程序。下列费用和债务中，应最优先清偿的有（    ）。","options":{"A":"甲公司所拖欠的职工医疗保险费","B":"甲公司所拖欠的职工社保费","C":"应支付给丁律师事务所的破产管理费用","D":"欠王某的债务","E":"甲公司所拖欠的职工工资"},"answer":"C","explanation":"本题考查债务清偿顺序。破产财产在优先清偿破产费用（选项C当 选）和共益债务后，依照下列顺序清偿：①破产人所欠职工的工资和医疗、伤残补助、抚恤 费用，所欠的应当划入职工个人账户的基本养老保险、基本医疗保险费用，以及法律、行政 法规规定应当支付给职工的补偿金；②破产人欠缴的除前项以外的社会保险费用；③破产人 所欠税款；④普通破产债权。"}],"options":{},"answer":"","explanation":""},{"id":"14.34","chapter":14,"chapter_name":"破产法","type":"综合","question":"A省大丘实业有限公司（以下简称“大丘公司”）于2005年在A省海川市成立，由张某和其妻子李某共同设立。后经一系列增资扩股和股权转让，截至2020年12月31日，大丘公司注册资本 为2 000万元，实缴2 000万元，共有张某、李某、王某、吴某四名股东，分别持有30%、30%、 30%、10%的股权。 大丘公司成立了董事会和监事会。董事会由张某、王某和李某的弟弟李四三人组成，张某担任 董事长和法定代表人，监事会由李某和另外2名职工代表共三人组成，李某任监事会主席，同时兼 任公司经理。 自2021年初开始，吴某以大丘公司两年多未召开过股东会以及张某、李某经营“夫妻店”侵 占小股东利益等理由，联合王某多次向张某、李某施压，要求分配利润，张某和李某不理睬。同年 10月，未经董事会和股东会决议，张某擅自决定将大丘公司价值120万元的核心生产线低价转让给 其关联公司长青实业有限公司（公司章程规定，公司转让价值100万元以上的财产需要董事会和股 东会决议），导致大丘公司经营出现严重困难，至2021年底，大丘公司已资不抵债。 2022年2月，大丘公司的债权人周某向法院申请大丘公司破产，2月28日，法院受理。法院破 产管理人储备库内中介包括：海山会计师事务所，曾担任大丘公司2021年财务顾问；勤会律师事务 所，曾担任大丘公司2015年法律顾问；尚德税务所，曾担任大丘公司2015年至2017年税务顾问；联 华律师事务所，2015年曾担任大丘公司民事诉讼代理人，尚有20万元代理费未收到；华西律师事务 所，2017年曾代理过大丘公司股权纠纷，代理费已结清。法院最终指定了管理人。 管理人在调查大丘公司财产时发现： 借用董事李四的一辆高级轿车。 保管长青公司的一批材料。 已抵押给长青公司的一辆商务车。 尚未取得所有权的一批原材料。 大丘公司和长青公司各享有50%份额的一套共有房屋。管理人在清查大丘公司债权债务时发现： 2021年3月，大丘公司提前偿还长青公司50万元债务，该债务到期为2022年3月15日。 2021年6月，大丘公司虚构对长青公司一笔债务，金额为200万元。 2021年6月，大丘公司将一辆轿车无偿转让给长青公司。 2021年10月7日，大丘公司转让核心生产线给长青公司的价格是市场价格的50%。 2021年12月15日，大丘公司对所欠长青公司本无担保的100万元债务，以商务车设定抵押担保。后大丘公司因严重资不抵债，被人民法院宣告破产。 请根据案情，回答下列问题： 根据企业破产法律制度的规定，管理人可以请求法院予以撤销的有（    ）。","sub_questions":[{"sub_num":1,"text":"根据公司法律制度的规定，下列关于大丘公司管理行为和经营活动分析的说法中，正确的有（    ）。","options":{"A":"李某兼任监事会主席和经理符合公司法律制度的规定","B":"由张某担任董事长和法定代表人符合公司法律制度的规定","C":"监事会有两名职工代表担任监事，不符合公司法律制度的规定","D":"张某擅自决定转让核心生产线不符合公司法律制度的规定","E":"大丘公司两年不开股东会不符合公司法律制度的规定"},"answer":"BD","explanation":"本题考查公司组织机构。选项A不当选，董事、高级管理人员不得 董事、高级管理人员不得 兼任监事 兼任监事。公司高级管理人员，是指公司的经理、副经理、财务负责人、上市公司董事会秘 书和公司章程规定的其他人员。本题中，李某任监事会主席，同时兼任公司经理不符合公司 法律制度的规定。选项B当选，公司法定代表人依照公司章程的规定，由执行公司事务的董 事或者经理担任，并依法登记。选项C不当选，监事会应当包括股东代表和公司职工代表， 其中职工代表的比例不得低于1/3 不得低于1/3，具体比例由公司章程规定。本案中，大丘公司监事会共 有3名监事组成，其中，有两名职工代表，比例符合不得低于1/3的规定，符合公司法律制度 的规定。选项D当选，“转让核心生产线决定”根据公司章程的规定，未经董事会和股东会 决议通过，张某擅自决定转让的，不符合公司法律制度的规定。选项E不当选，股东会议分 为定期会议和临时会议两种。有限责任公司股东会的定期会议应当依照公司章程的规定按 时召开。题目信息并未表明大丘公司未召开的股东会类型，也未提及公司章程对股东会的 定期会议召开时间的规定，因此，不能认定大丘公司2年不开股东会不符合公司法律制度的 规定。"},{"sub_num":2,"text":"法院受理大丘公司破产申请的，应当在破产管理人名册中指定破产管理人。下列各项中，可以担任破产管理人的有（    ）。","options":{"A":"华西律师事务所","B":"联华律师事务所","C":"勤会律师事务所","D":"海山会计师事务所","E":"尚德税务所"},"answer":"ACE","explanation":"本题考查管理人。选项ACE当选，社会中介机构在受理破产申请 3年前结束中介服务，与本案无利害关系，均可担任管理人。不得担任管理人的情形包括： （1）因故意犯罪受过刑事处罚；（2）曾被吊销相关专业执业证书；（3）与本案有利害关 系；（4）人民法院认为不宜担任管理人的其他情形。选项BD不当选，所涉及情形分别属 于“与本案有利害关系”中“与债务人、债权人有未了结的债权债务关系”和“现在担任 或者在人民法院受理破产申请前3年内曾经担任债务人、债权人的财务顾问、法律顾问”的 情形。"},{"sub_num":3,"text":"根据企业破产法律制度的规定，下列属于破产财产的有（    ）。","options":{"A":"大丘和长青各享50% 份额的一套共有房屋","B":"尚未取得所有权的一批原材料","C":"抵押给长青公司的一辆商务车","D":"帮长青公司保管的一批材料","E":"借用董事李四的高级轿车"},"answer":"AC","explanation":"本题考查破产财产的认定。下列财产不应认定为债务人财产： （1）债务人基于仓储、保管、承揽、代销、借用、寄存、租赁等合同或者其他法律关系占 有、使用的他人财产（选项DE不当选）；（2）债务人在所有权保留买卖中尚未取得所有 权的财产（选项B不当选）；（3）所有权专属于国家且不得转让的财产；（4）其他依照法 律、行政法规不属于债务人的财产。"},{"sub_num":4,"text":"根据企业破产法律制度的规定，管理人可以请求法院予以撤销的有（　）。","options":{"A":"2021年6月，大丘公司将一辆轿车无偿转让给长青公司","B":"2021年3月，大丘公司提前偿还长青公司50万元债务","C":"2021年12月，大丘公司对所欠长青公司本无担保的100万元债务，以商务车设定抵押担保","D":"2021年6月，大丘公司虚构对长青公司的200万元债务","E":"2021年10月，大丘公司转让核心生产线给长青公司"},"answer":"ABCE","explanation":"本题考查破产撤销权。人民法院受理破产申请前1年内，涉及债 务人财产的下列行为，管理人有权请求人民法院依法予以撤销：（1）无偿转让财产的（选 项A当选）；（2）以明显不合理的价格进行交易的（选项E当选）；（3）对没有财产担保 的债务提供财产担保的（选项C当选）；（4）对未到期的债务提前清偿的（选项B当选）； （5）放弃债权的。选项D不当选，为逃避债务而隐匿、转移财产的行为和虚构债务或者承认 不真实债务的行为无效。 第十四章  破产法| 答案与解析 做新变 单项选择题"}],"options":{},"answer":"","explanation":""},{"id":"14.35","chapter":14,"chapter_name":"破产法","type":"单选","question":"根据破产法律制度的规定，下列关于破产债权的说法中，不正确的是（　）。","options":{"A":"商品房消费者支付价款超过合同总价款30% 的，不得享有优先权","B":"欠缴税款的滞纳金产生于破产案件受理后的属于普通破产债权","C":"超过诉讼时效的债权不属于破产债权","D":"各类惩罚性债权是劣后债权，劣后于普通债权受偿"},"answer":"B","explanation":"本题考查破产债权。选项A不当选，商品房消费者优先权需同时满足以下 条件：（1）主体是自然人消费者；（2）签订合法有效的书面买卖合同；（3）所购商品房 系用于居住；（4）购房人名下无其他用于居住的房屋；（5）已支付的价款超过合同总价 款的50%。选项B当选，欠缴税款的滞纳金产生于破产案件受理前的属于普通破产债权，产 生于破产案件受理后的则不属于破产债权。选项C不当选，超过诉讼时效的债权不属于破产 债权。选项D不当选，劣后债权是指破产财产按照法定清偿顺序在清偿普通债权后仍有剩余 的，才能清偿的债权，主要是各类惩罚性债权，如迟延履行的利息、罚款、罚金等。 第十五章  电子商务法 答案与解析 一、单项选择题"},{"id":"15.1","chapter":15,"chapter_name":"电子商务法","type":"单选","question":"根据《电子商务法》的规定，下列关于电子商务法的说法中，正确的是（　）。","options":{"A":"金融类产品适用《电子商务法》","B":"金融类服务适用《电子商务法》","C":"利用信息网络提供音视频节目适用《电子商务法》","D":"电子商务是通过互联网等信息网络销售商品或提供服务"},"answer":"D","explanation":"本题考查《电子商务法》的适用范围。选项ABC不当选，《电子商务法》 不适用 适用下列情况：（1）金融类产品和服务 金融类产品和服务；（2）利用信息网络 利用信息网络提供新闻信息、音视频节 目、出版以及文化产品等内容方面的服务。选项D当选，电子商务，是指通过互联网等信息 网络销售商品或者提供服务的经营活动。"},{"id":"15.2","chapter":15,"chapter_name":"电子商务法","type":"单选","question":"根据《电子商务法》的规定，下列各项中，不需要办理电子商务经营者登记的是（　）。","options":{"A":"个人销售自产农副产品","B":"个人从事药品批发零售","C":"个人从事食品销售","D":"个人从事生活用品零售"},"answer":"A","explanation":"本题考查电子商务经营者登记的内容。法律对不需要办理电子商务经营者 登记的例外是：（1）个人销售自产农副产品、家庭手工业产品的（选项A当选）；（2）个 人利用自己的技能从事依法无须取得许可的便民劳务活动和零星小额交易活动的；（3）依 照法律、行政法规不需要进行登记的。"},{"id":"15.3","chapter":15,"chapter_name":"电子商务法","type":"单选","question":"下列关于电子商务平台经营者的义务说法中，错误的是（　）。","options":{"A":"电子商务平台经营者应当核实平台内经营者身份","B":"电子商务平台经营者应当采取技术措施和其他必要措施保证其网络安全，防范网络违法犯罪活动","C":"电子商务平台经营者对平台交易信息应予以记录、保存，并且保存时间不少于2 年","D":"电子商务平台经营者不得利用服务协议对平台经营者在平台内的交易进行不合理限制"},"answer":"C","explanation":"本题考查电子商务平台经营者的义务。选项A不当选，电子商务平台经营 者应当核实 应当核实平台内经营者身份，配合市场监督管理部门、税务部门办理平台内经营者的工商 登记以及税务登记。选项B不当选，平台经营者应当采取技术措施和其他必要措施保证其网 络安全，防范网络违法犯罪活动，并应当制定网络安全事件应急预案。选项C当选，平台经 营者应对平台交易信息予以记录、保存，并且保存时间不少于 不少于3年 3年。选项D不当选，平台经营 者有义务确保平台内的公平交易，以维护消费者合法权益。平台经营者不得利用服务协议、 交易规则以及技术等手段对平台内经营者在平台内的交易、交易价格以及与其他经营者的交 易进行不合理限制或附带不合理条件。"},{"id":"15.4","chapter":15,"chapter_name":"电子商务法","type":"单选","question":"甲是为电子商务交易各方提供经营场所、交易撮合、信息发布的机构，乙在该平台内从事经营活动。下列关于甲、乙主体类型与义务的说法中，正确的是（　）。","options":{"A":"乙不需要办理市场主体登记","B":"甲应当为法人或非法人组织","C":"乙不需要公示营业执照信息","D":"甲不承担消费者权益保护义务"},"answer":"B","explanation":"本题考查电子商务经营者主体资格。选项A不当选，除个人销售自产农副产 品等少数情形外，电子商务经营者均需办理市场主体登记。选项B当选，只有法人、非法人组 织才能成为电商平台。选项C不当选，电子商务经营者应当在其首页显著位置公示营业执照信 息、行政许可信息等，信息变更需及时更新。选项D不当选，平台经营者应当承担消费者保护 义务，对关系消费者生命健康的商品或服务，平台经营者对平台内经营者的资质资格未尽到 审核义务，或者对消费者未尽到安全保障义务，造成消费者损害的，依法承担相应责任。"},{"id":"15.5","chapter":15,"chapter_name":"电子商务法","type":"单选","question":"2月3日，用户李某参与A平台乙商家举行的空气炸锅秒杀活动，点击“立即支付”完成了付款。但由于下单人数过多造成系统拥堵，李某的订单未提交成功。2月5日，乙商家采用快递 物流方式向李某发货。2月8日，李某签收该商品。下列关于电子商务合同的说法中，正确的 是（　）。","options":{"A":"因为用户李某的订单未提交成功，电子商务合同未成立","B":"2 月3 日，用户李某完成付款时，电子商务合同成立","C":"2 月5 日，A 平台向李某发货时，电子商务合同成立","D":"空气炸锅的交付时间为乙商家向用户李某发货时"},"answer":"B","explanation":"本题考查电子商务合同的成立。选项B当选、选项AC不当选，电子商务经 营者发布的商品或者服务信息符合要约条件的，用户选择该商品或者服务并提交订单成功， 合同成立。在承诺生效前，电子商务经营者与用户中的一方已经实际履行其所负担的主给付 义务且相对人予以接受（如电子商务经营者的发货行为或用户的付款行为），该合同成立的 时间也发生了前移。本题中，虽然用户李某的订单未提交成功，但李某已完成付款，已经 履行了其主给付义务并且相对人已接受，电子商务合同在完成付款时成立。选项D不当选， 合同标的为交付商品并采用快递物流方式交付的，收货人签收时间为交付时间。本题中， 2月8日，李某签收该商品，标的物交付时间为李某签收时。"},{"id":"15.6","chapter":15,"chapter_name":"电子商务法","type":"单选","question":"根据《电子商务法》的规定，下列关于电子商务合同交付时间的说法中，错误的是（　）。","options":{"A":"合同标的为提供服务的，生成的电子凭证或者实物凭证中载明的时间为交付时间","B":"合同标的为提供服务的，凭证载明时间与实际提供服务时间不一致的，凭证载明的时间为交付时间","C":"合同标的为交付商品并采用快递物流方式交付的，收货人签收时间为交付时间","D":"合同标的为采用在线传输方式交付的，合同标的进入对方当事人指定的特定系统并且能够检索识别的时间为交付时间"},"answer":"B","explanation":"本题考查电子商务合同的交付时间。选项A不当选、选项B当选，合同标 的为提供服务 提供服务的，生成的电子凭证或者实物凭证中载明的时间 生成的电子凭证或者实物凭证中载明的时间为交付时间；前述凭证没有载 明时间或者载明时间与实际提供服务时间不一致的，实际提供服务 实际提供服务的时间为交付时间。选 项C不当选，标的为交付商品并采用快递物流方式交付的，收货人签收时间为交付时间。选 项D不当选，合同标的为采用在线传输 在线传输方式交付的，合同标的进入 进入对方当事人指定的特定系 统并且能够检索识别的时间为交付时间。"},{"id":"15.7","chapter":15,"chapter_name":"电子商务法","type":"单选","question":"付某在某电商平台购入一台手机，电商平台负责将手机配送到家，并按照售价向付某开具了电子发票。根据《电子商务法》的规定，下列说法中，错误的是（　）。","options":{"A":"电商平台属于电子商务平台经营者","B":"电商平台应当向付某提供纸质发票","C":"电商平台向付某提供的电子发票与纸质发票具有同等效力","D":"付某提交订单成功时，合同成立"},"answer":"B","explanation":"本题考查电子商务合同相关内容。选项B当选，电子商务经营者销售商品 或者提供服务应当依法出具纸质发票或者电子发票等购货凭证或者服务单据。 二、多项选择题"},{"id":"15.8","chapter":15,"chapter_name":"电子商务法","type":"多选","question":"根据《电子商务法》的规定，下列属于电子商务特征的有（　）。","options":{"A":"虚拟性","B":"国际性","C":"超越时空性","D":"开放性","E":"经营性"},"answer":"ACE","explanation":"本题考查电子商务的特征。选项ACE当选，电子商务具有虚拟性、超越 时空性和经营性等特征。选项BD不当选，电子商务法的特征有国际性、技术性、开放性和复 合型。"},{"id":"15.9","chapter":15,"chapter_name":"电子商务法","type":"多选","question":"根据《电子商务法》的规定，下列属于电子商务平台经营者的有（　）。","options":{"A":"微商","B":"淘宝网","C":"网店","D":"滴滴出行","E":"美团"},"answer":"BDE","explanation":"本题考查电子商务平台经营者。选项A不当选，微商既不属于电子商务 平台经营者，也不属于平台内经营者，而是通过网络服务销售商品或提供服务的自建网站经 营者。选项C不当选，网店属于平台内经营者，而非电子商务平台经营者。选项BDE当选， 电子商务平台经营者，现实中通常被称为“电商平台”，如淘宝网、美团、滴滴出行等。 问题：电子商务经营者与电子商务平台经营者有什么区别？ 解答：电子商务经营者直接销售商品或服务，如淘宝店铺、直播卖货主播等；电子 商务平台经营者提供平台和服务技术，如淘宝、京东、美团等。 第十五章  电子商务法| 答案与解析"},{"id":"15.10","chapter":15,"chapter_name":"电子商务法","type":"多选","question":"下列关于数据电文发送和接收的说法中，正确的有（　）。","options":{"A":"发件人的信息系统自动发送的，视为发件人发送","B":"经发件人授权发送的，视为发件人发送","C":"当事人对发送或接收有特别约定的，从其约定","D":"当事人未指定特定系统接收的，以最先进入收件人任一系统的时间为接收时间","E":"收件人营业执照登记的住所地与主营业地不一致的，应以营业执照登记的住所地为接收地"},"answer":"ABCD","explanation":"本题考查电子合同订立和成立的规则。数据电文有下列情形之一的， 视为发件人发送：（1）经发件人授权发送的（选项B当选）；（2）发件人的信息系统自动 发送的（选项A当选）；（3）收件人按照发件人认可的方法对数据电文进行验证后结果相符 的。当事人对前述规定的事项另有约定的，从其约定（选项C当选）。选项D当选，当事人 未指定特定系统的，数据电文进入收件人的任何系统的首次时间，视为该数据电文的接收时 间。当事人对数据电文的发送时间、接收时间另有约定的，从其约定。选项E不当选，发件 人的主营业地为数据电文的发送地点，收件人的主营业地为数据电文的接收地点。没有主营 业地的，其经常居住地为发送或者接收地点。当事人对数据电文的发送地点、接收地点另有 约定的，从其约定。"},{"id":"15.11","chapter":15,"chapter_name":"电子商务法","type":"多选","question":"根据《电子签名法》的规定，可靠的电子签名应具备的条件包括（　）。","options":{"A":"签署时电子签名制作数据仅由签名人控制","B":"签署后对电子签名的任何改动能够被发现","C":"电子签名的制作数据在签名时归签名人专有","D":"签署后对数据电文内容的任何改动能够被发现","E":"电子签名无法被修改"},"answer":"ABCD","explanation":"本题考查电子签名的法律效力。可靠的电子签名应具备的条件： （1）电子签名制作数据用于电子签名时，属于电子签名人专有（选项C当选）；（2）签署 时电子签名制作数据仅由电子签名人控制（选项A当选）；（3）签署后对电子签名的任何 改动能够被发现（选项B当选）；（4）签署后对数据电文内容和形式的任何改动能够被发 现（选项D当选）。法律规定当事人也可以选择使用符合其约定的可靠条件的电子签名。选 项E不当选，所述情形并非可靠电子签名应具备的条件。"},{"id":"15.12","chapter":15,"chapter_name":"电子商务法","type":"多选","question":"下列各项中，属于电子签名特征的有（　）。","options":{"A":"电子签名是以电子形式出现的数据，可以确保电子文件在传输和存储过程中的完整性","B":"电子签名表达了签署者的意愿","C":"电子签名具有身份识别功能","D":"电子签名具有不可抵赖性","E":"电子签名签署后对数据电文内容的任何改动能够被发现"},"answer":"ABCD","explanation":"本题考查电子签名的特征。电子签名具有以下特征：（1）电子签名 是以电子形式出现的数据。电子签名可以确保电子文件在传输和存储过程中的完整性（选 项A当选）；（2）电子签名表达了签署者的意愿。电子签名是附着于数据电文的。电子签 名可以是数据电文的一个组成部分，也可以是数据电文的附属，与数据电文具有某种逻辑关 系，能够使数据电文与电子签名相联系（选项B当选）；（3）具有身份识别功能。电子签名 必须能够识别签名人身份并表明签名人认可与电子签名相联系的数据电文的内容（选项C当 选）；（4）电子签名具有不可抵赖性。签署者不能否认自己对电子文件的签名行为（选 项D当选）。选项E不当选，属于可靠电子签名应具备的条件之一。"},{"id":"15.13","chapter":15,"chapter_name":"电子商务法","type":"多选","question":"下列法律关系中，属于电子支付法律关系的有（　）。","options":{"A":"发端人与受益人交易形成的商务合同关系","B":"发端人、受益人与银行或支付机构之间的金融服务合同关系","C":"认证机构与用户之间的认证服务合同","D":"第三方支付中，买卖双方委托支付机构代为收取、保管和转移资金，形成委托合同或保管合同关系","E":"发端人、认证机构与银行之间的认证服务合同"},"answer":"ABCD","explanation":"本题考查电子支付法律关系。电子支付法律关系的内容涉及多种合同 关系：（1）商务合同关系，如发端人与受益人交易形成的商务合同关系（选项A当选）； （2）金融服务合同关系，如发端人、受益人与银行或支付机构之间基于服务协议形成的金 融服务合同关系（选项B当选）；（3）委托保管关系，在第三方支付中，买卖双方委托支付 机构代为收取、保管和转移资金，形成委托合同或保管合同关系（选项D当选）；（4）担 保关系，第三方支付机构在一些业务中为确保资金安全而可能承担的担保责任；（5）认证 服务合同关系，认证机构与用户之间因提供身份认证服务而形成的认证服务合同（选项C当 选、选项E不当选）。"},{"id":"15.14","chapter":15,"chapter_name":"电子商务法","type":"多选","question":"对电子商务征税的税收基本原则包括（　）。","options":{"A":"公平与效率原则","B":"公序良俗原则","C":"税收中性原则","D":"灵活性原则","E":"税收法定原则"},"answer":"ACDE","explanation":"本题考查电子商务税收的基本原则。选项ACDE当选，对电子商务征 税的一般税收原则：（1）税收中性原则；（2）公平与效率原则；（3）税收法定原则； （4）灵活性原则。 第十六章  民事诉讼法 答案与解析 一、单项选择题"},{"id":"16.1","chapter":16,"chapter_name":"民事诉讼法","type":"单选","question":"下列关于民事诉讼法基本原则的说法中，正确的是（　）。","options":{"A":"处分原则意味着当事人可以任意处分自己的民事权利和诉讼权利","B":"当事人诉讼权利平等原则意味着当事人拥有相同的诉讼权利","C":"法院调解原则下调解不成的，应当进行二次调解","D":"双方当事人在法院的主持下，就案件的事实和争议的问题，各自陈述主张和根据，互相进行辩驳和论证是辩论原则的表现"},"answer":"D","explanation":"本题考查民事诉讼基本原则。选项A不当选，处分原则指当事人有权在法 律规定的范围内处分自己的民事权利和诉讼权利。选项B不当选，当事人诉讼权利平等原则 意味着双方当事人的诉讼地位、诉讼权利义务平等，并不意味 不意味着当事人的诉讼权利相同 诉讼权利相同。选 项C不当选，法院调解原则内容包括：（1）法院调解活动贯穿审判程序整个过程；（2）法 院调解要在自愿和合法的基础上进行；（3）对调解不成的案件法院应当及时判决。"},{"id":"16.2","chapter":16,"chapter_name":"民事诉讼法","type":"单选","question":"下列关于民事诉讼基本制度的说法中，正确的是（　）。","options":{"A":"离婚案件一律不公开审理","B":"特别程序审理的案件实行两审终审制度","C":"证人与本案有利害关系可能影响本案公正审理的，应当依法回避","D":"基层法院适用小额诉讼程序审理的民事纠纷由审判员一人独任审理"},"answer":"D","explanation":"本题考查民事诉讼基本制度。选项A不当选，涉及国家秘密的案件、涉 及个人隐私的案件或者法律另有规定不公开审理的案件不能公开审理。离婚案件 离婚案件、涉及商 业秘密 业秘密的案件，当事人申请不公开审理的，可以不公开 可以不公开审理。选项B不当选，按照小额诉讼 程序、特别程序、督促程序以及公示催告程序审理的案件，一律实行一审终审。选项C不当 选，回避的对象包括审判人员、法官助理、书记员、司法技术人员、翻译人员、鉴定人、勘 验人；检察人员从事民事检察活动，遇有法定情形也应依法回避。回避的对象不包括证人。 选项D当选，基层法院适用简易程序、小额诉讼程序审理的民事纠纷以及基层法院审理的基 本事实清楚、权利义务关系明确的第一审民事案件，可以由审判员一人适用普通程序独任 审理。"},{"id":"16.3","chapter":16,"chapter_name":"民事诉讼法","type":"单选","question":"下列关于民事诉讼管辖的说法中，正确的是（　）。","options":{"A":"对同一案件两个以上法院都有管辖权的，称为协议管辖","B":"法院受理案件后发现无管辖权时，将案件移送给有管辖权的法院审理，称为移送管辖","C":"对同一案件两个以上法院都有管辖权的，当事人选择其中一个法院起诉的，是指定管辖","D":"对同一案件两个以上法院都有管辖权的，当事人选择其中一个法院起诉的，是专属管辖"},"answer":"B","explanation":"本题考查民事诉讼管辖的概念。选项A不当选，对同一案件两个以上法院 都有管辖权的，为共同管辖。协议管辖，是指当事人在争议发生之前或发生之后，用书面协 议的方式，选择管辖法院。选项B当选，案件由无权管辖的法院移送至有权管辖的法院称为 移送管辖。选项CD不当选，对同一案件两个以上法院都有管辖权的，当事人选择其中一个 法院起诉的，是选择管辖。指定管辖，是指上级法院依照法律规定，指定其辖区内下级法院 对某一具体案件行使管辖权。专属管辖，是指基于法律规定，某些案件必须由特定的法院管 辖，其他法院无权管辖，也不准许当事人协议变更管辖。 问题：如何区分移送管辖和指定管辖？ 解答： 情形 移送管辖 指定管辖 启动原因 法院自己无管辖权 争议不决/特殊原因 主体 法院自行移送 必须由上级法院指定"},{"id":"16.4","chapter":16,"chapter_name":"民事诉讼法","type":"单选","question":"下列关于民事诉讼当事人的说法中，正确的是（　）。","options":{"A":"胎儿可以作为诉讼当事人","B":"精神病人有诉讼行为能力","C":"以未成年人为被告的诉讼，未成年人的法定代理人是当事人","D":"以无民事行为能力人为被告的诉讼，无民事行为能力人的监护人是当事人"},"answer":"A","explanation":"本题考查民事诉讼的当事人。选项A当选，《民法典》规定的遗产继承中 享有的民事权利能力的胎儿具有诉讼权利，可以作为诉讼当事人。选项B不当选，在特殊情 况下，如未成年人、精神病人等，虽有诉讼权利能力，却没有诉讼行为能力，只能由其法定 代理人代理其诉讼。选项CD不当选，民事诉讼的当事人以自己名义进行民事诉讼活动，而 未成年人的法定代理人、无民事行为能力人的监护人，作为法定代理人参加诉讼，不属于当 事人。"},{"id":"16.5","chapter":16,"chapter_name":"民事诉讼法","type":"单选","question":"甲承租了8位村民的土地，租赁期限约定为5年。在合同履行的第3年，甲因受到该8位村民的联合干扰，导致无法对土地进行正常经营使用，遂将8位村民作为共同被告诉至法院，请求 判令排除妨碍。诉讼过程中，8位村民共同向甲提起了反诉。下列关于本案诉讼类型认定的 说法中，正确的是（　）。","options":{"A":"本诉属于普通共同诉讼，反诉属于必要共同诉讼","B":"本诉属于必要共同诉讼，反诉属于普通共同诉讼","C":"本诉与反诉均属于普通共同诉讼","D":"本诉与反诉均属于必要共同诉讼"},"answer":"C","explanation":"本题考查民事诉讼中共同诉讼。选项C当选，普通共同诉讼是指诉讼标的 为同一种类，人民法院认为可以合并审理并经当事人同意的诉讼。本案中，甲基于与8位村 民分别订立但内容同类的土地租赁合同，主张各村民分别实施的妨碍行为侵害其土地使用 权，诉讼标的属于同一种类而非同一个，且各村民的行为和责任相互独立，故本诉为普通共 同诉讼。8位村民提起的反诉，亦是基于各自与甲的租赁合同关系分别主张权利，诉讼标的 同样属于同一种类，且不具备必须合一确定的必要性，故反诉亦为普通共同诉讼。选项AB不 当选，因本诉与反诉的诉讼类型应当一致。选项D不当选，必要共同诉讼要求诉讼标的是共 同的，即当事人对诉讼标的享有共同的权利或承担共同的义务，必须一同起诉或应诉，本案 中各村民与甲之间的租赁关系相互独立，不符合必要共同诉讼的特征。"},{"id":"16.6","chapter":16,"chapter_name":"民事诉讼法","type":"单选","question":"根据《民事诉讼法》的规定，下列事实中，当事人无须举证证明的是（　）。","options":{"A":"习惯","B":"当事人主张的实体权益所根据的事实","C":"当事人主张的具有程序性质的法律事实","D":"自然规律"},"answer":"D","explanation":"本题考查民事诉讼的证明。选项D当选，民事诉讼中，法律规定免于证 明的事实包括：自然规律以及定理、定律。选项ABC不当选，其所述事实均须当事人举证 证明。"},{"id":"16.7","chapter":16,"chapter_name":"民事诉讼法","type":"单选","question":"根据《民事诉讼法》的规定，下列关于民事诉讼证人的说法中，正确的是（　）。","options":{"A":"与一方当事人有利害关系的证人陈述的证言，不能单独作为认定案件事实的根据","B":"证人必须出庭作证","C":"未成年人不得作为证人出庭作证","D":"不论证人是否出庭作证，法院均可将其书面证言作为定案事实根据"},"answer":"A","explanation":"本题考查民事诉讼的证人。选项A当选，与一方当事人或者其代理人有利 有利 害关系 害关系的证人陈述的证言，不能单独 不能单独作为认定案件事实的根据。选项C不当选，待证事实与 第十六章  民事诉讼法| 答案与解析 其年龄、智力状况或者精神健康状况相适应的无民事行为能力人和限制民事行为能力人，可 以作为证人。选项BD不当选，双方当事人同意证人以其他方式作证并经法院准许的，证人可 以不出庭作证。无正当理由 无正当理由未出庭的证人以书面等方式提供的证言，不得作为 不得作为认定案件事实 的根据。"},{"id":"16.8","chapter":16,"chapter_name":"民事诉讼法","type":"单选","question":"根据《民事诉讼法》的规定，下列关于民事诉讼起诉与受理的说法中，正确的是（　）。","options":{"A":"对于裁判抚养费案件发生法律效力后，一方当事人因新理由起诉要求增加费用的，法院不予受理","B":"起诉应当向人民法院递交起诉状，故须书面起诉","C":"当事人超过诉讼时效期间起诉的，人民法院不再受理","D":"适用普通程序审理的案件，一般应当在立案之日起6 个月内审结"},"answer":"D","explanation":"本题考查民事诉讼程序。选项A不当选，赡养费、扶养费、抚养费案件， 裁判发生法律效力后，因新情况、新理由，一方当事人再行起诉要求增加或减少费用的，法 院应作为新案件受理。选项B不当选，起诉应当向人民法院递交起诉状，并按照被告人数提 出副本。书写起诉状 书写起诉状确有困难的，可以口头 可以口头起诉。选项C不当选，当事人超过诉讼时效期间 起诉的，人民法院应予受理。 二、多项选择题"},{"id":"16.9","chapter":16,"chapter_name":"民事诉讼法","type":"多选","question":"根据《民事诉讼法》的规定，下列关于专属管辖的说法中，正确的有（　）。","options":{"A":"因不动产纠纷提起的诉讼，由不动产所在地人民法院管辖","B":"对适用专属管辖的案件，准许当事人协议变更管辖","C":"因港口作业中发生纠纷提起的诉讼，由港口所在地人民法院管辖","D":"因继承遗产纠纷提起的诉讼，应由被继承人死亡时住所地法院管辖","E":"因继承遗产纠纷提起的诉讼，可以由主要遗产所在地法院管辖"},"answer":"ACE","explanation":"本题考查专属管辖。选项B不当选，专属管辖，是指基于法律规定，某 些案件必须由特定的法院管辖，其他法院无权管辖，也不准许当事人协议变更管辖。属于专 属管辖的情况如下：（1）因不动产纠纷提起的诉讼，由不动产所在地法院管辖（选项A当 选）；（2）因港口作业中发生纠纷提起的诉讼，由港口所在地法院管辖（选项C当选）； （3）因继承遗产 继承遗产纠纷提起的诉讼，由被继承人死亡时住所地 被继承人死亡时住所地或者主要遗产所在地 主要遗产所在地法院管辖 （选项D不当选、选项E当选）。"},{"id":"16.10","chapter":16,"chapter_name":"民事诉讼法","type":"多选","question":"根据《民事诉讼法》的规定，下列涉外民事案件中，属于我国法院专属管辖的有（　）。","options":{"A":"与在我国领域内设立的法人解散纠纷提起的诉讼","B":"涉外民事纠纷的当事人书面协议选择我国法院管辖的","C":"我国法院审理明显更为方便的诉讼","D":"与在我国领域内审查授予的知识产权的有效性有关的纠纷提起的诉讼","E":"在我国领域内履行中外合资经营企业合同发生纠纷提起的诉讼"},"answer":"ADE","explanation":"本题考查涉外民事案件的专属管辖。下列涉外的民事案件，由我国法院 专属管辖：（1）因在我国领域内设立的法人或者其他组织的设立、解散、清算，以及该法 人或者其他组织作出的决议的效力等纠纷提起的诉讼（选项A当选）；（2）因与在我国领域 内审查授予的知识产权的有效性有关的纠纷提起的诉讼（选项D当选）；（3）因在我国领域 内履行中外合资经营企业合同、中外合作经营企业合同、中外合作勘探开发自然资源合同发 生纠纷提起的诉讼（选项E当选）。"},{"id":"16.11","chapter":16,"chapter_name":"民事诉讼法","type":"多选","question":"根据《民事诉讼法》的规定，下列属于民事公益诉讼受案范围的有（　）。","options":{"A":"环境污染","B":"破坏生态环境","C":"破坏资源保护","D":"侵害众多消费者合法权益","E":"知识产权侵权"},"answer":"ABCD","explanation":"本题考查民事公益诉讼。选项ABCD当选，公益诉讼，是指为保护社 会公共利益为目的的诉讼。对污染环境、侵害众多消费者合法权益等损害社会公共利益的行 为，法律规定的机关和有关组织可以向法院提起诉讼。对污染环境、侵害众多消费者合法权 益等损害社会公共利益的行为，法律规定的机关和有关组织可以向法院提起诉讼。检察院在 履行职责中发现破坏生态环境和资源保护、食品药品安全领域侵害众多消费者合法权益等损 害社会公共利益的行为，在没有前述规定的机关和组织或者前述规定的机关和组织不提起诉 讼的情况下，可以向法院提起诉讼。"},{"id":"16.12","chapter":16,"chapter_name":"民事诉讼法","type":"多选","question":"在民事诉讼中，普通的共同诉讼必须具备的条件有（　）。","options":{"A":"诉讼标的属同一种类","B":"几个诉讼必须属于同一人民法院管辖"},"answer":"ABC","explanation":"本题考查普通的共同诉讼。普通的共同诉讼必须同时具备以下四个条 件：（1）诉讼标的属同一种类（选项A当选）；（2）几个诉讼必须属于同一人民法院管辖 （选项B当选）；（3）几个诉讼必须适用同一种诉讼程序（选项C当选）；（4）合并审理能 够达到简化诉讼程序、节省时间和费用的目的。选项D不当选，共同诉讼中，当事人一方或 双方为2人以上，并不要求双方均为2人以上。选项E不当选，普通的共同诉讼当事人之间没 有共同的权利和义务。"},{"id":"16.13","chapter":16,"chapter_name":"民事诉讼法","type":"多选","question":"下列民事诉讼证据中，属于物证的有（　）。","options":{"A":"证明甲、乙婚姻关系存在的结婚证","B":"证明甲伤害乙侵权事实的沾上乙血迹的木棒","C":"证明甲公司财务情况的会计账簿","D":"证明甲、乙谈话内容的录音","E":"证明甲、乙在共同伤人现场的鞋印"},"answer":"BE","explanation":"本题考查民事诉讼证据的法定种类。选项AC不当选，证明甲、乙婚姻关 系存在的结婚证和证明甲公司财务情况的会计账簿都是以其内容或思想来证明 内容或思想来证明待证事实，属 于书证 书证。选项BE当选，沾上乙血迹的木棒和现场的鞋印是用物品的外形、特征、质量等证明 物品的外形、特征、质量等证明 待证事实，属于物证 物证。选项D不当选，证明甲、乙谈话内容的录音如果存储在录音磁带中， 属于视听资料，如果存储在电子介质中，则属于电子数据。"},{"id":"16.14","chapter":16,"chapter_name":"民事诉讼法","type":"多选","question":"根据《民事诉讼法》的规定，下列属于电子数据证据的有（　）。","options":{"A":"在微博上发布的信息","B":"电子邮件","C":"存储在电子介质中的录音资料和影像资料","D":"利用录像、录音磁带反映出的图像和音像信息","E":"微信聊天记录"},"answer":"ABCE","explanation":"本题考查电子数据证据的认定。选项D不当选，属于视听资料。"},{"id":"16.15","chapter":16,"chapter_name":"民事诉讼法","type":"多选","question":"下列选项中，不能单独作为认定案件事实的证据包括（　）。","options":{"A":"无正当理由未出庭作证的证人证言","B":"原告提交的合同文书复印件，但该合同文书的原件丢失，被告不承认其与原告存在有该合同文书复印件所表述的法律关系","C":"未成年人作出的所有证言","D":"原告甲向法院提交的其采取偷录方式录下的用以证明被告乙、丙欠其1 万元人民币的录音带，该录音带部分关键录音听不清楚","E":"当事人王某的妻子张某向法院作出的有利于丈夫的证言"},"answer":"BDE","explanation":"本题考查民事诉讼证据的认定。选项A不当选，无正当理由未出庭的证 人以书面等方式提供的证言，不得作为认定案件事实的根据。不能单独作为认定案件事实根 据的证据包括：（1）当事人的陈述；（2）无民事行为能力人、限制民事行为能力人所作 的与其年龄、智力状况或者精神健康状况不相当的证言（并非所有证言，选项C不当选）； （3）与一方当事人或者其代理人有利害关系的证人陈述的证言（选项E当选）；（4）存有 疑点的视听资料、电子数据（选项D当选）；（5）无法与原件、原物核对的复制件、复制品 （选项B当选）。"},{"id":"16.16","chapter":16,"chapter_name":"民事诉讼法","type":"多选","question":"根据《民事诉讼法》的规定，下列关于起诉的说法中，正确的有（　）。","options":{"A":"起诉必须有明确的被告","B":"起诉必须递交起诉状，不得口头起诉","C":"未成年人不得以自己的名义起诉","D":"超过诉讼时效的案件不得起诉","E":"原告撤诉后，又以同一诉讼请求再次起诉的，法院应予受理"},"answer":"AE","explanation":"本题考查民事诉讼的起诉。选项A当选，提起民事诉讼必须有明确的被 告。选项B不当选，起诉原则上应当向人民法院递交起诉状，书写起诉状确有困难的，可以 口头起诉，由人民法院记入笔录，并告知对方当事人。选项C不当选，未成年人可以作为原 告，以自己的名义起诉，由其法定代理人代理参加诉讼。选项D不当选，诉讼时效期间届 满，当事人不丧失起诉权，即超过诉讼时效期间的案件，可以起诉。选项E当选，原告撤诉 或法院按撤诉处理后，原告以同一诉讼请求再次起诉的，法院应予受理。"},{"id":"16.17","chapter":16,"chapter_name":"民事诉讼法","type":"多选","question":"下列关于民事诉讼简易程序适用规则的说法中，正确的有（　）。","options":{"A":"适用简易程序的，举证期限不得超过15 日","B":"法院在审理过程中，发现案件不宜适用简易程序的，裁定驳回起诉","C":"第一审和第二审程序都可以适用简易程序","D":"适用简易程序案件的举证期限由法院确定","E":"法院适用简易程序审理案件，应当在立案之日起3 个月内审结，特殊情况下可以延期"},"answer":"AE","explanation":"本题考查简易程序。选项A当选、选项D不当选，适用简易程序案件的 举证期限由法院确定，也可以由当事人协商一致并经法院准许，但不得超过15日。选项B不 当选，法院在审理过程中，发现案件不宜适用简易程序的，裁定转为普通程序。选项C不当 选，第二审程序不可以适用简易程序 第二审程序不可以适用简易程序。选项E当选，法院适用简易程序审理案件，应当在立 案之日起3个月内审结。审理期限到期后，双方当事人同意继续适用简易程序的，由本院院 长批准，可以延长审理期限，但延长后的审理期限累计不得超过6个月。 第十七章  刑法 答案与解析 一、单项选择题"},{"id":"17.1","chapter":17,"chapter_name":"刑法","type":"单选","question":"刑法的基本原则是在刑事立法和刑事司法中必须遵循的具有全局性和根本性的准则。下列原 则中，属于刑法基本原则的是（　）。","options":{"A":"公开审判原则","B":"罪刑法定原则","C":"疑罪从无原则","D":"认罪从宽原则"},"answer":"B","explanation":"本题考查刑法基本原则。选项B当选，刑法的基本原则包括罪刑法定原 则、平等适用刑法原则以及罪刑相当原则（也称“罪刑相适应原则、罪刑均衡原则”）。"},{"id":"17.2","chapter":17,"chapter_name":"刑法","type":"单选","question":"下列关于追诉时效计算的说法中，正确的是（　）。","options":{"A":"法定最高刑为不满5 年有期徒刑的，追诉时效为5 年","B":"法定最高刑为10 年以上有期徒刑的，追诉时效为20 年","C":"法定最高刑为死刑的，不受追诉时效限制","D":"法定最高刑为5 年以上不满10 年的有期徒刑，追诉时效为15 年"},"answer":"A","explanation":"本题考查追诉时效。选项A当选，犯罪经过下列期限不再追诉：法定最 高刑为不满5年有期徒刑的，经过5年；法定最高刑为5年以上不满10年有期徒刑的，经过 10年；法定最高刑为10年以上有期徒刑的，经过15年；法定最高刑为无期徒刑、死刑的，经 过20年。如果20年 20年以后认为必须追诉 以后认为必须追诉的，须报请最高人民检察院 报请最高人民检察院核准。"},{"id":"17.3","chapter":17,"chapter_name":"刑法","type":"单选","question":"根据《刑法》的规定，在追诉期限以内又犯罪的，计算前罪追诉期限的起点是（　）。","options":{"A":"犯后罪之日","B":"前罪行为结束之日","C":"前罪行为开始之日","D":"前罪成立之日"},"answer":"A","explanation":"本题考查追诉时效的中断。选项A当选，根据规定，在追诉期限以内又犯 罪的，前罪追诉的期限从犯后罪之日起计算。"},{"id":"17.4","chapter":17,"chapter_name":"刑法","type":"单选","question":"根据《刑法》及相关法律规定，下列关于未成年人和老年人犯罪的定罪与量刑的说法中，正确的是（　）。","options":{"A":"犯罪时不满18 周岁的人，可以作为一般累犯","B":"犯罪时不满16 周岁的人，不负刑事责任","C":"审判时已满75 周岁的被告人，一般不适用死刑","D":"已满75 周岁的被告人故意犯罪，应当减轻处罚"},"answer":"C","explanation":"本题考查自然人的刑事责任能力。选项A不当选，犯罪时不满 犯罪时不满18周 18周岁的人 岁的人 不作为累犯 不作为累犯。选项B不当选，已满14周岁不满16周岁的人，犯故意杀人、故意伤害致人重伤 或者死亡、强奸、抢劫、贩卖毒品、放火、爆炸、投放危险物质罪的，应当负刑事责任。已 满12周岁不满14周岁的人，犯故意杀人、故意伤害罪，致人死亡或者以特别残忍手段致人 重伤造成严重残疾，情节恶劣，经最高人民检察院核准追诉的，应当负刑事责任。选项C当 选，审判时已满75周岁的人，一般不适用死刑，但以特别残忍手段致人死亡的除外。选 项D不当选，已满 已满75周 75周岁的人故意 故意犯罪的，可以 可以从轻或者减轻处罚，过失 过失犯罪的，应当 应当从轻 或减轻处罚。"},{"id":"17.5","chapter":17,"chapter_name":"刑法","type":"单选","question":"根据《刑法》的规定，下列关于附加刑适用规则的说法中，正确的是（　）。","options":{"A":"附加刑只能附加适用","B":"罚金由一审人民法院执行","C":"对一个犯罪只能适用一个附加刑","D":"判处有期徒刑10 年的，可以附加剥夺政治权利终身"},"answer":"B","explanation":"本题考查附加刑的适用。选项A不当选，附加刑既可以独立适用 附加刑既可以独立适用，也可以 附加适用。选项B当选，罚金由一审人民法院执行。犯罪分子的财产在异地的，一审人民法 院可以委托财产所在地人民法院代为执行。选项C不当选，附加适用时，对一个犯罪可以适 用两个或两个以上的附加刑。选项D不当选，对于被判处死刑、无期徒刑的犯罪分子，应当 剥夺政治权利终身。对于危害国家安全的犯罪分子，应当 应当附加剥夺政治权利。对于故意杀 人、强奸、放火、爆炸、投毒、抢劫等严重破坏社会秩序的犯罪分子，可以 可以附加剥夺政治 权利。"},{"id":"17.6","chapter":17,"chapter_name":"刑法","type":"单选","question":"根据《刑法》的规定，下列关于附加刑适用的说法中，正确的是（　）。","options":{"A":"罚金不可以单独适用","B":"对危害国家安全的犯罪分子，应当附加剥夺政治权利","C":"罚金应在判决指定的期限内一次缴纳","D":"在没收财产时，可以用追缴犯罪所得来代替"},"answer":"B","explanation":"本题考查附加刑的适用。选项A不当选，罚金属于附加刑，既可以独立适 用，也可以附加适用。选项B当选，危害国家安全的犯罪分子，应当附加剥夺政治权利；对 于故意杀人、强奸、放火、爆炸、投毒、抢劫等严重破坏社会秩序的犯罪分子，可以附加剥 夺政治权利；对于被判处死刑、无期徒刑的犯罪分子，应当剥夺政治权利终身。选项C不当 选，罚金在判决指定的期限内一次或者分期缴纳。选项D不当选，在没收财产时，不得以追 缴犯罪所得、没收违禁品和供犯罪所用的本人财物来代替或者折抵。"},{"id":"17.7","chapter":17,"chapter_name":"刑法","type":"单选","question":"根据《刑法》的规定，下列有关管制与禁止令的说法中，正确的是（　）。","options":{"A":"禁止令的期限必须与管制的期限相同","B":"禁止令由公安机关负责执行","C":"对判处管制的犯罪分子，可以根据犯罪情况，同时宣布禁止令","D":"检察院对公安机关执行禁止令的活动进行监督"},"answer":"C","explanation":"本题考查管制与禁止令。选项A不当选，禁止令的期限，既可以与管制执 行期限相同，也可以短于管制执行的期限，但不得少于3个月。选项BD不当选，禁止令由司 法行政机关指导管理的社区矫正机构 社区矫正机构负责执行 执行，人民检察院 人民检察院对社区矫正机构执行禁止令的活 动实行监督 监督。选项C当选，对判处管制的犯罪分子可以根据犯罪情况，同时宣布禁止令。"},{"id":"17.8","chapter":17,"chapter_name":"刑法","type":"单选","question":"下列有关累犯适用刑罚的说法中，正确的是（　）。","options":{"A":"可以酌情适用缓刑","B":"可以适用假释","C":"可以从重处罚","D":"应当从重处罚"},"answer":"D","explanation":"本题考查累犯。选项AB不当选，累犯不得缓刑、不得假释。选项C不当 选、选项D当选，对累犯应当从重处罚。 问题：累犯的刑罚适用口诀。 解答：累犯不缓刑、不假释、应从重、可减刑。 第十七章  刑法| 答案与解析"},{"id":"17.9","chapter":17,"chapter_name":"刑法","type":"单选","question":"甲因故意犯罪被判处有期徒刑，有期徒刑执行完毕后又犯罪，下列关于甲是否构成累犯的说法中，正确的是（　）。","options":{"A":"若后罪是交通肇事罪，可能构成","B":"若后罪在前罪刑罚执行完毕后5 年内发生，可能构成","C":"若后罪应当被判处拘役，可能构成","D":"若犯后罪时不满18 周岁，可能构成"},"answer":"B","explanation":"本题考查一般累犯。一般累犯的成立条件：（1）前罪和后罪 前罪和后罪都必须是故 意犯罪（选项A不当选）；（2）前罪被判处的刑罚和后罪应当判处的刑罚都必须是有期徒刑 有期徒刑 以上 以上的刑罚（选项C不当选）；（3）后罪必须发生在前罪刑罚执行完毕或者赦免以后的5年 5年 之内 之内（选项B当选）；（4）累犯不适用于不满 累犯不适用于不满18周 18周岁的人犯罪 岁的人犯罪（选项D不当选）。 提示：交通肇事罪不是故意犯罪。根据法律规定，交通肇事罪是指违反道路交通管理法规， 发生重大交通事故，致人重伤、死亡或者使公私财产遭受重大损失，依法被追究刑事责任的 犯罪行为。该罪在主观方面表现为过失，包括疏忽大意的过失和过于自信的过失。"},{"id":"17.10","chapter":17,"chapter_name":"刑法","type":"单选","question":"根据《刑法》规定，下列情形中，构成一般累犯的是（　）。","options":{"A":"张某因故意伤害罪被判处有期徒刑3 年，刑满释放后第4 年又犯故意杀人罪被判处无期徒刑","B":"李某因交通肇事罪被判处有期徒刑2 年，刑满释放后第3 年又犯故意伤害罪被判有期徒刑3 年","C":"王某因盗窃罪被判处有期徒刑1 年，缓刑2 年，缓刑考验期满后第3 年又犯诈骗罪被判有期徒刑4 年","D":"刘某因诈骗罪被判处拘役6 个月，释放后第2 年又犯敲诈勒索罪被判有期徒刑1 年"},"answer":"A","explanation":"本题考查累犯。选项A当选，一般累犯的成立条件：（1）前罪和后罪都必 须是故意犯罪；（2）前罪和后罪判处的刑罚都必须是有期徒刑以上的刑罚；（3）后罪必须 发生在前罪刑罚执行完毕或者赦免以后的5年之内。选项B不当选，前罪交通肇事罪属于过失 犯罪，不构成累犯。选项D不当选，前罪被判处拘役的，不构成累犯。选项C不当选，被判处 有期徒刑宣告缓刑的犯罪分子，在缓刑考验期满后5年内再犯应当判处有期徒刑以上刑罚之 罪的，因前罪判处的有期徒刑并未执行不具备《刑法》第65条规定的“刑罚执行完毕”的要 件，故不应认定为累犯，但可以作为新罪确定刑罚时的酌定从重情节予以考虑。"},{"id":"17.11","chapter":17,"chapter_name":"刑法","type":"单选","question":"下列关于立功认定的说法中，正确的是（　）。","options":{"A":"犯罪分子只要揭发他人的犯罪行为，应认定为立功","B":"犯罪分子提供的侦破其他案件的重要线索是通过非法手段获取的，不能认定为立功","C":"犯罪分子检举揭发的他人犯罪，犯罪嫌疑人依法可能被判处10 年以上有期徒刑的，应认定有重大立功表现","D":"犯罪分子的亲友揭发他人犯罪行为，经查证属实的，认定犯罪分子有立功表现"},"answer":"B","explanation":"本题考查立功。选项A不当选，犯罪分子揭发他人犯罪行为，提供侦破其 他案件重要线索的，必须经查证属实，才能认定为立功。选项B当选，据以立功的线索、 材料来源有下列情形之一的，不能认定为立功：（1）本人通过非法手段或者非法途径获取 的；（2）本人因原担任的查禁犯罪等职务获取的；（3）他人违反监管规定向犯罪分子提供 的；（4）负有查禁犯罪活动职责的国家机关工作人员或者其他国家工作人员利用职务便利 提供的。选项C不当选，犯罪分子检举揭发的他人犯罪，提供侦破其他案件的重要线索，阻 止他人的犯罪活动，或者协助司法机关抓捕的其他犯罪嫌疑人，犯罪嫌疑人、被告人依法可 能被判处无期徒刑以上刑罚的，应当认定为有重大立功表现。选项D不当选，立功必须是犯 罪分子本人实施的行为。为使犯罪分子得到从轻处理，犯罪分子的亲友直接向有关机关揭发 他人犯罪行为，提供侦破其他案件的重要线索，或者协助司法机关抓捕其他犯罪嫌疑人的， 不能认定为犯罪分子有立功表现。"},{"id":"17.12","chapter":17,"chapter_name":"刑法","type":"单选","question":"被采取强制措施的犯罪嫌疑人、被告人和已宣判的罪犯，如实供述司法机关尚未掌握的本人其他罪行的行为，属于（　）。","options":{"A":"坦白","B":"重大立功","C":"自首","D":"一般立功"},"answer":"C","explanation":"本题考查自首。选项A不当选、选项C当选，犯罪以后自动投案，如实供 述自己罪行的，是自首。被采取强制措施的犯罪嫌疑人、被告人和已宣判的罪犯，如实供述 司法机关尚未掌握的罪行，与司法机关已掌握的或者判决确定的罪行属不同罪行的，以自首 论。选项BD不当选，立功，是指犯罪分子揭发他人犯罪行为，查证属实，或者提供重要案件 线索，从而得以侦破其他案件的行为。题述情形下不属于立功，自然也就不属于一般立功或 重大立功。"},{"id":"17.13","chapter":17,"chapter_name":"刑法","type":"单选","question":"张某因犯盗窃罪被判处有期徒刑5年，在刑罚执行3年后，又发现他在判决宣告前还犯有抢劫罪，应判处有期徒刑7年。经数罪并罚决定执行10年有期徒刑。对张某还需要继续执行的刑 期是（　）。","options":{"A":"5 年","B":"7 年","C":"10 年","D":"12 年"},"answer":"B","explanation":"本题考查数罪并罚。选项B当选，判决宣告以后，刑罚执行完毕以前，发 现被判刑的犯罪分子在判决宣告以前还有其他罪没有判决的（漏罪），应当对新发现的罪作 出判决，把前后两个判决所判处的刑罚，依照《刑法》第69条的规定，决定执行的刑罚。已 经执行的刑罚应当计算在新判决决定的刑期以内，即“先并后减”。本题中，甲因盗窃罪、 抢劫罪数罪并罚共计执行有期徒刑10年，已经执行3年，未来还需执行7年有期徒刑。"},{"id":"17.14","chapter":17,"chapter_name":"刑法","type":"单选","question":"根据《刑法》的规定，下列罪犯中，可以宣告缓刑的是（　）。","options":{"A":"被判处3 年以下有期徒刑的罪犯","B":"被判处5 年有期徒刑且已满75 周岁的罪犯","C":"累犯","D":"犯罪集团的首要分子"},"answer":"A","explanation":"本题考查缓刑的适用。选项A当选、选项B不当选，对被判处拘役、3年以 下有期徒刑的犯罪分子，依其犯罪情节和悔罪表现，暂缓执行刑罚确实不致再危害社会的， 可以适用缓刑。选项CD不当选，累犯和犯罪集团的首要分子不适用缓刑。 问题：为什么“被判处5年有期徒刑且已满75周岁的罪犯”不当选？ 解答：“对不满18周岁的人、怀孕的妇女和已满75周岁的人，应当宣告缓刑”，该 规定的前提条件 前提条件是“符合缓刑条件”，最重要的一项条件是被判处的刑罚为 “拘役或3年以下有期徒刑”，若被判处的刑罚不属于上述情形，则无论未成 年人、孕妇还是已满75周岁的老年人，均不能适用缓刑。"},{"id":"17.15","chapter":17,"chapter_name":"刑法","type":"单选","question":"根据《刑法》的规定，被判处有期徒刑或者无期徒刑的犯罪分子，符合规定条件的，可以予以假释。下列可以适用假释的犯罪情形是（　）。","options":{"A":"因抢劫罪被判处8 年有期徒刑的犯罪分子，实际已经执行5 年刑期，狱中表现良好，确有悔改表现","B":"因暴力抢劫被判处10 年有期徒刑的犯罪分子，实际已经执行6 年刑期，狱中表现良好，确有悔改表现","C":"因受贿罪被判处15 年有期徒刑的犯罪分子，实际已经执行5 年刑期，狱中表现良好，确有悔改表现","D":"被判处无期徒刑的犯罪分子，实际已经执行12 年刑期，狱中表现良好，确有悔改表现"},"answer":"A","explanation":"本题考查假释。选项A当选、选项CD不当选，被判处有期徒刑的犯罪分 子，执行原判刑期1/2以上；被判处无期徒刑的犯罪分子，实际执行13年以上，如果认真遵 守监规，接受教育改造，确有悔改表现，没有再犯罪的危险的，可以假释。选项B不当选， 对累犯以及因故意杀人、强奸、抢劫、绑架、放火、爆炸、投放危险物质或者有组织的暴力 性犯罪被判处10年以上有期徒刑、无期徒刑的犯罪分子，不得假释。 问题：选项A所犯因抢劫罪而被判有期徒刑，为什么还可以假释？ 解答：“因故意杀人、强奸、抢劫、绑架、放火、爆炸、投放危险物质或者有组 织的暴力性犯罪被判处10年以上有期徒刑、无期徒刑的犯罪分子，不得假 释”，此规定的适用要求有二：罪名与判处刑罚的种类和期限。任一条件不 满足，则不能适用本规定。选项A中，虽然犯罪分子犯抢劫罪，但是被判刑罚 为8年有期徒刑，不属于“10年以上”，因此，不适用该规定，其可以假释。"},{"id":"17.16","chapter":17,"chapter_name":"刑法","type":"单选","question":"根据《刑法》的规定，下列关于假释的说法中，正确的是（　）。","options":{"A":"无期徒刑的假释考验期为10 年","B":"犯故意杀人罪的不得假释","C":"有期徒刑假释须执行原判刑期1/3 以上","D":"无期徒刑假释须实际执行12 年以上"},"answer":"A","explanation":"本题考查假释。选项A当选、选项B不当选，因故意杀人、强奸、抢劫、绑 架、放火、爆炸、投放危险物质或有组织的暴力性犯罪被判处10年 10年以上有期徒刑、无期徒刑 以上有期徒刑、无期徒刑 的犯罪分子，不得假释 不得假释。选项CD不当选，被判处有期 有期徒刑的犯罪分子，执行原判刑期1/ 1/2以 2以 上；被判处无期 无期徒刑的犯罪分子，实际执行13年 13年以上 以上；如果认真遵守监规，接受教育改造， 确有悔改表现，没有再犯罪的危险的犯罪分子，可以假释。"},{"id":"17.17","chapter":17,"chapter_name":"刑法","type":"单选","question":"根据《刑法》的规定，下列有关减刑、假释适用对象的说法中，正确的是（　）。","options":{"A":"减刑只适用于被判处有期徒刑和无期徒刑的犯罪分子","B":"累犯不适用减刑","C":"假释只适用于被判处管制、拘役和有期徒刑的犯罪分子","D":"累犯不适用假释"},"answer":"D","explanation":"本题考查减刑、假释。选项A不当选，减刑的适用对象为被判处管制、拘 役、有期徒刑或者无期徒刑的犯罪分子。选项B不当选、选项D当选，累犯不得缓刑和假释， 但可以适用减刑。选项C不当选，假释的适用对象为被判处有期徒刑或者无期徒刑的犯罪 分子。"},{"id":"17.18","chapter":17,"chapter_name":"刑法","type":"单选","question":"下列对判决宣告前一人犯数罪，适用数罪并罚的做法中，正确的是（　）。","options":{"A":"数罪并罚中判处有拘役和有期徒刑的，拘役、有期徒刑分别执行","B":"数罪中判处有多个种类相同附加刑的，合并执行附加刑","C":"有期徒刑总和刑期超过35 年的，执行刑期不超过20 年","D":"数罪中判处有管制和有期徒刑的，执行有期徒刑"},"answer":"B","explanation":"本题考查数罪并罚。选项A不当选，数罪中有判处有期徒刑和拘役的，执 行有期徒刑。选项B当选，数罪中有判处附加刑的，附加刑仍须执行，其中附加刑种类相同 第十七章  刑法| 答案与解析 的，合并执行，种类不同的，分别执行。选项C不当选，数罪并罚时，有期徒刑总和刑期不 满35年的，最高不能超过20年；总和刑期在35年以上的，最高不能超过25年。选项D不当 选，数罪中有判处有期徒刑和管制，或者拘役和管制的，有期徒刑、拘役执行完毕后，管制 仍须执行。"},{"id":"17.19","chapter":17,"chapter_name":"刑法","type":"单选","question":"根据《刑法》的规定，下列纳税人的行为中，可能构成逃税罪的是（　）。","options":{"A":"威胁税务工作人员抗拒缴纳税款","B":"采用欺骗手段不缴纳税款","C":"聚众抗拒缴纳税款","D":"隐匿财产致使税务机关无法追缴到其欠缴的税款"},"answer":"B","explanation":"本题考查逃税罪。抗税罪，是指纳税人、扣缴义务人故意违反税收法规， 以暴力、威胁方法拒不缴纳 暴力、威胁方法拒不缴纳税款的一种犯罪。选项AC不当选，所述行为均可能构成抗税罪。 选项B当选，逃税罪是指纳税人采取欺骗、隐瞒手段 欺骗、隐瞒手段进行虚假纳税申报或者不申报，逃避缴 纳税款，使国家税收受到侵害，数额较大的一种犯罪。选项D不当选，其所述行为可能构成 逃避追缴欠税罪。逃避追缴欠税罪，是指纳税人欠缴应纳税款，采取转移或者隐匿财产 转移或者隐匿财产的手 段，致使税务机关无法追缴欠缴的税款，且数额较大的一种犯罪。"},{"id":"17.20","chapter":17,"chapter_name":"刑法","type":"单选","question":"根据《刑法》的规定，下列行为中，不能构成伪造、出售伪造的增值税专用发票罪的是（　）。","options":{"A":"变造增值税专用发票","B":"个人私自印制增值税专用发票","C":"明知增值税专用发票系伪造仍出售","D":"明知系伪造的增值税专用发票仍购买"},"answer":"D","explanation":"本题考查伪造、出售伪造的增值税专用发票罪。选项A不当选，变造增值 税专用发票的，按伪造增值税专用发票论处。选项B不当选，增值税专用发票由国家税务总 局指定的企业印制，其他单位或者个人私自印制的，即构成伪造。选项C不当选，伪造、出 售伪造的增值税专用发票罪是指个人或者单位以营利为目的，非法印制或者出售非法印制的 增值税专用发票的一种犯罪。选项D当选，明知是伪造的增值税专用发票仍然购买的，属于 购买伪造的增值税专用发票罪。"},{"id":"17.21","chapter":17,"chapter_name":"刑法","type":"单选","question":"纳税人缴纳税款后，采取假报出口手段骗取国家出口退税款。骗取税款数额超过其缴纳的税款部分，涉嫌构成（　）。","options":{"A":"骗取出口退税罪","B":"虚开用于骗取出口退税、抵扣税款发票罪","C":"抗税罪","D":"逃税罪"},"answer":"A","explanation":"本题考查骗取出口退税罪。选项A当选，对纳税人实施假报出口或者其他 欺骗手段，骗取国家出口退税款的，应当分情况定罪处罚：纳税人缴纳税款后，采取上述欺 骗方法，骗取所缴税款的，按逃税罪处罚；骗取税款超过所缴纳的税款部分，以骗取出口退 税罪论处。"},{"id":"17.22","chapter":17,"chapter_name":"刑法","type":"单选","question":"2022年8月，被告人李某为非法获利在无注册资金的情况下申请注册成立了甲公司，并担任法定代表人。2022年12月至2023年7月期间，李某经王某介绍，在无货物交易的情况下，采 取按发票税额收取开票费的方法，以甲公司名义为M市乙公司开具增值税专用发票18份，发 票上注明税额为15万元。乙公司将其中的16份发票向当地税务部门申报抵扣。2023年10月至 2024年2月期间，李某采取上述同样方法，为N市丙公司开具增值税专用发票22份，发票上注 明税额为25万元。丙公司将上述发票向税务部门全部申报抵扣。下列关于涉案公司与李某的 相关行为性质的说法中，正确的是（　）。","options":{"A":"乙公司的行为属于为他人虚开","B":"甲公司构成单位犯罪","C":"丙公司的行为属于介绍他人为自己虚开","D":"李某的行为属于为他人虚开"},"answer":"D","explanation":"本题考查虚开增值税专用发票罪。选项A不当选，乙公司并未为他人开发 票，其行为不属于为他人虚开增值税专用发票，而属于让他人为自己虚开增值税专用发票。 选项B不当选，甲公司是由李某为非法获利而设立，且以实施犯罪为主要活动。个人为进行 违法犯罪活动而设立公司、企业、事业单位实施犯罪的，或者公司、企业、事业单位设立 后，以实施犯罪为主要活动的，不以单位犯罪论处，因此甲公司不构成单位犯罪。选项C不 当选，丙公司的行为未涉及介绍他人虚开增值税专用发票，而属于“让他人为自己虚开增值 税专用发票”。选项D当选，李某实施了为他人虚开增值税专用发票的行为，构成为他人虚 开增值税专用发票罪。"},{"id":"17.23","chapter":17,"chapter_name":"刑法","type":"单选","question":"2022年7月以来，陶某等人分别以自己或者家庭成员名义，先后注册15家公司，从税务机关骗购各类普通发票共计2.4万份，以200元至1 000元不等的价格对外出售9 000余份，涉案金 额近亿元，非法获利200余万元。本案中，陶某涉嫌的罪名是（　）。","options":{"A":"非法出售发票罪","B":"非法购买发票罪","C":"出售伪造发票罪","D":"出售抵扣税款发票罪"},"answer":"A","explanation":"本题考查非法出售发票罪的立案追诉标准。选项A当选，非法出售增值税专 用发票、用于骗取出口退税、抵扣税款的其他发票以外的发票，涉嫌下列情形之一的，应予立 案追诉：（1）非法出售增值税专用发票、用于骗取出口退税、抵扣税款的其他发票以外的发 票100份以上且票面金额累计在30万元以上的；（2）票面金额累计在50万元以上的；（3）非 法获利数额在1万元以上的。陶某非法出售普通发票，达到非法出售发票罪的立案标准。"},{"id":"17.24","chapter":17,"chapter_name":"刑法","type":"单选","question":"根据《2022年修订后的刑事案件立案追诉标准规定（二）》，下列各项中，属于非法购买增值税专用发票应予立案追诉情形的是（　）。","options":{"A":"非法购买的增值税专用发票票面税额累计在20 万元以上","B":"非法购买的增值税专用发票票面税额累计在10 万元以上","C":"非法购买增值税专用发票或者购买伪造的增值税专用发票10 份以上且票面税额在6 万元以上的","D":"非法购买增值税专用发票或者购买伪造的增值税专用发票100 份以上且票面税额在5 万元以上的"},"answer":"A","explanation":"本题考查非法购买增值税专用发票的立案追诉标准。非法购买增值税专用 发票或者购买伪造的增值税专用发票，涉嫌下列情形之一的，应予立案追诉：（1）非法购 买增值税专用发票或者购买伪造的增值税专用发票20份以上且票面税额在10万元以上的行为 （选项CD不当选）；（2）票面税额累计在20万元以上的（选项A当选、选项B不当选）。"},{"id":"17.25","chapter":17,"chapter_name":"刑法","type":"单选","question":"根据《刑法》的规定，下列犯罪中，犯罪主体仅限于纳税人的是（　）。","options":{"A":"逃税罪","B":"骗取出口退税罪","C":"抗税罪","D":"逃避追缴欠税罪"},"answer":"D","explanation":"本题考查涉税犯罪主体。选项A不当选，逃税罪的犯罪主体是纳税人和扣 缴义务人。选项B不当选，骗取出口退税罪犯罪主体是一般主体，既可以是纳税人，也可以 是非纳税人。选项C不当选，抗税罪犯罪主体是纳税人或者扣缴义务人。选项D当选，逃避追 缴欠税罪的犯罪主体为纳税人，扣缴义务人不构成逃避追缴欠税罪主体。"},{"id":"17.26","chapter":17,"chapter_name":"刑法","type":"单选","question":"税务人员徇私舞弊是徇私舞弊不征、少征税款罪的客观方面要件之一，下列情形中，构成本罪客观方面要件的是（　）。","options":{"A":"纳税人提供虚假材料骗取减免税导致不征或少征税款","B":"税务人员工作严重不负责任导致不征或少征税款","C":"税务人员为照顾朋友违规决定不征或少征税款","D":"税务人员因税收业务不熟造成不征或少征税款"},"answer":"C","explanation":"本题考查徇私舞弊不征、少征税款罪。选项ABD不当选，徇私舞弊不征、 少征税款罪，主观上为故意，关键点在于徇私情。因纳税人提供假材料、税收业务不熟练以 及工作严重不负责任（玩忽职守）导致不征或少征税款，并非故意不征或少征，也并非徇私 情。选项C当选，为照顾朋友违规不征或少征属于故意，且为徇私情，属于本罪客观方面构 成要件。"},{"id":"17.27","chapter":17,"chapter_name":"刑法","type":"单选","question":"张某为甲市市场监督管理局副局长，因收受辖区内市场商户孙某10万元，未将孙某销售有毒有害食品案件移交公安机关。下列对张某的处罚方式中，正确的是（　）。","options":{"A":"仅按受贿罪处罚","B":"仅按徇私枉法罪处罚","C":"按徇私舞弊不移交刑事案件罪和受贿罪数罪并罚","D":"仅按徇私舞弊不移交刑事案件罪处罚"},"answer":"C","explanation":"本题考查涉税职务犯罪。选项C当选，行政执法人员徇私舞弊，对依法应 当移交司法机关追究刑事责任的案件不移交，情节严重，同时又因此而收受他人贿赂，则构 成徇私舞弊不移交刑事案件罪与受贿罪两个罪名，应实行数罪并罚。"},{"id":"17.28","chapter":17,"chapter_name":"刑法","type":"单选","question":"下列渎职犯罪中，犯罪主体须为税务机关工作人员的是（　）。","options":{"A":"玩忽职守罪","B":"徇私舞弊发售发票、抵扣税款、出口退税罪","C":"违法提供出口退税凭证罪","D":"徇私舞弊不移交刑事案件罪"},"answer":"B","explanation":"本题考查渎职犯罪。选项A不当选，玩忽职守罪的主体为国家机关工作人 员，并不仅限于税务机关工作人员。选项B当选，徇私舞弊发售发票、抵扣税款、出口退税 罪犯罪主体为税务机关工作人员。选项C不当选，违法提供出口退税凭证罪犯罪主体是海 关、外汇管理等国家机关工作人员，其他自然人或单位均不能成为违法提供出口退税凭证罪 的主体。选项D不当选，徇私舞弊不移交刑事案件罪犯罪主体必须是行政执法人员，具体是 指在工商、税务、监察等依法具有行政执法权的行政机关中承担执法工作的公务人员。 二、多项选择题"},{"id":"17.29","chapter":17,"chapter_name":"刑法","type":"多选","question":"根据《刑法》的规定，犯罪必须具有的特征有（　）。","options":{"A":"刑事违法性","B":"应受刑罚处罚性","C":"主观故意性","D":"严重的社会危害性","E":"一般违法性"},"answer":"ABD","explanation":"本题考查犯罪的特征。犯罪，是《刑法》规定应当受到刑罚处罚的严 重危害社会的行为，具有严重的社会危害性（选项D当选）、刑事违法性（选项A当选）和 应受刑罚处罚性（选项B当选）。"},{"id":"17.30","chapter":17,"chapter_name":"刑法","type":"多选","question":"根据《刑法》的规定，犯罪构成要件通常包括（　）。","options":{"A":"犯罪客体","B":"犯罪动机","C":"犯罪主体","D":"犯罪主观方面","E":"犯罪客观方面"},"answer":"ACDE","explanation":"本题考查犯罪构成要件。任何犯罪的成立都必须具备四个方面的构 成要件，即犯罪客体（选项A当选）、犯罪客观方面（选项E当选）、犯罪主体（选项C当 选）、犯罪主观方面（选项D当选）。选项B不当选，犯罪目的和犯罪动机只存在于直接故意 犯罪中，并非任何犯罪都必须具备。"},{"id":"17.31","chapter":17,"chapter_name":"刑法","type":"多选","question":"根据《刑法》的规定，下列关于对未成年人犯罪案件处理的说法中，正确的有（　）。","options":{"A":"犯罪时不满18 周岁的人，即使以特别残忍手段致人死亡，也不适用死刑","B":"已满16 周岁的人犯罪，应当负刑事责任","C":"因犯罪时不满16 周岁，不予刑事处罚的，责令其父母或者其他监护人加以管教","D":"对未成年人犯罪，应当免除处罚","E":"对未成年人犯罪，应当判处缓刑"},"answer":"ABC","explanation":"本题考查未成年犯罪的从宽处理规定。选项A当选，犯罪时不满 犯罪时不满18周 18周岁 的人，一律不适用死刑 的人，一律不适用死刑。选项B当选，已满16周岁的人犯罪，应当负刑事责任。选项C当选， 因不满16周岁不予刑事处罚的，责令其父母或者其他监护人加以管教；在必要的时候，依法 进行专门的矫治教育。选项D不当选，对未成年人 未成年人犯罪，应当从轻 应当从轻或减轻处罚，并非免除处 罚。选项E不当选，不满18周岁的人犯罪，符合缓刑条件的，应当予以缓刑。"},{"id":"17.32","chapter":17,"chapter_name":"刑法","type":"多选","question":"根据《刑法》的规定，下列关于主刑和附加刑的说法中，正确的有（　）。","options":{"A":"主刑适用缓刑的，附加刑随之免除","B":"主刑适用缓刑的，附加刑仍需执行","C":"附加刑不能单独适用","D":"一个犯罪可以适用两个以上的附加刑","E":"对数罪宣告的刑罚中，多种附加刑合并执行"},"answer":"BD","explanation":"本题考查主刑和附加刑。选项A不当选、选项B当选，缓刑的效力不及于 缓刑的效力不及于 附加刑 附加刑，即被宣告缓刑的犯罪分子，如果被判处附加刑，附加刑仍需执行。选项C不当选，附 加刑既可以独立适用，也可以附加适用。选项D当选，附加适用时，对一个犯罪可以适用两个 或两个以上的附加刑。选项E不当选，对数罪宣告的刑罚中有附加刑的，附加刑仍须执行，即 附加刑与主刑采取并科原则。其中附加刑种类相同的，合并执行，种类不同的，分别执行。 第十七章  刑法| 答案与解析"},{"id":"17.33","chapter":17,"chapter_name":"刑法","type":"多选","question":"犯罪后自动投案是认定为自首的必要条件。下列情形中，应当视为犯罪嫌疑人自动投案的有（　）。","options":{"A":"正在投案途中，被公安机关捕获的，经查实确属真实情况的","B":"犯罪后逃跑，在被通缉、追捕的过程中，主动投案的","C":"犯罪后逃至亲属家中，在亲属家中被公安机关抓获的","D":"明知他人报案而在现场等待，抓捕时无拒捕行为，供认犯罪事实的","E":"向其所在单位投案"},"answer":"ABDE","explanation":"本题考查视为自动投案的情形。犯罪嫌疑人具有以下情形之一的， 视为自动投案：（1）向犯罪嫌疑人所在单位、城乡基层组织或其他有关负责人投案的（选 项E当选）；（2）犯罪后逃跑，在被通缉、追捕过程中，主动投案的（选项B当选）； （3）犯罪嫌疑人确已准备去投案，或在投案途中被公安机关捕获，经查实确属真实情况的 （选项A当选）；（4）犯罪后主动报案，虽未表明自己是作案人，但没有逃离现场，在司法 机关询问时交代自己罪行的；（5）明知他人报案而在现场等待，抓捕时无拒捕行为，供认 犯罪事实的（选项D当选）；（6）因特定违法行为被采取行政拘留、司法拘留、强制隔离戒 毒等行政、司法强制措施期间，主动向执行机关交代尚未被掌握的犯罪行为的；（7）交通 肇事后保护现场、抢救伤员，并向公安机关报告的。选项C不当选，犯罪后逃至亲属家中， 在亲属家中被公安机关抓获的，不属于自动投案。"},{"id":"17.34","chapter":17,"chapter_name":"刑法","type":"多选","question":"下列关于自首认定的说法中，正确的有（　）。","options":{"A":"张某自动投案并如实供述其盗窃罪的事实，但隐瞒了诈骗罪的事实，不构成自首","B":"李某在共同抢劫案中自动投案并如实供述了自己的罪行，但拒绝交代其他同案犯，不构成自首","C":"王某自动投案并如实供述了其贪污罪行，但在检察院审查起诉阶段翻供，一审判决前又如实供述的，构成自首","D":"单位犯罪案件中，单位直接负责的主管人员自动投案，如实交代单位犯罪事实的，应当认定为单位自首","E":"单位没有自首，直接责任人员自动投案并如实交代自己知道的犯罪事实的，构成单位自首"},"answer":"BCD","explanation":"本题考查自首的认定。自首，是指犯罪以后自动投案，如实供述自己 罪行的行为。选项A不当选，犯有数罪的犯罪嫌疑人仅如实供述所犯数罪中部分犯罪的，只 对如实供述部分犯罪的行为，认定为自首。选项B当选，共同犯罪案件中的犯罪嫌疑人，除 如实供述自己的罪行，还应当供述所知的同案犯，主犯则应当供述所知其他同案犯的共同犯 罪事实，才能认定为自首。选项C当选，犯罪嫌疑人自动投案并如实供述自己的罪行后又翻 供的，不能认定为自首，但在一审判决前又能如实供述的，应当认定为自首；犯罪嫌疑人自 动投案后又逃跑的，不能认定为自首。选项D当选，单位犯罪案件中，单位集体决定或者单 位负责人决定而自动投案，如实交代单位犯罪事实的，或者单位直接负责的主管人员自动投 案，如实交代单位犯罪事实的，应当认定为单位自首。选项E不当选，单位没有自首，直接 责任人员自动投案并如实交代自己知道的犯罪事实的，对该直接责任人员应当认定为自首。"},{"id":"17.35","chapter":17,"chapter_name":"刑法","type":"多选","question":"下列立功表现中，可以作为免除处罚理由的有（　）。","options":{"A":"检举他人重大犯罪行为，经查证属实","B":"提供侦破其他案件的重要线索，经查证属实","C":"阻止他人重大犯罪活动","D":"协助公安机关抓捕同案其他重大犯罪嫌疑人","E":"协助公安机关抓捕非同案其他犯罪嫌疑人"},"answer":"ACD","explanation":"本题考查立功后处理规则。立功分为一般立功与重大立功。有一般立功 表现的，可以从轻或者减轻处罚。有重大立功表现的，可以减轻或者免除处罚。重大立功主 要表现包括：（1）犯罪分子有检举、揭发他人重大犯罪行为，经查证属实（选项A当选）； （2）提供侦破其他重大案件的重要线索，经查证属实；（3）阻止他人重大犯罪活动（选 项C当选）；（4）协助司法机关抓捕其他重大犯罪嫌疑人（包括同案犯）（选项D当选）； （5）对国家和社会有其他重大贡献等表现。选项BE不当选，所述属于一般立功，该等情形 可以从轻或者减轻处罚，但不免除处罚。"},{"id":"17.36","chapter":17,"chapter_name":"刑法","type":"多选","question":"2017年6月，梁某因交通肇事罪被判入狱服刑4年，2022年11月，因虚开普通发票罪被判处有期徒刑4年。下列有关梁某的刑罚适用及执行的说法中，正确的有（　）。","options":{"A":"构成累犯","B":"不构成累犯","C":"可以适用假释","D":"可以适用缓刑","E":"执行期间不得减刑"},"answer":"BC","explanation":"本题考查累犯、假释和缓刑。选项A不当选、选项B当选，成立一般累犯 要求前罪和后罪均为故意犯罪，交通肇事罪属于过失犯罪，因此梁某不构成累犯。选项C当 选，假释适用于被判处有期徒刑或者无期徒刑的犯罪分子。因为梁某前罪为过失犯罪，不成 立累犯，因此可以适用假释。选项D不当选，被判处拘役或者3年以下有期徒刑的犯罪分子， 符合特定条件，可以适用缓刑。梁某被判处有期徒刑4年，不能适用缓刑。选项E不当选，减 刑适用对象为被判处管制、拘役、有期徒刑或者无期徒刑的犯罪分子，梁某被判处有期徒刑 4年，可以适用减刑。"},{"id":"17.37","chapter":17,"chapter_name":"刑法","type":"多选","question":"根据《刑法》及相关规定，下列关于刑罚适用的说法中，正确的有（　）。","options":{"A":"对于自首的犯罪分子，可以从轻或减轻处罚","B":"累犯不适用于犯罪时未满18 周岁的人","C":"对累犯不适用缓刑","D":"刑罚执行完毕后又犯罪的，应予数罪并罚","E":"有期徒刑减刑的起始时间自判决执行之日起计算"},"answer":"ABCE","explanation":"本题考查刑罚的适用。选项A当选，对于自首 自首的犯罪分子，可以从轻 可以从轻 或者减轻处罚。犯罪较轻 较轻的，可以免除 可以免除处罚。选项B当选，累犯不适用于不满18周岁的人犯 罪。选项C当选，累犯不适用缓刑与假释。选项D不当选，数罪并罚，是指人民法院对犯罪分 子在法定期间内所犯数罪分别定罪量刑，并根据法定原则和方法，决定应当执行的刑罚的制 度。刑罚执行完毕以后又犯罪的，应当考虑犯罪嫌疑人是否构成累犯，而非应予数罪并罚。 选项E当选，有期徒刑减刑的起始时间自判决执行之日起计算。"},{"id":"17.38","chapter":17,"chapter_name":"刑法","type":"多选","question":"根据《刑法》及司法解释规定，下列关于逃税罪的说法中，正确的有（　）。","options":{"A":"本罪主观方面必须出于故意","B":"本罪犯罪主体只能是纳税人","C":"从逃税额看，只有纳税人的逃税额在10 万元以上且占各税种应纳税总额10% 以上的，才能构成本罪","D":"对于初次逃税行为，经税务机关依法下达追缴通知书后，在规定期限内补缴税款及滞纳金，已受行政处罚的，不予追究刑事责任","E":"本罪侵犯的客体是税收征收管理制度和税收征管权"},"answer":"ACDE","explanation":"本题考查逃税罪。选项A当选，逃税罪主观方面必须是出于直接故 直接故 意。选项B不当选，逃税罪的主体包括纳税人和扣缴义务人。选项C当选，纳税人涉嫌逃税 罪，从逃税角度界定，标准有二：（1）逃税额占各税种应纳税总额10% 10%以上且逃税额在 10万 10万元以上的，才能构成逃税罪；（2）凡5年 5年内因逃避缴纳税款受过刑事处罚或者被税务 机关给予2次 2次以上行政处罚，又逃避 又逃避缴纳税款，数额在10万 10万元以上并且占各税种应纳税总额 10% 10%以上的。选项D当选，若纳税人有逃税行为，经税务机关依法下达追缴通知后，在规定 的期限或者批准延缓、分期缴纳的期限内足额补缴应纳税款、缴纳滞纳金，并全部履行税务 机关作出的行政处罚决定的，不予追究刑事责任；但是，5年内因逃避缴纳税款受过刑事处 罚或者被税务机关给予2次以上行政处罚的除外。选项E当选，逃税罪侵犯的客体是我国税收 征收管理制度和税收征管权。"},{"id":"17.39","chapter":17,"chapter_name":"刑法","type":"多选","question":"根据《刑法》的规定，骗取出口退税是犯罪主体以假报出口或者其他欺骗手段，骗取国家出口退税款，数额较大的一种犯罪。下列手段中，属于假报出口或其他欺骗手段的有（　）。","options":{"A":"非法出售可以用于骗取出口退税、抵扣税款的其他发票","B":"通过签订虚假的销售合同取得出口业务相关单据、凭证，虚构出口事实申报出口退税的","C":"将未负税或免税的出口业务申报为已税的出口业务的","D":"在货物出口后，又转入境内循环进出口并申报出口退税的","E":"虚报出口产品的功能、用途等，将不享受退税政策的产品申报为退税产品的"},"answer":"BCDE","explanation":"本题考查骗取出口退税罪的构成。具有下列情形之一的，属于“假报 出口或者其他欺骗手段”：（1）使用虚开、非法购买或者以其他非法手段取得的增值税专 用发票或者其他可以用于出口退税的发票申报出口退税的；（2）将未负税或者免税的出口 业务申报为已税的出口业务的（选项C当选）；（3）冒用他人出口业务申报出口退税的； （4）虽有出口，但虚构应退税出口业务的品名、数量、单价等要素，以虚增出口退税额申 报出口退税的；（5）伪造、签订虚假的销售合同，或者以伪造、变造等非法手段取得出口 报关单、运输单据等出口业务相关单据、凭证，虚构出口事实申报出口退税的（选项B当 选）；（6）在货物出口后，又转入境内或者将境外同种货物转入境内循环进出口并申报出 口退税的（选项D当选）；（7）虚报出口产品的功能、用途等，将不享受退税政策的产品申 报为退税产品的（选项E当选）。选项A不当选，所述情形属于非法出售用于骗取出口退税、 抵扣税款发票罪。非法出售用于骗取出口退税、抵扣税款发票罪客观方面表现为行为人为达 到营利目的，非法出售用于骗取出口退税、抵扣税款的经税务机关监制的具有出口退税、抵 扣税款功能的非增值税专用发票的行为。"},{"id":"17.40","chapter":17,"chapter_name":"刑法","type":"多选","question":"根据《刑法》的规定，伪造、出售伪造的增值税专用发票罪，必须有伪造、出售伪造的增值税专用发票的行为，且应达到立案追诉标准，方可构成本罪。下列行为中，属于伪造、出售 伪造的增值税专用发票行为或者按照该行为处理的有（　）。","options":{"A":"变造增值税专用发票","B":"公司擅自印制增值税专用发票","C":"个人私自印制增值税专用发票","D":"明知系伪造的增值税专用发票仍购买","E":"明知增值税专用发票系伪造仍出售"},"answer":"ABCE","explanation":"本题考查伪造、出售伪造的增值税专用发票罪。选项A当选，变造增 值税专用发票的，按照伪造增值税专用发票论处。选项BC当选，增值税专用发票由国家税 务总局指定的企业印制，其他单位或个人私自印制的，即构成伪造增值税专用发票行为。 选项D不当选，明知是伪造的增值税专用发票仍购买的，构成购买伪造的增值税专用发票行 为，不属于伪造、出售伪造的增值税专用发票行为。选项E当选，明知自己所持有的是伪造 的增值税专用发票，而仍然出售的，构成出售伪造的增值税专用发票行为。"},{"id":"17.41","chapter":17,"chapter_name":"刑法","type":"多选","question":"根据《刑法》的规定，下列职务犯罪中，犯罪主体必须是税务机关工作人员的有（　）。","options":{"A":"徇私舞弊不移交刑事案件罪","B":"逃税罪","C":"违法提供出口退税凭证罪","D":"徇私舞弊发售发票、抵扣税款、出口退税罪","E":"徇私舞弊不征、少征税款罪做新变"},"answer":"DE","explanation":"本题考查涉税职务犯罪。选项A不当选，徇私舞弊不移交刑事案件罪的 犯罪主体是行政执法人员 行政执法人员。选项B不当选，逃税罪的犯罪主体是纳税人和扣缴义务人。选 项C不当选，违法提供出口退税凭证罪的犯罪主体是海关、外汇管理 海关、外汇管理等国家机关工作人员。 选项DE当选，徇私舞弊不征、少征税款罪和徇私舞弊发售发票、抵扣税款、出口退税罪的犯 罪主体必须是税务机关工作人员。 第十七章  刑法| 答案与解析 做新变 多项选择题"},{"id":"17.42","chapter":17,"chapter_name":"刑法","type":"多选","question":"根据刑法法律制度的规定，下列关于刑罚执行与监督的说法中，正确的有（　）。","options":{"A":"人民法院依法对执行机关的执行活动实行法律监督","B":"剥夺政治权利由公安机关执行","C":"人民法院负责死刑立即执行","D":"监狱负责死刑立即执行","E":"社区矫正机构负责管制"},"answer":"BCE","explanation":"本题考查刑罚执行与监督。选项A不当选，人民检察院依法对执行机关 的执行活动实行法律监督。选项B当选，公安机关负责拘役、剥夺政治权利、驱逐出境的执 行，以及余刑在3个月以下有期徒刑的代为执行。选项C当选，人民法院负责死刑立即执行、 罚金和没收财产的执行。选项D不当选，监狱负责死刑缓期二年执行、无期徒刑、有期徒刑 的执行。选项E当选，社区矫正机构，负责管制、宣告缓刑、假释和暂予监外执行的执行。 第十八章  刑事诉讼法 答案与解析 一、单项选择题"},{"id":"18.1","chapter":18,"chapter_name":"刑事诉讼法","type":"单选","question":"根据《刑事诉讼法》的规定，下列选项中属于刑事诉讼当事人的是（　）。","options":{"A":"辩护人","B":"法定代理人","C":"自诉人","D":"证人"},"answer":"C","explanation":"本题考查刑事诉讼当事人。选项C当选，刑事诉讼当事人，是指与案件事 实和诉讼结果有切身利害关系，在诉讼中处于控告或者被控告地位的诉讼参与人，是刑事诉 讼的主要参加者，包括被害人、自诉人 自诉人、犯罪嫌疑人、被告人、附带民事诉讼的原告人和被 附带民事诉讼的原告人和被 告人 告人。选项ABD不当选，其他刑事诉讼参与人，是指刑事诉讼当事人以外的，根据法律规定 和诉讼需要而参加刑事诉讼活动的人，包括法定代理人、诉讼代理人、辩护人、证人、鉴定 人和翻译人员。"},{"id":"18.2","chapter":18,"chapter_name":"刑事诉讼法","type":"单选","question":"根据《刑事诉讼法》的规定，下列关于委托刑事诉讼代理人的做法中，错误的是（　）。","options":{"A":"公诉案件的被害人，有权随时委托诉讼代理人","B":"公诉案件的被害人的法定代理人或者近亲属，可以为被害人委托诉讼代理人","C":"自诉案件的自诉人及其法定代理人有权随时委托诉讼代理人","D":"公诉案件的被害人可以委托律师作为诉讼代理人"},"answer":"A","explanation":"本题考查刑事诉讼代理人。选项A当选、选项B不当选，公诉案件的被害人 及其法定代理人或者近亲属，附带民事诉讼的当事人及其法定代理人，自案件移送审查起诉 之日起，有权委托诉讼代理人。选项C不当选，自诉案件的自诉人及其法定代理人，有权随 时委托诉讼代理人。选项D不当选，担任诉讼代理人的可以是律师、人民团体、被告人所在 单位推荐的人，也可以是犯罪嫌疑人、被告人的监护人、亲友。"},{"id":"18.3","chapter":18,"chapter_name":"刑事诉讼法","type":"单选","question":"在刑事诉讼中，犯罪嫌疑人、被告人有权委托辩护人。下列有关委托辩护人的说法中，正确的是（　）。","options":{"A":"犯罪嫌疑人、被告人可以委托其在人民法院任职的监护人担任辩护人","B":"犯罪嫌疑人、被告人可以委托其正处于缓刑考验期的亲友担任辩护人","C":"犯罪嫌疑人、被告人可以委托已从法院离职1 年的朋友以律师的身份担任辩护人","D":"犯罪嫌疑人、被告人可以委托人民陪审员担任辩护人"},"answer":"A","explanation":"本题考查辩护人的范围。选项A当选，一般来说，人民法院的现职人员不 得担任辩护人，除非是犯罪嫌疑人、被告人的监护人、近亲属。选项B不当选，正在被执行 刑罚或处于缓刑、假释考验期间的人不得担任辩护人。选项C不当选，审判人员和人民法院 其他工作人员从人民法院离任后 离任后2年 2年内，不得以律师身份 不得以律师身份担任辩护人。选项D不当选，人民陪 审员不得担任辩护人，除非其是犯罪嫌疑人、被告人的监护人、近亲属。"},{"id":"18.4","chapter":18,"chapter_name":"刑事诉讼法","type":"单选","question":"下列关于认罪认罚从宽制度适用规则的说法中，正确的是（　）。","options":{"A":"被告人愿意接受处罚，但不同意适用简易程序，不应作“认罚”认定","B":"被告人虽然承认被指控的主要犯罪事实，但对个别事实情节提出异议，不应作“认罪”认定","C":"对于人身危险性较小的初犯，从宽幅度可以大一些","D":"认罪认罚的累犯不得从宽处理"},"answer":"C","explanation":"本题考查认罪认罚从宽制度。选项A不当选，犯罪嫌疑人、被告人享有程 序选择权，不同意适用速裁程序、简易程序的，不影响 不影响“认罚”的认定。选项B不当选，犯 罪嫌疑人、被告人承认指控的主要犯罪事实，仅对个别事实情节提出异议，或者虽然对行为 性质提出辩解但表示接受司法机关认定意见的，不影响“认罪”的认定。选项C当选，对罪 行较轻、人身危险性较小的，特别是初犯、偶犯，从宽幅度可以大一些。选项D不当选，累 犯可以适用认罪认罚从宽制度，但从宽幅度应当从严把握。"},{"id":"18.5","chapter":18,"chapter_name":"刑事诉讼法","type":"单选","question":"根据《刑事诉讼法》的规定，下列关于刑事案件地域管辖、指定管辖和并案管辖的说法中，不正确的是（　）。","options":{"A":"刑事案件原则上由犯罪行为地的人民法院管辖","B":"管辖权发生争议，由争议双方法院协商，协商不成的，分别层报共同上级法院指定管辖","C":"发现正在服刑的罪犯在判决宣告前还有其他犯罪没有受到审判的，原则上由服刑地的人民法院管辖","D":"因共同犯罪需要并案审理的案件，其中一罪属于上级人民法院管辖的，全案由上级人民法院管辖"},"answer":"C","explanation":"本题考查刑事案件地域管辖和指定管辖。选项A不当选，刑事案件由犯罪 行为地的人民法院管辖，如果由被告人居住地的人民法院审判更为适宜的，可以由被告人 居住地的人民法院管辖。选项B不当选，管辖权发生争议，由争议双方法院协商；协商不成 的，分别层报共同上级法院指定管辖。选项C当选，发现正在服刑的罪犯在判决宣告前还有 其他犯罪没有受到审判的，由原审人民法院管辖；由罪犯服刑地或者犯罪地人民法院管辖更 为适宜的，可以由罪犯服刑地或者犯罪地的人民法院管辖。选项D不当选，一人犯数罪、共 同犯罪和其他需要并案审理 需要并案审理的案件，其中一人或者一罪属于上级人民法院管辖的，全案由上 级人民法院 级人民法院管辖。"},{"id":"18.6","chapter":18,"chapter_name":"刑事诉讼法","type":"单选","question":"根据《刑事诉讼法》及其相关规定，下列案件中被告人没有委托辩护人，人民法院、人民检察院应当通知法律援助机构指派律师为其辩护的是（　）。","options":{"A":"可能被判处无期徒刑的人","B":"被告人的行为可能不构成犯罪的","C":"人民检察院抗诉的","D":"共同犯罪案件中，其他被告人已经委托辩护人的"},"answer":"A","explanation":"本题考查指定辩护。选项A当选，其所述情形属于应当指定辩护的情形。 选项BCD不当选，其所述情形均属于可以指定辩护的情形。 问题：可以指定辩护与应当指定辩护情形的区分。 解答：采用排除法，先认定是否属于应当指定的情形。应当指定的情形概括为严重 影响生理（盲、聋、哑人）、心智受限（未完全丧失辨认/控制能力的精神病 人）和涉及重大人身权益（可能判无期、死刑）。 第十八章  刑事诉讼法| 答案与解析 （1）可以指定辩护的情形。对下列没有委托辩护人的被告人，人民法院可以 通知法律援助机构指派律师为其提供辩护：共同犯罪案件中，其他被告人已 经委托辩护人的；案件有重大社会影响的；人民检察院抗诉的；被告人的行 为可能不构成犯罪的；有必要指派律师提供辩护的其他情形。 （2）应当指定辩护的情形。对下列没有委托辩护人的犯罪嫌疑人、被告人， 人民法院、人民检察院应当通知法律援助机构指派律师为其提供辩护：盲、 聋、哑人；尚未完全丧失辨认或者控制自己行为能力的精神病人；可能被判 处无期徒刑、死刑的人。"},{"id":"18.7","chapter":18,"chapter_name":"刑事诉讼法","type":"单选","question":"在刑事诉讼中，犯罪嫌疑人自被侦查机关第一次讯问或采取强制措施之日起，有权委托辩护人。侦查期间能够担任其辩护人的是（　）。","options":{"A":"单位推荐的人","B":"监护人","C":"律师","D":"亲友"},"answer":"C","explanation":"本题考查辩护人。选项C当选，犯罪嫌疑人在侦查期间，只能委托律师作 犯罪嫌疑人在侦查期间，只能委托律师作 为辩 为辩护人。"},{"id":"18.8","chapter":18,"chapter_name":"刑事诉讼法","type":"单选","question":"在刑事诉讼的不同阶段，辩护律师提供法律服务的内容是不同的。辩护律师可以向犯罪嫌疑人、被告人核实证据的时间起点是（　）。","options":{"A":"自侦查机关第一次讯问之日起","B":"自被依法采取强制措施之日起","C":"自案件移送审查起诉之日起","D":"自提起公诉之日起"},"answer":"C","explanation":"本题考查辩护人的权利。选项C当选，自案件移送审查起诉之日 案件移送审查起诉之日起，可以 向犯罪嫌疑人、被告人核实有关证据。"},{"id":"18.9","chapter":18,"chapter_name":"刑事诉讼法","type":"单选","question":"根据《刑事诉讼法》的规定，下列说法错误的是（　）。","options":{"A":"可能被判处无期徒刑、死刑的，没有委托辩护人的犯罪嫌疑人、被告人，人民法院、人民检察院应当通知法律援助机构指派律师为其提供辩护","B":"1 名辩护人不得为2 名以上的同案被告人辩护","C":"辩护律师会见犯罪嫌疑人、被告人时可以被监听","D":"危害国家安全犯罪，在侦查期间辩护律师会见在押的犯罪嫌疑人，应当经侦查机关许可"},"answer":"C","explanation":"本题考查辩护人的权利。选项C当选，辩护律师会见犯罪嫌疑人、被告人 时不被监听。"},{"id":"18.10","chapter":18,"chapter_name":"刑事诉讼法","type":"单选","question":"根据《刑事诉讼法》及有关规定，关于刑事强制措施的说法中，正确的是（　）。","options":{"A":"公安机关在办案中，可以采取拘传措施，对没有被逮捕的犯罪嫌疑人，依法强制其到案接受询问","B":"被羁押的犯罪嫌疑人聘请的律师可以为其申请取保候审，但犯罪嫌疑人的近亲属不能申请","C":"人民法院有权决定逮捕","D":"人民检察院有权执行拘留"},"answer":"C","explanation":"本题考查强制措施的具体规定。选项A不当选，询问 询问适用于证人或被害 人，对犯罪嫌疑人，适用讯问 讯问。选项B不当选，被羁押、监视居住以及被逮捕后的犯罪嫌疑 人、被告人及其法定代理人、近亲属或者辩护人有权向公安机关、人民检察院、人民法院申 请取保候审。选项C当选，人民检察院和人民法院有权决定 人民检察院和人民法院有权决定逮捕。选项D不当选，拘留由公安 机关、人民检察院决定，由公安机关执行。"},{"id":"18.11","chapter":18,"chapter_name":"刑事诉讼法","type":"单选","question":"根据刑事诉讼法律制度的规定，下列关于监视居住适用规则说法中，正确的是（　）。","options":{"A":"监视居住由公安机关决定","B":"指定居所监视居住，可以在看守所执行","C":"监视居住最长不得超过6 个月","D":"监视居住应当折抵刑期"},"answer":"C","explanation":"本题考查监视居住。选项A不当选，监视居住由公安机关执行 监视居住由公安机关执行。选项B不当 选，采取指定居所监视居住，不得在看守所、拘留所、监狱等羁押、监管场所以及留置室、 讯问室等专门的办案场所、办公区域执行。选项D不当选，指定居所监视居住的期限应当折 抵刑期。被判处管制 管制的，监视居住1日 1日折抵刑期 折抵刑期1日 1日；被判处拘役、有期徒刑 拘役、有期徒刑的，监视居住 2日 2日折抵刑期 折抵刑期1日。"},{"id":"18.12","chapter":18,"chapter_name":"刑事诉讼法","type":"单选","question":"下列有关速裁程序的说法中，正确的是（　）。","options":{"A":"被告人为未成年人的，可以适用速裁程序","B":"对犯罪嫌疑人可能判处3 年以下有期徒刑的刑事案件，应当适用速裁程序","C":"被告人是盲、聋、哑人的，不适用速裁程序","D":"速裁程序既可以在一审程序中适用，也可以在二审程序中适用"},"answer":"C","explanation":"本题考查速裁程序。选项A不当选、选项C当选，被告人是未成年人的或者 未成年人的或者 是盲、聋、哑人的，不适用速裁程序 是盲、聋、哑人的，不适用速裁程序。选项B不当选，基层人民法院管辖的可能判处3年有期 徒刑以下刑罚的案件，案件事实清楚，证据确实、充分，被告人认罪认罚并同意适用速裁程 序的，可以适用速裁程序。选项D不当选，速裁程序只能在一审程序中适用 速裁程序只能在一审程序中适用，二审程序不能 适用速裁程序。"},{"id":"18.13","chapter":18,"chapter_name":"刑事诉讼法","type":"单选","question":"刑事案件的二审程序，必须由特定主体提起才能启动。下列说法中，符合法律规定的是（　）。","options":{"A":"被害人提出上诉","B":"被告人提出上诉","C":"被告人的近亲属未经被告人同意提出上诉","D":"被害人的近亲属提出抗诉"},"answer":"B","explanation":"本题考查刑事诉讼二审程序的启动。选项AD不当选，被害人及其法定代 理人，有权请求人民检察院提出抗诉，无权直接提出上诉，更无权直接提出抗诉。选项B当 选，被告人、自诉人及其法定代理人有权提出上诉。选项C不当选，被告人的辩护人和近亲 属，经被告人同意，也可以提出上诉，未经同意不得提出上诉。 二、多项选择题"},{"id":"18.14","chapter":18,"chapter_name":"刑事诉讼法","type":"多选","question":"根据《刑事诉讼法》的规定，下列人员中，属于诉讼参与人的有（　）。","options":{"A":"鉴定人","B":"证人","C":"书记员","D":"辩护人","E":"被害人"},"answer":"ABDE","explanation":"本题考查刑事诉讼参与人。刑事诉讼参与人包括刑事诉讼当事人和其 他参与刑事诉讼的人。刑事诉讼当事人，主要包括被害人（选项E当选）、自诉人、犯罪嫌 疑人、被告人、附带民事诉讼的原告人和被告人；其他诉讼参与人包括法定代理人、诉讼代 理人、辩护人（选项D当选）、证人（选项B当选）、鉴定人（选项A当选）和翻译人员。选 项C不当选，刑事诉讼参与人是指在刑事诉讼中享有一定诉讼权利、负有一定诉讼义务的除 国家专门机关工作人员以外的人。书记员不属于诉讼参与人。"},{"id":"18.15","chapter":18,"chapter_name":"刑事诉讼法","type":"多选","question":"根据《刑事诉讼法》的规定，下列属于刑诉被告人享有的权利的有（　）。","options":{"A":"控告追究犯罪嫌疑人的责任","B":"申请影响公正处理案件的人员回避","C":"拒绝辩护人为其辩护","D":"最后陈述权","E":"如实回答侦查人员的讯问"},"answer":"BCD","explanation":"本题考查刑事诉讼被告人的诉讼权利。选项A不当选，控告追究犯罪嫌 疑人的责任属于被害人的诉讼权利。选项BCD当选，均为刑事诉讼中被告人享有的诉讼权 利。选项E不当选，在刑事诉讼中，被告人的义务包括应当如实回答侦查人员的讯问。"},{"id":"18.16","chapter":18,"chapter_name":"刑事诉讼法","type":"多选","question":"根据《刑事诉讼法》的规定，下列关于刑事案件审判管辖的说法中，正确的有（　）。","options":{"A":"第一审普通刑事案件，原则上由基层人民法院管辖","B":"危害国家安全、恐怖活动的第一审刑事案件，由高级人民法院管辖","C":"可能判处无期徒刑、死刑的第一审刑事案件，由中级人民法院管辖","D":"全省（自治区、直辖市）性的重大第一审刑事案件，由最高人民法院管辖","E":"上级人民法院在必要的时候，可以审判下级人民法院管辖的第一审刑事案件"},"answer":"ACE","explanation":"本题考查刑事案件的审判管辖。选项A当选，基层人民法院管辖第一审 普通刑事案件，但是依法由上级人民法院管辖的除外。选项B不当选、选项C当选，中级人 中级人 民法院管辖 民法院管辖的第一审刑事案件包括：（1）危害国家安全、恐怖活动案件；（2）可能判处无 期徒刑、死刑的刑事案件；（3）适用违法所得没收程序的案件；（4）适用缺席 缺席审判程序 审理的案件。选项D不当选，高级人民法院管辖的第一审刑事案件，是全省（自治区、直辖 市）性的重大刑事案件。最高人民法院管辖的第一审刑事案件，是全国性的重大刑事案件。 选项E当选，上级人民法院在必要的时候，可以审判下级人民法院管辖的第一审刑事案件； 下级人民法院认为案情重大、复杂，需要由上级人民法院审判的第一审刑事案件，可以请求 移送上一级人民法院审判。"},{"id":"18.17","chapter":18,"chapter_name":"刑事诉讼法","type":"多选","question":"根据《刑事诉讼法》的规定，下列关于刑事诉讼回避的说法中，正确的有（　）。","options":{"A":"检察人员是本案当事人的近亲属的，应自行回避","B":"接受本案当事人宴请的审判人员，当事人有权申请其回避","C":"检察长和公安机关负责人的回避，由上级人民检察院检察委员会决定","D":"当事人被驳回申请回避的，可以申请复议一次","E":"回避的种类包括自行回避、申请回避和指令回避"},"answer":"ABDE","explanation":"本题考查刑事诉讼回避。选项A当选，审判人员、检察人员、侦查人 员是本案的当事人或者当事人的近亲属的，应当自行回避，当事人及其法定代理人也有权要 求其回避。选项B当选，接受本案当事人及其委托的人的宴请，或者参加由其支付费用的活 动的审判人员，当事人及其法定代理人有权申请其回避。选项C不当选，审判人员、检察人 员、侦查人员的回避，应当分别由院长、检察长、公安机关负责人决定；院长的回避，由本 院长的回避，由本 院审判委员会决定；检察长和公安机关负责人的回避，由同级人民检察院检察委员会决定 院审判委员会决定；检察长和公安机关负责人的回避，由同级人民检察院检察委员会决定。 选项D当选，对驳回申请回避的决定，当事人及其法定代理人可以申请复议一次。选项E当 选，回避的种类包括自行回避、申请回避和指令回避。其中指令回避，是指审判人员、检察 人员、侦查人员等遇有法定回避情形而没有自行回避，当事人及其法定代理人也没有申请其 回避，公安司法机关等有关组织或行政负责人有权作出决定，令其退出诉讼活动。"},{"id":"18.18","chapter":18,"chapter_name":"刑事诉讼法","type":"多选","question":"在刑事诉讼中，犯罪嫌疑人的辩护律师享有多种诉讼权利。下列关于辩护律师诉讼权利的说法中，正确的有（　）。","options":{"A":"自案件移送审查起诉之日起，可以向犯罪嫌疑人、被告人核实有关证据","B":"经人民法院、人民检察院许可，可以查阅、摘抄、复制本案的案卷材料","C":"可以申请人民检察院、人民法院调取公安机关、人民检察院未提交的在侦查、审查起诉期间收集的证明犯罪嫌疑人无罪或者罪轻的证据材料","D":"可以向侦查机关了解犯罪嫌疑人涉嫌的罪名和案件有关情况，提出意见","E":"经人民法院、人民检察院许可，可以同在押的犯罪嫌疑人会见和通信"},"answer":"ACD","explanation":"本题考查辩护律师的权利。选项A当选，辩护律师自案件移送审查起诉 之日起，可以向犯罪嫌疑人、被告人核实有关证据。选项B不当选，自人民检察院对案件审 查起诉之日起，辩护律师可以查阅、摘抄、复制案卷材料（无须人民检察院、人民法院许 可）；其他辩护人经人民检察院、人民法院许可，也可查阅、摘抄、复制案卷材料，但依法 不公开的材料除外。选项C当选，辩护人认为在调查、侦查、审查起诉期间监察机关、公安 机关、人民检察院收集的证明犯罪嫌疑人、被告人无罪或者罪轻的证据材料未随案移送，申 请人民检察院、人民法院、公安机关调取的，应当以书面形式提出，并提供相关线索或者 材料。选项D当选，侦查期间，辩护律师可以向侦查机关了解犯罪嫌疑人涉嫌的罪名和案件 第十八章  刑事诉讼法| 答案与解析 有关情况，如当时已查明的该罪的主要事实，犯罪嫌疑人被采取、变更、解除强制措施的情 况，侦查机关延长侦查羁押期限等情况，并提出意见。选项E不当选，辩护律师可以同在押 的或者被监视居住的犯罪嫌疑人、被告人会见和通信（无须许可）。"},{"id":"18.19","chapter":18,"chapter_name":"刑事诉讼法","type":"多选","question":"根据《刑事诉讼法》的规定，刑事强制措施包括（　）。","options":{"A":"拘传","B":"拘役","C":"讯问","D":"传唤","E":"拘留"},"answer":"AE","explanation":"本题考查刑事强制措施。选项AE当选，刑事强制措施包括拘传、取保候 审、监视居住、拘留、逮捕。"},{"id":"18.20","chapter":18,"chapter_name":"刑事诉讼法","type":"多选","question":"根据《刑事诉讼法》的规定，下列关于侦查措施的说法中，符合法律规定的有（　）。","options":{"A":"侦查人员询问证人，可以在现场进行","B":"在犯罪嫌疑人家属、邻居或者其他见证人在场的情况下，侦查人员可以对犯罪嫌疑人住所进行搜查","C":"对发现的犯罪嫌疑人，侦查人员可以强制带离现场讯问","D":"侦查人员在侦查中查封与案件无关的财物应当在3 日内解除查封","E":"侦查人员讯问犯罪嫌疑人，必须在看守所内进行三、综合分析题"},"answer":"ABD","explanation":"本题考查侦查措施。选项A当选，询问证人，可以在现场进行，也可以 到证人所在单位、住处或者证人提出的地点进行，在必要的时候，可以通知证人到人民检察 院或者公安机关提供证言。选项B当选，搜查的对象和范围，既可以是犯罪嫌疑人，也可以 是其他可能隐藏罪犯或者犯罪证据的人；既可以对人身进行，也可以对被搜查人的住处、 物品、工作地点和其他有关场所进行；搜查时，应当有被搜查人或其家属、邻居或者其他见 证人在场。选项C不当选，对在现场发现的犯罪嫌疑人，可以口头传唤，并非“强制带离现 场询问”。选项D当选，侦查人员在侦查中发现可用以证明犯罪嫌疑人有罪、无罪或者犯罪 情节轻重的各种财物、文件的，应当查封或者扣押；经查明确实与案件无关的，应当在3日 以内解除查封或者予以退还。选项E不当选，犯罪嫌疑人被送交看守所羁押后，对其进行讯 问，应当在看守所讯问室进行；对不需要逮捕、拘留的犯罪嫌疑人，可以传唤到犯罪嫌疑人 所在市、县内的指定地点或者到他的住处进行讯问。 三、综合分析题"},{"id":"18.21","chapter":18,"chapter_name":"刑事诉讼法","type":"综合","question":"2022年6月，为了通过买卖发票获取资金，吴某遂与好友费某商议共同成立春燕医药咨询有限公司（以下简称“春燕公司”），以医疗咨询服务和市场推广为由，为有需要的医药公司开具增 值税普通发票，并收取开票金额6%的手续费。春燕公司成立后，吴某负责寻找客户，费某负责开 具发票。2022年8月至2023年4月，在没有实际交易的情况下，两人先后为44家医药公司累计开具增 值税普通发票740份，涉及金额6 000万元，实缴税额226.8万元，非法获利120余万元。 在此期间，九通医药公司总经理易某安排员工王某向费某购买医药咨询类增值税普通发票 44份，涉及税额85万元；周某作为中贵医药营销有限公司（以下简称“中贵公司”）地区代理商， 在明知没有真实交易的情况下，帮助中贵公司向费某购买医药咨询类增值税普通发票400份，涉及 税额586万元；朱某作为金乡财务公司负责人，在为春燕公司代理记账期间，明知其无实际业务经 营，仍安排员工帮助费某代开增值税普通发票。 案发后，王某自动投案，如实供述自己的犯罪事实；其他人到案后，亦如实供述自己的犯罪 事实。","sub_questions":[{"sub_num":1,"text":"本案犯罪嫌疑人费某触犯的罪名有（    ）。","options":{"A":"非法出售发票罪","B":"持有伪造发票罪","C":"虚开发票罪","D":"非法购买发票罪","E":"虚开增值税专用发票罪"},"answer":"C","explanation":"本题考查涉税犯罪罪名辨析。费某在没有商品购销或者没有提供、 接受劳务、服务的情况下开具普通发票，其行为属于虚开普通发票行为。虚开增值税专用发 票和用于骗取出口退税、抵扣税款发票以外的其他发票，涉嫌下列情形之一的，应予立案追 诉：①虚开发票金额累计在50万元以上的。②虚开发票100份以上且票面金额在30万元以上 的。③5年内因虚开发票受过刑事处罚或者2次以上行政处罚，又虚开发票，数额达到上述第 ①②项标准60%以上的。选项C当选，费某虚开发票份数以及金额都满足虚开发票罪立案追 诉标准，涉嫌虚开发票罪。 提示：只有非法购买“增值税专用发票”或购买伪造的增值税专用发票才属于涉税犯罪。 《刑法》中并未明确规定非法购买其他类型的发票构成涉税犯罪。"},{"sub_num":2,"text":"下列对本案人员行为的认定中，正确的有（    ）。","options":{"A":"周某购买发票超过100 份，构成非法购买发票罪","B":"王某购买44 份发票构成虚开发票罪","C":"王某购买44 份发票构成非法购买发票罪","D":"吴某的行为构成非法出售发票罪","E":"朱某安排员工帮助他人代开发票的行为构成虚开发票罪"},"answer":"BE","explanation":"本题考查涉税犯罪的认定。选项AC不当选、选项B当选，不存在 “非法购买发票罪”，对非法购买发票行为入罪的，只有非法购买增值税专用发票罪或者购 买伪造的增值税专用发票罪（增值税专用发票）。周某明知没有真实交易，而购买增值税 普通发票，达到立案追诉标准，其涉嫌虚开发票罪。王某经易某指派，在没有真实交易的 情况下，要求他人为自己虚开发票，达到立案追诉标准，构成虚开发票罪。选项D不当选， 吴某与费某合谋，构成虚开增值税普通发票的共犯，达到立案追诉标准，涉嫌虚开发票罪。 选项E当选，费某实施了虚开发票的行为，朱某安排员工帮助费某虚开发票，二者为共同犯 罪。因此，朱某亦涉嫌虚开发票罪。"}],"options":{},"answer":"","explanation":""},{"id":"18.22","chapter":18,"chapter_name":"刑事诉讼法","type":"综合","question":"丘佛市万亿公司于2010年12月20日成立并办理了税务登记，属一人有限责任公司。法定代表人为汪某，主要从事玻璃制品销售。2022年至2023年期间，万亿公司与税收管理员陈某相互勾结， 部分销售收入不开具发票，不按规定入账，未申报纳税。另一税收管理员任某对此知情。任某在接 受万亿公司5万元红包后，对万亿公司未申报纳税一直放任不管。2024年12月，税务局检查发现： 2022年度，万亿公司瞒报销售收入580万元，逃避缴纳税款110万元，占该公司2022年度应纳税款总 额的24%；2023年度，万亿公司瞒报销售收入758万元，逃避缴纳税款142万元，占该公司2023年度 应纳税款总额的42%。税务局依法决定追缴，万亿公司及其法定代表人汪某拒不补缴上述税款。 另查明，汪某于2022年1月2日因犯危险驾驶罪被法院判处拘役1个月，缓刑2个月，并处罚金人 民币3 000元。 公安机关立案后，万亿公司缴清了上述税款及滞纳金。汪某被逮捕后如实供述，同时表示：税 务局决定追缴时，万亿公司已濒临破产、无补缴能力，并非故意拒不补缴。检察机关对万亿公司及 汪某以逃税罪提起公诉。","sub_questions":[{"sub_num":1,"text":"下列有关税收管理员陈某、任某涉嫌罪名的说法中，正确的有（    ）。","options":{"A":"任某涉嫌逃税罪","B":"陈某涉嫌徇私舞弊不移交刑事案件罪","C":"陈某涉嫌逃税罪","D":"任某涉嫌受贿罪","E":"任某涉嫌徇私舞弊不征、少征税款罪"},"answer":"CDE","explanation":"本题考查涉税职务犯罪。选项C当选，本题中，万亿公司的行为 是部分销售收入不开具发票，不入账，未申报纳税，且逃避缴纳税款的金额超过10万元，占 各税种的比例超过10%，涉嫌逃税罪，而陈某作为税收管理员，与万亿公司勾结，涉嫌构成 逃税罪的共犯。选项B不当选，本题中，并未体现陈某徇私情私利不移交刑事案件，故其不 涉嫌徇私舞弊不移交刑事案件罪。选项A不当选、选项E当选，对于任某来说，明知万亿公司 在逃税，出于某种私利而佯装不知，对逃税行为采取放任态度，因此不征或少征应征税款， 致使国家税收遭受重大损失的，则只能认定构成徇私舞弊不征、少征税款罪，而不能认定为 逃税罪。选项D当选，任某接受万亿公司的红包，因此对其逃税行为采取放任态度，不征或 者少征应征税款，致使国家税收遭受重大损失，应当以徇私舞弊不征、少征税款罪和“受贿 罪”数罪并罚。"},{"sub_num":2,"text":"下列有关万亿公司犯罪及刑事责任的说法中，正确的有（    ）。","options":{"A":"万亿公司是一人有限责任公司，因此本案逃税罪是自然人犯罪","B":"万亿公司是一人有限责任公司，因此本案逃税罪是单位犯罪","C":"万亿公司是本案逃税罪的犯罪主体","D":"万亿公司具有犯罪的主观故意","E":"万亿公司在公安机关立案后补缴了税款和滞纳金，因此不应追究刑事责任"},"answer":"BCD","explanation":"本题考查逃税罪、危害税收征管犯罪的犯罪构成以及单位犯罪。 选项A不当选、选项BC当选，为谋取本单位的非法利益，由单位负责人或者经集体讨论决 定，实施了《刑法》规定的危害社会的行为，属于单位犯罪主体，万亿公司属于单位，万亿 公司的逃税行为属于单位犯罪主体。选项D当选，危害税收征管犯罪主观方面均为故意。选 项E不当选，纳税人涉嫌逃税罪后，在公安机关立案后再补缴 立案后再补缴应纳税款、缴纳滞纳金或者接 受行政处罚的，不影响刑事责任的 不影响刑事责任的追究。"},{"sub_num":3,"text":"本案中，对万亿公司定罪的影响因素有（    ）。","options":{"A":"万亿公司瞒报销售收入，对部分收入未申报纳税","B":"2023 年度逃避缴纳税款占万亿公司2023 年度应纳税款总额的42%","C":"2022 年度逃避缴纳税款占万亿公司2022 年度应纳税款总额的24%","D":"万亿公司送给税收管理员任某5 万元","E":"万亿公司与税收管理员陈某勾结"},"answer":"ABC","explanation":"本题考查逃税罪。纳税人采取欺骗、隐瞒手段进行虚假纳税申报 第十八章  刑事诉讼法| 答案与解析 或不申报（选项A当选），逃避缴纳税款，数额在10万元以上并且占各税种应纳税总额10% 以上（选项BC当选），经税务机关依法下达追缴通知后，不补缴应纳税款、不缴纳滞纳金或 不接受行政处罚的，或者5年内因逃避缴纳税款受过刑事处罚或被税务机关给予2次以上行政 处罚，又逃避缴纳税款，数额在10万元以上并且占各税种应纳税总额10%以上的。选项DE不 当选，是否行贿和是否与税收管理员勾结不影响逃税罪的认定。"},{"sub_num":4,"text":"若检察机关指控汪某的罪名成立，下列有关对汪某量刑的说法中，正确的有（    ）。","options":{"A":"汪某如实供述不属于自首","B":"汪某如实供述属于自首","C":"汪某如实供述属于一般立功","D":"汪某不属于累犯","E":"汪某属于一般累犯"},"answer":"AD","explanation":"本题考查累犯、自首和立功。选项A当选、选项BC不当选，自首是 指犯罪以后自动投案 自动投案并且如实供述 如实供述自己的罪行，汪某的如实供述是在被逮捕后如实供述，而 没有“自动投案”情节，不属于自首。立功，是指犯罪分子具有揭发他人 揭发他人犯罪行为，查证属 实，或者提供重要案件线索，从而得以侦破其他案件等行为。汪某的行为并不属于立功，即 不属于一般立功。选项D当选、选项E不当选，一般累犯的成立条件之一为“前罪被判处的 刑罚和后罪应当判处的刑罚都必须是有期徒刑以上刑罚”，汪某犯危险驾驶罪被法院判处拘 役，不构成累犯。"}],"options":{},"answer":"","explanation":""},{"id":"18.23","chapter":18,"chapter_name":"刑事诉讼法","type":"综合","question":"2022年2月，东川省东山市开展打击虚开骗税违法行为的行动，东山市公安机关与税务机关、监察机关、海关等多部门配合，破获下列涉税违法犯罪案件： 甲公司虽有货物出口，但通过虚构出口货物品名、数量和单价，骗取国家出口退税款20万元。 乙公司利用虚开的增值税专用发票骗取国家出口退税款100万元，税务机关发现发票为虚开的事实，未通过乙公司出口退税的审核。 丙公司通过伪造出口货物报关单等出口退税单据和凭证，骗取国家出口退税款12万元。 丁公司通过虚构交易和银行流水接受外省某公司虚开的增值税专用发票，虚开税款数额18万元。 戊公司采取将免税货物作为已税货物出口的方式，骗取国家出口退税款4万元。另外，在调查己公司时发现己公司利用国家留抵退税政策，采用隐匿销售收入、减少增值税销 项税额、虚假申报等手段，骗取留抵退税15万元。同时调查了解到己公司采购原材料时，取得庚公 司开具的100万元增值税专用发票。后经税务协查查明，庚公司开具的100万元增值税专用发票构成 虚开。己公司认为自己属于善意取得虚开的增值税专用发票。","sub_questions":[{"sub_num":1,"text":"根据《刑法》的规定，本案中，涉嫌骗取出口退税罪应予立案追诉的主体有（    ）。","options":{"A":"甲公司","B":"乙公司","C":"丙公司","D":"丁公司","E":"戊公司"},"answer":"AC","explanation":"本题考查涉嫌骗取出口退税罪应予立案追诉的主体。选项B不当 选，对于虚开发票又骗取出口退税的犯罪人，如果骗取出口退税已完成，通常以骗取出口退 税罪定罪；如果骗取出口退税未遂，或者虚开发票数额特别巨大，给国家造成特别重大损失 的，应认定为虚开增值税专用发票或者虚开用于骗取出口退税、抵扣税款发票罪。选项D不 当选，根据题干信息，丁公司行为不涉及出口，涉嫌构成虚开增值税专用发票罪。选项E不 当选，戊公司骗取国家出口退税款4万元，未达到立案标准（10万元），不构成骗取出口退 税罪。"},{"sub_num":2,"text":"本案中，涉嫌虚开增值税专用发票罪应予立案追诉的主体有（    ）。","options":{"A":"甲公司","B":"乙公司","C":"丙公司","D":"丁公司","E":"戊公司"},"answer":"BD","explanation":"本题考查虚开增值税专用发票罪的构成。选项BD当选，虚开增值 税专用发票或者虚开用于骗取出口退税、抵扣税款发票罪客观方面表现为实施了虚开增值税 专用发票或者虚开用于骗取出口退税、抵扣税款的其他发票的行为，税款数额在10万元以 上的。本题中，丁公司所涉情形为没有货物购销或没有提供或接受应税劳务而为他人、为自 为他人、为自 己、让他人为自己、介绍他人开具 己、让他人为自己、介绍他人开具增值税专用发票，属于虚开增值税专用发票行为。乙公司 同时构成骗取出口退税罪和虚开增值税专用发票罪，但因乙公司出口退税未遂，应认定乙公 司构成虚开增值税专用发票罪。"},{"sub_num":3,"text":"根据《刑法》的规定，下列关于骗取出口退税罪的说法中，正确的有（    ）。","options":{"A":"犯罪主体应当是纳税人","B":"犯罪主体应当是单位","C":"客观方面应满足行为和数额的标准","D":"犯罪主体应具有进出口经营权","E":"主观方面包括故意和过失"},"answer":"C","explanation":"本题考查骗取出口退税罪的构成。选项ABD不当选，骗取出口退税 罪犯罪主体是一般主体。既可以是纳税人，也可以是非纳税人；既可以是个人，也可以是单 位，且单位不限于是否具有进出口经营权。选项C当选，骗取出口退税罪客观方面表现为利 用国家出口退税制度，以假报出口或者其他欺骗手段，骗取国家出口退税款，数额在10万元 以上的行为，必须达到法定结果（行为+数额），罪名才能成立。选项E不当选，骗取出口退 税罪主观方面必须是出于故意，且具有骗取国家出口退税款的目的。"},{"sub_num":4,"text":"若要认定己公司构成善意取得虚开增值税专用发票，则必须同时查明的事实有（　）。","options":{"A":"己公司不知道庚公司发票为虚开","B":"己公司取得发票所记载的内容与其购进的原材料一致","C":"己公司取得的发票经税务机关认证为真发票","D":"己公司已抵扣了进项税款","E":"己公司没有能力知道庚公司发票为虚开"},"answer":"ABCE","explanation":"本题考查构成善意取得虚开增值税专用发票的条件。构成善意 取得虚开增值税专用发票，需要具备三个条件： ①发票记载事项与客观实际完全相符 与客观实际完全相符（选项B当选）。 ②购货方不知道发票为虚开，且没有能力知道 有能力知道发票为虚开（选项AE当选）。 ③发票经过税务机关认证为真发票 认证为真发票（选项C当选）。"}],"options":{},"answer":"","explanation":""}];

let currentIdx = 0;
let filteredData = [];
let userAnswers = {}; // {questionKey: {selected: [...], correct: bool}}
let filter = 'all';
let currentChapter = null;

// Flatten data for display
function flattenData(data) {
  const flat = [];
  for (const q of data) {
    if (q.type === '综合' && q.sub_questions && q.sub_questions.length > 0) {
      for (const sub of q.sub_questions) {
        flat.push({
          id: q.id,
          chapter: q.chapter,
          chapter_name: q.chapter_name,
          type: '综合',
          scenario: q.question,
          question: sub.text,
          options: sub.options,
          answer: sub.answer,
          explanation: sub.explanation || '',
          sub_num: sub.sub_num,
          is_sub: true,
          key: q.id + '-' + sub.sub_num
        });
      }
    } else {
      flat.push({
        id: q.id,
        chapter: q.chapter,
        chapter_name: q.chapter_name,
        type: q.type,
        question: q.question,
        options: q.options || {},
        answer: q.answer || '',
        explanation: q.explanation || '',
        key: q.id
      });
    }
  }
  return flat;
}

const allFlatData = flattenData(QUIZ_DATA);

function applyFilter() {
  filteredData = allFlatData.filter(item => {
    // Chapter filter
    if (currentChapter && item.chapter !== currentChapter) return false;
    // Type filter
    if (filter === '单选' && item.type !== '单选') return false;
    if (filter === '多选' && item.type !== '多选') return false;
    if (filter === '综合' && item.type !== '综合') return false;
    // Wrong filter
    if (filter === 'wrong') {
      const ua = userAnswers[item.key];
      if (!ua || ua.correct) return false;
    }
    // Undone filter
    if (filter === 'undone') {
      if (userAnswers[item.key]) return false;
    }
    return true;
  });

  if (currentIdx >= filteredData.length) currentIdx = Math.max(0, filteredData.length - 1);
  renderQuestion();
  renderProgress();
  renderJumpGrid();
}

function renderChapters() {
  const chapters = {};
  QUIZ_DATA.forEach(q => {
    if (!chapters[q.chapter]) chapters[q.chapter] = { name: q.chapter_name, count: 0 };
    if (q.type === '综合' && q.sub_questions) {
      chapters[q.chapter].count += q.sub_questions.length;
    } else {
      chapters[q.chapter].count += 1;
    }
  });

  // Build sidebar list
  const list = document.getElementById('chapterList');
  list.innerHTML = '';

  // "全部" option
  const allLi = document.createElement('li');
  allLi.textContent = '全部章节';
  allLi.style.fontWeight = '600';
  allLi.onclick = () => {
    currentChapter = null;
    document.querySelectorAll('.chapter-list li').forEach(li => li.classList.remove('active'));
    allLi.classList.add('active');
    document.getElementById('chapterSelect').value = '';
    currentIdx = 0;
    applyFilter();
    if (window.innerWidth <= 768) toggleSidebar();
  };
  allLi.classList.add('active');
  list.appendChild(allLi);

  for (const [ch, info] of Object.entries(chapters)) {
    const li = document.createElement('li');
    li.innerHTML = `第${ch}章 ${info.name}<span class="badge">${info.count}</span>`;
    li.onclick = () => {
      currentChapter = parseInt(ch);
      document.querySelectorAll('.chapter-list li').forEach(l => l.classList.remove('active'));
      li.classList.add('active');
      document.getElementById('chapterSelect').value = ch;
      currentIdx = 0;
      applyFilter();
      if (window.innerWidth <= 768) toggleSidebar();
    };
    list.appendChild(li);
  }

  // Build dropdown select
  const sel = document.getElementById('chapterSelect');
  // Clear existing options except first
  while (sel.options.length > 1) sel.remove(1);
  for (const [ch, info] of Object.entries(chapters)) {
    const opt = document.createElement('option');
    opt.value = ch;
    opt.textContent = `第${ch}章 ${info.name}（${info.count}题）`;
    sel.appendChild(opt);
  }
}

function onChapterSelectChange() {
  const sel = document.getElementById('chapterSelect');
  const val = sel.value;
  currentChapter = val ? parseInt(val) : null;

  // Sync sidebar active state
  const items = document.querySelectorAll('.chapter-list li');
  items.forEach(li => li.classList.remove('active'));
  if (!val) {
    items[0].classList.add('active'); // "全部章节"
  } else {
    // Find matching chapter in sidebar
    const chName = QUIZ_DATA.find(q => q.chapter == val)?.chapter_name;
    if (chName) {
      items.forEach(li => {
        if (li.textContent.includes('第' + val + '章')) li.classList.add('active');
      });
    }
  }

  currentIdx = 0;
  applyFilter();
}

function toggleSidebar() {
  const sidebar = document.querySelector('.sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  sidebar.classList.toggle('show');
  overlay.classList.toggle('show');
}

function renderQuestion() {
  const container = document.getElementById('quizContainer');
  if (filteredData.length === 0) {
    container.innerHTML = '<div class="empty"><div class="icon">📋</div><p>当前筛选条件下没有题目</p><p>试试切换筛选或章节</p></div>';
    document.getElementById('prevBtn').disabled = true;
    document.getElementById('nextBtn').disabled = true;
    return;
  }

  const q = filteredData[currentIdx];
  document.getElementById('prevBtn').disabled = currentIdx === 0;
  document.getElementById('nextBtn').disabled = currentIdx === filteredData.length - 1;

  const isMulti = q.answer && q.answer.length > 1;
  const ua = userAnswers[q.key];
  const showResult = ua !== undefined;

  let html = '<div class="q-card">';
  html += '<div class="q-header">';
  html += `<span class="q-tag ${q.type}">${q.type}${isMulti ? '（多选）' : q.type === '单选' ? '（单选）' : ''}</span>`;
  html += `<span class="q-id">${q.id}${q.is_sub ? '（' + q.sub_num + '）' : ''}</span>`;
  html += `<span class="q-chapter">第${q.chapter}章 ${q.chapter_name}</span>`;
  html += `<span style="margin-left:auto;font-size:13px;color:var(--text-light);">${currentIdx + 1} / ${filteredData.length}</span>`;
  html += '</div>';

  // Scenario for comprehensive questions
  if (q.scenario) {
    html += `<div class="q-scenario">${escapeHtml(q.scenario)}</div>`;
    html += `<div class="q-sub-title"><span class="sub-num">${q.sub_num}</span>${escapeHtml(q.question)}</div>`;
  } else {
    html += `<div class="q-title">${escapeHtml(q.question)}</div>`;
  }

  // Options
  html += '<div class="options">';
  const optKeys = Object.keys(q.options).sort();
  for (const key of optKeys) {
    let cls = 'option';
    let letterCls = '';
    if (showResult) {
      if (q.answer.includes(key)) {
        cls += ' correct-answer';
      } else if (ua.selected.includes(key)) {
        cls += ' wrong-answer';
      }
    } else if (ua && ua.selected.includes(key)) {
      cls += ' selected';
    }

    html += `<div class="${cls}" onclick="selectOption('${q.key}', '${key}', ${isMulti})">`;
    html += `<div class="opt-letter">${key}</div>`;
    html += `<div class="opt-text">${escapeHtml(q.options[key])}</div>`;
    html += '</div>';
  }
  html += '</div>';

  // Actions
  if (!showResult) {
    html += '<div class="actions">';
    html += `<button class="btn btn-primary" onclick="submitAnswer('${q.key}')">提交答案</button>`;
    if (isMulti) {
      html += `<button class="btn btn-outline" onclick="clearSelection('${q.key}')">清除选择</button>`;
    }
    html += '</div>';
  }

  // Explanation
  if (showResult) {
    html += '<div class="explanation show">';
    html += '<div class="exp-title">答案解析</div>';
    html += `<div class="exp-answer">正确答案：${q.answer}</div>`;
    html += `<div class="exp-answer" style="background:${ua.correct ? 'var(--correct)' : 'var(--wrong)'}">${ua.correct ? '✓ 回答正确' : '✗ 回答错误'}</div>`;
    if (ua.selected.length > 0) {
      html += `<div style="margin:8px 0;font-size:13px;color:var(--text-light);">你的答案：${ua.selected.join('')}</div>`;
    }
    if (q.explanation) {
      html += `<div class="exp-text">${escapeHtml(q.explanation)}</div>`;
    }
    html += '</div>';
  }

  html += '</div>';
  container.innerHTML = html;
}

function selectOption(key, optKey, isMulti) {
  if (userAnswers[key]) return; // Already submitted

  if (!isMulti) {
    // Single select
    userAnswers[key] = { selected: [optKey], correct: false };
    submitAnswer(key);
  } else {
    // Multi select - toggle
    if (!userAnswers[key + '_temp']) userAnswers[key + '_temp'] = [];
    const temp = userAnswers[key + '_temp'];
    const idx = temp.indexOf(optKey);
    if (idx >= 0) temp.splice(idx, 1);
    else temp.push(optKey);
    renderQuestion();
  }
}

function submitAnswer(key) {
  const q = filteredData.find(x => x.key === key);
  if (!q) return;

  let selected = [];
  if (userAnswers[key + '_temp']) {
    selected = userAnswers[key + '_temp'];
    delete userAnswers[key + '_temp'];
  } else if (userAnswers[key] && !userAnswers[key].correct) {
    selected = userAnswers[key].selected;
  }

  if (selected.length === 0) {
    alert('请先选择答案');
    return;
  }

  selected.sort();
  const correctAnswer = q.answer.split('').sort();
  const correct = JSON.stringify(selected) === JSON.stringify(correctAnswer);

  userAnswers[key] = { selected: selected, correct: correct };
  renderQuestion();
  renderProgress();
  renderJumpGrid();
  updateStats();
}

function clearSelection(key) {
  delete userAnswers[key + '_temp'];
  renderQuestion();
}

function navigate(dir) {
  const newIdx = currentIdx + dir;
  if (newIdx < 0 || newIdx >= filteredData.length) return;
  currentIdx = newIdx;
  renderQuestion();
  renderJumpGrid();
  // Scroll to top
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderProgress() {
  const total = filteredData.length;
  const done = filteredData.filter(q => userAnswers[q.key]).length;
  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done} / ${total}（${pct}%）`;
}

function updateStats() {
  const allKeys = allFlatData.map(q => q.key);
  const total = allKeys.length;
  const done = allKeys.filter(k => userAnswers[k]).length;
  const correct = allKeys.filter(k => userAnswers[k] && userAnswers[k].correct).length;
  const rate = done > 0 ? Math.round(correct / done * 100) : 0;

  document.getElementById('statTotal').textContent = `共 ${total} 题`;
  document.getElementById('statDone').textContent = `已答 ${done}`;
  document.getElementById('statCorrect').textContent = `正确率 ${rate}%`;
}

function toggleJump() {
  const panel = document.getElementById('jumpPanel');
  panel.classList.toggle('show');
  if (panel.classList.contains('show')) renderJumpGrid();
}

function renderJumpGrid() {
  const grid = document.getElementById('jumpGrid');
  if (filteredData.length === 0) {
    grid.innerHTML = '<p style="color:var(--text-light);font-size:13px;">无题目</p>';
    return;
  }
  grid.innerHTML = '';
  for (let i = 0; i < filteredData.length; i++) {
    const q = filteredData[i];
    const cell = document.createElement('div');
    cell.className = 'jump-cell';
    cell.textContent = (i + 1);
    if (i === currentIdx) cell.classList.add('current');
    if (userAnswers[q.key]) {
      cell.classList.add(userAnswers[q.key].correct ? 'done' : 'wrong');
    }
    cell.onclick = () => {
      currentIdx = i;
      renderQuestion();
      renderJumpGrid();
    };
    grid.appendChild(cell);
  }
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft') navigate(-1);
  if (e.key === 'ArrowRight') navigate(1);
  if (e.key === 'Escape') document.getElementById('jumpPanel').classList.remove('show');
});

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.filter;
    currentIdx = 0;
    applyFilter();
  };
});

// Save/Load progress
function saveProgress() {
  try {
    localStorage.setItem('quiz_answers', JSON.stringify(userAnswers));
  } catch(e) {}
}

function loadProgress() {
  try {
    const saved = localStorage.getItem('quiz_answers');
    if (saved) userAnswers = JSON.parse(saved);
  } catch(e) {}
}

// Auto-save on answer
const origSubmit = submitAnswer;
submitAnswer = function(key) {
  origSubmit(key);
  saveProgress();
};

// Init
loadProgress();
renderChapters();
applyFilter();
updateStats();
</script>
</body>
</html>
