C":"若提存期间藏品意外损坏灭失，乙仍应支付50 万元价款","D":"乙无论是否付清价款，均有权自提存机关处领取提存的藏品","E":"乙领取提存物的权利，自提存之日起5 年内不行使而消灭"},"answer":"CE","explanation":"本题考查提存。选项A不当选，提存成立的，视为债务人在其提存范围 内已经交付标的物。甲提存后，藏品的所有权归属于乙。选项B不当选，自提存之日起，甲 的对待给付义务消灭。题中并未提及乙是否支付价款，故无法确定乙的对待给付义务是否消 灭。选项C当选，提存后，应由乙承担藏品毁损灭失的风险。因此，若提存期间藏品意外损 坏灭失，乙仍应支付50万元价款。选项D不当选，提存期间，债权人对债务人负有到期债务 的，在债权人未履行债务或者提供担保之前，提存部门根据债务人的要求应当拒绝其领取提 存物。选项E当选，债权人领取提存物的权利，自提存之日起5年内不行使而消灭，提存物扣 除提存费用后归国家所有。"},{"id":"9.48","chapter":9,"chapter_name":"债权法律制度","type":"多选","question":"下列损害事实中，乙有权请求甲进行赔偿的有（　）。","options":{"A":"甲落水，乙因施救造成自己手表损坏","B":"甲施工失误砍断供电电缆，乙因此停工遭受损失","C":"乙晨跑时晕倒，路过的医生甲对其进行心肺复苏压断其两根肋骨","D":"为躲避横穿马路的骑车人，甲紧急扭转方向盘撞到乙的汽车","E":"甲酒店前台工作人员因管理不当丢失乙的行李"},"answer":"BE","explanation":"本题考查侵权责任。选项A不当选，根据规定，因保护他人民事权益使 自己受到损害的，由侵权人承担民事责任，受益人可以给予适当补偿。没有侵权人、侵权人 逃逸或者无力承担民事责任，受害人请求补偿的，受益人应当给予适当补偿（不是赔偿）。 选项B当选，行为人因过错侵害他人民事权益造成损害的，应当承担侵权责任。选项C不当 选，因自愿实施紧急救助行为造成受助人损害的，救助人不承担民事责任（紧急救助）。选 项D不当选，因紧急避险造成损害的，由引起险情发生的人承担民事责任，题述情形中，甲 紧急扭转方向盘是为躲避横穿马路的骑车人，故乙无权请求甲进行赔偿。选项E当选，保管 期内，因保管人保管不善造成保管物毁损、灭失的，保管人应当承担赔偿责任。但是，无偿 保管人证明自己没有故意或者重大过失的，不承担赔偿责任。题述情形中，是由于甲酒店的 工作人员管理不当丢失乙的行李，因此，甲酒店应当承担赔偿责任。"},{"id":"9.49","chapter":9,"chapter_name":"债权法律制度","type":"多选","question":"下列关于教唆无民事行为能力人实施侵权行为的责任主体的说法中，正确的有（　）。","options":{"A":"教唆人应承担全部责任","B":"监护人不承担责任","C":"监护人在未尽到监护职责的范围内与教唆人共同承担责任","D":"未尽到监护职责的监护人先行赔付后，就超过自己相应责任的部分可以向教唆人追偿","E":"教唆人不知道且不应当知道行为人为无民事行为能力人的，不承担侵权责任"},"answer":"ACD","explanation":"本题考查数人侵权责任。选项AC当选、选项B不当选，教唆、帮助无民 事行为能力人、限制民事行为能力人实施侵权行为，由教唆人、帮助人承担侵权人应承担的 全部责任；监护人在未尽到监护职责的范围内与教唆人、帮助人共同承担责任，但责任主体 实际支付的赔偿费用总和不应超出被侵权人应受偿的损失数额。选项D当选，监护人先行支 付赔偿费用后，就超过自己相应责任的部分可以向教唆人、帮助人追偿。选项E不当选，教 唆人、帮助人以其不知道且不应当知道行为人为无民事行为能力人、限制民事行为能力人为 由，主张不承担侵权责任或者与行为人的监护人承担连带责任的，人民法院不予支持。"},{"id":"9.50","chapter":9,"chapter_name":"债权法律制度","type":"多选","question":"下列关于未成年子女造成他人损害的责任承担的说法中，正确的有（　）。","options":{"A":"即使监护人已尽到监护职责，监护人仍应承担侵权责任","B":"作为监护人的父母离婚的，未与该子女共同生活的一方可以主张不承担责任","C":"赔偿费用可以先从被监护人财产中支付，不足部分由监护人支付","D":"监护人将监护职责委托给他人的，被侵权人可以请求监护人承担全部侵权责任","E":"监护人将监护职责委托给他人的，被侵权人可以请求受托人承担全部侵权责任"},"answer":"ACD","explanation":"本题考查特殊主体侵权责任。选项A当选，无民事行为能力人、限制民 事行为能力人造成他人损害，由监护人承担侵权人应承担的全部责任，监护人责任属于无 过错责任。选项B不当选，未成年子女造成他人损害，由父母共同承担侵权责任。夫妻离婚 后，未成年子女造成他人损害，由离异夫妻共同承担侵权责任。一方以未与该子女共同生活 为由主张不承担或者少承担责任的，人民法院不予支持。选项C当选，无民事行为能力人、 限制民事行为能力人造成他人损害，赔偿费用可以先从被监护人财产中支付，不足部分由监 护人支付。从被监护人财产中支付赔偿费用的，应当保留被监护人所必需的生活费和完成义 务教育所必需的费用。选项D当选、选项E不当选，监护人将监护职责委托给他人的，由监护 人承担侵权人应承担的全部责任；受托人在过错范围内与监护人共同承担责任，但责任主体 实际支付的赔偿费用总和不应超出被侵权人应受偿的损失数额。"},{"id":"9.51","chapter":9,"chapter_name":"债权法律制度","type":"多选","question":"王某将自有车辆借给朋友张某使用，但未给自己的机动车投保交强险（机动车交通事故责任强制保险）。张某驾驶该机动车时因闯红灯撞伤行人李某，造成李某花费医疗费共计5万 元。经交警部门认定，张某对事故负全部责任。假设该事故机动车强制保险责任限额为1.8万 元。下列说法中，正确的有（　）。","options":{"A":"李某可以请求张某承担全部赔偿责任","B":"李某可以请求王某承担1.8 万元的赔偿责任","C":"李某可以请求张某和王某连带赔偿5 万元","D":"如王某赔偿李某5 万元的，可以向张某追偿3.2 万元","E":"张某和王某实际支付的赔偿总额不应超出5 万元三、综合分析题"},"answer":"ABDE","explanation":"本题考查机动车交通事故侵权责任。未依法投保强制保险的机动车发 生交通事故造成损害，投保义务人和交通事故责任人不是同一人的，由交通事故责任人承担 侵权人应承担的全部责任；投保义务人在机动车强制保险责任限额范围内与交通事故责任人 共同承担责任，但责任主体实际支付的赔偿费用总和不应超出被侵权人应受偿的损失数额。 选项ABE当选、选项C不当选，本题中，张某借用王某的车辆驾驶，对李某造成侵权，应由 侵权人张某承担全部的赔偿责任。但是由于王某未投交强险，需要在机动车强制保险责任限 额范围内（1.8万元）与张某共同承担责任。综上，李某可以直接请求王某赔偿1.8万元、张 某赔偿5万元，但是李某在两方获得的赔偿总额不得超过5万元。可见，张某和王某只是部分 连带的关系，并非传统意义上的连带责任关系。选项D当选，投保义务人先行支付赔偿费用 后，就超出机动车强制保险责任限额范围部分可以向交通事故责任人追偿。 三、综合分析题"},{"id":"9.52","chapter":9,"chapter_name":"债权法律制度","type":"综合","question":"甲公司主营生物制剂研发与生产。2024年7月10日，为扩大生产规模，甲公司向乙银行借款800万元，以其现有及将有的生产设备、原材料、半成品及产成品设立抵押担保。2024年7月11日， 双方完成抵押登记。 2024年8月10日，甲公司为升级生产线设备，向丙公司采购两套生产设备，合同总价200万元。 2024年8月12日，丙公司向甲公司完成交付，甲公司以采购的两套设备为抵押物与丙公司签订 抵押合同，担保其200万元债权。2024年8月18日，双方完成抵押登记。 2025年3月15日，甲公司将其中一套出现故障的设备送至丁维修公司检修。一周后，因甲公司 拖欠维修费用，丁公司依法留置该设备。 2025年4月5日，丁公司因经营困难，在未取得甲公司同意的情况下，以留置设备抵押，向不知 情的戊公司借款100万元，双方未办理抵押登记。 2025年4月8日，丁公司因欠己材料公司货款到期未能清偿，双方签订以物抵债协议。当日，丁 公司将留置的甲公司设备抵债给不知情的己公司。 上述债务均到期后，各方因清偿产生纠纷。","sub_questions":[{"sub_num":1,"text":"下列当事人中，善意取得相应物权的有（    ）。","options":{"A":"丁公司","B":"戊公司","C":"乙银行","D":"己公司","E":"丙公司"},"answer":"D","explanation":"本题考查善意取得。动产善意取得的适用条件：（1）受让人须 自无处分权 无处分权人处受让动产；（2）须受让人受让该动产时是善意 善意；（3）须支付合理价格 合理价格； （4）须已依照法律规定完成交付 交付。选项A不当选，留置权属于法定担保物权，丁公司依法行 使留置权。选项D当选、选项B不当选，丁公司作为留置权人不得擅自处分留置物，包括抵押 或以物抵债等处分行为。题述情形中，丁公司先将留置设备抵押给戊公司，后将留置设备以 物抵债给己公司，均属于无权处分行为。戊公司和己公司对于丁公司无权处分的事实均不知 情，但戊公司抵押权未进行登记，故不得主张善意取得设备抵押权，而丁已将设备交付给己 公司抵债完成公示，有权主张善意取得设备所有权。选项CE不当选，乙银行和丙公司的抵押 权均来自于所有权人甲公司为其设立的担保物权，不适用善意取得制度。"},{"sub_num":2,"text":"下列关于担保物权发生时间及对抗效力的说法中，正确的有（    ）。","options":{"A":"2024 年7 月10 日，乙银行的浮动抵押权设立B.2024 年8 月18 日，丙公司的抵押权设立C.2025 年3 月15 日，丁公司的留置权成立D.2025 年4 月5 日，戊公司的抵押权设立","E":"上述担保物权皆可对抗善意第三人"},"answer":"A","explanation":"本题考查担保物权。选项A当选，浮动抵押权自抵押合同生效时设 立，未经登记，不得对抗善意第三人。2024年7月10日抵押合同生效，乙银行的浮动抵押权 设立。选项B不当选，动产抵押权自抵押合同生效时设立，未经登记，不得对抗善意第三 人。丙公司的抵押权于2024年8月12日抵押合同生效时设立。选项C不当选，留置权是法定担 保物权，是指债务人不履行到期债务时，债权人可以留置已经合法占有的债务人或第三人的 动产，并有权就该动产优先受偿的权利。根据题述情形，丁公司的留置权于2025年3月15日 的一周后，甲公司拖欠维修费用时成立。选项DE不当选，戊公司未取得设备抵押权，不存在 对抗善意第三人的问题。"},{"sub_num":3,"text":"因债务到期各方发生纠纷时，设备上存在数个担保物权，下列关于其效力顺位的说法中，正确的有（    ）。","options":{"A":"丙公司的抵押权优先于乙银行受偿","B":"丙公司的抵押权优先于丁公司的留置权受偿","C":"丁公司的留置权优先于丙公司受偿","D":"戊公司的抵押权效力顺位应排在最后","E":"乙银行的抵押权优先于丙公司受偿"},"answer":"A","explanation":"本题考查担保物权。选项A当选、选项E不当选，动产抵押担保的主 债权是抵押物的价款，标的物交付后10日内办理抵押登记的，该抵押权人优先于抵押物买受 人的其他担保物权人受偿，但是留置权人除外。丙公司的抵押权为购买价款抵押权，在交付 后10日内办理抵押登记，享有超级优先权，优先于乙银行的浮动抵押权。选项BC不当选，丁 作为留置权人对设备享有留置权的前提是要占有该设备。根据题述情形，丁通过以物抵债已 将设备交付给己，丧失对设备的占有，故丁对设备的留置权消灭。选项D不当选，戊公司未 善意取得设备抵押权。 第九章  债权法律制度| 答案与解析"},{"sub_num":4,"text":"下列关于丁公司与己公司以物抵债协议的说法中，正确的有（    ）。","options":{"A":"丁公司履行以物抵债协议，将设备交付己公司，原债务在抵偿范围内消灭","B":"若丁公司未按约定履行以物抵债协议，经催告后在合理期限内仍未履行，则己公司可以选择请求丁公司继续履行该协议或者请求履行原债务","C":"无论以物抵债协议有效与否，甲公司均可请求己公司返还抵债设备","D":"甲公司不得以丁公司在订立以物抵债协议时对设备没有所有权为由主张该协议无效","E":"丁公司与己公司的以物抵债协议，自丁公司将设备交付己公司时生效"},"answer":"ABD","explanation":"本题考查合同的解除。选项AB当选，债务人或者第三人履行以 物抵债协议后，人民法院应当认定相应的原债务同时消灭；债务人或者第三人未按照约定履 行以物抵债协议，经催告后在合理期限内仍不履行，债权人选择请求履行原债务或者以物抵 债协议的，人民法院应予支持，但是法律另有规定或者当事人另有约定的除外。选项C不当 选，己公司善意取得设备所有权，甲公司无权要求返还抵债设备。选项D当选，无权处分行 为不影响合同效力，甲公司不得以丁公司对留置设备不享有所有权为由主张以物抵债协议无 效。选项E不当选，债务人或者第三人与债权人在债务履行期限届满后达成以物抵债协议， 不存在影响合同效力情形的，人民法院应当认定该协议自当事人意思表示一致时生效。"}],"options":{},"answer":"","explanation":""},{"id":"9.53","chapter":9,"chapter_name":"债权法律制度","type":"综合","question":"2021年1月6日，甲在其一套房屋上为前妻乙设立居住权，双方签订居住权合同并约定：乙若\n再婚，则居住权消灭。1月10日，双方办理了居住权登记。\n3月5日，甲因急需生意周转资金，遂以该房屋抵押向同乡丙借款500万元，双方签订了借期6个\n月的借款合同和房屋抵押合同。3月8日，丙将500万元汇入甲的账户。3月10日，双方办理房屋抵押\n登记。办理抵押登记时，丙方知晓该房屋上存在乙的居住权，遂要求甲另外再提供一份担保。于是\n甲找到好友丁和戊，请求2人为其向丙提供担保。3月16日，丙与丁、戊签订保证合同约定：如果甲\n到期未还款，则由丁、戊2人承担返还本金的保证责任。其余事项未进行约定。\n\n\n第九章| 债权法律制度\n8月9日，甲因车祸离世，其子己继承上述房屋。8月20日，己将继承的房屋登记到自己名下。\n借款到期后，丙因追讨欠款与丁、戊、己发生纠纷。","sub_questions":[{"sub_num":1,"text":"下列关于乙所享有的居住权性质、效力的说法中，正确的有（    ）。","options":{"A":"乙的居住权属于用益物权，具有对世性","B":"甲为乙设立的居住权附有解除条件","C":"乙的居住权属于支配权，可以自己行使，也可以转让他人","D":"乙的居住权属于财产权，可以抵押，也可以继承","E":"甲为乙设立的居住权因未约定居住权期限，故乙若未再婚即可终生居住"},"answer":"ABE","explanation":"本题考查居住权。选项A当选，居住权属于用益物权。物权是对 物的直接支配权、排他性财产权、对世权、绝对权。选项B当选，甲与乙约定，若乙再婚， 则居住权消灭，属于附解除条件的民事法律行为。选项CD不当选，居住权为专属权，只能 由权利人本人享有和行使，不能与权利人分离。居住权不得让与、继承，亦不得抵押 居住权不得让与、继承，亦不得抵押。选 项E当选，居住权的期限可由当事人在居住权合同中约定或者在遗嘱中确定。若合同或者遗 嘱未对居住权期限予以明确，则推定居住权期限为居住权人的终生。"},{"sub_num":2,"text":"下列关于涉案房屋物权变动的说法中，正确的有（    ）。","options":{"A":"3 月5 日，丙对房屋的抵押权设立","B":"1 月10 日，乙的居住权自登记时设立","C":"8 月9 日，己继承取得房屋所有权","D":"1 月6 日，乙的居住权于合同签订时设立","E":"8 月20 日，己自登记完成时取得继承房屋的所有权"},"answer":"BC","explanation":"本题考查物权变动。选项A不当选，以不动产抵押，抵押权自登 记时设立。3月10日，甲、丙双方办理了房屋抵押登记，当日，丙对房屋的抵押权设立。选 项B当选、选项D不当选，设立居住权的，应当向登记机构申请居住权登记。居住权自登记时 设立。选项C当选、选项E不当选，因继承取得物权的，自继承开始时发生效力 因继承取得物权的，自继承开始时发生效力，8月9日，己 继承取得房屋所有权。"},{"sub_num":3,"text":"下列关于丙、丁、戊间保证合同效力的说法中，正确的有（    ）。","options":{"A":"丁、戊须以各自的全部财产承担保证责任","B":"丁、戊对甲的借款本金及其利息承担保证责任","C":"若丁代甲清偿了全部借款，则可以向戊进行全部追偿","D":"丙仅在甲无力偿还借款时，方可请求丁或戊代甲清偿所欠借款","E":"丙在甲无力偿还借款时，可任意选择丁或戊，请求其代甲清偿借款"},"answer":"A","explanation":"本题考查保证合同效力。选项A当选，保证人原则上应以其全部财 产作为履行债务的担保。选项B不当选，当事人可在抵押合同中明确约定抵押权所担保的债 权范围，若无约定，抵押权所担保的债权范围依法应当包括：主债权及其利息、违约金、损 害赔偿金和实现抵押权的费用。题述情形下，丙、丁、戊之间明确约定仅对借款本金提供保 证，不包括其他债务。选项C不当选，同一债务有两个以上第三人提供担保，担保人之间未 对相互追偿作出约定且未约定承担连带共同担保，但是各担保人在同一份合同书上签字、盖 章或者按指印，承担了担保责任的担保人请求其他担保人按照比例分担向债务人不能追偿 向债务人不能追偿部 分的，人民法院应予支持。丁承担全部借款后，应当先向甲追偿，就无法向甲追偿的部分， 方可向戊追偿。选项DE不当选，被担保的债权既有物的担保又有人的担保的，债务人不履 被担保的债权既有物的担保又有人的担保的，债务人不履 行到期债务或者发生当事人约定的实现担保物权的情形，债权人应当按照约定实现债权；没 行到期债务或者发生当事人约定的实现担保物权的情形，债权人应当按照约定实现债权；没 有约定或者约定不明确，债务人自己提供物的担保的，债权人应当先就该物的担保实现债 有约定或者约定不明确，债务人自己提供物的担保的，债权人应当先就该物的担保实现债 权；第三人提供物的担保的，债权人可以就物的担保实现债权，也可以请求保证人承担保证 权；第三人提供物的担保的，债权人可以就物的担保实现债权，也可以请求保证人承担保证 责任 责任。提供担保的第三人承担担保责任后，有权向债务人追偿。题述情形下，丙、丁、戊间 签订的保证合同中对保证方式并没有明确约定，应当按照一般保证承担保证责任，保证人 （丁、戊）享有先诉抗辩权。在债的实现顺序上，债权人丙应先实现抵押权，之后就债务纠 纷进行民事诉讼或申请仲裁，对诉讼判决或仲裁裁决强制执行仍不能清偿债务的，方可请求 丁、戊承担各自的保证责任。"},{"sub_num":4,"text":"根据《民法典》及相关规定，己继承房屋的法律效果有（    ）。","options":{"A":"乙对房屋的居住权当然消灭","B":"丙仍可以对房屋行使抵押权","C":"丙对房屋的抵押权当然消灭","D":"乙仍可以继续在房屋中居住","E":"己取得带有居住权和抵押权负担的房屋所有权"},"answer":"BDE","explanation":"本题考查继承法律效果。选项A不当选、选项D当选，居住权可 因居住权期限届满或者居住权人死亡而消灭。题述情形下，乙的居住权并未消灭。选项B当 选、选项C不当选，抵押权因下列原因而消灭：①主债权消灭；②抵押权实现；③抵押财产 因不可归责于任何人的事由而灭失；④抵押权人放弃抵押权。本题中不存在上述情形，故 丙仍可以对房屋行使抵押权。选项E当选，己因继承取得带有居住权和抵押权负担的房屋所 有权。"}],"options":{},"answer":"","explanation":""},{"id":"9.54","chapter":9,"chapter_name":"债权法律制度","type":"综合","question":"甲与丙房地产公司签订借款合同，向丙出借8 000万元，约定月利率为1.5%。乙是丙房地产公司的供货商，丙房地产公司欠乙5 000万元货款。乙以其对丙房地产公司的5 000万元货款债权质 押向丁银行办理了贷款。两个月后，因资金周转需要，乙将其对丙房地产公司的5 000万元货款债 权转让给甲。至此，甲对丙房地产公司的债权本金合计1.3亿元。为保障债权如期实现，甲与丙房 地产公司签订了一份商品房预购合同，并办理了预告登记。甲、丙双方约定：若将来债权到期，丙 房地产公司未能偿还货款及借款本息，则商品房预购合同生效，将债权本金及借款利息经对账清算 转化为已付购房款。货款债权和借款债权陆续到期后，因丙房地产公司未偿还货款及借款本息，双 方经对账确认丙房地产公司欠甲本息合计1.8亿元。 按照双方此前约定，将该欠款本息转为已付购房款后，甲尚欠丙房地产公司购房款2 000万 元。甲承诺待办理完所购商品房移转登记后即付清2 000万元尾款。丙房地产公司认为折抵购房款 的欠款金额包含高额借款利息，要求与甲重新核算购房款遭甲拒绝，丙房地产公司遂拒绝履行商品 房买卖合同致双方涉讼。 已知，借款合同成立时一年期贷款市场报价利率为3.65%。","sub_questions":[{"sub_num":1,"text":"下列关于甲与丙房地产公司之间借款合同属性及利率约定效力的说法中，正确的有（    ）。","options":{"A":"甲与丙房地产公司的借款合同约定的利率仅部分受法律保护","B":"甲与丙房地产公司的借款合同属于有偿合同","C":"甲与丙房地产公司的借款合同仅在甲向丙提供借款时方能成立","D":"甲与丙房地产公司的借款合同约定的利率无效","E":"甲与丙房地产公司的借款合同属于民间借贷合同"},"answer":"ABE","explanation":"本题考查借款合同属性与利率。选项A当选、选项D不当选，出借 人请求借款人按照合同约定利率支付利息的，人民法院应予支持，但是双方约定的利率超过 合同成立时一年期贷款市场报价利率四倍的除外。题述情形下，甲与丙房地产公司之间约定 月利率为1.5%，年利率为18%。按照相关规定，仅在未超过14.6%（3.65%×4）的部分受到 法律保护，超出部分的约定无效。选项B当选，民间借贷合同可以有偿亦可无偿，题述情形 下，甲公司与丙公司约定了利息，该借款合同属于有偿合同。选项C不当选、选项E当选，民 间借贷，是指自然人、法人和非法人组织之间进行资金融通的行为。民间借贷合同（除双方 均为自然人的借款合同）为诺成合同，自双方达成一致意思表示时成立，一般情形下，该合 同成立即生效。自然人之间的借款合同为实践合同，自借款人实际提供借款时成立。"},{"sub_num":2,"text":"下列关于本案甲与丙房地产公司之间商品房预购合同属性及效力的说法中，正确的有（    ）。","options":{"A":"甲与丙房地产公司商品房预购合同属于附始期法律行为","B":"甲与丙房地产公司商品房预购合同是借款合同变更的结果","C":"甲与丙房地产公司商品房预购合同属于附生效条件法律行为","D":"甲与丙房地产公司商品房预购合同有效","E":"甲与丙房地产公司商品房预购合同因价款包含高额利息而无效"},"answer":"CD","explanation":"本题考查商品房预购合同的属性及效力。选项A不当选、选项C当 选，题述情形下，甲、丙的约定不属于附期限的民事法律行为，而应属于附条件的民事法律 行为，且为附生效条件的民事法律行为。附条件与附期限最明显的区分为条件不一定会发 生，但期限一定会到来。选项B不当选，甲与丙房地产公司之间的商品房预购合同是为保障 借款合同实现，属于借款合同变更的原因。选项D当选、选项E不当选，该商品房预购合同为 附生效条件合同，自条件成就时生效。双方约定利息的多少并不会导致合同无效。"},{"sub_num":3,"text":"乙将其对丙房地产公司的5 000 万元货款债权转让给甲，须满足的法律条件有（    ）。","options":{"A":"须乙与甲就债权转让达成合意","B":"须乙的债权有效存在","C":"须征得丁银行的同意","D":"须征得丙房地产公司的同意","E":"须乙与丙房地产公司之间无债权不得转让的约定"},"answer":"ABC","explanation":"本题考查债权转让。选项A当选，债权转让需要转让人与受让人 达成一致的意思表示。选项BC当选，债权让与的生效要件为：①存在有效债权；②让与人对 被让与的债权享有处分权；③被让与的债权具有可转让性；④法律、行政法规规定债权让与 合同应当办理批准、登记等手续才能生效的，当事人须办理相应的手续。应收账款出质后， 不得转让，除非出质人与质权人协商同意。选项D不当选，债权让与以通知债务人为对债务 人生效的要件，无须征得债务人同意。选项E不当选，乙、丙之间无论有无转让约定，乙均 可转让债权，当事人约定金钱债权不得转让的，不得对抗第三人。"},{"sub_num":4,"text":"下列关于丁银行质权设立及甲与丙房地产公司所办理的预告登记效力的说法中，正确的有（    ）。","options":{"A":"丁银行的质权自乙与丁签订质押合同时设立","B":"预告登记后，丙房地产公司未经甲同意以预购商品房为他人设定的抵押权无效","C":"预告登记后，预购商品房的所有权即归属于甲","D":"预告登记后，丙房地产公司对预购商品房的处分权即丧失","E":"丁银行的质权自乙与丁办理出质登记时设立"},"answer":"BE","explanation":"本题考查质权设立与预告登记效力。选项A不当选、选项E当选， 以应收账款出质的，质权自办理出质登记时设立。选项B当选、选项CD不当选，预告登记 后，未经预告登记的权利人同意，处分该不动产的，不发生物权效力。未经预告登记的权利 人同意，转让不动产所有权等物权，或者设立建设用地使用权、居住权、地役权、抵押权等 其他物权的，认定其不发生物权效力。因此，预告登记后，丙房地产公司未经甲同意，以该 商品房设立的抵押权无效。但预告登记并不意味着对“房屋”所有权的登记，其仅为保障将 来房屋物权能顺利实现所作的登记。 第九章  债权法律制度| 答案与解析 问题：预告登记后，房地产公司丧失所有权吗？ 解答：预告登记后，丙房地产公司并没有丧失商品房的所有权，因此还是有商品房 的处分权，只是在未经预告登记的权利人同意转让商品房的所有权等物权， 或者设立建设用地使用权、居住权、地役权、抵押权等其他物权的，不发生 物权效力。"}],"options":{},"answer":"","explanation":""},{"id":"9.55","chapter":9,"chapter_name":"债权法律制度","type":"综合","question":"骑车爱好者甲因一次交通意外致右腿重度伤残，无法再从事骑行活动，遂有意出售其两辆名\n牌山地车。6月5日，甲在其“骑友微信群”中发信息：“本人有黑色、红色两辆九成新山地车出\n售，欢迎垂询。”甲还在此条信息下面上传了两辆山地车的图片。\n骑友乙于6月6日在微信群中向甲询价，甲当即在微信群中回复：“两辆车均卖7 000元。”乙\n觉得有些贵，犹豫两天后，于6月8日私信甲：“若5 000元，我就买一辆。”\n\n\n第九章| 债权法律制度\n6月9日，甲微信回复乙：“这样吧，我们各让一步，6 000元，不能再低了。”乙于6月10日微\n信回复甲：“好吧，就6 000元。至于买哪个颜色的，我再考虑考虑，15日之前告知你。”甲当即\n表示同意，但要求乙支付2 000元定金。\n6月11日，乙向甲微信转账1 500元作为定金，甲即刻微信收款1 500元。\n6月12日，骑友丙私信甲称：“我参加6月13日的骑行活动，借你的山地车应急用一下，活动一\n结束就还给你。”甲微信回复丙同意出借。\n6月13日清早，丙到甲家将黑色山地车骑走。当日，丁驾驶货车闯红灯将丙撞伤，丙所骑山地\n车被货车碾压致报废。6月14日，甲私信乙称：“我不想卖红色山地车了，想留作纪念。”乙表示\n理解，但双方就定金返还数额主张不一，遂引起纠纷。","sub_questions":[{"sub_num":1,"text":"下列有关甲、乙意思表示的性质认定的说法中，正确的有（    ）。","options":{"A":"6 月8 日乙的意思表示属于要约","B":"6 月6 日甲的意思表示属于要约邀请","C":"6 月5 日甲的意思表示属于要约邀请","D":"6 月10 日乙的意思表示属于承诺","E":"6 月9 日甲的意思表示属于承诺"},"answer":"ACD","explanation":"本题考查要约、要约邀请、承诺的界定。选项C当选，6月5日， 甲的意思表明希望他人与自己订立合同，属于要约邀请。选项B不当选，6月6日，甲表示 两辆车均卖7 000元，对方若同意即可成交，该项意思表示的内容具体确定，属于要约。 选项A当选，6月8日，乙更改了价格，属于对甲的要约进行了实质性变更，为新要约。选 项E不当选，6月9日，甲再次更改价格，属于新要约。选项D当选，6月10日乙回复表示同 意，属于承诺。"},{"sub_num":2,"text":"下列有关甲、乙间买卖合同成立时间及所生之债类型归属的说法中，正确的有（    ）。","options":{"A":"甲、乙间买卖合同所生之债在合同成立时属于选择之债","B":"甲、乙间买卖合同在乙确定山地车颜色并告知甲时成立","C":"甲、乙间买卖合同于6 月10 日成立","D":"甲、乙间买卖合同所生之债在成立时属于任意之债","E":"甲、乙间买卖合同所生之债在黑色山地车受损报废之后属于简单之债"},"answer":"ACE","explanation":"本题考查债的分类。简单之债是指债的标的只有一宗，当事人只 能按该宗标的履行的债。选择之债是指债的标的有数宗，当事人可以选择其中之一为履行标 的的债。任意之债是指债权人或债务人可以约定用原定给付之外的其他给付来代替原定给 付的债。选项A当选、选项D不当选，甲、乙之间的买卖合同成立时，合同标的可以在黑色 和红色山地车之间选择，标的物有数宗，属于选择之债。选项E当选，在黑色山地车报废之 后，合同标的物变为一宗，成为简单之债。选项B不当选、选项C当选，承诺生效时，合同成 立，本题中，6月10日乙回复表示同意，该回复为承诺，此时合同成立。"},{"sub_num":3,"text":"黑色山地车受损报废，对此，下列当事人的索赔主张及其理由中，能获得法律支持的有\n（    ）。","options":{"A":"甲基于侵权向丁主张赔偿","B":"甲基于侵权向丙主张赔偿","C":"甲基于借用合同向丙主张赔偿","D":"丙基于侵权向丁主张赔偿","E":"乙基于侵权向丁主张赔偿"},"answer":"ACD","explanation":"本题考查债的发生原因。选项AD当选，因丁的原因导致交通事故 的发生，造成甲的山地自行车报废，丙受伤，构成侵权。甲可以基于所有权、丙可以基于占 有向丁主张损害赔偿。选项B不当选、选项C当选，甲、丙之间为借用合同，甲有权基于合同 要求丙承担违约责任。侵权人并非丙，甲不得基于侵权要求赔偿。选项E不当选，乙尚未取 得山地车所有权，不能向丁主张权利。"},{"sub_num":4,"text":"本案中，甲、乙基于合同所提出的下列主张中，能获得法律支持的有（    ）。","options":{"A":"甲主张仅向乙返还1 500 元","B":"乙主张甲返还3 000 元","C":"甲以乙未足额交付定金为由，主张乙承担违约责任","D":"乙主张甲返还2 700 元","E":"甲主张仅向乙返还2 400 元"},"answer":"D","explanation":"本题考查定金。选项ABE不当选、选项D当选，定金数额不能超过主 合同标的额的20%，超过部分不产生定金的效力。本题中，发生定金效力的金额为1 200元 （6 000元×20%），超出的部分300元应当作为预付款项。收受定金一方未按约定履行合 收受定金一方未按约定履行合 同的，应双倍返还定金 同的，应双倍返还定金，故甲应向乙返还2 400元，同时应返还不发生定金效力的部分款项 同时应返还不发生定金效力的部分款项 300元，合计返还2 700元。选项C不当选，实际交付的定金数额多于或者少于约定数额的， 视为变更约定的定金数额。乙向甲支付定金数额1 500元，少于约定定金数额，甲接受，视 为二者对约定定金数额的变更。"}],"options":{},"answer":"","explanation":""},{"id":"9.56","chapter":9,"chapter_name":"债权法律制度","type":"综合","question":"2024年5月7日，种植大户甲向乙租用一架农用无人机并投入使用，租期至2024年10月31日。6月2日，乙将农用无人机出卖于丙，双方未约定履约期限。 6月20日，乙将对甲的返还请求权让与丙，并约定：由丙继续向甲收取租金，且待丙付清价款 后再将无人机的所有权转移。 6月30日，丙付清价款，乙、丙双方达成无人机所有权移转合意。 7月8日，甲将无人机转租给丁并交付，租期至8月20日。 8月10日，丁使用无人机田间作业时，被戊之子（12周岁）用石头击中，导致无人机坠落 毁损。","sub_questions":[{"sub_num":1,"text":"若甲未经丙同意将农用无人机转租给丁，则丙依法取得一项解除权，下列关于该解除权的行使、效力的说法中，正确的有（    ）。","options":{"A":"丙可以行使该项解除权，解除甲、丁农用无人机租赁合同","B":"丙行使该项解除权的效力具有溯及力","C":"丙行使该项解除权属于形成权","D":"丙行使该项解除权的意思表示自作出时生效","E":"丙行使该项解除权的行为属于单方民事法律行为"},"answer":"CE","explanation":"本题考查租赁合同的转租。选项A不当选，承租人未经出租人同 意转租的，出租人有权解除租赁合同，根据合同相对性原理，丙无权解除甲、丁间的转租 合同。选项B不当选，合同一经解除，其权利义务关系即终止。本题中，租赁合同属于继续 性合同，合同解除的，其权利义务关系即终止，解除效力无溯及力。选项C当选，法定解除 权属于形成权。选项D不当选，一般情况下，当事人一方依法主张解除合同的，应当通知对 当事人一方依法主张解除合同的，应当通知对 方，合同自通知到达对方时解除 方，合同自通知到达对方时解除。选项E当选，丙行使法定解除权，其单方意思表示即可成 立，是单方民事法律行为。"},{"sub_num":2,"text":"下列关于农用无人机租赁合同形式及效力的说法中，正确的有（    ）。","options":{"A":"7 月8 日，甲、丁所签农用无人机租赁合同可采用口头形式，也可采用书面形式","B":"7 月8 日，甲、丁所签农用无人机租赁合同须征得丙同意，方为有效","C":"5 月7 日，甲、乙所签农用无人机租赁合同，在乙向甲交付时成立","D":"5 月7 日，甲、乙所签农用无人机租赁合同，应当采用书面形式","E":"6 月20 日起，甲基于农用无人机租赁合同对乙的抗辩，可以对丙主张"},"answer":"AE","explanation":"本题考查租赁合同形式及效力。选项A当选、选项D不当选，租赁 期限6个月以上的，应当采用书面形式。本题中，租期不足6个月，可采用口头形式，也可采 用书面形式。选项B不当选，甲、丁间的转租合同，自双方达成合意时成立并生效。甲未经 丙同意，擅自转租的行为不影响甲、丁间转租合同的效力。选项C不当选，无人机租赁合同 是诺成合同，双方当事人意思表示达成一致则合同成立。选项E当选，债务人接到债权转让 通知后，债务人对让与人的抗辩，可以向受让人主张。"},{"sub_num":3,"text":"下列关于乙、丙农用无人机买卖合同效力及农用无人机权利变动的说法中，正确的有（    ）。","options":{"A":"6 月20 日，丙基于指示交付而继受取得无人机所有权","B":"6 月30 日起，丙有权请求甲交付无人机","C":"6 月20 日，乙交付义务履行完毕，农用无人机损毁风险由乙转移丙","D":"6 月2 日起，丙有权请求乙交付无人机","E":"6 月20 日起，丙有权请求甲交付无人机"},"answer":"CD","explanation":"本题考查买卖合同和动产物权变动。选项A不当选，乙、丙的买卖 合同约定了所有权保留条款，因此指示交付时丙没有取得所有权，而是在付清价款后才能取 得所有权。选项BE不当选，租赁物在承租人按照租赁合同占有期限内发生所有权变动的， 租赁物在承租人按照租赁合同占有期限内发生所有权变动的， 不影响租赁合同的效力 不影响租赁合同的效力。根据租赁合同的约定，甲有权承租无人机至10月31日，故丙在租期 届满前，无权要求甲交付无人机。选项C当选，标的物毁损、灭失的风险，在标的物交付之 前由出卖人承担，交付之后由买受人承担，但是法律另有规定或者当事人另有约定的除外。 6月20日，乙通过指示交付的方式将无人机进行交付，交付后风险转移给丙。选项D当选，履 行期限不明确的，债务人可以随时履行，债权人也可以随时请求履行，但是应当给对方必要 的准备时间。6月2日买卖合同成立，双方未约定履约期限，丙随时有权请求乙交付无人机。 提示：在所有权保留情况中，虽然标的物所有权仍然归出卖人所有，但此时标的物已经变更 为买受人占有和控制，故买受人应当负担标的物毁损、灭失的相关风险，即所有权保留条款 并不会当然影响标的物风险转移。"},{"sub_num":4,"text":"下列关于无人机坠毁责任承担的说法中，正确的有（    ）。","options":{"A":"丙有权请求戊承担赔偿责任","B":"丙有权请求丁承担赔偿责任","C":"甲、戊应对无人机坠毁承担连带责任","D":"丙有权请求甲承担赔偿责任","E":"戊应对农用无人机坠毁承担无过错责任"},"answer":"ADE","explanation":"本题考查合同责任与侵权责任。选项E当选，无民事行为能力 人、限制民事行为能力人造成他人损害，由监护人承担侵权人应承担的全部责任（无过错责 任）。选项AD当选，丙作为农用无人机的所有权人，有权请求侵权人戊承担赔偿责任，也 有权基于租赁合同请求甲承担因第三人的原因导致不能向丙交付农用无人机的赔偿责任。选 项C不当选，连带债务的发生是由法律规定或者当事人约定。而不真正连带债务的发生是因 不同法律关系的偶然竞合所致，并非法律所规定，各债务人之间亦不可能存在约定。在本题 中，甲、戊之间成立的是不真正连带关系。选项B不当选，根据合同相对性原理，丙有权请 求甲承担赔偿责任，甲向丙承担赔偿责任后，有权基于转租合同向丁进行追偿，即丙无权直 接请求丁承担赔偿责任。 第十章  婚姻家庭和继承法 答案与解析 一、单项选择题"}],"options":{},"answer":"","explanation":""},{"id":"10.1","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"单选","question":"甲（女）5岁时生父去世，其母随后与乙再婚。在共同生活期间，继父乙对甲履行了抚养和教育的责任。甲成年后，下列关于其对继父乙是否负有赡养义务的说法中，正确的是 （　）。","options":{"A":"甲对乙没有赡养义务，因为二人之间不存在自然血亲关系","B":"甲对乙负有赡养义务，因为双方为拟制血亲关系","C":"甲对乙负有赡养义务，因为法律规定所有继子女都必须赡养继父母","D":"甲对乙没有赡养义务，因为二人的关系属于非婚生父女关系"},"answer":"B","explanation":"本题考查父母子女关系。选项A不当选，赡养义务的产生不仅基于自然血 亲，也可基于合法的拟制血亲关系。选项B当选，根据《民法典》规定，继父或者继母和受 其抚养教育的继子女间的权利义务关系，适用关于父母子女关系的法律规定。本案中乙对甲 尽到了抚养教育义务，双方已形成具有法律约束力 形成具有法律约束力的拟制血亲关系，故甲成年后应对乙承担 赡养义务。选项C不当选，继子女对继父母的赡养义务以形成抚养教育关系为前提，并非所 有继子女都自动负有该义务。选项D不当选，非婚生子女，是指没有合法婚姻关系的男女所 生的子女。甲的生父去世后，其母与乙再婚，甲与乙属于合法的继父女关系，不属于非婚生 父女关系。"},{"id":"10.2","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"单选","question":"根据《民法典》的规定，法院审理宣告婚姻无效案件，下列说法正确的是（　）。","options":{"A":"对于婚姻无效可以以调解的方式结案","B":"婚姻是否无效的判断，可以由双方协商予以确认","C":"对于婚姻无效应以判决的方式结案","D":"法院受理请求婚姻无效案件后，原告申请撤诉的，法院经审查撤诉确为原告真实意思表示后，可予准许"},"answer":"C","explanation":"本题考查无效婚姻。选项A不当选、选项C当选，对婚姻效力的审理不适用 调解，应当依法作出判决。选项B不当选，婚姻是否无效的判断，只能由法院根据法定情形 予以确认。选项D不当选，法院受理请求确认婚姻无效案件后，原告申请撤诉的，法院不予 准许。"},{"id":"10.3","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"单选","question":"下列各项中，属于可撤销婚姻的是（　）。","options":{"A":"一方婚前隐瞒既往婚史","B":"一方婚前隐瞒重大债务","C":"双方是三代以内旁系血亲之间的婚姻","D":"一方婚前隐瞒重大疾病未告知对方"},"answer":"D","explanation":"本题考查可撤销婚姻。选项AB不当选，该情形不属于无效婚姻、可撤销婚 姻。选项C不当选，三代以内旁系血亲之间禁止结婚，该婚姻属于无效婚姻。选项D当选，一 方患有重大疾病的，应当在结婚登记前如实告知另一方；不如实告知的，另一方可以向法院 请求撤销婚姻。"},{"id":"10.4","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"单选","question":"根据《民法典》的规定，下列属于夫妻共同财产的是（　）。","options":{"A":"赠与合同中确定只归一方的财产","B":"婚后用共同财产购买的房屋","C":"一方婚前购买的小汽车","D":"一方因出车祸获得的赔偿"},"answer":"B","explanation":"本题考查夫妻共同财产。选项B当选，夫妻在婚姻关系存续期间取得的下 列财产属于夫妻共同财产：（1）工资、奖金、劳务报酬；（2）生产、经营、投资的收益； （3）知识产权的收益；（4）继承或者受赠的财产，但《民法典》特别规定的属夫妻一方 的个人财产除外。选项ACD不当选，下列财产为夫妻一方的个人财产：（1）一方的婚前财 产；（2）一方因受到人身损害获得的赔偿和补偿；（3）遗嘱或者赠与合同中确定只归一方 的财产；（4）一方专用的生活用品；（5）其他应当归一方的财产。"},{"id":"10.5","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"单选","question":"甲和乙自愿达成离婚协议，并约定财产平均分配，婚姻关系存续期间的债务全部由乙偿还。经查，婚姻存续期间甲、乙共同向丙借款10万元用于购买婚房。下列说法正确的是 （　）。","options":{"A":"丙只能要求甲偿还10 万元","B":"丙只能要求乙偿还10 万元","C":"如甲偿还了10 万元，则有权向乙追偿10 万元","D":"如甲偿还了10 万元，则有权向乙追偿5 万元"},"answer":"C","explanation":"本题考查夫妻共同债务清偿。选项AB不当选，离婚时，夫妻共同债务，应 当共同偿还。即使题述情形约定夫妻离婚后对夫妻共同债务的清偿方式，该约定对债权人丙 不发生效力。丙仍然有权要求甲或乙承担全部清偿责任。选项C当选、选项D不当选，按甲、 乙双方约定，婚姻关系存续期间的债务全部由乙偿还，若甲清偿10万元债务，则有权向乙追 偿10万元。"},{"id":"10.6","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"单选","question":"下列关于婚姻终止的说法中，正确的是（　）。","options":{"A":"婚姻终止的法律事实包括因配偶的失踪而终止","B":"在离婚冷静期届满后，双方无异议的即可办理离婚登记","C":"男女双方自愿离婚的，不得委托他人到婚姻登记机关申请离婚登记","D":"婚姻解除的时间为完成离婚登记之时"},"answer":"C","explanation":"本题考查婚姻的终止。选项A不当选，婚姻终止，是指合法有效的婚姻因 发生一定的法律事实而归于消灭。引起婚姻终止的原因包括配偶的死亡和离婚，而没有失 踪。选项B不当选，在规定的离婚冷静期届满后30日内，双方应当亲自到婚姻登记机关申请 发给离婚证；未申请的，视为撤回离婚登记申请。选项C当选，男女双方自愿离婚的，应当 订立书面离婚协议，并亲自到婚姻登记机关申请离婚登记。选项D不当选，完成离婚登记或 者离婚判决书、调解书生效，即解除婚姻关系。"},{"id":"10.7","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"单选","question":"王大毛与张小喵结婚时签订书面协议，约定婚后所得财产归各自所有，张小喵婚后即辞去工作在家照顾公婆和小孩。王大毛长期在外地工作，对家庭照顾较少，且在婚内与陈小星同 居。张小喵随即向法院起诉离婚。下列说法或做法中，错误的是（　）。","options":{"A":"因对家庭付出较多，张小喵请求王大毛予以补偿","B":"因对家庭付出较多，张小喵请求确定其与王大毛约定婚后财产归各自所有的约定无效","C":"因王大毛与陈小星同居，张小喵请求王大毛给予损害赔偿","D":"因离婚后生活困难，王大毛应当给予张小喵适当帮助"},"answer":"B","explanation":"本题考查离婚的法律后果。选项B当选，男女双方可以约定婚姻关系存续 期间所得的财产以及婚前财产归各自所有、共同所有或者部分各自所有、部分共同所有。约 定应当采用书面形式。该约定属于王大毛与张小喵真实意思表示，该约定合法有效。张小喵 不得主张约定无效。"},{"id":"10.8","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"单选","question":"下列关于收养的说法中，符合《民法典》规定的是（　）。","options":{"A":"当事人协议解除收养关系的，无须办理登记","B":"收养人在被收养人成年以后，原则上不得解除收养关系","C":"收养关系自收养协议生效之日起成立","D":"有配偶者收养子女，应当夫妻共同收养"},"answer":"D","explanation":"本题考查收养。选项A不当选，因双方协议而解除收养关系的，双方当事 人应向公证机关或基层政权机关提出申请，以公证机关发给的收养关系解除的公证书或者基 层政权机关办理解除收养关系的登记为准。选项B不当选，收养人在被收养人成年以前，原 则上不得解除收养关系，但是收养人、送养人双方协议解除的除外。选项C不当选，收养关 系自登记之日起成立。选项D当选，有配偶者收养子女，应当夫妻共同收养。"},{"id":"10.9","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"单选","question":"相互有继承关系的数人在同一事件中死亡，难以确定死亡时间，下列关于死亡时间确定规则的说法中，正确的是（　）。","options":{"A":"推定有其他继承人的人先死亡","B":"都有其他继承人，辈分不同的，推定晚辈先死亡","C":"都有其他继承人，辈分相同的，推定同时死亡，相互不发生继承","D":"都有其他继承人，辈分相同的，推定同时死亡，可以相互继承"},"answer":"C","explanation":"本题考查继承。选项C当选，根据规定，相互有继承关系的数人在同一事 件中死亡，难以确定死亡时间的，推定没有其他继承人的人先死亡。都有其他继承人，辈分 不同的，推定长辈先死亡；辈分相同的，推定同时死亡，相互不发生继承。 第十章  婚姻家庭和继承法| 答案与解析"},{"id":"10.10","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"单选","question":"下列有关遗赠的说法中，正确的是（　）。","options":{"A":"遗赠是双方法律行为","B":"受遗赠人是法定继承人","C":"遗赠于遗赠人死亡时生效","D":"受遗赠人只能是自然人"},"answer":"C","explanation":"本题考查遗赠。选项A不当选，遗赠属于单方民事法律行为，只要将遗赠 内容载入遗嘱，不需要受遗赠人同意即可产生法律效力。选项BD不当选，受遗赠人既可以 是自然人，也可以是非自然人，但作为受遗赠人的自然人必须是法定继承人以外的人。选 项C当选，遗赠人生前所为的遗赠行为只有到他死亡时才发生法律效力，受遗赠人才有权取 得遗嘱中所指定的遗赠给他的遗产。"},{"id":"10.11","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"单选","question":"柯明仁临终立下自书遗嘱，对其个人财产处理如下：将房产留给对其尽了主要赡养义务的丧偶儿媳李红，将汽车留给胞弟柯明海，将存款留给养子柯华，将收藏的字画留给孙子柯磊， 根据《民法典》的规定，下列属于受遗赠人的是（　）。","options":{"A":"李红","B":"柯明海","C":"柯华","D":"柯磊"},"answer":"D","explanation":"本题考查遗赠。选项A不当选，丧偶儿媳对公婆，丧偶女婿对岳父母，尽 了主要赡养义务的，作为第一顺序继承人。选项BC不当选，遗赠是给予法定继承人范围以 外的人财产利益的民事法律行为。法定继承人包括：配偶、子女（包括婚生子女、非婚生子 女、养子女和有扶养关系的继子女）、父母、兄弟姐妹、祖父母、外祖父母。"},{"id":"10.12","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"单选","question":"下列关于确定遗产管理人的说法中，正确的是（　）。","options":{"A":"对遗产管理人的确定有争议的，利害关系人可以申请被继承人生前住所地的民政部门指定","B":"继承人均放弃继承的，由被继承人生前住所地的居民委员会担任遗产管理人","C":"没有遗嘱执行人，继承人又未推选遗产管理人的，由继承人共同担任遗产管理人","D":"没有继承人的，由被继承人生前工作单位担任遗产管理人"},"answer":"C","explanation":"本题考查遗产管理人。选项A不当选，对遗产管理人的确定有争议的，利 害关系人可以向法院申请指定遗产管理人。选项BD不当选，没有继承人或者继承人均放弃继 承的，由被继承人生前住所地的民政部门或者村民委员会担任遗产管理人。选项C当选，没 有遗嘱执行人的，继承人应当及时推选遗产管理人；继承人未推选的，由继承人共同担任遗 产管理人。 二、多项选择题"},{"id":"10.13","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"多选","question":"根据《民法典》的规定，下列情形属于可撤销的婚姻的有（　）。","options":{"A":"27 岁的赵某（男）和18 岁钱某（女）结婚","B":"赵某（男）和表妹钱某（女）结婚","C":"丈夫李某被宣告死亡后，妻子钱某与赵某结婚","D":"钱某因受赵某胁迫而与其结婚","E":"赵某（男）婚前患有重大疾病，向钱某（女）隐藏病情并与其结婚"},"answer":"DE","explanation":"本题考查婚姻无效和可撤销的区分。选项A不当选，法定婚龄为男性不 早于22周岁，女性不早于20周岁。未达到法定婚龄的，婚姻无效，而非可撤销。选项B不当 选，直系血亲或者三代以内的旁系血亲禁止结婚。表兄妹属于三代以内旁系血亲，该等婚姻 无效。选项C不当选，夫妻一方被宣告死亡的，婚姻关系自动消除，另一方再结婚的，一般 为有效婚姻。选项D当选，因胁迫结婚的，受胁迫的一方可以向法院请求撤销婚姻。选项E当 选，一方患有重大疾病的，应当在结婚登记前如实告知另一方；不如实告知的，另一方可以 向法院请求撤销婚姻。 问题：如何辨析无效婚姻与可撤销婚姻？ 解答：无效婚姻可由他人主张，可撤销婚姻仅限 无效婚姻可由他人主张，可撤销婚姻仅限本人 本人。 无效婚姻的情形是法定“硬伤”，直接无效（重婚、近亲、未达龄）；可撤 销婚姻的情形需主动申请（胁迫、瞒大病）。"},{"id":"10.14","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"多选","question":"根据《民法典》的规定，下列夫妻关系存续期间取得的财产中，属于夫妻共同财产的有（　）。","options":{"A":"一方专用的生活用品","B":"一方获得的伤残补助金","C":"一方依法定继承取得的财产","D":"一方获得的医疗生活补助费","E":"知识产权收益"},"answer":"CE","explanation":"本题考查夫妻共同财产。选项ABD不当选，婚姻关系存续期间，一方因 受到人身损害获得的赔偿和补偿、一方专用的生活用品均属于个人财产。夫妻在婚姻关系存 续期间所得的下列财产为夫妻共同财产，为夫妻共同所有：（1）工资、奖金、劳务报酬； （2）生产、经营、投资的收益；（3）知识产权的收益（选项E当选）；（4）继承或者受赠 的财产（选项C当选），但《民法典》特别规定的属夫妻一方的个人财产除外；（5）其他应 当归于共同所有的财产。"},{"id":"10.15","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"多选","question":"根据《民法典》的规定，下列关于离婚案件的受理及裁判的说法中，正确的有（　）。","options":{"A":"法院审理离婚案件应当先进行调解，调解无效才能判决离婚","B":"若在起诉离婚前已经分居2 年，经法院调解无效的，应当判决离婚","C":"一方被宣告失踪，另一方提出离婚诉讼的，不应准许","D":"法院判决离婚的，自判决书生效之日起双方婚姻关系解除","E":"若一审法院判决不准离婚，双方在分居1 年后再次提起离婚诉讼的，则法院应准予离婚"},"answer":"ADE","explanation":"本题考查诉讼离婚。选项A当选，法院审理离婚案件，应当进行调解； 如果感情确已破裂，调解无效，应当准予离婚。选项B不当选，因感情不和分居满2年，调 解无效的，应当准予离婚。选项C不当选，一方被宣告失踪，另一方提出离婚诉讼的，应准 予离婚。选项D当选，完成离婚登记或者离婚判决书、调解书生效，即解除婚姻关系。选 项E当选，经法院判决不准离婚后，双方又分居满1年，一方再次提起离婚诉讼的，应当准予 离婚。"},{"id":"10.16","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"多选","question":"下列关于可撤销婚姻的说法中，正确的有（　）。","options":{"A":"可撤销的婚姻，双方当事人均有权主张撤销婚姻","B":"可撤销婚姻在撤销前不具有法律约束力","C":"可撤销的婚姻必须由享有撤销权的本人向法院提出撤销","D":"因胁迫结婚的属于可撤销婚姻","E":"结婚登记前，一方患有重大疾病未如实告知另一方的属于可撤销婚姻"},"answer":"CDE","explanation":"本题考查可撤销婚姻。选项A不当选、选项DE当选，因胁迫结婚的，受 胁迫的一方可以向法院请求撤销婚姻。一方患有重大疾病的，应当在结婚登记前如实告知另 一方；不如实告知的，另一方可以向法院请求撤销婚姻。选项B不当选，在当事人行使撤销 权之前，婚姻关系有效，双方当事人之间产生夫妻人身和财产方面的权利和义务，但婚姻因 撤销权的行使而自始没有法律拘束力。选项C当选，可撤销的婚姻必须由享有撤销权的一方 当事人向法院提出撤销婚姻的意思表示。"},{"id":"10.17","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"多选","question":"根据《民法典》的规定，第二顺序法定继承人有（　）。","options":{"A":"孙子女","B":"丧偶儿媳","C":"兄弟姐妹","D":"岳父母","E":"祖父母"},"answer":"CE","explanation":"本题考查法定继承人的继承顺序。选项CE当选，继承顺序，是指法律规 定的法定继承人继承遗产的先后次序。根据《民法典》的规定，遗产按照下列顺序继承：第 一顺序为配偶、子女、父母和尽了主要赡养义务的丧偶儿媳或丧偶女婿；第二顺序为兄弟姐 妹、祖父母、外祖父母。"},{"id":"10.18","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"多选","question":"根据《民法典》的规定，下列关于遗嘱继承的说法中，正确的有（　）。","options":{"A":"继承人的债务人不能作为遗嘱见证人","B":"法定继承人以外的人可以担任遗嘱执行人","C":"遗嘱人立遗嘱时具有完全民事行为能力，后来成为无民事行为能力人的，遗嘱无效","D":"公证遗嘱由遗嘱人经公证机关办理，办理时，应有两个以上见证人在场见证","E":"遗嘱被篡改的，遗嘱无效"},"answer":"AB","explanation":"本题考查遗嘱继承。选项A当选，无民事行为能力人、限制民事行为能 无民事行为能力人、限制民事行为能 力人以及其他不具有见证能力的人不能作为遗嘱见证人 力人以及其他不具有见证能力的人不能作为遗嘱见证人；除此之外，继承人、受遗赠人以及 与继承人、受遗赠人有利害关系的人（债权人、债务人，共同经营的合伙人）也不能作为遗 嘱见证人。选项B当选，遗嘱人可以在遗嘱中指定法定继承人中的一个或数个执行遗嘱，也 可以指定法定继承人以外的人执行遗嘱，还可以指定某些单位或组织充当遗嘱执行人。选 项C不当选，遗嘱人立遗嘱时具有完全民事行为能力，后来成为无民事行为能力人或者限制 民事行为能力人的，不影响遗嘱的效力。选项D不当选，公证遗嘱无须 无须2个以上见证人在场见 证。选项E不当选，遗嘱被篡改的，篡改的内容 遗嘱被篡改的，篡改的内容无效。"},{"id":"10.19","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"多选","question":"赵某有妻子儿女，为了妥善处理其死后财产，先后立有数份遗嘱，后赵某突发脑溢血死亡，根据《民法典》的规定，对其遗产处理方式的说法中，正确的有（　）。","options":{"A":"若其数份遗嘱内容相抵触，应以第一份遗嘱为准","B":"若其数份遗嘱内容相抵触，应以其最后所立遗嘱为准","C":"若其数份遗嘱内容相抵触，应按法定继承处理","D":"对于其遗嘱中未涉及的遗产应按法定继承处理","E":"因其立有数份遗嘱，所以所有遗嘱均无效"},"answer":"BD","explanation":"本题考查遗嘱的效力。选项ACE不当选、选项B当选，立有数份遗嘱，内 容相抵触的，以最后的遗嘱为准。选项D当选，遗嘱未处分的遗产，应当按法定继承处理。"},{"id":"10.20","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"多选","question":"根据《民法典》及相关规定，下列关于遗产归属和处理规则的说法中，正确的有（　）。","options":{"A":"遗产管理人应向继承人报告遗产情况","B":"遗产管理人无权处理被继承人的债权债务","C":"继承人可以在继承开始后随时请求分割遗产","D":"遗产自继承开始时转归全体继承人共同共有","E":"遗产管理人应当按照遗嘱或法律规定分割遗产"},"answer":"ACDE","explanation":"本题考查遗产归属和处理规则。遗产管理人应当履行下列职责：（1）清 理遗产并制作遗产清单；（2）向继承人报告遗产情况（选项A当选）；（3）采取必要措施 防止遗产毁损；（4）处理被继承人的债权债务（选项B不当选）；（5）按照遗嘱或者依照 法律规定分割遗产（选项E当选）；（6）实施与管理遗产有关的其他必要行为。选项C当 选，继承开始后，遗产转归全体继承人共同共有，继承人可以随时请求分割遗产。选项D当 选，遗嘱未处分的遗产，按照法定继承办理。"},{"id":"10.21","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"多选","question":"下列关于遗赠扶养协议与遗赠的说法中，正确的有（　）。","options":{"A":"遗赠扶养协议是有偿、诺成、双方民事法律行为","B":"自然人可以与继承人签订遗赠扶养协议","C":"继承开始后，如果遗赠扶养协议与遗嘱有抵触，按遗嘱处理","D":"遗赠扶养协议自遗赠人死亡时发生法律效力","E":"遗赠扶养协议是生前行为和死后行为的统一"},"answer":"AE","explanation":"本题考查遗赠扶养协议与遗赠。选项A当选，遗赠扶养协议是有偿、诺 成、双方民事法律行为。选项B不当选，自然人可以与继承人以外的组织或者个人签订遗赠 扶养协议。选项C不当选，继承开始后，如果遗赠扶养协议与遗嘱没有抵触，遗产分别按协 议和遗嘱处理；如果有抵触，按协议处理。选项D不当选、选项E当选，遗赠扶养协议是生前 第十章  婚姻家庭和继承法| 答案与解析 行为和死后行为的统一。遗赠扶养协议从协议成立之日起开始发生法律效力，而遗赠是从遗 赠人死亡之日起发生法律效力。"},{"id":"10.22","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"多选","question":"甲通过自书遗嘱，将自己的全部遗产赠送给好友乙。甲有一个亲生女儿丙和一个养子丁，还有一个未成年的继子戊（与甲未形成抚养教育关系）。2025年6月15日，甲不幸离世，乙于 同日知晓遗嘱。甲的儿女们对遗产的处理均有意见，遂提起诉讼。直到2025年8月17日遗产 纠纷案件开庭，乙仍未作表示是否接受遗赠。下列关于本案的说法中，正确的有（　）。","options":{"A":"戊不享有法定继承权","B":"乙有权取得全部遗产","C":"丙与丁是直系血亲关系","D":"乙未作表示，视为放弃接受遗赠","E":"丙、丁享有法定继承权，有权取得甲的全部遗产三、综合分析题"},"answer":"ADE","explanation":"本题考查亲属关系和遗赠。选项A当选，继父母与继子女未形成抚养 教育关系，相互间不发生法定的权利义务关系。戊与甲未形成抚养教育关系，相互之间不 能继承遗产。因此，甲死亡，戊不享有法定继承权。选项C不当选，丙是甲亲生女儿，丁是 甲的养子，丙、丁之间为旁系血亲。选项B不当选、选项D当选，受遗赠人应当在知道受遗 赠后60日内，作出接受或者放弃受遗赠的表示；到期没有表示的，视为放弃受遗赠。乙于 2025年6月15日知晓遗嘱，直至2025年8月17日尚未作出继承遗产的意思表示，视为乙放弃受 遗赠。选项E当选，乙放弃受遗赠后，对甲的遗产适用法定继承，丙、丁作为第一顺序继承 人，有权取得甲的全部遗产。 三、综合分析题"},{"id":"10.23","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"综合","question":"1986年3月1日，刘沧海与葛丽娟登记结婚。1994年5月2日，夫妻二人决定收养一个孩子，遂\n从儿童福利机构收养了一名女孩，取名刘欣颖，并办理了收养和户籍登记。\n2000年7月，刘沧海与葛丽娟因感情不和向法院提起离婚诉讼，2000年9月，法院判决准予二人\n离婚，并将孩子的抚养权及位于京海市甲区的一处房屋判给女方葛丽娟。法院判决生效后，房屋一\n直未办理过户登记，仍登记在刘沧海名下。\n2002年，刘沧海再婚，再婚妻子为何燕。2008年，刘沧海用其与何燕的夫妻共同财产在京海\n市乙区购买了一套房屋用于居住，并登记在刘沧海名下。次年，二人生下一个儿子，名叫刘小涛。\n2016年10月，刘沧海在京海市丙区因交通事故去世身亡。刘沧海的父亲于2016年6月去世，其母亲\n季海霞一直由刘沧海的哥哥刘沧山抚养。\n2017年5月，刘欣颖将何燕、季海霞、刘小涛告上法庭，请求分割养父刘沧海留下的遗产。涉\n及的财产包括两套房屋，一套是位于京海市甲区的房屋，一套位于京海市乙区的房屋；此外，何燕\n\n\n第十章| 婚姻家庭和继承法\n婚后所得存款80万元、交通事故死亡赔偿金23万元和抚恤金5万元。","sub_questions":[{"sub_num":1,"text":"根据继承法律制度的规定，下列主体中可以担任遗产管理人的有（    ）。","options":{"A":"刘小涛","B":"季海霞","C":"何燕","D":"刘欣颖","E":"葛丽娟"},"answer":"CD","explanation":"本题考查遗产管理人。选项CD当选，遗产管理人应当具备完全民 事行为能力。继承开始后，遗嘱执行人 遗嘱执行人为遗产管理人；没有遗嘱执行人的，继承人应当及时 推选遗产管理人 推选遗产管理人；继承人未推选的，由继承人共同担任 继承人共同担任遗产管理人。没有继承人或者继承人 均放弃继承的，由被继承人生前住所地的民政部门或者村民委员会 被继承人生前住所地的民政部门或者村民委员会担任遗产管理人。本题 中，刘沧海并未订立遗嘱，其遗产应按照法定继承分配。第一顺序的法定继承人分别为其现 任妻子何燕、婚生子刘小涛、养子女刘欣颖及其母亲季海霞。刘沧海的母亲季海霞为无民事 行为能力人，其婚生子刘小涛为限制民事行为能力人，二人均不得担任遗产管理人。葛丽娟 作为刘沧海的前妻，不属于刘沧海的法定继承人。综上，可以担任遗产管理人的分别为何燕 和刘欣颖。"},{"sub_num":2,"text":"下列关于亲属关系的说法中，正确的有（    ）。","options":{"A":"刘欣颖与葛丽娟之间属于拟制血亲关系","B":"刘欣颖与刘沧海之间属于非婚生子女关系","C":"刘欣颖与刘沧山之间属于直系血亲关系","D":"刘欣颖与季海霞之间属于直系血亲关系","E":"刘欣颖与何燕之间属于拟制血亲关系"},"answer":"AD","explanation":"本题考查亲属关系。选项A当选，自然血亲，是指有自然血缘联系 的亲属，如同父同母、同父异母、同母异父。拟制血亲指相互之间本无该种血亲应当具有的 血缘关系，但法律确认其与该种血亲具有相同的权利义务的亲属，如收养。题述情形中，刘 欣颖与其养父母葛丽娟、刘沧海之间属于拟制直系血亲。选项B不当选，非婚生子女是指没 有合法婚姻关系的男女所生的子女。题述情形中，刘欣颖属于刘沧海与葛丽娟婚姻关系存 续期间所收养的子女，不属于非婚生子女。选项C不当选，养子女与养父母的近亲属间形成 相应的拟制血亲关系。题述情形中，刘沧山为刘沧海的哥哥，刘欣颖与刘沧山之间属于拟制 的旁系血亲。选项D当选，直系血亲，是指彼此之间有直接血缘关系的亲属。如父母、祖父 母、外祖父母、子女、孙子女、外孙子女。直系血亲除自然血亲外，还包括法律拟制的直系 血亲，如养父母与养子女、养祖父母与养孙子女、有抚养关系的继父母与继子女。选项E不 当选，刘欣颖与何燕之间属于继父母子女关系，必须具有抚养关系才能发生拟制血亲关系。 题述情形中，刘欣颖与何燕之间并无抚养关系，故不构成拟制血亲关系。"},{"sub_num":3,"text":"下列财产中，属于刘沧海遗产的有（    ）。","options":{"A":"死亡赔偿金23 万元","B":"抚恤金5 万元","C":"甲区的房屋","D":"乙区房屋的1/2 份额","E":"存款40 万元"},"answer":"DE","explanation":"本题考查夫妻财产关系。遗产，是指自然人死亡时遗留的 死亡时遗留的个人合法 财产，但是，依照法律规定或者根据其性质不得继承的除外。选项AB不当选，死亡赔偿金与 抚恤金是刘沧海死亡后产生的财产，不属于刘沧海的遗产。选项C不当选，因人民法院、仲 裁机构的法律文书或者人民政府的征收决定等，导致物权设立、变更、转让或者消灭的，自 法律文书或者征收决定等生效时发生效力。题述情形中，法院在刘沧海与葛丽娟的离婚诉讼 中，将位于甲区的房屋判给葛丽娟。法院的判决书生效时，该房屋就归葛丽娟所有，不以登 记作为物权变动的要件。选项DE当选，夫妻共同所有的财产，除有约定的外，遗产分割时， 应当先将共同所有的财产的一半分出为配偶所有，其余的为被继承人的遗产。题述情形中， 乙区的房屋和何燕的婚后所得存款80万元，均属于夫妻共同财产。其中一半应分出为配偶何 燕所有，剩下乙区房屋的1/2份额和40万元存款为刘沧海的遗产。"},{"sub_num":4,"text":"下列法院对遗产继承纠纷享有管辖权的有（    ）。","options":{"A":"京海市甲区人民法院","B":"京海市乙区人民法院","C":"京海市丙区人民法院","D":"刘欣颖住所地人民法院","E":"季海霞住所地人民法院\n\n\n\n做新变\n单项选择题"},"answer":"B","explanation":"本题考查专属管辖。选项B当选，因继承遗产纠纷提起的诉讼，由 被继承人死亡时住所地 被继承人死亡时住所地（京海市乙区人民法院）或者主要遗产所在地 主要遗产所在地（京海市乙区人民法 院）法院管辖。 第十章  婚姻家庭和继承法| 答案与解析 做新变 单项选择题"}],"options":{},"answer":"","explanation":""},{"id":"10.24","chapter":10,"chapter_name":"婚姻家庭和继承法","type":"单选","question":"下列关于协议离婚和诉讼离婚的说法中，正确的是（　）。","options":{"A":"离婚协议关于财产分割的约定、子女抚养权及抚养费的约定对双方具有约束力，且具有强制执行力","B":"若一方隐瞒财产协议离婚后，另一方可向法院起诉要求重新分割财产，但需在发现隐瞒财产之日起1 年内提出","C":"诉讼离婚的，双方婚姻关系自法院作出离婚判决时解除","D":"诉讼离婚的，调解书自双方签收后生效"},"answer":"D","explanation":"本题考查离婚。选项A不当选，离婚协议关于财产分割的约定、子女抚养 权及抚养费的约定对双方具有约束力，但无强制执行力。选项B不当选，若一方隐瞒财产， 协议离婚后，另一方可向法院起诉要求重新分割财产，但需在发现隐瞒财产之日起3年内提 出。选项D当选、选项C不当选，诉讼离婚的，判决书或者调解书生效后，双方婚姻关系解 除。判决书自送达之日起15日内无上诉即生效；调解书自双方签收后生效。 第十一章  个人独资企业法 答案与解析 一、单项选择题"},{"id":"11.1","chapter":11,"chapter_name":"个人独资企业法","type":"单选","question":"根据《个人独资企业法》的规定，下列关于个人独资企业的说法中，正确的是（　）。","options":{"A":"个人独资企业是一个法人组织","B":"投资人可以委托他人负责管理企业的事务","C":"投资人的个人财产与企业财产分离","D":"投资人可以是外国公民"},"answer":"B","explanation":"本题考查个人独资企业的概念。选项A不当选，个人独资企业是一个非法 人组织。选项B当选，个人独资企业的出资人可以自行管理企业事务，也可以委托或者聘用 其他具有民事行为能力的人担任企业事务管理。选项C不当选，个人独资企业投资人的个人 个人独资企业投资人的个人 财产与企业财产不分离，投资人对企业债务承担无限责任 财产与企业财产不分离，投资人对企业债务承担无限责任。选项D不当选，个人独资企业是 由一个自然人投资设立的企业，企业的出资人是一个自然人，并且仅指中国公民。"},{"id":"11.2","chapter":11,"chapter_name":"个人独资企业法","type":"单选","question":"下列关于个人独资企业特征、权限和事务管理的说法中，正确的是（　）。","options":{"A":"个人独资企业的名称中可以使用“有限”字样","B":"个人独资企业适用《公司法》","C":"个人独资企业不包括国有和集体所有的独资企业","D":"个人独资企业出资人对受聘人员职权的限制，可以对抗第三人"},"answer":"C","explanation":"本题考查个人独资企业的特征和事务管理等。选项A不当选，个人独资企 业的名称中不得使用“有限”“有限责任”或者“公司”等字样。选项B不当选，个人独资 企业适用《个人独资企业法》。选项D不当选，投资人对受托人或者被聘用的人员职权的限 投资人对受托人或者被聘用的人员职权的限 制，不得对抗善意第三人 制，不得对抗善意第三人。选项C当选，其所述为正确表述。"},{"id":"11.3","chapter":11,"chapter_name":"个人独资企业法","type":"单选","question":"李某设立个人独资企业，聘请张某负责日常经营管理。下列关于该企业事务管理及责任承担的表述中，正确的是（　）。","options":{"A":"李某仅以实际出资额为限对企业债务承担责任","B":"该企业具有独立法人资格，以企业全部财产承担责任","C":"李某以其个人全部财产对企业债务承担无限责任","D":"张某作为经营管理者需对企业债务承担连带责任"},"answer":"C","explanation":"本题考查个人独资企业的特征。选项C当选、选项AB不当选，个人独资企 业是一个非法人组织，不具有独立法人资格。个人独资企业投资人的个人财产与企业财产不 分离，投资人对企业债务承担无限责任。当投资人申报登记的出资不足以清偿个人独资企业 经营所负的债务时，投资人必须以其个人全部财产承担债务责任。选项D不当选，经营管理 者仅承担管理责任，不承担企业债务。"},{"id":"11.4","chapter":11,"chapter_name":"个人独资企业法","type":"单选","question":"下列关于个人独资企业成立时间的说法中，正确的是（　）。","options":{"A":"提交申请设立文件之日为企业成立日","B":"营业执照签发之日为企业成立日","C":"收到营业执照之日为企业成立日","D":"出资到位之日为企业成立日"},"answer":"B","explanation":"本题考查个人独资企业成立时间。选项B当选，个人独资企业营业执照的 签发日期为个人独资企业成立日期。"},{"id":"11.5","chapter":11,"chapter_name":"个人独资企业法","type":"单选","question":"下列关于个人独资企业解散和清算的说法中，正确的是（　）。","options":{"A":"投资人死亡且无继承人的，个人独资企业应当解散","B":"清算期间，个人独资企业可以开展部分与清算目的无关的经营活动","C":"个人独资企业清算结束后，应由法院指定的清算人编制清算报告","D":"个人独资企业解散后，原投资人对个人独资企业存续期间的债务不再负偿还责任"},"answer":"A","explanation":"本题考查个人独资企业解散和清算。选项A当选，投资人死亡或者被宣告 死亡，无继承人或者继承人放弃继承属于个人独资企业解散的情形。选项B不当选，清算期 间，个人独资企业不得开展与清算目的无关的经营活动。选项C不当选，个人独资企业清算 结束后，投资人或者人民法院指定的清算人应当编制清算报告，并于15日内到登记机关办理 注销登记。选项D不当选，个人独资企业解散后，原投资人对个人独资企业存续期间的债务 个人独资企业解散后，原投资人对个人独资企业存续期间的债务 仍应承担偿还责任，但债权人在 仍应承担偿还责任，但债权人在5年 5年内未向债务人提出偿债请求的，该责任 内未向债务人提出偿债请求的，该责任消灭。"},{"id":"11.6","chapter":11,"chapter_name":"个人独资企业法","type":"单选","question":"下列关于个人独资企业的变更登记和清算的说法中，正确的是（　）。","options":{"A":"个人独资企业存续期间登记事项发生变更的，应当办理注销登记","B":"个人独资企业申请变更登记，无须换发《营业执照》","C":"个人独资企业解散，可以由债权人申请法院指定清算人进行清算","D":"投资人自行清算的，应当在清算前10 日内书面通知债权人"},"answer":"C","explanation":"本题考查个人独资企业的变更登记和清算。选项A不当选，个人独资企业 存续期间登记事项发生变更的，应当办理变更登记。选项B不当选，个人独资企业存续期间 登记事项发生变更的， 应当办理变更登记。登记机关应当在收到投资人所提交且符合法律 规定的全部文件并符合法定条件的予以核准，换发《营业执照》；对不符合《个人独资企业 法》规定条件的变更登记申请，作出不予登记的决定。选项C当选、选项D不当选，个人独资 企业解散，由投资人自行清算或者由债权人申请法院指定清算人进行清算。投资人自行清算 的，应当在清算前15日内书面通知债权人，无法通知的，应当予以公告。 二、多项选择题"},{"id":"11.7","chapter":11,"chapter_name":"个人独资企业法","type":"多选","question":"鹿某是应届毕业大学生，为响应国家“大众创业，万众创新”号召，准备创办一家个人独资企业从事软件开发，经查阅相关资料后，鹿某对个人独资企业法律规定有了一定了解，下列 关于鹿某对个人独资企业法律规定的理解中，正确的有（　）。","options":{"A":"营业执照副本不具有法律效力","B":"个人独资企业应当依法设置会计账簿","C":"个人独资企业财产归投资人个人所有","D":"家庭可以申请设立个人独资企业","E":"个人独资企业投资人须自行管理企业事务"},"answer":"BC","explanation":"本题考查个人独资企业的特征等。选项A不当选，个人独资企业营业执 照分为正本和副本，正本和副本具有同等法律效力。选项B当选，企业应当依法设置会计账 簿，进行会计核算。选项C当选，个人独资企业的财产归投资人个人所有。选项D不当选， 个人独资企业的投资人为一个自然人，即使以家庭财产出资，也只能以一个自然人的名义设 立。选项E不当选，个人独资企业投资人可以自行管理企业事务，也可以委托或者聘用其他 具有民事行为能力的人负责企业的事务管理。"},{"id":"11.8","chapter":11,"chapter_name":"个人独资企业法","type":"多选","question":"个人独资企业成立满足的条件有（　）。","options":{"A":"有合法的企业名称","B":"有投资人申报的出资","C":"投资人为家庭","D":"投资人为一个自然人","E":"有固定的生产经营场所"},"answer":"ABDE","explanation":"本题考查个人独资企业的设立条件。个人独资企业的设立条件包 括：（1）投资人为一个自然人（选项D当选）；（2）有合法的企业名称（选项A当选）； （3）有投资人申报的出资（选项B当选）；（4）有固定的生产经营场所和必要的生产经营 条件（选项E当选）；（5）有必要的从业人员。"},{"id":"11.9","chapter":11,"chapter_name":"个人独资企业法","type":"多选","question":"根据《个人独资企业法》的规定，导致个人独资企业解散的情形有（　）。","options":{"A":"被依法吊销营业执照","B":"投资人死亡且无继承人","C":"投资人决定解散","D":"投资人丧失行为能力","E":"投资人被宣告死亡且其继承人放弃继承"},"answer":"ABCE","explanation":"本题考查个人独资企业解散的情形。有下列情形之一的，个人独资 企业解散：（1）投资人决定解散（选项C当选）；（2）投资人死亡或者被宣告死亡，无 继承人或者继承人放弃继承（选项BE当选）；（3）被依法吊销营业执照（选项A当选）； （4）法律、行政法规规定的其他情形。选项D不当选，投资者丧失行为能力并不必然导致个 投资者丧失行为能力并不必然导致个 人独资企业 人独资企业解散。 第十二章  合伙企业法 答案与解析 一、单项选择题"},{"id":"12.1","chapter":12,"chapter_name":"合伙企业法","type":"单选","question":"下列关于合伙企业特征的说法中，正确的是（　）。","options":{"A":"合伙企业具有法人资格","B":"合伙企业属于非商事合伙","C":"合伙协议必须以书面形式订立","D":"合伙企业具有资合的团体性"},"answer":"C","explanation":"本题考查合伙企业的特征。选项AB不当选，合伙企业属于商事合伙，不具 有法人资格。选项C当选，合伙协议应当依法由全体合伙人协商一致，以书面形式订立。选 项D不当选，合伙企业具有人合的团体性。"},{"id":"12.2","chapter":12,"chapter_name":"合伙企业法","type":"单选","question":"下列关于普通合伙企业的说法中，正确的是（　）。","options":{"A":"普通合伙企业的设立只能由2 个以上的自然人组成","B":"普通合伙企业的合伙人只能是法人或者其他组织，且国有企业、上市公司均不得成为普通合伙人","C":"普通合伙人对合伙企业债务承担无限连带责任","D":"普通合伙企业的合伙人不得以劳务作为出资"},"answer":"C","explanation":"本题考查普通合伙企业的设立。选项AB不当选，普通合伙企业应有2个以 上合伙人，合伙人可以是自然人，也可以是法人或者其他组织。选项D不当选，普通合伙企 业的合伙人全部为普通合伙人，普通合伙人可以以劳务出资。"},{"id":"12.3","chapter":12,"chapter_name":"合伙企业法","type":"单选","question":"下列有关普通合伙企业财产、财产份额转让以及出质的说法中，正确的是（　）。","options":{"A":"合伙企业的原始财产是指以合伙企业名义依法取得的全部收益","B":"合伙人之间转让在合伙企业中的财产份额的，无须其他合伙人一致同意","C":"合伙协议可以对合伙人以其在合伙企业中的财产份额出质事项约定表决办法","D":"合伙人向合伙人以外的人转让其在合伙企业中的财产份额的，应当通知其他合伙人"},"answer":"B","explanation":"本题考查合伙企业的财产及财产份额的转让及出质。选项A不当选，合伙 企业的财产包括原始财产和积累财产。原始财产是指全体合伙人的出资，积累财产包括：合 伙企业成立以后以合伙企业的名义依法取得的全部收益以及依法取得的其他财产。选项B当 选、选项D不当选，合伙人之间转让在合伙企业中的全部或者部分财产份额时，应当通知其 合伙人之间转让在合伙企业中的全部或者部分财产份额时，应当通知其 他合伙人，但无须经全体合伙人一致同意；合伙人向合伙人以外的人转让其在合伙企业中的 他合伙人，但无须经全体合伙人一致同意；合伙人向合伙人以外的人转让其在合伙企业中的 财产份额时，除合伙协议另有约定外，须经其他合伙人一致同意 财产份额时，除合伙协议另有约定外，须经其他合伙人一致同意。选项C不当选，合伙人以 合伙人以 其在合伙企业中的财产份额出质的，须经其他合伙人一致同意 其在合伙企业中的财产份额出质的，须经其他合伙人一致同意。合伙协议对此约定无效。"},{"id":"12.4","chapter":12,"chapter_name":"合伙企业法","type":"单选","question":"根据《合伙企业法》的规定，下列有关普通合伙企业合伙事务执行的说法中，正确的是（　）。","options":{"A":"不执行合伙事务的合伙人有权对执行合伙事务的合伙人执行合伙事务情况进行监督","B":"执行合伙事务的合伙人必须是自然人","C":"作为合伙人的法人、其他组织不能对外代表合伙企业执行合伙事务","D":"不执行合伙事务的合伙人可以对执行合伙事务的合伙人提出异议"},"answer":"A","explanation":"本题考查合伙事务的执行。选项A当选，按照合伙协议的约定或者全体合 伙人的决定，可以委托一个或者数个合伙人执行合伙事务；其他合伙人不再执行合伙事务， 但是有权监督执行情况。选项B不当选，自然人、法人、其他组织均可执行合伙事务。作为 合伙人的法人、其他组织执行合伙事务的，由其委派的代表执行。选项C不当选，按照合伙 协议的约定或者经全体合伙人决定，可以委托一个或者数个合伙人对外代表合伙企业，执行 合伙事务。作为合伙人的法人、其他组织执行合伙事务的，由其委派的代表执行。选项D不 当选，合伙人分别执行合伙事务的，执行事务合伙人可以对其他合伙人执行的事务提出 异议。"},{"id":"12.5","chapter":12,"chapter_name":"合伙企业法","type":"单选","question":"在普通合伙企业中，除合伙协议另有约定外，下列事项中，须经全体合伙人一致同意的是（　）。","options":{"A":"聘请合伙人以外的人担任企业的财务负责人","B":"出售合伙企业名下的动产","C":"合伙人以其个人财产为他人提供担保","D":"聘请会计师事务所承办合伙企业的审计业务"},"answer":"A","explanation":"本题考查合伙企业的决议。除合伙协议另有约定外，合伙企业的下列事项 应当经全体合伙人一致同意：（1）改变合伙企业的名称；（2）改变合伙企业的经营范围、 主要经营场所的地点；（3）处分合伙企业的不动产（选项B不当选，处分动产无须经全体合 伙人一致同意）；（4）转让或者处分合伙企业的知识产权和其他财产权利；（5）以合伙企 业名义为他人提供担保（选项C不当选，合伙人为他人或合伙企业提供担保无须经全体合伙 人一致同意）；（6）聘任合伙人以外的人担任合伙企业的经营管理人员（选项A当选）。选 项D不当选，普通合伙企业中对于“聘请会计师事务所承办合伙企业的审计业务”是否需要 经过全体合伙人一致同意未作要求。但在有限合伙企业中，有限合伙人参与选择承办审计业 务的会计师事务所，不视为有限合伙人执行合伙事务。"},{"id":"12.6","chapter":12,"chapter_name":"合伙企业法","type":"单选","question":"甲为某普通合伙企业的执行事务合伙人。该合伙企业对甲执行合伙事务的权利作了一定限制。某日，甲超越权限代表合伙企业与乙公司签订了一份房屋租赁合同，乙公司对甲超越权 限并不知情。该合同的效力应为（　）。","options":{"A":"无效","B":"可撤销","C":"效力待定","D":"有效"},"answer":"D","explanation":"本题考查合伙人在执行合伙事务中的权利。选项D当选，合伙企业对合伙 合伙企业对合伙 人执行合伙事务以及对外代表合伙企业权利的限制，不得对抗善意第三人 人执行合伙事务以及对外代表合伙企业权利的限制，不得对抗善意第三人。题述情形下， 乙公司对甲超越权限并不知情，表明乙公司属于善意第三人，因此，甲公司不得主张该合同 无效。"},{"id":"12.7","chapter":12,"chapter_name":"合伙企业法","type":"单选","question":"根据合伙企业法律制度的规定，下列关于合伙人责任承担和事务执行的说法中，正确的是（　）。","options":{"A":"普通合伙企业的所有合伙人须共同执行事务","B":"普通合伙企业的合伙人仅以出资额为限对合伙企业债务承担责任","C":"特殊普通合伙企业的所有合伙人对合伙企业债务承担无限连带责任","D":"特殊普通合伙企业的合伙人对因其重大过失造成的合伙企业债务承担无限责任，其他合伙人承担有限责任"},"answer":"D","explanation":"本题考查合伙人责任承担和事务执行。选项A不当选，在普通合伙企业 中，按照合伙协议的约定或者经全体合伙人决定，可以委托一个或者数个合伙人对外代表合 伙企业，执行合伙事务。选项B不当选，合伙企业对其债务，应先以合伙企业自身的全部财 产进行清偿；合伙企业不能清偿到期债务的，合伙人承担无限连带责任。选项C不当选、选 项D当选，特殊普通合伙企业的责任形式可体现为：（1）无限责任与有限责任结合。如果一 个合伙人或数个合伙人在执业活动中因故意或重大过失造成合伙企业债务，该合伙人需承担 无限责任或无限连带责任，而其他合伙人则仅以其在合伙企业中的财产份额为限承担责任； （2）因非故意或重大过失产生的债务的责任。合伙人在执业活动中非因故意或重大过失造 成的合伙企业债务，以及合伙企业的其他债务，由全体合伙人承担无限连带责任；（3）内 部赔偿责任。因故意或重大过失造成合伙企业债务的合伙人，在合伙企业对外承担责任后， 还需按照合伙协议的约定对合伙企业造成的损失承担赔偿责任。"},{"id":"12.8","chapter":12,"chapter_name":"合伙企业法","type":"单选","question":"除合伙协议另有约定外，下列关于合伙人入伙、退伙的说法中，正确的是（　）。","options":{"A":"新合伙人对入伙前的合伙企业债务不承担责任","B":"新合伙人入伙应经合伙企业2/3 以上合伙人同意","C":"普通合伙人丧失偿债能力当然退伙","D":"合伙人故意或者重大过失给合伙企业造成损失的当然退伙"},"answer":"C","explanation":"本题考查合伙人入伙、退伙。选项A不当选，新入伙的普通合伙人 普通合伙人对入伙 前合伙企业的债务承担无限连带责任 无限连带责任；新入伙的有限合伙人 有限合伙人对入伙前有限合伙企业的债务， 以其认缴的出资额为限 认缴的出资额为限承担责任。选项B不当选，新合伙人入伙，除合伙协议另有约定外， 应当经全体合伙人一致同意，并依法订立书面入伙协议。订立入伙协议时，原合伙人应当向 新合伙人如实告知原合伙企业的经营状况和财务状况。选项D不当选，因故意或者重大过失 第十二章  合伙企业法| 答案与解析 给合伙企业造成损失，经其他合伙人一致同意，可以决议将其除名。"},{"id":"12.9","chapter":12,"chapter_name":"合伙企业法","type":"单选","question":"2023年1月，甲、乙共同设立普通合伙企业。同年10月，甲、乙为了扩大经营吸纳丙入伙，并在入伙协议中约定丙对其入伙前的债务不承担责任。现该合伙企业无力清偿欠债权人丁的 2023年9月到期的9万元债务。下列说法中，符合合伙企业法律制度规定的是（　）。","options":{"A":"丙有权以其与甲、乙间的约定，对抗债权人丁，拒绝清偿债务","B":"丙清偿9 万元债务后，有权向甲、乙全部追偿","C":"丙清偿9 万元债务后，只能分别向甲、乙各追偿3 万元","D":"甲清偿9 万元债务后，有权分别向乙、丙各追偿3 万元"},"answer":"B","explanation":"本题考查入伙。选项A不当选，入伙的新合伙人与原合伙人享有同等权 利，承担同等责任。入伙协议另有约定的，从其约定。新合伙人对入伙前合伙企业的债务承 担无限连带责任。即使入伙协议中约定新合伙人对入伙前合伙企业债务不承担责任，也不能 对抗合伙企业的债权人。选项B当选、选项CD不当选，入伙协议中约定新合伙人对入伙前合 伙企业债务不承担责任的，新合伙人应当向合伙企业的债权人清偿债务，但在清偿后有权依 据入伙协议的约定向其他合伙人追偿。本题中，丙应当对其入伙前的债务承担责任，向债权 人丁清偿债务。丙清偿后有权根据入伙协议的约定，向其他合伙人全部追偿。"},{"id":"12.10","chapter":12,"chapter_name":"合伙企业法","type":"单选","question":"某普通合伙企业合伙人甲死亡，其未成年子女乙、丙是其全部合法继承人。根据合伙企业法律制度的规定，下列说法中，正确的是（　）。","options":{"A":"乙、丙因继承甲的财产份额自动取得合伙人资格","B":"乙、丙可以继承甲的财产份额，但不能成为合伙人","C":"应解散合伙企业，清算后向乙、丙退还甲的财产份额","D":"经全体合伙人一致同意，乙、丙可以成为有限合伙人"},"answer":"D","explanation":"本题考查普通合伙人资格的继承。选项D当选，普通合伙人死亡或者被依 法宣告死亡，其继承人为无民事行为能力人或者限制民事行为能力人的，经全体合伙人一 致同意（不能自动取得资格），可以依法成为有限合伙人，普通合伙企业依法转为有限合伙 企业。"},{"id":"12.11","chapter":12,"chapter_name":"合伙企业法","type":"单选","question":"下列关于特殊的普通合伙企业的说法中，正确的是（　）。","options":{"A":"特殊的普通合伙企业以从事融资服务为主要特征","B":"在特殊的普通合伙企业中，合伙人对所有债务承担有限责任","C":"特殊的普通合伙企业建立的执业风险基金用于偿付合伙人执业活动造成的债务","D":"非专业机构经过批准也可以成立特殊的普通合伙企业"},"answer":"C","explanation":"本题考查特殊普通合伙企业。选项AD不当选，特殊普通合伙企业，是指以 专业知识和专门技能为客户提供有偿服务的专业机构性质的合伙企业；非专业服务机构不能 采取特殊的普通合伙企业形式。选项B不当选，特殊普通合伙企业中，一个合伙人或者数个 合伙人在执业活动中因故意或者重大过失造成合伙企业债务的，该合伙人需承担无限责任或 者无限连带责任，其他合伙人以其在合伙企业中的财产份额为限承担责任。选项C当选，特 殊的普通合伙企业应当建立执业风险基金、办理职业保险，执业风险基金用于偿付合伙人执 业活动造成的债务。"},{"id":"12.12","chapter":12,"chapter_name":"合伙企业法","type":"单选","question":"根据《合伙企业法》的规定，下列关于有限合伙人权利和义务的说法中，正确的是（　）。","options":{"A":"有限合伙人不参与合伙事务的管理","B":"有限合伙人不得以知识产权出资","C":"有限合伙人不享有对普通合伙人入伙和退伙的表决权","D":"有限合伙人在对外交往中可以代表合伙企业"},"answer":"A","explanation":"本题考查有限合伙人的权利与义务。选项A当选，有限合伙人不参与合伙 事务的处理，不得对外代表有限合伙企业。选项B不当选，有限合伙人可以用货币、实物、 知识产权、土地使用权或者其他财产权利作价出资。需要注意的是，有限合伙人不得以劳务 出资。选项CD不当选，有限合伙人不执行合伙事务，不得对外代表有限合伙企业，但其可以 参与决定普通合伙人入伙、退伙，该等情形不视为执行合伙事务。"},{"id":"12.13","chapter":12,"chapter_name":"合伙企业法","type":"单选","question":"下列各项中，属于有限合伙人当然退伙情形的是（　）。","options":{"A":"作为有限合伙人的法人被宣告破产","B":"因有限合伙人的自然人的重大过失造成合伙企业重大损失","C":"作为有限合伙人的自然人被宣告失踪","D":"作为有限合伙人的自然人丧失民事行为能力"},"answer":"A","explanation":"本题考查有限合伙人当然退伙的情形。有限合伙人出现下列情形之一时当 然退伙：（1）作为合伙人的自然人死亡或者被依法宣告死亡，宣告失踪不属于当然退伙情 宣告失踪不属于当然退伙情 形（选项C不当选）；（2）作为合伙人的法人或者其他组织依法被吊销营业执照、责令关 闭、撤销，或者被宣告破产（选项A当选）；（3）法律规定或者合伙协议约定合伙人必须 具有相关资格而丧失该资格；（4）合伙人在合伙企业中的全部财产份额被人民法院强制执 行。选项B不当选，普通合伙企业中规定了除名的情形，若因普通合伙人重大过失导致合伙 企业的重大损失，经其他合伙人一致同意，该合伙人被除名。该等规定在有限合伙企业中亦 适用。选项D不当选，无民事行为能力人和限制民事行为能力人可以成为有限合伙人，作为 有限合伙人的自然人丧失民事行为能力，不会导致其退伙。"},{"id":"12.14","chapter":12,"chapter_name":"合伙企业法","type":"单选","question":"王某是某有限合伙企业的有限合伙人，在合伙协议无特别约定的情况下，王某在合伙期间经其他合伙人同意实施的下列行为中，不符合《合伙企业法》规定的是（　）。","options":{"A":"将自购的机器设备出租给合伙企业使用","B":"以合伙企业的名义购买汽车一辆归合伙企业使用","C":"以自己在合伙企业中的财产份额向银行提供质押担保","D":"提前30 日通知其他合伙人将其部分合伙份额转让给合伙人以外的人"},"answer":"B","explanation":"本题考查有限合伙人的义务。选项A不当选，合伙协议没有约定的情况 下，有限合伙人可以同本有限合伙企业进行交易。选项B当选，有限合伙人不执行合伙事 务，不得对外代表有限合伙企业，因此，王某不能以合伙企业的名义签订合同。选项C不当 选，合伙协议没有约定的情况下，有限合伙人可以将其在合伙企业中的财产份额出质。选 项D不当选，有限合伙人可以按照合伙协议的约定向合伙人以外的人转让其在有限合伙企业 中的财产份额，但应当提前30日通知其他合伙人。"},{"id":"12.15","chapter":12,"chapter_name":"合伙企业法","type":"单选","question":"下列关于合伙企业解散、清算的说法中，正确的是（　）。","options":{"A":"合伙企业清算人应由全体合伙人共同担任","B":"清算人应自被确定之日起10 日内将合伙企业解散事项通知债权人","C":"合伙企业经营亏损的，合伙人不得通过协议解散合伙企业","D":"合伙企业解散应得到2/3 以上合伙人同意"},"answer":"B","explanation":"本题考查合伙企业的解散。选项A不当选，合伙企业解散应当由清算人进 行清算。清算人由全体合伙人担任；经全体合伙人过半数同意，可以自合伙企业解散事由出 现后15日内指定一个或者数个合伙人，或者委托第三人，担任清算人。自合伙企业解散事由 出现之日起15日内未确定清算人的，合伙人或者其他利害关系人可以申请法院指定清算人。 选项B当选，清算人应自被确定之日起10日内将合伙企业解散事项通知债权人，并于60日内 在报纸上公告。选项C不当选，全体合伙人决定解散合伙企业的，合伙企业应当解散。也就 是说，合伙人在经营亏损时可以通过协议解散合伙企业。选项D不当选，当合伙企业出现法 定的解散事由时，合伙企业解散，无须得到2/3以上合伙人的同意。 二、多项选择题"},{"id":"12.16","chapter":12,"chapter_name":"合伙企业法","type":"多选","question":"下列主体中，不得成为有限合伙企业的普通合伙人的有（　）。","options":{"A":"上市公司","B":"国有独资公司","C":"公益性事业单位","D":"个人独资企业","E":"公益性社会团体"},"answer":"ABCE","explanation":"本题考查普通合伙人的资格。选项ABCE当选，国有独资公司、国有 企业、上市公司以及公益性的事业单位、社会团体不得成为普通合伙人。"},{"id":"12.17","chapter":12,"chapter_name":"合伙企业法","type":"多选","question":"下列关于普通合伙企业的说法中，正确的有（　）。","options":{"A":"合伙人可以以劳务出资","B":"合伙企业清算前，合伙人原则上不得请求分割合伙企业的财产","C":"合伙企业的财产即合伙人的出资","D":"合伙人向合伙企业以外的人转让合伙企业中的财产份额的，需要经全体合伙人过半数同意","E":"合伙人未经其他合伙人的一致同意以其在合伙企业中的财产份额出质的，该出质行为无效"},"answer":"ABE","explanation":"本题考查普通合伙企业的特征。选项A当选，普通合伙人可以以劳务出 资。选项B当选，除合伙企业法另有规定外，合伙人在合伙企业清算前，不得请求分割合伙 企业的财产。选项C不当选，合伙企业财产由原始财产和积累财产两个部分组成，原始财产 即全体合伙人的出资。积累财产包括：（1）合伙企业成立以后以合伙企业的名义依法取得 的全部收益；（2）依法取得的其他财产。选项D不当选，除合伙协议另有约定外，普通合伙 普通合伙 人向合伙人以外的人转让其在合伙企业中的全部或者部分财产份额时，须经其他合伙人一致 人向合伙人以外的人转让其在合伙企业中的全部或者部分财产份额时，须经其他合伙人一致 同意 同意。选项E当选，普通合伙人以其在合伙企业中的财产份额出质的，须经其他合伙人一致 同意，未经其他合伙人的同意，其行为无效。 提示：普通合伙人向合伙人以外的人转让其在合伙企业中的财产份额的，在同等条件下，其 他合伙人有优先购买权；但是，合伙协议另有约定的除外。"},{"id":"12.18","chapter":12,"chapter_name":"合伙企业法","type":"多选","question":"下列关于有限合伙企业设立、出资的说法中，正确的有（　）。","options":{"A":"法人和其他组织可以设立有限合伙企业","B":"有限合伙人可以实物出资","C":"公立学校可以成为有限合伙企业的普通合伙人","D":"有限合伙人不得以劳务出资","E":"有限合伙人可以认缴出资"},"answer":"ABDE","explanation":"本题考查有限合伙企业设立、出资。选项A当选，法人和其他组织可 以为普通合伙人或有限合伙人，由此，二者可以出资设立有限合伙企业。选项BD当选，有限 合伙人可以用货币、实物、知识产权、土地使用权或者其他财产权利作价出资。但有限合伙 人不得以劳务出资。选项C不当选，国有独资公司、国有企业、上市公司以及公益性的事业 单位、社会团体不得成为普通合伙人，但可以成为有限合伙人。选项E当选，有限合伙人应 当按照合伙协议的约定按期足额缴纳出资；未按期足额缴纳的，应当承担补缴义务，并对其 他合伙人承担违约责任。由此，法律允许有限合伙人认缴出资。"},{"id":"12.19","chapter":12,"chapter_name":"合伙企业法","type":"多选","question":"根据《合伙企业法》的规定，下列关于合伙事务执行及合伙企业管理的说法中，正确的有（　）。","options":{"A":"执行事务合伙人可以自营或者同他人合作经营与本合伙企业相竞争的业务","B":"合伙人一律不得同本合伙企业进行交易","C":"合伙人可以分别执行合伙事务","D":"执行事务合伙人对其他合伙人执行合伙事务提出异议时，其他合伙人应当暂停该事务的执行","E":"按照合伙协议的约定或者经全体合伙人决定，可以委托一个或数个合伙人对外代表合伙企业，执行合伙事务"},"answer":"CDE","explanation":"本题考查合伙事务执行和合伙企业管理。选项A不当选，执行事务合伙 人作为普通合伙人不得自营或者同他人合作经营与本合伙企业相竞争的业务。选项E当选， 按照合伙协议的约定或者经全体合伙人决定，可以委托一个或数个合伙人对外代表合伙企 业，执行合伙事务。选项B不当选，除合伙协议另有约定或者经全体合伙人一致同意外，普 通合伙人不得同本合伙企业进行交易，并非一律不得交易。选项CD当选，合伙人分别执行 第十二章  合伙企业法| 答案与解析 合伙事务的，执行事务合伙人可以对其他合伙人执行的事务提出异议；其他合伙人提出异议 时，应当暂停该项事务的执行。 问题：普通合伙人、有限合伙人在同业竞争和关联交易事项上的区别是什么？ 解答：普通合伙人不得自营或者同他人合作经营与本合伙企业相竞争的业务（绝对 禁止）；除合伙协议另有约定或者经全体合伙人一致同意外，普通合伙人不 得同本合伙企业进行交易（相对禁止）。有限合伙人可以自营或者同他人合 作经营与本有限合伙企业相竞争的业务，但是合伙协议另有约定的除外（原 则允许）；有限合伙人可以同本有限合伙企业进行交易，但是合伙协议另有 约定的除外（原则允许）。"},{"id":"12.20","chapter":12,"chapter_name":"合伙企业法","type":"多选","question":"甲、乙、丙3人订立合伙协议共同投资设立一家普通合伙企业。经营一年后，甲欲将其在合伙企业中的财产份额转让给合伙人之外的丁。合伙协议中没有关于份额转让的相关约 定。根据《合伙企业法》的规定，下列关于甲之份额转让条件及效力的说法中，正确的有 （　）。","options":{"A":"甲转让其份额必须经乙和丙一致同意","B":"乙、丙在同等条件下享有优先购买权","C":"甲将其份额转让给丁之后，甲对合伙企业以前的债务即不再承担责任","D":"丁购得甲转让的份额之后，丁对合伙企业以前的债务不承担责任","E":"若甲欲将其份额转让给乙，则无须征得丙的同意"},"answer":"ABE","explanation":"本题考查合伙企业财产份额的转让。选项AB当选，合伙人向合伙人以 外的人转让其在合伙企业中的财产份额时，除合伙协议另有约定外，须经其他合伙人一致同 意，其他合伙人享有同等条件下的优先购买权。选项C不当选，普通合伙人退伙的，退伙人 对基于其退伙前的原因发生的合伙企业债务，承担无限连带责任。选项D不当选，普通合伙 企业的新入伙的合伙人对入伙前合伙企业的债务承担无限连带责任。选项E当选，合伙人之 间转让在合伙企业中的全部或者部分财产份额时，应当通知其他合伙人，但无须经全体合伙 人一致同意。"},{"id":"12.21","chapter":12,"chapter_name":"合伙企业法","type":"多选","question":"甲为普通合伙企业的合伙人，因个人原因欠合伙企业以外的第三人乙10万元。乙欠合伙企业货款15万元。现甲无力以个人财产清偿欠乙的债务，乙的下列主张中，符合合伙企业法律制 度规定的有（　）。","options":{"A":"以其对甲的债权部分抵销其欠合伙企业的债务","B":"以甲从合伙企业中分取的收益用于清偿","C":"直接取得合伙人资格","D":"代位行使甲在合伙企业中的各项权利","E":"请求人民法院强制执行甲在合伙企业中的财产份额偿付债务"},"answer":"BE","explanation":"本题考查合伙企业的债务与合伙人的债务清偿。选项ACD不当选，合伙 人发生与合伙企业无关的债务，相关债权人不得以其债权抵销其对合伙企业的债务，也不得 代位行使合伙人在合伙企业中的权利，更不能直接取得合伙人的资格。选项BE当选，合伙人 的自有财产不足清偿其与合伙企业无关的债务的，该合伙人可以以其从合伙企业中分取的收 益用于清偿；债权人也可以依法请求人民法院强制执行该合伙人在合伙企业中的财产份额用 于清偿。"},{"id":"12.22","chapter":12,"chapter_name":"合伙企业法","type":"多选","question":"根据《合伙企业法》的规定，可能导致普通合伙人被除名的事由有（　）。","options":{"A":"因故意给合伙企业造成损失","B":"因重大过失给合伙企业造成损失","C":"执行合伙事务时有不正当行为","D":"未履行出资义务","E":"合伙人个人丧失偿债能力"},"answer":"ABCD","explanation":"本题考查除名退伙。合伙人有下列情形之一的，经其他合伙人一致 同意，可以决议将其除名：（1）未履行出资义务（选项D当选）；（2）因故意或者重大 过失给合伙企业造成损失（选项AB当选）；（3）执行合伙事务时有不正当行为（选项C当 选）；（4）发生合伙协议约定的事由。选项E不当选，其所述属于普通合伙人当然退伙的 情形。"},{"id":"12.23","chapter":12,"chapter_name":"合伙企业法","type":"多选","question":"下列关于有限合伙企业及合伙人的说法中，正确的有（　）。","options":{"A":"有限合伙企业只有有限合伙人的，应当解散","B":"有限合伙企业没有有限合伙人的，应当变更为普通合伙企业"},"answer":"ABDE","explanation":"本题考查有限合伙企业及有限合伙人。选项ABD当选，有限合伙企业 必须同时存在普通合伙人和有限合伙人，仅剩有限合伙人的，企业应当解散；仅剩普通合伙 人的，应当转为普通合伙企业。选项C不当选，有限合伙人不能执行合伙事务，不得对外代 表合伙企业。选项E当选，有限合伙人应当按照合伙协议的约定按期足额缴纳出资；未按期 足额缴纳的，应承担补缴义务，并对其他合伙人承担违约责任。"},{"id":"12.24","chapter":12,"chapter_name":"合伙企业法","type":"多选","question":"根据合伙企业法及相关规定，有限合伙人的下列行为中，不视为执行合伙事务的有（　）。","options":{"A":"参与决定普通合伙人退伙","B":"参与对外签订买卖合同","C":"参与选择承办企业审计业务的会计师事务所","D":"依法为本企业提供担保","E":"对企业的经营管理提出建议"},"answer":"ACDE","explanation":"本题考查有限合伙企业合伙事务的执行。有限合伙人的下列行为，不 视为执行合伙事务：（1）参与决定普通合伙人入伙、退伙（选项A当选）；（2）对企业的 经营管理提出建议（选项E当选）；（3）参与选择承办有限合伙企业审计业务的会计师事 务所（选项C当选）；（4）获取经审计的有限合伙企业财务会计报告；（5）对涉及自身利 益的情况，查阅有限合伙企业财务会计账簿等财务资料；（6）在有限合伙企业中的利益受 到侵害时，向有责任的合伙人主张权利或者提起诉讼；（7）执行事务合伙人怠于行使权利 时，督促其行使权利或者为了本企业的利益以自己的名义提起诉讼；（8）依法为本企业提 供担保（选项D当选）。选项B不当选，参与对外签订买卖合同属于执行合伙事务，有限合伙 人不得实施。"},{"id":"12.25","chapter":12,"chapter_name":"合伙企业法","type":"多选","question":"根据合伙企业法及相关规定，下列有关合伙企业清算的说法中，正确的有（　）。","options":{"A":"合伙企业解散，经全体合伙人过半数同意，可以在法定期限内委托第三人担任清算人","B":"合伙企业解散后不能在规定时间内确定清算人的，其他利害关系人可以申请人民法院指定清算人","C":"合伙企业进入清算后，应由清算人代表合伙企业参加诉讼活动","D":"清算人应自被确定之日起15 日内将合伙企业解散事项通知债权人","E":"清算开始，则合伙企业消灭"},"answer":"ABC","explanation":"本题考查合伙企业的清算。选项A当选，全体合伙人过半数同意，可以 自合伙企业解散事由出现15日内指定一个或者数个合伙人，或者委托第三人，担任清算人。 选项B当选，自合伙企业解散事由出现之日起15日内未确定清算人的，合伙人或者其他利害 关系人可以申请人民法院指定清算人。选项C当选，清算人的职责之一是代表合伙企业参加 诉讼或者仲裁活动。选项D不当选，清算人应自被确定之日起10日内将合伙企业解散事项通 知债权人，并于60日内在报纸上公告。选项E不当选，清算期间，合伙企业存续，合伙企业 清算期间，合伙企业存续，合伙企业 经注销登记后 经注销登记后消灭。 第十三章  公司法 答案与解析 一、单项选择题"},{"id":"13.1","chapter":13,"chapter_name":"公司法","type":"单选","question":"根据《公司法》的规定，下列关于公司章程效力及修改程序的说法中，正确的是（　）。","options":{"A":"有限责任公司的章程必须经全体股东同意并签名或者盖章后才能生效","B":"股份有限公司的章程必须经全体认股人同意并签名或者盖章后才能生效","C":"公司章程修改须经股东会决议，股东表决时可以实行累积投票制","D":"公司章程对公司、股东、实际控制人、董事、监事、高级管理人员具有约束力"},"answer":"A","explanation":"本题考查公司章程。选项A当选，有限责任公司章程由股东共同制定，并 在公司章程上签名或者盖章，公司章程方可生效。选项B不当选，设立股份有限公司，应当 由发起人共同制订公司章程。公司章程须经出席公司成立大会的认股人所持表决权过半数通 过。选项C不当选，累积投票制仅适用于股东会选举董事和监事。修改公司章程为股东会特 别决议事项，须经代表2/3以上表决权的股东或出席会议的股东所持表决权2/3以上通过。选 项D不当选，公司章程对公司、股东、董事、监事、高级管理人员具有约束力。公司章程作 为公司的内部规章，效力仅及于公司和相关当事人，不具有普遍约束力，故对实际控制人无 约束力。"},{"id":"13.2","chapter":13,"chapter_name":"公司法","type":"单选","question":"根据《公司法》的规定，下列各项中，应认定为公司人格混同的是（　）。","options":{"A":"母子公司之间进行利益输送","B":"母子公司之间进行交易，收益归一方，损失却由另一方承担","C":"股东自身收益与公司盈利不加区分，致使双方利益不清的","D":"先从原公司抽走资金，然后再成立经营目的类似的公司，逃避原公司债务"},"answer":"C","explanation":"本题考查人格混同的认定。下列情形应认定为“人格混同”：（1）股东 无偿使用公司资金或者财产，不作财务记载的；（2）股东用公司的资金偿还股东的债务， 或者将公司的资金供关联公司无偿使用，不作财务记载的；（3）公司账簿与股东账簿不 分，致使公司财产与股东财产无法区分的；（4）股东自身收益与公司盈利不加区分，致使 双方利益不清的（选项C当选）；（5）公司的财产记载于股东名下，由股东占有、使用的。 选项ABD不当选，其所述均为公司控制股东对公司过度支配与控制的表现。"},{"id":"13.3","chapter":13,"chapter_name":"公司法","type":"单选","question":"根据《公司法》的规定，以下不得用作股东出资的是（　）。","options":{"A":"劳务","B":"土地使用权","C":"商标","D":"非专利技术"},"answer":"A","explanation":"本题考查股东出资的规定。股东可以用货币出资，也可以用实物、知识产 权（选项CD不当选）、土地使用权（选项B不当选）等可以用货币估价并可以依法转让的非 货币财产作价出资，但法律、行政法规规定不得作为出资的财产除外。"},{"id":"13.4","chapter":13,"chapter_name":"公司法","type":"单选","question":"根据《公司法》的规定，下列关于有限责任公司股东出资的说法中，正确的是（　）。","options":{"A":"股东认缴的出资额应按照公司章程的规定自公司成立之日起3 年内缴足","B":"公司不能清偿到期债务的，已到期的债权人有权请求已认缴出资但未届出资期限的股东提前缴纳出资","C":"公司成立后，股东抽逃出资的，负有责任的股东应与该股东承担连带赔偿责任","D":"股东未按照公司章程规定实际缴纳出资，设立时的其他股东对此承担补充责任"},"answer":"B","explanation":"本题考查有限责任公司股东出资。选项A不当选，有限责任公司的注册资 本为在公司登记机关登记的全体股东认缴的出资额。全体股东认缴的出资额由股东按照公司 章程的规定，自公司成立之日起5年内缴足。选项B当选，有限责任公司不能清偿到期债务 的，公司或已到期债权的债权人有权要求已认缴出资但未届出资期限的股东提前缴纳出资。 选项C不当选，公司成立后，股东或者出资人不得抽逃出资。违反规定的，股东或者出资人 应当返还；给公司造成损失的，负有责任的董事、监事、高级管理人员应当与该股东或者该 出资人承担连带赔偿责任。选项D不当选，有限责任公司设立时，股东未按照公司章程规定 实际缴纳出资，或者实际出资的非货币财产的实际价额显著低于所认缴的出资额的，设立时 的其他股东与该股东在出资不足的范围内承担连带责任。"},{"id":"13.5","chapter":13,"chapter_name":"公司法","type":"单选","question":"根据《公司法》的规定，下列关于股东抽逃出资的认定和效力的说法中，正确的是（　）。","options":{"A":"利用关联交易将出资转出的，不属于抽逃出资","B":"股东抽逃出资的，应当返还抽逃的出资","C":"股东抽逃出资给公司造成损失的，董事、监事应当与该股东承担连带赔偿责任","D":"通过虚构债权债务关系将出资转出的，不属于抽逃出资"},"answer":"B","explanation":"本题考查股东抽逃出资的认定和效力。公司成立后，相关股东的行为符合 下列情形之一且损害公司权益的，为股东抽逃出资：（1）制作虚假财务会计报表虚增利润 进行分配；（2）通过虚构债权债务关系将其出资转出（选项D不当选）；（3）利用关联交 易将出资转出（选项A不当选）；（4）其他未经法定程序将出资抽回的行为。选项B当选、 选项C不当选，股东抽逃出资的，应当返还抽逃的出资；给公司造成损失的，负有责任的董 事、监事、高级管理人员应当与该股东承担连带赔偿责任。"},{"id":"13.6","chapter":13,"chapter_name":"公司法","type":"单选","question":"根据《公司法》及有关规定，导致公司股东资格丧失的情形是（　）。","options":{"A":"公司股东将其所持有的部分股权转让给他人","B":"公司股东的部分股权被法院强制执行","C":"公司的法人股东终止","D":"公司的法人股东设立分支机构"},"answer":"C","explanation":"本题考查公司股东资格丧失的情形。选项AB不当选，股东将部分股权转 让给他人，以及部分股权被强制执行，意味着该股东还持有部分股权，仍享有股东资格。选 项C当选，法人股东终止，意味着股东主体已经不存在了，该等情形会导致股东资格丧失。 选项D不当选，法人股东设立分支机构并不影响其股东权利。"},{"id":"13.7","chapter":13,"chapter_name":"公司法","type":"单选","question":"下列职权中，不属于有限责任公司股东会职权的是（　）。","options":{"A":"审议批准公司的利润分配方案和弥补亏损方案","B":"审议批准董事会和监事会的报告","C":"聘任或者解聘公司总经理","D":"修改公司章程"},"answer":"C","explanation":"本题考查有限责任公司股东会的职权。选项C当选，其所述情形属于董事 会职权，而不是股东会职权。在人事任免方面，股东会可以选举和更换非由职工代表担任的 董事、监事，并决定有关董事、监事的报酬事项。董事会可以决定聘任或解聘公司经理及其 第十三章  公司法| 答案与解析 报酬事项。选项ABD不当选，其所述情形均为股东会职权。"},{"id":"13.8","chapter":13,"chapter_name":"公司法","type":"单选","question":"某股份有限公司董事会由11名董事组成。2023年8月20日，公司董事长胡某召集并主持董事会会议，共有8名董事出席会议，其他3名董事因事请假。董事会会议讨论了下列事项：一是 鉴于公司董事会成员工作任务加重，拟给每位董事涨工资30%；二是鉴于监事会成员中的职 工代表张某生病，拟由公司职工王某替换张某担任监事；三是鉴于公司发展的实际情况，拟 将公司与另一公司合并，组建新的公司。经表决，有6名董事同意而通过前述事项。董事会 就此作出最终决定。本案董事会的做法中，符合《公司法》规定的是（　）。","options":{"A":"公司董事长召集并主持董事会会议","B":"董事会决定给每位董事涨工资","C":"董事会决定选举职工王某为监事会中的职工代表","D":"董事会决定公司合并"},"answer":"A","explanation":"本题考查董事会的职权。选项A当选，董事会会议由董事长召集和主持。 选项BD不当选，决定非职工代表担任董事的报酬以及公司合并事项，属于股东会职权，而非 董事会职权。选项C不当选，董事会、监事会中的职工代表由公司职工代表大会、职工大会 或者其他形式民主选举产生。 问题：如何快速区分股东会职权与董事会职权？ 解答：股东会是权力机构 权力机构，多为审议报告、作出决议和修改章程等决策性职权，还 有选举和更换“董监”。董事会是执行机构 执行机构，多为召开、执行会议决议，制 订方案，制订基本管理制度等执行性行为和决定高管的去留及报酬。"},{"id":"13.9","chapter":13,"chapter_name":"公司法","type":"单选","question":"根据《公司法》的规定，下列关于有限责任公司组织机构的说法中，错误的是（　）。","options":{"A":"规模较小或者股东人数较少的，可以不设监事会，只需设1 名监事","B":"规模较小或者股东人数较少的，经全体股东一致同意，可以不设监事","C":"公司在董事会中设置由董事组成的审计委员会的，不设监事会或监事","D":"职工人数300 人以上的公司，其董事会成员中应当有公司职工代表"},"answer":"D","explanation":"本题考查有限责任公司的组织机构。选项AB不当选，有限责任公司和股份 有限公司规模较小或者股东人数较少情况下，可以不设监事会，只需设1名监事，行使《公 司法》规定的监事会职权；经全体股东一致同意，有限责任公司也可以不设监事。选项C不 当选，有限责任公司和股份有限公司按照公司章程规定，可以在董事会中设置由董事组成的 审计委员会，行使《公司法》规定的监事会职权，不设监事会或者监事。选项D当选，职工 人数300人以上的公司，除依法设监事会并有公司职工代表的外，其董事会成员中应当有公 司职工代表。董事会中的职工代表由公司职工通过职工代表大会、职工大会或者其他形式民 主选举产生。"},{"id":"13.10","chapter":13,"chapter_name":"公司法","type":"单选","question":"根据《公司法》的规定，下列关于股份有限公司审计委员会的说法中，正确的是（　）。","options":{"A":"董事会中必须设置审计委员会","B":"审计委员会的成员为3 名以上，且过半数成员不得在公司担任除董事以外的其他职务","C":"审计委员会成员必须有职工代表","D":"审计委员会作出决议，应当一人一票，经审计委员会成员2/3 以上通过"},"answer":"B","explanation":"本题考查股份有限公司的审计委员会。选项AC不当选，公司可以按照公 司章程的规定在董事会中设置由董事组成的审计委员会，行使《公司法》规定的监事会的 职权，不设监事会或者监事。公司董事会成员中的职工代表可以成为审计委员会成员。选 项B当选，股份有限公司审计委员会成员为3名以上，过半数 过半数成员不得 不得在公司担任除董事以外 的其他职务，且不得与公司存在任何可能影响其独立客观判断的关系。选项D不当选，审计 委员会决议的表决，应当一人一票，经审计委员会成员的过半数通过。"},{"id":"13.11","chapter":13,"chapter_name":"公司法","type":"单选","question":"甲公司、乙公司和丙（自然人）为双江有限责任公司（以下称“双江公司”）的股东，出资比例分别为20%、15%和65%，双江公司对股东行使表决权未作约定。丙请求双江公司为其 债务提供担保，则下列说法中，可以作为双江公司为丙提供担保的依据的是（　）。","options":{"A":"仅需甲公司同意即可提供担保","B":"仅需乙公司同意即可提供担保","C":"甲公司、乙公司、丙一致同意，即可为丙提供担保","D":"经甲公司、乙公司、丙所持表决权的过半数通过"},"answer":"A","explanation":"本题考查公司为股东提供担保的决议程序。选项A当选，公司为股东提供 担保必须经股东会决议，且该股东不得参与表决。该项表决由出席会议的其他股东所持表决 权的过半数通过。为丙提供担保，丙应当回避表决。甲、乙公司按出资比例行使表决权，表 决权合计为35%，甲的20%表决权超过35%的半数，其同意即可通过为丙担保的决议。"},{"id":"13.12","chapter":13,"chapter_name":"公司法","type":"单选","question":"下列关于国有独资公司的表述中，正确的是（　）。","options":{"A":"国有独资公司所有董事会成员均由履行出资人职责的机构指定","B":"董事会成员不得兼任经理","C":"国有独资公司应当设置监事会或者监事","D":"国有独资公司董事会成员应当有公司职工代表"},"answer":"D","explanation":"本题考查国有独资公司。选项A不当选、选项D当选，国有独资公司的董 事会成员中，应当过半数 过半数为外部董事，并应当 应当有公司职工代表。国有独资公司的董事会成员 由履行出资人职责的机构委派；但是，董事会成员中的职工代表由公司职工代表大会选举产 生。选项B不当选，经履行出资人职责的机构同意，董事会成员可以兼任经理。选项C不当 选，国有独资公司在董事会中设置由董事组成的审计委员会的，不设监事会或者监事。"},{"id":"13.13","chapter":13,"chapter_name":"公司法","type":"单选","question":"根据《公司法》的规定，下列关于临时提案权的说法中，错误的是（　）。","options":{"A":"单独或者合计持有股份有限公司1% 以上股份的股东可以提出临时提案","B":"公司章程可以提高提出临时提案股东的持股比例","C":"临时提案的提出应在股东会召开10 日前书面提交给董事会","D":"董事会应当在收到提案后2 日内通知其他股东，并将该临时提案提交股东会审议"},"answer":"B","explanation":"本题考查股东权利之临时提案权。选项ACD不当选，单独或者合计持有公 司1%以上 1%以上股份的股东，可以在股东会召开10日 10日前提出临时提案并书面提交董事会；董事会 应当在收到提案后2日内通知其他股东，并将该临时提案提交股东会审议；但临时提案违反 法律、行政法规或者公司章程的规定，或者不属于股东会职权范围的除外。选项B当选，公 司不得提高提出临时提案股东的持股比例。"},{"id":"13.14","chapter":13,"chapter_name":"公司法","type":"单选","question":"下列关于股份有限公司股东知情权的说法中，符合公司法律制度规定的是（　）。","options":{"A":"任一股东有权查阅、复制股东会会议决议","B":"任一股东有权查阅、复制监事会会议决议","C":"任一股东有权查阅会计账簿、会计凭证","D":"任一股东有权要求查阅、复制公司控股子公司的财务会计报告"},"answer":"B","explanation":"本题考查股东权利之知情权。选项B当选、选项A不当选，股份有限公司的 股东有权查阅、复制 查阅、复制公司章程、股东名册、股东会会议记录（非股东会会议决议）、董事会 会议决议、监事会会议决议、财务会计报告。选项C不当选，股份有限公司 股份有限公司中，连续180日 180日以 上单独或者合计持有公司3% 3%以上股份的股东有权要求查阅 查阅公司的会计账簿、会计凭证 会计账簿、会计凭证，股 份有限公司公司章程对持股比例有较低规定的，从其规定。选项D不当选，公司股东有权要 求查阅、复制公司全资 全资子公司（非控股子公司）相关材料。"},{"id":"13.15","chapter":13,"chapter_name":"公司法","type":"单选","question":"2024年2月，甲有限责任公司股东会通过减资决议，本次股东会的召开通知了除王某以外的全体股东，后发现本次股东会减资决议的内容违反公司章程的规定。下列说法中，错误的是 （　）。","options":{"A":"关于减资的股东会决议为可撤销决议","B":"股东王某自决议作出之日起1 年内没有行使撤销权的，撤销权消灭","C":"股东王某应该自股东会决议作出之日起60 日内，请求法院撤销该决议","D":"决议撤销之诉中，被告为公司"},"answer":"C","explanation":"本题考查决议撤销之诉。选项A不当选，股东会、董事会的会议召集程 序、表决方式违反法律、行政法规或者公司章程，或者决议内容违反公司章程的，股东可以 自决议作出之日起60日内，请求人民法院撤销。选项B不当选、选项C当选，未被通知参加 股东会会议的股东自知道或者应当知道 自知道或者应当知道股东会决议作出之日起60日 60日内，可以请求人民法院撤 销；自决议作出之日起1年内没有行使撤销权的，撤销权消灭。选项D不当选，股东会或董事 会决议撤销或无效的诉讼中，被告为公司。"},{"id":"13.16","chapter":13,"chapter_name":"公司法","type":"单选","question":"根据《公司法》的规定，下列关于公司股东诉讼及事由的说法中，正确的是（　）。","options":{"A":"认为股东会的决议内容违反法律、行政法规规定的，股东可自决议作出之日起60 日内，请求人民法院判决撤销","B":"认为股东会的表决方式违反法律、行政法规规定的，被通知参加股东会会议的股东可自决议作出之日起60 日内，请求人民法院判决撤销","C":"认为公司高管执行职务时违反公司章程规定，给公司造成损失的，股东可以直接向人民法院提起诉讼","D":"认为公司高管执行职务时违反法律、行政法规规定，损害股东利益的，股东须请求监事会向人民法院提起诉讼，情况紧急的除外"},"answer":"B","explanation":"本题考查股东诉讼。选项A不当选、选项B当选，股东会、董事会的决议内 容违反法律、行政法规的无效。股东会、董事会的会议召集程序、表决方式违反法律、行政 法规或者公司章程，或者决议内容违反公司章程的，属于可撤销决议。股东自决议作出之日 起60日内，可以请求人民法院撤销。未被通知参加股东会会议的股东自知道或者应当知道股 东会决议作出之日起60日内，可以请求人民法院撤销；自决议作出之日起1年内没有行使撤 销权的，撤销权消灭。选项CD不当选，董事、监事、高级管理人员或者他人的违反法律、行 政法规或者公司章程的行为给公司造成损失，股东可以提起股东代表诉讼。股东代表诉讼的 前置程序为书面请求监事会或董事会起诉，并非股东直接起诉。但高级管理人员执行公司职 务时损害了股东利益的，股东为维护自身利益可以直接向人民法院起诉，无须经过监事会。"},{"id":"13.17","chapter":13,"chapter_name":"公司法","type":"单选","question":"根据《公司法》及相关规定，下列关于股东诉讼的说法中，正确的是（　）。","options":{"A":"股东知情权受到损害的，股东可向人民法院提起解散公司的诉讼","B":"若公司持续两年以上无法召开股东会，公司经营管理发生严重困难，则任何一个股东均可提起解散公司的诉讼","C":"单独持有公司股份51% 以上的股东，才可向人民法院提起解散公司的诉讼","D":"股东提起解散公司诉讼，同时又申请人民法院对公司进行清算的，人民法院对其提出的清算申请不予受理"},"answer":"D","explanation":"本题考查强制解散公司之诉。选项A不当选，股东以知情权、利润分配请 求权等权益受到损害，或者公司亏损、财产不足以偿还全部债务，以及公司被吊销企业法人 营业执照未进行清算等为由，提起解散公司诉讼的，人民法院不予受理。选项BC不当选，当 公司出现了解散事由时，单独或者合计持有公司全部股东表决权10%以上的股东，可以向人 民法院提起解散公司的诉讼。选项D当选，股东提起解散公司诉讼，同时又申请人民法院对 公司进行清算的，人民法院对其提出的清算申请不予受理。"},{"id":"13.18","chapter":13,"chapter_name":"公司法","type":"单选","question":"下列关于有限责任公司股权转让的说法中，正确的是（　）。","options":{"A":"有限责任公司的股东之间不得相互转让其全部或者部分股权","B":"法院依照强制执行程序转让股东的股权时，应当通知公司及全体股东，其他股东在同等条件下有优先购买权","C":"自然人股东死亡后，其合法继承人不可以继承其股东资格","D":"股东向股东以外的人转让股权，应当经其他股东过半数同意"},"answer":"B","explanation":"本题考查股权转让。选项AD不当选，有限责任公司的股东之间可以相互转 让其全部或者部分股权；股东向股东以外的人转让股权的，应当将股权转让的数量、价格、 支付方式和期限等事项书面通知 书面通知其他股东，无须征得其他股东过半数同意，其他股东在同等 条件下有优先购买权。股东自接到书面通知之日起30日 30日内未答复的，视为放弃优先购买权。 公司章程对股权转让另有规定的，从其规定。选项B当选，法院依照强制执行程序转让股东 的股权时，应当通知公司及全体股东，其他股东在同等条件下有优先购买权。其他股东自人 第十三章  公司法| 答案与解析 民法院通知之日起满20日 20日不行使优先购买权的，视为放弃优先购买权。选项C不当选，有限 责任公司的自然人股东死亡后，其合法继承人可以继承股东资格；但是，公司章程另有规定 的除外。"},{"id":"13.19","chapter":13,"chapter_name":"公司法","type":"单选","question":"根据《公司法》的规定，下列关于股份有限公司股份转让的说法中，正确的是（　）。","options":{"A":"发起人持有的本公司股份，自公司成立之日起2 年内不得转让","B":"公司经理在任职期间不得转让其所持有的本公司股份","C":"公司董事所持有的本公司股份，自公司股票上市交易之日起1 年内不得转让","D":"公司监事离职后1 年内不得转让其所持有的原任职公司股份"},"answer":"C","explanation":"本题考查股份转让。选项A不当选，发起人持有的本公司股份，自公司成 立之日起1年内不得转让。选项BD不当选，公司董事、监事、高级管理人员在任职期间每年 转让的股份不得超过其所持有本公司股份总数的25%，离职后半年内，不得转让其所持有的 本公司股份。选项C当选，公司董事、监事、高管所持有的本公司股份，自公司股票上市交 易之日起1年内不得转让。"},{"id":"13.20","chapter":13,"chapter_name":"公司法","type":"单选","question":"下列关于公司财务会计制度的说法中，正确的是（　）。","options":{"A":"公司持有的本公司股份可以分配利润","B":"资本公积金不可以用于弥补公司亏损","C":"公开发行股票的股份有限公司必须公告其财务会计报告","D":"法定公积金应当从税前利润中提取，任意公积金应当从税后利润中提取"},"answer":"C","explanation":"本题考查公司财务会计制度。选项A不当选，公司持有的本公司股份不得 分配利润。选项B不当选，公积金弥补公司亏损，应当先使用任意公积金和法定公积金；仍 不能弥补的，可以按照规定使用资本公积金。选项D不当选，公司从税后利润中提取法定公 积金后，经股东会决议，还可以从税后利润中提取任意公积金。"},{"id":"13.21","chapter":13,"chapter_name":"公司法","type":"单选","question":"下列关于公司合并的说法中，正确的是（　）。","options":{"A":"应当经董事会全体董事一致通过","B":"公司应当自作出合并决议之日起30 日内通知各自的债权人","C":"未接到通知书的债权人，自公告之日起45 日内，可以要求公司清偿债务或提供相应的担保","D":"应当经全体股东过半数同意"},"answer":"C","explanation":"本题考查公司合并。选项AD不当选，公司合并属于股东会特别决议事项， 有限责任公司的合并决议，须经代表全体2/3以上表决权的股东通过。股份有限公司的合并 决议，须经出席会议的股东所持表决权的2/3以上通过。选项B不当选、选项C当选，公司应 当自作出合并决议之日起10日内通知债权人，并于30日内在报纸上或者国家企业信用信息公 示系统公告。债权人自接到通知书之日起30日内，未接到通知书的自公告之日起45日内，可 以要求公司清偿债务或者提供相应的担保。"},{"id":"13.22","chapter":13,"chapter_name":"公司法","type":"单选","question":"根据《公司法》的规定，下列主体中，公司的清算义务人是（　）。","options":{"A":"监事","B":"董事","C":"经理","D":"控股股东"},"answer":"B","explanation":"本题考查公司清算。选项B当选，董事为公司清算义务人，应当在解散事 由出现之日起15日内组成清算组进行清算。"},{"id":"13.23","chapter":13,"chapter_name":"公司法","type":"单选","question":"根据《公司法》的规定，下列关于公司设立登记的说法中，正确的是（　）。","options":{"A":"设立公司必须依法办理批准手续","B":"公司申请营业执照的日期为公司成立日期","C":"公司应登记事项未经登记可以对抗善意相对人","D":"电子营业执照与纸质营业执照具有同等法律效力"},"answer":"D","explanation":"本题考查公司设立登记。选项A不当选，设立公司，应当依法向公司登记 机关申请设立登记。法律、行政法规规定设立公司必须报经批准的，应当在公司登记前依法 办理批准手续。选项B不当选，公司营业执照签发日期为公司成立日期。选项C不当选，公司 登记事项发生变更的，应当依法办理变更登记。公司登记事项未经登记或者未经变更登记， 不得对抗善意相对人。 二、多项选择题"},{"id":"13.24","chapter":13,"chapter_name":"公司法","type":"多选","question":"根据《公司法》及有关规定，下列关于股权出资规则的说法中，正确的有（　）。","options":{"A":"不可以用已被冻结的股权出资","B":"可以用出资人合法持有并依法可转让的股权出资","C":"可以用依法享有的债权出资","D":"可以用已设立质权的股权出资","E":"不可以用公司章程约定不得转让的股权出资"},"answer":"ABCE","explanation":"本题考查股权出资。具有下列情形的，股权不得用作出资：（1）已 被设立质权（选项D不当选）；（2）股权所在公司章程约定不得转让（选项E当选）； （3）法律、行政法规或者国务院决定规定，股权所在公司股东转让股权应当报经批准而未 经批准；（4）法律、行政法规或者国务院决定规定不得转让的其他情形。选项ABC当选， 股东可以用货币出资，也可以用实物、知识产权、土地使用权等可以用货币估价并可以依法 转让的非货币财产作价出资，但不得以劳务、信用、自然人姓名、商誉、特许经营权或者设 定担保的财产等作价出资。出资人合法持有并依法可以转让的股权符合股东以非货币性财产 出资的条件。"},{"id":"13.25","chapter":13,"chapter_name":"公司法","type":"多选","question":"根据《公司法》的规定，下列关于股东失权制度的说法中，正确的有（　）。","options":{"A":"公司成立后，董事会发现股东未按期足额缴纳出资的，应当由董事会向该股东发出书面催缴书","B":"书面催缴股东出资的，可以载明缴纳出资的宽限期，宽限期自股东收到书面催缴书之日起，不得少于60 日","C":"宽限期届满，股东仍未履行出资义务的，公司经董事会决议可以向该股东发出失权通知"},"answer":"CE","explanation":"本题考查股东失权制度。选项A不当选，公司成立后，董事会应当对股东 的出资情况进行核查，发现股东未按期足额缴纳公司章程规定的出资的，应当由公司向该股 东发出书面催缴书，催缴出资。未及时履行前款规定的义务，给公司造成损失的，负有责任 的董事应当承担赔偿责任。选项B不当选，股东未按照公司章程规定的出资日期缴纳出资， 公司按照规定发出书面催缴书催缴出资的，可以载明缴纳出资的宽限期；宽限期自公司发 出催缴书之日起，不得少于60日。选项C当选、选项D不当选，书面催缴书载明的宽限期届 满，股东仍未履行出资义务的，公司经董事会决议可以向该股东发出失权通知，通知应当以 书面形式发出。自通知发出之日起，该股东丧失其未缴纳出资的股权。丧失的股权应当依法 转让，或者相应减少注册资本并注销该股权；6个 6个月内 月内未转让或者注销的，由公司其他股东 按照其出资比例足额缴纳相应出资。选项E当选，股东对失权有异议的，应当自接到失权通 知之日起30日内，向人民法院提起诉讼。"},{"id":"13.26","chapter":13,"chapter_name":"公司法","type":"多选","question":"根据《公司法》的规定，有限责任公司对股东会该项决议投反对票的股东，可以请求公司按照合理的价格收购其股权的情形有（　）。","options":{"A":"在公司连续5 年不向股东分配利润、该5 年连续盈利，且符合《公司法》规定的分配利润条件的情况下，股东会会议决议不向股东分配利润","B":"股东会会议决议与其他公司合并，或者公司分立、转让主要财产","C":"股东会会议决议为公司股东或者实际控制人提供担保","D":"公司章程规定的营业期限届满或者章程规定的其他解散事由出现，股东会会议通过决议修改章程使公司存续","E":"股东会会议决议减少注册资本"},"answer":"ABD","explanation":"本题考查公司回购。有限责任公司存在下列情形之一的，对股东会决 议投反对票的股东可以请求公司按照合理的价格收购其股权：（1）公司连续5年不向股东 分配利润，而公司该5年连续盈利，并且符合《公司法》规定的分配利润条件的（选项A当 选）；（2）公司合并、分立、转让主要财产的（选项B当选）；（3）公司章程规定的营业 期限届满或者章程规定的其他解散事由出现，股东会会议通过决议修改章程使公司存续的 （选项D当选）。选项CE不当选，其所述情形出现时，股东不得要求公司回购其股份。"},{"id":"13.27","chapter":13,"chapter_name":"公司法","type":"多选","question":"若公司董事会作出的决议存在违反公司章程的瑕疵，则可以对该决议提起撤销之诉的人员有（　）。","options":{"A":"公司非控股股东","B":"列席董事会会议的非股东监事","C":"出席董事会会议具有表决权的非股东董事","D":"出席董事会会议的股东","E":"受决议内容影响的股东"},"answer":"ADE","explanation":"本题考查决议撤销之诉。选项ADE当选，股东会、董事会的会议召集程 序、表决方式违反法律、行政法规或者公司章程，或者决议内容违反公司章程的，股东自决 议作出之日起60日内，可以请求人民法院撤销。未被通知参加股东会会议的股东自知道或者 应当知道股东会决议作出之日起60日内，可以请求人民法院撤销；自决议作出之日起1年内 没有行使撤销权的，撤销权消灭。选项BC不当选，非股东的董事、监事均无权提起决议撤销 之诉。 问题：关于决议不成立、无效和可撤销情形的总结。 解答：（1）未开会、未表决、人不够、未通过的，决议不成立。 （2）决议内容违法的，决议无效。 （3）程序瑕疵或者决议内容违反章程的，决议可撤销。"},{"id":"13.28","chapter":13,"chapter_name":"公司法","type":"多选","question":"根据《公司法》有关司法解释的规定，对股东因下列理由提起解散公司的诉讼，人民法院依法不予受理的有（　）。","options":{"A":"股东利润分配请求权受到损害","B":"公司持续2 年以上无法召开股东会，经营管理发生严重困难，继续存续会使股东利益受到重大损失，通过其他途径不能解决","C":"公司财产不足以偿还全部债务","D":"公司被市场监督管理局吊销企业法人营业执照后，未依法成立清算组进行清算","E":"公司董事之间长期冲突，且无法通过股东会解决，经营管理发生严重困难，继续存续会使股东利益受到重大损失，通过其他途径不能解决"},"answer":"ACD","explanation":"本题考查解散公司之诉。有下列情形之一的，单独或合计持有公司表 决权10%以上的股东可以提起公司解散之诉：（1）公司持续2年以上无法召开股东会，公 司经营管理发生严重困难的（选项B不当选）；（2）股东表决时无法达到法定或者公司章 程规定的比例，持续2年以上不能作出有效的股东会决议，公司经营管理发生严重困难的； （3）公司董事长期冲突，且无法通过股东会解决，公司经营管理发生严重困难的（选项E不 当选）；（4）经营管理发生其他严重困难，公司继续存续会使股东利益受到重大损失的情 形。选项ACD当选，股东以知情权、利润分配请求权等权益受到损害，或者公司亏损、财产 第十三章  公司法| 答案与解析 不足以偿还全部债务，以及公司被吊销企业法人营业执照未进行清算等为由，提起解散公司 诉讼的，人民法院不予受理。"},{"id":"13.29","chapter":13,"chapter_name":"公司法","type":"多选","question":"根据《公司法》的规定，下列关于有限责任公司股权转让的说法中，正确的有（　）。","options":{"A":"股东向股东以外的人转让股权的，无须征得其他股东同意，但须通知其他股东","B":"股东转让股权的，自受让人记载于股东名册时起享有股东权利","C":"股东转让已认缴出资但未届出资期限的股权的，由转让人承担出资责任","D":"股东转让出资不实股权的，善意受让人不承担补足出资的责任","E":"股东转让出资不实股权的，由转让人承担补足出资责任，不知情的受让人承担补充责任"},"answer":"ABD","explanation":"本题考查有限责任公司股东的股权转让。选项A当选，有限责任公司 中，股东之间可以相互转让其全部或者部分股权。股东向股东以外的人转让股权的，应当将 股权转让的数量、价格、支付方式和期限等事项书面通知其他股东，其他股东在同等条件 同等条件下 享有优先购买权。选项B当选，股权转让的，受让人自记载于股东名册时起可以向公司主张 行使股东权利。选项C不当选，股东转让已认缴出资但未届出资期限的股权的，由受让人承 担缴纳该出资的义务；受让人未按期足额缴纳出资的，转让人对受让人未按期缴纳的出资承 担补充责任。选项D当选、选项E不当选，转让股权的股东未按照公司章程规定的出资日期缴 纳出资或者作为出资的非货币财产的实际价额显著低于所认缴的出资额的，转让人与受让人 在出资不足的范围内承担连带责任；受让人不知道且不应当知道存在上述情形的，由转让人 承担责任。"},{"id":"13.30","chapter":13,"chapter_name":"公司法","type":"多选","question":"根据《公司法》的规定，下列情形中，属于股份有限公司可以收购本公司股份情形的有（　）。","options":{"A":"增加公司注册资本","B":"与持有本公司股份的其他公司合并","C":"将股份用于员工持股计划","D":"股份用于转换上市公司发行的可转换为股票的公司债券","E":"上市公司为维护公司价值及股东权益所必需"},"answer":"BCDE","explanation":"本题考查股份回购。股份有限公司不得收购本公司的股份。但是， 有下列情形之一的除外：（1）减少公司注册资本（选项A不当选）；（2）与持有本公司股 份的其他公司合并（选项B当选）；（3）股东因对股东会作出的公司合并、分立决议持异 议，要求公司收购其股份；（4）将股份用于员工持股计划或者股权激励（选项C当选）； （5）股份用于转换上市公司发行的可转换为股票的公司债券（选项D当选）；（6）上市公 司为维护公司价值及股东权益所必需（选项E当选）。"},{"id":"13.31","chapter":13,"chapter_name":"公司法","type":"多选","question":"下列有关公司合并、分立的说法中，正确的有（　）。","options":{"A":"因分立而存续的公司，其登记事项发生变化的，应当申请变更登记","B":"公司分立，应当编制资产负债表或财产清单之一即可","C":"公司合并、分立的，不经过清算程序","D":"股份有限公司合并的决议，需经该公司代表2/3 以上表决权的股东通过","E":"公司合并时，合并各方的债权、债务由合并后存续的公司或者新设的公司承继三、综合分析题"},"answer":"ACE","explanation":"本题考查公司合并、分立。选项ACE当选，表述正确。选项B不当选， 公司分立，由股东会作出批准与否的决议，其财产作相应的分割，编制资产负债表和财产清 单。选项D不当选，公司合并、分立属于股东会的特别决议事项，有限责任公司股东会作出 合并、分立决议，经该公司代表 代表2/3以上表决权的股东通过；股份有限公司股东会作出公司 合并、分立的决议，须经出席 出席会议的股东所持表决权2/3以上通过。 三、综合分析题"},{"id":"13.32","chapter":13,"chapter_name":"公司法","type":"综合","question":"甲、乙、丙、丁四人各出资100万元，拟设立明月商贸有限责任公司（以下简称“明月公司”）。 2020年1月，甲为设立明月公司，以明月公司的名义与红星公司签订办公家具采购合同，采购 价款20万元。 2020年2月，明月公司成立。甲为董事并担任法定代表人，乙担任公司监事，丙担任财务负 责人。 2020年3月，红星公司将办公家具运送至明月公司，并出具了产品检验合格报告。明月公司接 收后，以质量问题为由，仅支付15万元货款，拒付剩余5万元货款。 2021年6月，丙在执行公司事务期间，严重违反法律规定，给公司造成损失300万元。 2021年7月，甲利用关联公司进行虚假交易，从明月公司转出50万元。同时，山南公司欠明月 公司80万元债务已逾期5个月。因上述原因，明月公司资金周转困难。 2021年10月，宁海公司向明月公司追讨100万元逾期货款。因明月公司已无力清偿，经双方 协商，宁海公司将100万元债权转为对明月公司的投资，并签订了债权投资协议。协议中约定，宁 海公司享有20%的股权，30%的表决权以及30%的利润分配权。同时，明月公司对公司章程进行修 改，修改事项如下： 修改公司章程须经代表30%以上表决权的股东通过。 明月公司增加或减少注册资本，宁海公司享有一票否决权。 未经宁海公司同意，明月公司其他股东不得转让股权。","sub_questions":[{"sub_num":1,"text":"下列关于红星公司的做法中，正确的有（    ）。","options":{"A":"红星公司有权要求甲和明月公司承担连带责任","B":"红星公司有权要求甲承担合同义务","C":"红星公司有权要求明月公司承担合同义务","D":"红星公司可主张以其对明月公司的债权与山南公司欠明月公司的债务相抵销","E":"红星公司和明月公司可以协商解除合同"},"answer":"CE","explanation":"本题考查公司设立时的责任承担。选项AB不当选、选项C当选，公 司设立时的股东为设立公司从事的民事活动，其法律后果由公司承受。本题中，甲为设立明 月公司，以明月公司的名义与红星公司签订采购合同的，应由成立后的明月公司承担合同义 务。因此，红星公司只能请求明月公司承担合同义务，支付货款。选项D不当选，红星公司 与明月公司并非互负债务，不得以第三人的债务相抵销。选项E当选，当事人双方解除合同 的意思表示达成一致的，可以约定解除合同。"},{"sub_num":2,"text":"下列对于明月公司资金周转困难的情况，明月公司及其股东的做法中，正确的有（    ）。","options":{"A":"明月公司要求甲返还其抽逃出资的50 万元","B":"股东会决议决定增加注册资本"},"answer":"ABCD","explanation":"本题考查抽逃出资及股东诉讼。选项A当选，甲利用其关联公 司进行虚假交易将其出资转出，构成抽逃出资，应向公司返还抽逃的出资。选项B当选，增 加注册资本的决议属于股东会的职权 股东会的职权。选项C当选，董事、监事、高级管理人员执行公司职 务时违反法律、行政法规或者公司章程的规定，给公司造成损失的，有限责任公司的股东可 以书面请求监事会 监事会向人民法院提起诉讼。选项D当选，董事、监事、高级管理人员执行公司 职务时违反法律、行政法规或者公司章程规定，给公司造成损失的，应当承担赔偿责任。选 项E不当选，破产清算申请人包括债权人和债务人等，不包括 不包括股东。"}],"options":{},"answer":"","explanation":""},{"id":"13.33","chapter":13,"chapter_name":"公司法","type":"综合","question":"2020年1月1日，甲、乙、丙、丁签订投资协议设立海虹有限责任公司（以下简称“海虹公司”），约定每人各认缴出资30万元。2022年3月15日，海虹公司经登记依法成立。甲任董事，乙 任经理，丙、丁不参与公司经营管理。 2022年6月，丙以了解公司财务状况和自己不具有会计和法律专业知识为由，向海虹公司提交 书面申请，请求由其聘请的律师和会计师代其查阅海虹公司的会计账簿。海虹公司以丙不具备查阅 资格为由，拒绝了丙的要求。 2023年3月，根据2022年度财务会计报告可知，海虹公司的实收资本300万元、资本公积金50万 元、法定公积金为15万元（未提取2022年的法定公积金）、净利润为20万元、以前年度未弥补的亏 损为100万元。2023年4月，海虹公司股东会决议用公积金弥补公司亏损和通过减少注册资本弥补公 司亏损。","sub_questions":[{"sub_num":1,"text":"根据《公司法》的规定，下列有关海虹公司股东出资和股权转让的说法中，正确的有（    ）。","options":{"A":"公司章程可以规定，甲、乙、丙、丁的认缴出资额在公司成立之日起的3 年内缴足","B":"甲未按期缴纳出资的，公司应向甲书面催缴，宽限期自公司发出催缴书之日起不少于30 日","C":"乙未按期缴纳出资，经公司催缴，宽限期届满仍未出资的，自乙收到公司向其发出的失权通知之日起，丧失其未缴纳出资的股权","D":"海虹公司不能清偿到期债务的，公司有权要求已认缴出资但未届出资期限的股东丙提前缴纳出资","E":"股东丁转让其已认缴出资但未届出资期限的股权给第三人戊，由戊承担缴纳该出资的义务，丁无须承担责任"},"answer":"AD","explanation":"本题考查有限责任公司的股东出资和股权转让。选项A当选，有 限责任公司的全体股东认缴的出资额由股东按照公司章程的规定 公司章程的规定自公司成立之日起5年 5年内缴 足。即在5年的出资期限内，公司章程可以从低规定出资期限。选项B不当选，董事会应当对 股东或者发起人的出资情况进行核查，发现股东或者发起人未按照公司章程规定的出资日期 足额缴纳出资的，应当由公司向股东或者发起人发出书面催缴书催缴出资。书面催缴书可以 载明自公司发出催缴书之日起 发出催缴书之日起不少于60日 60日的缴纳出资宽限期。选项C不当选，公司章程规定 出资期到期，股东接催缴通知后宽限期内仍未出资，董事会发出失权通知，自通知发出之日 起（并非股东收到失权通知之日）股东丧失其未缴纳出资的股权。选项D当选，有限责任公 司不能清偿到期债务，公司或者已到期债权的债权人，有权要求已认缴出资但未届出资期限 的股东提前缴纳出资。选项E不当选，股东转让已认缴出资但未届出资期限的股权的，由受 让人承担缴纳该出资的义务；受让人未按期足额缴纳出资的，转让人 转让人对受让人未按期缴纳的 出资承担补充 承担补充责任。"},{"sub_num":2,"text":"根据《公司法》的规定，下列关于海虹公司组织机构的说法中，正确的有（    ）。","options":{"A":"设置审计委员会的公司，不设置监事会，但必须设置1 名监事","B":"规模小或股东人数少的公司，可以不设监事会，设1 名监事","C":"规模小或股东人数少的公司，经全体股东一致同意，可以不设监事","D":"公司董事会成员为3 ～13 人，其成员中可以有公司职工代表","E":"职工人数300 人以上的公司，未设监事会的，董事会中应当有职工代表"},"answer":"BCDE","explanation":"本题考查有限责任公司的股东出资。选项A不当选，公司可以按 照公司章程的规定在董事会中设置由董事组成的审计委员会，不设监事会或者监事（监事也 可以不设置）。选项BC当选，规模较小或者股东人数较少的公司，可以不设监事会，设1名 监事；经全体股东一致同意，也可以不设监事（仅限有限责任公司）。选项D当选，公司董 事会成员为3人以上，其成员中可以有公司职工代表。选项E当选，职工人数300人以上的公 司，除依法设监事会并有公司职工代表的外，其董事会成员中应当有公司职工代表。"},{"sub_num":3,"text":"下列关于海虹公司股东丙查阅公司会计账簿的说法中，正确的有（    ）。","options":{"A":"丙申请查阅无须经过海虹公司同意","B":"连续180 日以上单独或者合计持有公司3% 以上股权的股东才有权查阅公司会计账簿","C":"丙有权查阅，但是不能聘请律师或会计师帮助查阅","D":"丙有权请求查阅公司会计账簿，复制公司会计凭证","E":"公司拒绝提供查阅的，股东丙可向人民法院提起诉讼"},"answer":"E","explanation":"本题考查股东查阅权。选项A不当选，有限责任公司股东可以查阅公 司会计账簿、会计凭证，但需书面请求公司同意。选项E当选、选项BD不当选，有限责任公 司股东和连续180日以上单独或者合计持有公司3%以上股份的股份有限公司股东要求查阅公 司会计账簿、会计凭证的（无权请求复制），应当向公司提出书面请求，说明目的。公司拒 第十三章  公司法| 答案与解析 绝提供查阅的，股东可以向人民法院提起诉讼。选项C不当选，股东查阅公司会计账簿、会 计凭证的，可以委托会计师事务所、律师事务所等中介机构进行。"},{"sub_num":4,"text":"根据公司法律制度的规定，下列关于海虹公司公积金补亏和减资补亏的说法中，正确的有（    ）。","options":{"A":"资本公积金不得用于弥补公司亏损","B":"海虹公司应当先用当年利润弥补亏损","C":"以公积金补亏的，应当先使用任意公积金和法定公积金；仍不能弥补的，可以使用资本公积金补亏","D":"减少注册资本补亏的，不得免除股东缴纳出资或者股款的义务","E":"减少注册资本补亏的，在法定公积金和任意公积金累计额达到公司注册资本25% 前，不得向股东分配利润"},"answer":"BCD","explanation":"本题考查减资补亏。选项A不当选，公积金包括资本公积金、法 定公积金和任意公积金，主要用于弥补公司亏损、扩大公司生产经营或者转为增加公司注 册资本。选项B当选，法定公积金不足以弥补公司以前年度亏损的，在依照规定提取法定公 积金之前，应当先用当年利润弥补。选项C当选，用公积金弥补公司以前年度亏损的，应当 先使用任意公积金和法定公积金；仍不能弥补的，可以按照规定使用资本公积金 仍不能弥补的，可以按照规定使用资本公积金。选项D当 选，用公积金弥补亏损后仍有亏损的，可以减少注册资本弥补亏损。减少注册资本弥补亏损 的，公司不得向股东分配，也不得免除股东缴纳出资或者股款的义务。选项E不当选，减少 注册资本补亏的，在法定公积金和任意公积金累计额达到公司注册资本50%前，不得向股东 分配利润。 做新变 多项选择题"}],"options":{},"answer":"","explanation":""},{"id":"13.34","chapter":13,"chapter_name":"公司法","type":"多选","question":"根据公司法律制度的规定，下列关于国有独资公司的说法中，正确的有（　）。","options":{"A":"不设股东会，由履行出资人职责的机构行使股东会职权","B":"在董事会中设置由董事组成的审计委员会行使监事会职权的，不设监事会或监事","C":"履行出资人职责的机构可以授权公司董事会决定分配利润","D":"董事长由履行出资人职责的机构从董事会成员中指定","E":"董事会中应当有职工代表"},"answer":"ABDE","explanation":"本题考查国有独资公司。选项AB当选，国有独资公司不设股东会， 由履行出资人职责的机构行使股东会职权。国有独资公司在董事会中设置由董事组成的审计 委员会行使监事会职权的，不设监事会或者监事。选项C不当选，履行出资人职责的机构可 以授权公司董事会行使股东会的部分职权，但公司章程的制定和修改，公司的合并、分立、 解散、申请破产，增加或者减少注册资本，分配利润，应当由履行出资人职责的机构决定。 选项D当选，国有独资公司的董事长、副董事长由履行出资人职责的机构从董事会成员中指 定。选项E当选，董事会成员由履行出资人职责的机构委派，其中外部董事应当过半数，同 时应当有公司职工代表。 第十四章  破产法 答案与解析 一、单项选择题"},{"id":"14.1","chapter":14,"chapter_name":"破产法","type":"单选","question":"破产申请是破产程序开始的前提。根据《企业破产法》的规定，下列有关破产申请及管辖的说法中，正确的是（　）。","options":{"A":"破产申请只能由债务人向人民法院提出","B":"破产申请在人民法院受理前不能撤回","C":"破产案件由债务人住所地人民法院管辖","D":"破产案件由破产财产所在地人民法院管辖"},"answer":"C","explanation":"本题考查破产案件的管辖。选项A不当选，债务人、债权人等主体均可在 特定情形下向人民法院申请破产。选项B不当选，申请人可以在人民法院受理破产申请前请 求撤回申请。选项C当选、选项D不当选，破产案件由债务人住所地 债务人住所地人民法院管辖。"},{"id":"14.2","chapter":14,"chapter_name":"破产法","type":"单选","question":"债务人尚未解散，但不能清偿到期债务且明显缺乏清偿能力，属于破产原因之一。这种情况下，可以依法提出破产申请的主体是（　）。","options":{"A":"债权人","B":"债务人的债务人","C":"依法负有清算责任的人","D":"债务人的出资人"},"answer":"A","explanation":"本题考查破产申请人。选项A当选，债务人不能清偿到期债务，并且明显 缺乏清偿能力，主要适用于债权人提出破产申请的案件。选项BD不当选，债务人的债务人与 出资人无权提出破产申请。选项C不当选，依法负有清算责任的人（包括未清算完毕情形下 已经成立的清算组，以及应清算未清算情形下依法负有启动清算程序的清算义务人），应当 在企业法人已解散但未清算或者未清算完毕，资产不足以清偿债务的情况下向人民法院申请 破产清算。 提示：债务人不能清偿到期债务，并且资产不足以清偿全部债务，主要适用于债务人自己提 出破产申请且其资不抵债状况通过形式审查即可判断的案件。"},{"id":"14.3","chapter":14,"chapter_name":"破产法","type":"单选","question":"根据《企业破产法》及相关规定，下列主体中，不能作为破产申请人的是（　）。","options":{"A":"债务人的出资人","B":"依法对债务人负有清算责任的人","C":"国务院金融监督管理机构","D":"债务人"},"answer":"A","explanation":"本题考查破产申请人。选项A当选，债务人的出资人在满足一定条件时可 以提出重整申请，但不能申请破产。选项BCD不当选，破产申请人包括债务人、债权人、依 法对债务人负有清算责任的人以及国务院金融监督管理机构。"},{"id":"14.4","chapter":14,"chapter_name":"破产法","type":"单选","question":"根据《企业破产法》及相关规定，下列关于管理人的说法中，错误的是（　）。","options":{"A":"个人依法也可以担任管理人","B":"管理人可以由依法设立的社会中介机构担任","C":"管理人可以由有关部门、机构人员组成的清算组担任","D":"管理人可以由财政、审计部门担任"},"answer":"D","explanation":"本题考查可以担任管理人的对象。选项A不当选，对于事实清楚、债权债 务关系简单、债务人财产相对集中的企业破产案件，可以指定管理人名册中的个人为管理 人。选项BC不当选、选项D当选，管理人可以由依法设立的律师事务所、会计师事务所、破 产清算事务所等社会中介机构以及中介机构中具备相关专业知识并取得执业资格的人员或有 关部门、机构的人员组成的清算组担任，不包括财政、审计部门。"},{"id":"14.5","chapter":14,"chapter_name":"破产法","type":"单选","question":"根据《企业破产法》及相关规定，破产管理人确定模式是（　）。","options":{"A":"由债权人委员会确定","B":"由债权人会议选任","C":"由债务人选任","D":"由人民法院指定"},"answer":"D","explanation":"本题考查管理人的确定。选项D当选，管理人由人民法院在裁定受理破产 申请的同时指定，对人民法院负责。"},{"id":"14.6","chapter":14,"chapter_name":"破产法","type":"单选","question":"管理人不能依法、公正执行职务或者有其他不能胜任职务情形的，有关主体可以申请人民法院予以更换，该主体是（　）。","options":{"A":"债权人会议","B":"债权人","C":"债务人","D":"债权人委员会"},"answer":"A","explanation":"本题考查管理人的更换。选项A当选，债权人会议认为管理人不能依法、 公正执行职务或者有其他不能胜任职务情形的，可以申请人民法院予以更换。 提示：债权人会议可以申请更换管理人，但是不能“自己做主”，决定权仍在人民法院 “手里”。"},{"id":"14.7","chapter":14,"chapter_name":"破产法","type":"单选","question":"下列关于破产债权申报的说法中，错误的是（　）。","options":{"A":"债权人申报债权时，应当书面说明债权的数额和有无财产担保，并提交有关证据","B":"连带债权人可由一人代表全体申报债权","C":"债权人在确定的债权申报期限内未申报债权的，此前已经进行的分配，不再对其补充分配","D":"债权人在确定的债权申报期限内未申报债权的，可以随时补充申报"},"answer":"D","explanation":"本题考查破产债权申报。选项ABC不当选，表述均正确。选项D当选，债 权人应当在人民法院确定的债权申报期限内向管理人申报债权。在确定的债权申报期限内未 申报债权的，可以在破产财产最后分配前 最后分配前补充申报；但是，此前已进行的分配，不再对其补 充分配。"},{"id":"14.8","chapter":14,"chapter_name":"破产法","type":"单选","question":"管理人不能依法、公正执行职务或者有其他不能胜任职务情形的，有关主体可以申请人民法院予以更换，该主体是（　）。","options":{"A":"债权人","B":"债权人会议","C":"债权人委员会","D":"债务人"},"answer":"B","explanation":"本题考查债权人会议的职权。选项B当选，债权人会议认为管理人不能依 法、公正执行职务或有其他不能胜任职务情形的，可以申请人民法院予以更换。在一定情形 下，人民法院可以根据债权人会议的申请或者依职权径行决定更换管理人。"},{"id":"14.9","chapter":14,"chapter_name":"破产法","type":"单选","question":"根据《企业破产法》及相关规定，债权人会议可以行使的职权是（　）。","options":{"A":"监督债务人财产的管理和处分","B":"审查管理人的费用和报酬","C":"批准重整计划","D":"监督破产财产分配"},"answer":"B","explanation":"本题考查债权人会议的职权。债权人会议的职权包括：（1）核查债权； （2）申请人民法院更换管理人，审查管理人的费用和报酬（选项B当选）；（3）监督管理 第十四章  破产法| 答案与解析 人；（4）选任和更换债权人委员会成员；（5）决定继续或者停止债务人的营业；（6）通 过重整计划、和解协议；（7）通过债务人财产的管理方案、破产财产的变价及分配方案。 选项AD不当选，监督债务人财产的管理和处分以及监督破产财产的分配属于债权人委员会 的职权。选项C不当选，批准重整计划属于法院的职权。"},{"id":"14.10","chapter":14,"chapter_name":"破产法","type":"单选","question":"根据《企业破产法》的规定，在债权人会议上经表决不能通过而需由人民法院裁定的事项是（　）。","options":{"A":"更换债权人委员会成员方案","B":"破产财产的变价方案","C":"重整计划草案","D":"监督管理人方案"},"answer":"B","explanation":"本题考查债权人会议的表决。选项ACD不当选、选项B当选，债权人会议 表决不能通过债务人财产管理方案和破产财产变价方案的，由人民法院裁定；对破产财产的 分配方案，债权人会议经两次表决 两次表决仍不能通过的，由人民法院裁定。"},{"id":"14.11","chapter":14,"chapter_name":"破产法","type":"单选","question":"债权人委员会是对破产程序进行监督的机构。下列关于债权人委员会的说法中，正确的是（　）。","options":{"A":"是否设立债权人委员会，应由债权人会议根据需要决定","B":"债权人会议必须决定设立债权人委员会","C":"债权人委员会成员由债权人会议选定的债权人代表组成","D":"债权人委员会应当经人民法院判决认可后方可设立"},"answer":"A","explanation":"本题考查债权人委员会。选项A当选、选项B不当选，债权人委员会为破 产程序中的选任机关，是否设置债权人委员会，由债权人会议根据案件具体情况决定。选 项CD不当选，债权人委员会由债权人会议选任的债权人代表和1名债务人的职工代表或者工 会代表组成，不得超过9人，由人民法院以书面决定认可。"},{"id":"14.12","chapter":14,"chapter_name":"破产法","type":"单选","question":"根据《企业破产法》的规定，下列涉及债务人财产的行为中，无效的是（　）。","options":{"A":"债务人明显缺乏清偿能力，仍对个别债权人清偿","B":"债务人放弃债权","C":"债务人为逃避债务而隐匿、转移财产","D":"债务人对没有担保的债务提供担保"},"answer":"C","explanation":"本题考查涉及债务人财产的无效行为。涉及债务人财产的下列行为无效： （1）为逃避债务而隐匿、转移财产的（选项C当选）；（2）虚构债务或者承认不真实的债 务的。选项ABD不当选，所述情形均为可撤销情形。"},{"id":"14.13","chapter":14,"chapter_name":"破产法","type":"单选","question":"对因《企业破产法》规定的可撤销行为、无效行为而取得的债务人财产行使追回权的主体是（　）。","options":{"A":"债权人","B":"管理人","C":"破产申请人","D":"债务人"},"answer":"B","explanation":"本题考查追回权行使主体。选项B当选，对因可撤销行为和无效行为而取 得的债务人的财产，管理人有权追回。"},{"id":"14.14","chapter":14,"chapter_name":"破产法","type":"单选","question":"根据《企业破产法》及司法解释规定，法院受理破产申请后，下列关于管理人职责及债务人财产的说法中，错误的是（　）。","options":{"A":"债务人的债务人在破产申请受理后取得他人对债务人的债权的，可以向管理人主张抵销","B":"债务人占有的不属于债务人的财产，该财产的权利人可以通过管理人取回，但《企业破产法》另有规定的除外","C":"债务人的出资人尚未完全履行出资义务的，管理人应当要求该出资人缴纳所认缴的出资而不受出资期限的限制","D":"债务人的董事侵占的企业财产，管理人应当追回"},"answer":"A","explanation":"本题考查管理人职责和债务人财产。选项A当选，债务人的债务人在破产 申请受理后取得他人对债务人的债权的，禁止抵销。选项B不当选，债务人占有的他人财产 债务人占有的他人财产 不属于债务人财产，在人民法院受理破产申请后，权利人可以通过管理人取回，但是，法律 不属于债务人财产，在人民法院受理破产申请后，权利人可以通过管理人取回，但是，法律 另有规定的除外 另有规定的除外。选项C不当选，人民法院受理破产申请后，债务人的出资人尚未完全履行 出资义务的，应当按照管理人的要求缴纳所认缴的出资，该出资不受出资期限的限制。选 项D不当选，“董监高”侵占的企业财产以及“董监高”的非正常收入，管理人均应追回， 根据不同情况确定清偿顺位。"},{"id":"14.15","chapter":14,"chapter_name":"破产法","type":"单选","question":"根据《企业破产法》的规定，下列情形属于债务人财产的是（　）。","options":{"A":"为了维持日常经营而租入的设备","B":"其他公司抵押给债务人的厂房","C":"免费使用的政府办公楼","D":"破产重整期间购入10 000 股流通股票"},"answer":"D","explanation":"本题考查债务人财产。债务人财产，是指破产申请受理时属于债务人的全 部财产，以及破产申请受理后至破产程序终结前债务人取得的财产。下列财产不应认定为债 务人财产：（1）债务人基于仓储、保管、承揽、代销、借用、寄存、租赁等合同或者其他 法律关系占有、使用的他人财产（选项AB不当选）；（2）债务人在所有权保留买卖中尚未 取得所有权的财产；（3）所有权专属于国家且不得转让的财产（选项C不当选）；（4）其 他依照法律、行政法规不属于债务人的财产。"},{"id":"14.16","chapter":14,"chapter_name":"破产法","type":"单选","question":"根据《企业破产法》的规定，下列有关重整申请人的说法中，正确的是（　）。","options":{"A":"进入破产程序前，债务人可以直接向人民法院申请重整","B":"人民法院受理破产申请后、宣告债务人破产前，破产管理人可以向人民法院申请重整","C":"人民法院受理破产申请后、宣告债务人破产前，出资额占债务人注册资本5% 以上的出资人，可以向人民法院申请重整","D":"人民法院受理破产申请后，债权人不能向人民法院申请重整"},"answer":"A","explanation":"本题考查重整申请人。开启重整程序有两种方式：（1）债务人或债权人 直接向人民法院申请重整（选项A当选）；（2）债权人申请对债务人进行破产清算的，在人 民法院受理破产申请后、宣告债务人破产前，债务人、出资额占债务人注册资本1/10以上的 出资人（选项C不当选）、债权人可以申请对债务人重整（选项D不当选）。选项B不当选， 管理人在任何情况下都不能作为破产申请人。 问题：直接申请重整的申请人与申请破产清算转重整的申请人辨析。 解答：直接申请重整的申请人有债务人和债权人。 申请破产清算转重整的申请人有债务人、债权人和出资额占债务人注册资本 出资额占债务人注册资本 1/10以上的出 1/10以上的出资人 资人。"},{"id":"14.17","chapter":14,"chapter_name":"破产法","type":"单选","question":"根据《企业破产法》的规定，下列关于破产重整的说法中，正确的是（　）。","options":{"A":"破产重整期间是指法院受理破产申请至重整程序终止的期间","B":"破产重整期间，除债务人管理破产财产受管理人监督外，债务人的营业事务不受管理人干预","C":"破产重整期间，债务人的出资人可以请求投资收益分配","D":"破产重整期间，债务人可以决定内部管理事务"},"answer":"D","explanation":"本题考查破产重整期间。选项A不当选，重整期间，是指自人民法院裁定 债务人重整之日起至重整程序终止，不包括重整计划执行的期间 不包括重整计划执行的期间。选项B不当选、选项D当 选，破产重整期间，可以由债务人自行管理企业事务，也可以由管理人管理，债务人自行管 理财产和营业事务的，应受管理人的监督。选项C不当选，重整期间，债务人的出资人不得 重整期间，债务人的出资人不得 请求投资收益 请求投资收益分配。"},{"id":"14.18","chapter":14,"chapter_name":"破产法","type":"单选","question":"对具有破产原因而又有再生希望的企业，经利害关系人申请，人民法院可以依法裁定重整。下列有关债务人及其出资人重整期间权利义务的说法中，正确的是（　）。","options":{"A":"债务人合法占有他人财产，该财产的权利人要求取回，债务人应当无条件予以返还","B":"经人民法院同意，债务人的董事可以向第三人转让持有债务人的股权","C":"债务人为继续营业而借款的，不得为该借款提供担保","D":"经人民法院批准，债务人可以自行管理财产而不接受管理人的监督"},"answer":"B","explanation":"本题考查重整期间相关主体的权利义务。选项A不当选，重整期间，债务 人合法占有的他人财产，该财产的权利人在重整期间要求取回的，应当符合事先约定的条 件。选项B当选，债务人的董事、监事、高级管理人员不得向第三人转让其持有的债务人的 股权。但是，经人民法院同意的除外。选项C不当选，重整期间，债务人或者管理人为继续 为继续 营业 营业而借款的，可以 可以为该借款设定担保。选项D不当选，重整期间，经债务人申请，人民法 院批准，债务人可以在管理人的监督下自行管理财产和营业事务。"},{"id":"14.19","chapter":14,"chapter_name":"破产法","type":"单选","question":"根据《企业破产法》及相关规定，下列关于和解的说法中，正确的是（　）。","options":{"A":"经法院裁定认可的和解协议，对债务人和全体和解债权人均有约束力，但和解债权人对债务人的保证人所享有的权利，不受和解协议的影响","B":"债权人会议通过和解协议的决议，由出席会议的有表决权的债权人一致同意","C":"法院裁定终止和解协议执行的，和解债权人在和解协议中作出的债权调整的承诺失去效力，和解债权人因执行和解协议所受的清偿无效","D":"债权人可以直接向法院申请和解，但不能在法院受理破产申请后、宣告债务人破产前，向法院申请和解"},"answer":"A","explanation":"本题考查和解。选项A当选，经人民法院裁定认可的和解协议，对债务人 和全体和解债权人均有约束力。但是，债权人对债务人的保证人和其他连带债务人所享有的 权利，不受影响。选项B不当选，债权人会议通过和解协议的决议，由出席会议的有表决权 的债权人过半数同意，并且其所代表的债权额占无财产担保债权总额的2/3以上。选项C不当 选，人民法院裁定终止和解协议执行的，和解债权人在和解协议中作出的债权调整的承诺失 去效力，和解债权人因执行和解协议所受的清偿仍然有效。选项D不当选，只有债务人一方 可以申请和解，债权人无权提出和解申请。"},{"id":"14.20","chapter":14,"chapter_name":"破产法","type":"单选","question":"根据《企业破产法》的规定，在人民法院受理破产申请后发生的下列费用中，属于破产费用的是（　）。","options":{"A":"管理人执行职务致人损害应支付的费用","B":"管理人请求对方当事人履行双方均未履行完毕的合同应支付的费用","C":"管理人聘用工作人员应支付的费用","D":"债务人财产受无因管理应支付的费用"},"answer":"C","explanation":"本题考查破产费用和共益债务。破产费用是在破产程序期间发生的，为全 体债权人的共同利益而支出，为了保障破产程序顺利进行而发生的费用。包括：（1）破产 案件的诉讼费用；（2）管理、变价和分配债务人财产的费用；（3）管理人执行职务的费 用、报酬和聘用工作人员的费用（选项C当选）。此外，人民法院裁定受理破产申请的，此 前债务人尚未支付的公司强制清算费用、未终结的执行程序中产生的评估费、公告费、保管 费等执行费用，可以参照破产费用的规定，由债务人财产随时清偿。选项ABD不当选，所述 均属于共益债务。"},{"id":"14.21","chapter":14,"chapter_name":"破产法","type":"单选","question":"根据《企业破产法》的规定，下列关于破产费用、共益债务认定及清偿原则的说法中，正确的是（　）。","options":{"A":"债务人财产不足以清偿所有破产费用和共益债务的，先行清偿共益债务","B":"债务人财产致人损害所产生的费用属于破产费用","C":"破产费用和共益债务由债务人财产随时清偿","D":"管理人执行职务的报酬属于共益债务"},"answer":"C","explanation":"本题考查破产费用和共益债务。选项A不当选，债务人财产不足以清偿所 债务人财产不足以清偿所 有破产费用和共益债务的，先行清偿破产费用 有破产费用和共益债务的，先行清偿破产费用。选项B不当选，债务人财产致人损害所产生 的债务属于共益债务。选项C当选，破产费用和共益债务由债务人财产随时清偿。选项D不当 选，管理人执行职务的费用、报酬和聘用工作人员的费用属于破产费用。 第十四章  破产法| 答案与解析 二、多项选择题"},{"id":"14.22","chapter":14,"chapter_name":"破产法","type":"多选","question":"债务人账面资产虽大于负债，但存在相关情形的，人民法院应当认定其明显缺乏清偿能力。下列选项属于该情形的有（　）。","options":{"A":"法定代表人下落不明","B":"因资金严重不足，无法清偿债务","C":"经人民法院强制执行，无法清偿债务","D":"长期亏损且经营扭亏困难，无法清偿债务","E":"因财产不能变现，无法清偿债务"},"answer":"BCDE","explanation":"本题考查破产原因。债务人账面资产虽大于负债，但存在下列情形之 一的，人民法院应当认定其明显缺乏清偿能力：（1）因资金严重不足或者财产不能变现等
