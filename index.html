制裁，具有惩罚性和终局性；而加处罚款是为了促 使当事人履行已生效的金钱给付义务（如罚款、税款），是一种督促执行的 手段，不具有终局性。例如，本案中甲公司已被处以罚款，逾期不缴纳罚款 才加处罚款，目的是促使其尽快缴纳原罚款，因此属于行政强制执行范畴。"},{"sub_num":2,"text":"下列有关甲公司对罚款不服的行政救济和稽查局对罚款强制执行的说法中，正确的有（    ）。","options":{"A":"甲公司对罚款不服的，可以直接提起行政诉讼","B":"甲公司在稽查局限定的期限内不缴纳罚款，稽查局可当即对罚款强制执行","C":"甲公司收到处罚决定书之日起满60 日不申请行政复议的，稽查局可当即对罚款强制执行","D":"甲公司对罚款不服的，必须先申请行政复议","E":"甲公司对逾期不缴纳罚款加处罚款不服的，必须先足额缴纳罚款与加处罚款，才能申请行政复议"},"answer":"AE","explanation":"本题考查强制执行的程序与具体行政行为的救济。选项A当选、选 项D不当选，相对人对税务机关作出的征税行为不服的，应当先向行政复议机关申请行政复 议，对复议决定不服的，方可提起行政诉讼。罚款不属于征税行为，甲公司对罚款行为不服 的，可以申请行政复议，也可以直接向人民法院提起行政诉讼。选项B不当选，行政机关作 行政机关作 第六章  行政诉讼法律制度| 答案与解析 出强制执行决定前，应当事先催告当事人履行义务 出强制执行决定前，应当事先催告当事人履行义务。选项C不当选，当事人对税务机关的处 罚决定逾期不申请行政复议也不向法院起诉、又不履行的，作出处罚决定的税务机关可以采 取强制执行措施或者申请法院强制执行。选项E当选，申请人对税务机关作出逾期不缴纳罚 申请人对税务机关作出逾期不缴纳罚 款加处罚款的决定不服的，应当先缴纳罚款和加处罚款，再申请行政 款加处罚款的决定不服的，应当先缴纳罚款和加处罚款，再申请行政复议。"},{"sub_num":3,"text":"根据《行政强制法》的规定，下列有关本案催告的说法中，正确的有（    ）。","options":{"A":"事先催告甲公司履行义务，是稽查局实施强制执行的必经程序","B":"稽查局催告甲公司履行义务，应当告知甲公司享有陈述权和申辩权","C":"稽查局催告甲公司履行义务，可以采用口头方式作出","D":"事先催告甲公司履行义务，是稽查局实施强制措施的必经程序","E":"在催告甲公司履行义务期间，对有证据证明有转移或者隐匿财物迹象的，稽查局可以作出立即强制执行决定"},"answer":"ABE","explanation":"本题考查强制执行的催告。选项AB当选、选项CD不当选，行政 机关作出强制执行（非强制措施）决定前，应当事先催告当事人履行义务。催告应当以书面 形式作出，并载明下列事项：①履行义务的期限；②履行义务的方式；③涉及金钱给付的， 应当有明确的金额和给付方式；④当事人依法享有的陈述权和申辩权。选项E当选，在催告 期间，对有证据证明有转移或者隐匿财物迹象的，行政机关可以作出立即强制执行决定。"},{"sub_num":4,"text":"下列关于本案扣押、拍卖财产的说法中，正确的有（    ）。","options":{"A":"根据《行政强制法》的规定，稽查局扣押财产的期限一般不得超过30 日","B":"稽查局拍卖财产发生的费用由甲公司负担"},"answer":"ABC","explanation":"本题考查扣押、拍卖。选项A当选，查封、扣押的期限不得超过 30日；情况复杂的，经行政机关负责人批准，可以延长，但是延长期限不得超过30日。法 律、行政法规另有规定的除外。选项B当选，强制执行的费用由被执行人（甲公司）承担。 人民法院以划拨、拍卖方式强制执行的，可以在划拨、拍卖后将强制执行的费用扣除。选 项E不当选，查封、扣押限于涉案的场所、设施或者财物，不得查封、扣押与违法行为无关 的场所、设施或者财物。题述情形下，李某的房产、车辆与其违法行为无关，稽查局无权扣 押，也无权进行拍卖。选项C当选，行政机关实施查封、扣押，对查封、扣押的场所、设施 或者财物应当妥善保管，不得使用或者损毁；因未尽妥善保管义务造成损失的，应当承担赔 偿责任。选项D不当选，因查封、扣押发生的保管费用由行政机关承担。"}],"options":{},"answer":"","explanation":""},{"id":"6.29","chapter":6,"chapter_name":"行政诉讼法律制度","type":"综合","question":"2024年8月，南湖市税务局在对个人所得税综合所得汇算清缴办理情况开展事后抽查时，发现纳税人贾某在南湖市甲公司、乙公司等多处任职且未办理2022年度、2023年度个人所得税综合所 得汇算清缴，遂依法对其进行立案调查。经查，纳税人贾某未在法定期限内办理2022年度个人所得 税综合所得汇算清缴，少缴个人所得税。经税务机关提醒督促，贾某仍不办理。 税务部门对其立案调查，在作出处罚决定前，南湖市税务局第三稽查局向贾某送达《税务行政 处罚事项告知书》，告知贾某相关权利。 2024年10月3日，税务部门依法送达《税务处理决定书》和《税务行政处罚决定书》，对贾某 追缴税款、加收滞纳金，共计8.7万元，罚款5.63万元。限期15日内缴纳税款、滞纳金和罚款。但 贾某以滞纳金与罚款数额过高为由拒不缴纳。2024年10月20日，贾某以罚款数额过高为由向法院起 诉，要求撤销《税务行政处罚决定书》。","sub_questions":[{"sub_num":1,"text":"贾某对滞纳金与罚款不服，下列关于贾某申请救济的说法中，正确的有（    ）。","options":{"A":"贾某认为滞纳金数额过高，应当先申请行政复议，对复议决定不服，方可提起行政诉讼","B":"贾某认为罚款数额过高，应当先申请行政复议，对复议决定不服，方可提起行政诉讼","C":"贾某认为滞纳金数额过高，可以直接提起行政诉讼","D":"贾某认为罚款数额过高，可以直接提起行政诉讼","E":"贾某认为罚款与滞纳金数额过高，不得申请行政复议或提起行政诉讼"},"answer":"AD","explanation":"本题考查行政行为的救济。选项A当选、选项CE不当选，加收滞纳 金属于征税行为。公司、法人、其他组织对税务机关的征税行为不服的，应当先申请行政复 议；对复议决定仍不服的，方可提起行政诉讼。选项B不当选、选项D当选，罚款属于“或议 或诉”的情形，对罚款决定不服，可以申请行政复议，也可以直接提起行政诉讼。"},{"sub_num":2,"text":"下列关于罚款决定的说法中，正确的有（    ）。","options":{"A":"南湖市税务局第三稽查局在作出罚款决定前应当告知贾某已经查明的违法事实、理由、证据","B":"贾某有权申请听证","C":"若贾某要求听证符合条件的，税务机关应当在收到当事人听证要求后15 日内举行听证","D":"若贾某未在收到文书后15 日内缴纳罚款，南湖市税务局第三稽查局有权对其强制执行","E":"若贾某的违法事实2 年内未发现，则不再给予行政处罚"},"answer":"ABC","explanation":"本题考查行政处罚。选项AB当选，税务机关对公民作出2 000元 以上罚款，或者对法人或者其他组织作出1万元以上罚款的行政处罚之前，应当向当事人送 达《税务行政处罚事项告知书》，告知当事人已经查明的违法事实、证据、行政处罚的法 律依据和拟将给予的行政处罚，并告知其有要求举行听证的权利。选项C当选，当事人要求 听证符合条件的，税务机关应当在收到当事人听证要求后15日内举行听证，并在举行听证 的7日前将《税务行政处罚听证通知书》送达当事人，通知当事人及有关人员举行听证的时 间、地点。选项D不当选，税务局稽查局依法作出税务行政处罚决定，被执行人在法定期限 内不申请行政复议或者提起行政诉讼，又无正当理由不履行税务行政处罚决定，经税务局稽 查局催告仍未履行的，税务局稽查局可以向所在地有管辖权的人民法院申请强制执行。选 项E不当选，违反税收法律、行政法规应当给予行政处罚的行为在 违反税收法律、行政法规应当给予行政处罚的行为在5年 5年内未被发现的，不再给 内未被发现的，不再给 予行政 予行政处罚。"},{"sub_num":3,"text":"下列关于贾某起诉与法院受理的说法中，正确的有（    ）。","options":{"A":"该案件应由南湖市中级人民法院管辖","B":"该案件应由南湖市税务局所在地基层人民法院管辖","C":"人民法院受理案件后，若当场不能决定是否立案，应收到材料5 日内裁定是否立案","D":"若贾某起诉书中内容欠缺，人民法院应不予受理","E":"若人民法院既不立案，又不作出不予立案的裁定，贾某可以向上一级法院起诉"},"answer":"BE","explanation":"本题考查行政诉讼的起诉与受理。选项A不当选、选项B当选，基 层人民法院管辖第一审行政案件，即管辖除中级、高级以及最高人民法院管辖的特殊的第一 审行政案件以外的所有行政案件。本案应由基层法院管辖。贾某不服，向人民法院起诉，被 告为南湖市税务局第三稽查局，行政案件由最初作出行政行为的行政机关所在地人民法院管 辖。因此，应由南湖市税务局所在地的基层法院管辖。选项C不当选、选项E当选，人民法院 受理案件后，若不能当场决定是否立案，应在收到材料7日内裁定是否立案。受诉人民法院 自收到起诉状之日起7日内既不立案，又不作出不予立案裁定的，起诉人可以向上一级人民 法院起诉。上一级人民法院认为符合起诉条件的，应当立案、审理，也可以指定其他下级人 民法院立案、审理。选项D不当选，起诉状内容欠缺或者有其他错误的，应当给予指导和释 明，并一次性告知当事人需要补正的内容。不得未经指导和释明即以起诉不符合条件为由不 接收起诉状。"},{"sub_num":4,"text":"下列关于人民法院审理该案的说法中，正确的有（    ）。","options":{"A":"一审人民法院审理该案件，可以适用简易程序","B":"一审人民法院审理案件，一律应当开庭审理","C":"人民法院审理行政案件，以法律、行政法规、地方性法规、自治条例和单行条例为依据，并参照规章","D":"人民法院审理该案件，应于立案之日起3 个月内审结","E":"若贾某在法院判决前撤回起诉，法院不予准许，贾某无正当理由拒不到庭，人民法院可以按撤诉处理"},"answer":"BC","explanation":"本题考查行政诉讼程序。选项A不当选，人民法院审理下列第一审 行政案件，认为事实清楚、权利义务关系明确、争议不大的，可以适用简易程序：①被诉行 政行为是依法当场作出的；②案件涉及款额2 000元以下的；③属于政府信息公开案件的。 此外，当事人各方同意适用简易程序，可以适用简易程序。本题所述情形不在上述范围内， 因此，不适用一审简易程序。选项B当选，人民法院审理第一审行政案件，一律实行开庭审 理，不得进行书面审理。选项C当选，人民法院审理行政案件，以法律、行政法规、地方性 法规、自治条例和单行条例为依据，并参照规章。选项D不当选，人民法院应当在立案之 日起6个月内作出一审判决。有特殊情况需要延长的，由高级人民法院批准；高级人民法院 审理的一审案件需要延长的，由最高人民法院批准。选项E不当选，原告或者上诉人申请撤 诉，人民法院裁定不予准许的，原告或者上诉人经传票传唤，无正当理由拒不到庭，或者未 经法庭许可中途退庭的，人民法院可以缺席判决。撤回起诉体现当事人意思自治，一旦成立 会导致诉讼程序终结；而缺席判决是法院对诉讼程序的正常推进并作出实体裁判。法院不允 许贾某撤回起诉，即只能按照正常诉讼程序推进作出判决而不能按撤诉处理。"}],"options":{},"answer":"","explanation":""},{"id":"6.30","chapter":6,"chapter_name":"行政诉讼法律制度","type":"综合","question":"石城市田家区税务局稽查局根据群众举报，对该区贝尔德电器有限公司进行稽查。稽查中发现贝尔德电器有限公司设内账，记录对外销售产品情况。其中：记录的销售额大于实际开票金额。 依据其内部进销存账、送货单，确定有4 900万元收入没有向税务机关如实申报，少计销项税额 840万元。根据《税收征收管理法》的规定，田家区税务局稽查局对贝尔德电器有限公司处以420万 元罚款，补税和罚款共计1 200多万元。贝尔德电器有限公司对罚款不服，向石城市田家区法院提 起诉讼。田家区法院以田家区税务局稽查局提供的证据不足以证明贝尔德电器有限公司偷税为由判 决田家区税务局稽查局败诉。田家区税务局稽查局不服，向石城市中级人民法院提起诉讼。","sub_questions":[{"sub_num":1,"text":"田家区法院以田家区税务局稽查局提供的证据不足以证明贝尔德电器有限公司偷税为由判决田家区税务局稽查局败诉。下列关于行政诉讼证据收集和举证的说法中，正确的有（    ）。","options":{"A":"一审法院可以主动调查收集证据以证明贝尔德电器有限公司偷税","B":"贝尔德电器有限公司应提供证据证明其行为不构成偷税","C":"若原告贝尔德电器有限公司提供的证明罚款处罚决定违法的证据不成立，则被告田家区税务局稽查局对罚款处罚决定合法性的举证责任仍不能免除","D":"贝尔德电器有限公司应提供证据证明其起诉符合法定条件","E":"一审中，田家区税务局稽查局不能自行向贝尔德电器有限公司收集证据"},"answer":"CDE","explanation":"本题考查行政诉讼的举证规则。选项A不当选，人民法院在调取 证据时，不得为证明被诉行政行为的合法性而调取被告在作出行政行为时未收集的证据。选 项B不当选、选项D当选，行政诉讼中被告承担行政行为合法性的举证责任，原告应当提供的 是其符合法定（起诉）条件的相应的证据材料，无须自证其行为不构成偷税。选项C当选， 原告可以提供证明被诉行政行为违法的证据，原告提供的证据不成立的，不免除被告对被诉 原告可以提供证明被诉行政行为违法的证据，原告提供的证据不成立的，不免除被告对被诉 行政行为的举证责任 行政行为的举证责任。选项E当选，被告对于证据的收集应当在作出行政行为之前，在诉讼 过程中，被告及其诉讼代理人不得自行向原告、第三人和证人收集证据。"},{"sub_num":2,"text":"下列关于本案一审程序及审理依据的说法中，正确的有（    ）。","options":{"A":"如果没有特殊情况，田家区法院应当在立案之日起6 个月内作出一审判决","B":"法院审理此案，以法律、法规等为依据，可以参照税收规章","C":"一审程序一律实行开庭审理","D":"如果原告在审理过程中未经许可中途退庭，田家区法院可以缺席判决","E":"被告田家区税务局稽查局应当在收到起诉状副本之日起15 日内提交答辩状"},"answer":"ABCE","explanation":"本题考查行政诉讼第一审程序。选项A当选，人民法院应当在立 案之日起6个月内作出一审判决。有特殊情况需要延长的，由高级人民法院批准；高级人民 高级人民 法院审理的一审案件需要延长的，由最高人民法院批准 法院审理的一审案件需要延长的，由最高人民法院批准。选项B当选，人民法院审理行政案 件，以法律、行政法规、地方性法规、自治条例和单行条例为依据，并参照规章。选项C当 选，一审程序一律实行开庭审理，不得进行书面审理。开庭审理时，除涉及国家秘密、个人 隐私和法律另有规定外，人民法院审理行政案件应当一律公开审理。选项D不当选，原告经 合法传唤，无正当理由拒不到庭或者未经法庭许可中途退庭的，按撤诉处理；原告或者上诉 人申请撤诉，人民法院裁定不予准许的，原告经传票传唤无正当理由拒不到庭，或者未经法 庭许可中途退庭的，人民法院可以缺席判决。选项E当选，被告应当在收到起诉状副本之日 起15日内提交答辩状，并提供据以作出被诉行政行为的全部证据和所依据的规范性文件。 第六章  行政诉讼法律制度| 答案与解析"},{"sub_num":3,"text":"下列关于本案二审程序的说法中，正确的有（    ）。","options":{"A":"二审法院作出的判决为发生法律效力的判决","B":"除特殊情况需要延长外，二审法院应当自收到上诉状之日起3 个月内作出判决","C":"二审法院应当对一审法院裁判和被诉行政行为是否合法进行全面审查","D":"发回重审的案件当事人可再次上诉，但是法院不得再次发回重审","E":"田家区税务局稽查局收到一审判决后应在10 日内提出上诉"},"answer":"ABCD","explanation":"本题考查行政诉讼第二审程序。选项A当选，人民法院审理行政 案件，实行两审终审制，即二审法院作出的判决为发生法律效力的判决。选项B当选，第二 审人民法院审理上诉案件，应当自收到上诉状之日起3个月内作出终审判决。有特殊情况需 要延长的，由高级人民法院批准，高级人民法院审理上诉案件需要延长的，由最高人民法院 批准。选项C当选，第二审人民法院审理上诉案件，必须组成合议庭，开庭审理，对原审人 民法院的裁判和被诉行政行为进行全面审查。选项D当选，当事人对发回重审案件的判决不 服的，可以再行上诉。第二审人民法院不得再次发回重审。选项E不当选，不服一审判决的 上诉期为15天，不服一审裁定的上诉期为10天。"},{"sub_num":4,"text":"下列证据材料中，属于书证的有（    ）。","options":{"A":"用于证明贝尔德电器有限公司经营范围的营业执照","B":"用于证实开票单位、金额的盖有发票专用章的发票","C":"用于证明收货单位的送货单","D":"用于证明系贝尔德电器有限公司持有的发票","E":"用于证明数量的内部进销存账"},"answer":"ABCE","explanation":"本题考查行政诉讼的证据。书证，是以其内容、文字、符号、 图画等来表达一定的思想并用以证明案件事实的材料。选项A当选，营业执照上的记载事项 包括公司的经营范围，能够以记载内容证明案件事实，属于书证。选项B当选，盖有发票专 用章的发票上记载了开票单位和金额，能够以记载内容证明案件事实，属于书证。选项C当 选，送货单上记载了送货单位和收货单位，能够以记载内容证明案件事实，属于书证。选 项D不当选，物证是以物品的外部特征、存在状态或物质属性来证明案件事实的，而书证是 以其记载的内容来证明案件事实。用于证明主体持有的发票是通过发票本身证明待证事实， 属于物证。选项E当选，内部进销存账记载内容包括进项数量，能够以记载内容证明案件事 实，属于书证。 问题：如何区分书证与物证？ 解答：（1）书证是通过记载的内容、文字、符号等证明案件事实。如证明经营范围 和经营期限的营业执照、盖有发票专用章的发票等。 （2）物证是通过其存在的外形、规格、质量、特征等形式证明案件事实的物 品。如为了证明相关主体持有发票，只要有发票这个物品，就可证明持有发 票的状态，无须查验发票的内容。"}],"options":{},"answer":"","explanation":""},{"id":"6.31","chapter":6,"chapter_name":"行政诉讼法律制度","type":"综合","question":"万盛公司系某省某市一家建筑施工企业。2015年8月，该企业承接该市某单位的一项改建工程。因该公司违反法律及有关规定操作，施工阶段发生生产安全事故。某省建设厅经现场调查后当 场作出暂扣该公司安全生产许可证3个月的决定；市安全监督管理局作出对该公司罚款20万元的决 定，该公司对市安全监督管理局作出的罚款决定不服，向法院提起行政诉讼。","sub_questions":[{"sub_num":1,"text":"根据《行政诉讼法》及其司法解释的规定，下列关于被告确定、出庭应诉事项以及法院做法的说法中，正确的有（    ）。","options":{"A":"市安全监督管理局作为被告，其正职负责人或者副职负责人依法应当出庭应诉","B":"若本案市安全监督管理局负责人不能出席应诉，法院应缺席判决","C":"若本案市安全监督管理局负责人不能出席应诉，法院应终结诉讼","D":"省建设厅作为共同被告，其负责人依法应当出庭应诉","E":"省建设厅作为第三人，其负责人依法应当出庭应诉"},"answer":"A","explanation":"本题考查行政诉讼的被告及应诉事项。选项A当选、选项BC不当 选，被诉行政机关负责人应当出庭应诉，被诉行政机关负责人不能出庭的，应当委托行政机 关相应的工作人员出庭。选项DE不当选，省建设厅暂扣安全生产许可证的行为和市安全监督 管理局的罚款决定是两个独立的行政行为，万盛公司对市安全监督管理局的罚款决定不服， 并非对某省建设厅暂扣安全生产许可证不服，此时，应当仅以市安全监督管理局为被告，省 建设厅不作为共同被告，也不应作为诉讼中的第三人。"},{"sub_num":2,"text":"本案中，省建设厅作出暂扣万盛公司安全生产许可证3 个月的决定。下列关于暂扣安全生产许可证这一行为的性质、类型以及适用法律问题的说法中，正确的有（    ）。","options":{"A":"省建设厅暂扣许可证的行为是行政处罚，属于能力罚，应适用《行政处罚法》的程序规定","B":"省建设厅暂扣许可证的行为是行政事实行为，属于行政指导，应适用《行政许可法》的程序规定","C":"省建设厅暂扣许可证的行为是双方行政行为，应适用《行政强制法》的程序规定","D":"省建设厅暂扣许可证的行为是损益行政行为，应适用《行政处罚法》的程序规定","E":"省建设厅暂扣许可证的行为是没收行为，应适用《行政强制法》的程序规定"},"answer":"AD","explanation":"本题考查行政处罚的种类。选项A当选、选项BCE不当选，暂扣许 可证件属于行政处罚中的行为罚（能力罚），为单方行政行为，应适用《行政处罚法》的程 序规定。选项D当选，损益行政行为指行政主体对行政相对人实施的对相对人不利或者以某 种方式侵夺、减损相对人某种权利或利益的行政行为，行政处罚为损益行政行为。 提示：行政强制亦为损益行政行为。"},{"sub_num":3,"text":"本案中，市安全监督管理局作出对万盛公司罚款20 万元的决定。下列关于该罚款程序及听证程序的说法中，正确的有（    ）。","options":{"A":"若该公司要求举行听证，应当在安全监督管理局告知其听证后5 日内提出","B":"若本案依法举行听证，由市安全监督管理局指定非本案调查人员主持听证","C":"若本案依法举行听证，则市安全监督管理局调查人员以及万盛公司有关人员可以亲自参加听证，市安全监督管理局和万盛公司也可以各自委托1 ～2 人代理参加听证","D":"作出该罚款处罚决定前，市安全监督管理局应事先向万盛公司告知其违法的事实、理由、处罚依据及依法享有的权利","E":"市安全监督管理局一般应当自立案之日起90 日内作出行政处罚决定"},"answer":"ABDE","explanation":"本题考查行政处罚的听证程序。选项A当选，行政处罚中，当事 人要求听证的，应在行政机关告知后5日内提出。选项B当选，听证应当由行政机关指定非本 案调查人员主持。选项C不当选，行政处罚听证中，当事人可以亲自参加听证，也可以委托 1至2人代理参加听证。行政机关不能委托代理人参加听证。选项D当选，行政机关在依法作 出行政处罚决定之前，应当事先告知当事人作出行政处罚决定的事实、理由及法律依据，并 告知当事人依法享有的权利。选项E当选，行政机关应当自行政处罚案件立案之日起90日内 作出行政处罚决定。法律、法规、规章另有规定的，从其规定。"},{"sub_num":4,"text":"根据《行政许可法》的规定，若省建设厅查明万盛公司实际上不符合安全生产许可条件，其安全生产许可证系通过贿赂、欺骗手段取得，则下列关于省建设厅依法采取措施及处理理由 的说法中，正确的有（    ）。","options":{"A":"应当变更该许可，理由是客观情况发生重大变化","B":"应当撤回该许可，理由是万盛公司通过贿赂和欺骗手段违法取得该许可","C":"应当撤销该许可，理由是万盛公司通过贿赂和欺骗手段违法取得该许可","D":"应当撤销该许可，但是对万盛公司基于该许可实施的可获得利益应给予适当补偿，理由是信赖保护原则","E":"是否撤销该许可，由省建设厅根据具体情况进行裁量决定，理由是省建设厅基于过错违法授予许可"},"answer":"C","explanation":"本题考查行政许可的撤销。选项ABDE不当选、选项C当选，被许可 人以欺骗、贿赂等不正当手段取得许可的，应当予以撤销，撤销后，不应给予赔偿或补偿。 提示：行政许可所依据的法律、法规、规章修改或者废止，或者准予行政许可所依据的客观 情况发生重大变化的，适用行政许可的撤回。由此给相对人造成的损失应当给予补偿。"}],"options":{},"answer":"","explanation":""},{"id":"6.32","chapter":6,"chapter_name":"行政诉讼法律制度","type":"综合","question":"陈某和谢某住对门，素有矛盾。某日夜里，陈某酒后猛撞谢某家屋门，持械闯入谢某家并猛砸谢某家电器等物品，谢某夫妇上前阻止，双方发生推搡，此时，隔壁邻居张某也被惊醒，并去谢 某家劝阻双方。谢某夫妇当即报案，县公安局派民警姜某、石某立即进入现场调查，对现场物品、 痕迹等进行拍照，制作现场笔录，调取谢某儿子（12岁）用手机记录的陈某猛砸谢某家物品的录音 资料，向陈某邻居张某了解事发起因和过程，并请县价格鉴证中心作出价格鉴定意见，之后县公安 局决定对陈某作出行政拘留10日的处罚。 陈某对拘留决定不服，向法院起诉。法院依法审理，县公安局向法院提交了照片、现场笔录、 鉴定意见以及录音资料，陈某要求隔壁邻居张某作证。法院审理期间认定，张某的相关证言系推断 性证言。","sub_questions":[{"sub_num":1,"text":"根据《行政诉讼法》的规定，本案中可以作为诉讼证据使用的有（    ）。","options":{"A":"陈某向法院当庭所作的真实陈述","B":"物品被砸坏的照片","C":"谢某儿子的录音证据","D":"县价格鉴证中心所作价格鉴定意见","E":"隔壁邻居张某所作的推断性证言"},"answer":"ABCD","explanation":"本题考查行政诉讼的证据。行政诉讼的证据包括：书证、物 证、视听资料、电子数据、证人证言、当事人的陈述、鉴定意见（选项D当选）、勘验笔 录、现场笔录。选项A当选，当事人陈某向法院所作陈述属于当事人陈述。选项B当选，用物 品的外形、特征、质量等证明待证事实的一部分或全部的，称为物证，被砸坏的物品的照片 属于物证。选项C当选，谢某儿子用手机录下的录音证据，属于电子数据。选项E不当选，证 人对案件事实进行的描述属于证人证言，但是证人所作的“评论性”“推断性”证言不能作 为证据。"},{"sub_num":2,"text":"下列关于诉讼证据的说法中，正确的有（    ）。","options":{"A":"县公安局提交的鉴定意见应有县价格鉴证中心盖章和鉴定人签名","B":"陈某在诉讼中可以对现场笔录的合法性提出异议","C":"现场笔录可以由公安局事后补作，当事人签名或盖章即可","D":"若县公安局提交的现场笔录没有当事人之外的其他在场人签名，则没有法律效力","E":"若陈某当时拒绝在现场笔录上签名，县公安局执法人员写明原因，法院仍应认定现场笔录没有法律效力"},"answer":"AB","explanation":"本题考查行政诉讼的证据。选项A当选，被告向人民法院提供的在 行政程序中采用的鉴定意见，应当载明委托人和委托鉴定的事项、向鉴定部门提交的相关 材料、鉴定的依据和使用的科学技术手段、鉴定部门和鉴定人鉴定资格的说明，并应有鉴定 人的签名和鉴定部门的盖章。选项B当选，当事人提供的证据需在法庭上出示，并由当事人 对质辨认和核实。现场笔录作为法定证据之一，陈某可以对其合法性提出异议。选项C不当 选，现场笔录应当在现场制作，不能事后补作，并应当由当事人签名或盖章。选项DE不当 选，被告向人民法院提供的现场笔录，应当载明时间、地点和事件等内容，并由执法人员和 当事人签名。当事人拒绝签名或者不能签名的，应当注明原因；有其他人在现场的，可由其 他人签名。法律、法规和规章对现场笔录的制作形式另有规定的，从其规定。在一般情况 下，对于现场笔录没有当事人签名的，不能简单地认定该笔录不具有法律效力。"},{"sub_num":3,"text":"下列关于本案证据收集与补充、证据提供、证据调取与审核的说法中，符合《行政诉讼法》规定的有（    ）。","options":{"A":"当事人申请调查与待证事实无关联的证据，人民法院不予准许","B":"法院不得为证明公安局处罚决定的合法性调取被告在作出处罚时未收集的证据","C":"诉讼期间，县公安局不得自行向原告和证人收集证据，但作为其诉讼代理律师可以","D":"陈某可以提供证明县公安局处罚决定违法的证据，其提供的证据若不成立，则县公安局证明处罚决定合法性的举证责任依法免除","E":"若陈某提出了在行政处罚程序中没有提出的理由或证据，经法院准许，县公安局可以补充相关证据"},"answer":"ABE","explanation":"本题考查行政诉讼的举证规则。选项A当选，当事人申请调查收 集证据，但该证据与待证事实无关联、对证明待证事实无意义或者其他无调查收集必要的， 人民法院不予准许。选项B当选，人民法院在调取证据时，不得为证明被诉行政行为的合法 性而调取被告在作出行政行为时未收集的证据。选项C不当选，行政机关向法院提交的证据 原则上应当在作出行政行为之前收集。一旦进入诉讼程序，被告及其诉讼代理人（包括被告 代理律师）就不得自行向原告、第三人和证人收集证据。选项D不当选，原告可以提供证明 行政行为违法的证据。原告提供的证据不成立的，不免除被告的举证责任。选项E当选，原 告陈某在诉讼程序中，提出了其在行政处理程序中没有提出的理由或者证据的，经人民法院 准许，被告县公安局可以补充相关的证据。 第六章  行政诉讼法律制度| 答案与解析"},{"sub_num":4,"text":"若本案中县公安局对陈某作出的处罚决定是罚款1 000 元，陈某不服，向法院起诉，则下列关于适用简易程序的说法中，正确的有（    ）。","options":{"A":"若一审法院适用简易程序审理此案，则应由审判员一人独任审理，并应当当庭宣判","B":"若一审法院认为本案事实清楚，权利义务关系明确，争议不大，则可以适用简易程序审理","C":"本案中，被告若同意适用简易程序，一审法院可以适用简易程序审理","D":"二审法院审理本案也可以适用简易程序","E":"若一审法院适用简易程序审理此案，则应在立案之日起15 日内审结"},"answer":"B","explanation":"本题考查行政诉讼的简易程序。选项AE不当选，适用简易程序审 理的行政案件，由审判员一人独任审理，并应当在立案之日起45日内审结，并不要求当庭 宣判。选项B当选，人民法院审理下列第一审行政案件，认为事实清楚、权利义务关系明 确、争议不大的，可以适用简易程序：①被诉行政行为是依法当场作出的；②案件涉及款额 2 000元以下的；③属于政府信息公开案件的。选项C不当选，当事人各方同意适用简易程序 的，可以适用简易程序。仅有被告一方同意，不能适用简易程序。选项D不当选，简易程序 是第一审案件的程序，二审程序和审判监督程序均不能适用简易程序。 第七章  民法总论 答案与解析 一、单项选择题"}],"options":{},"answer":"","explanation":""},{"id":"7.1","chapter":7,"chapter_name":"民法总论","type":"单选","question":"根据《民法典》的规定，“受害人和行为人对损害的发生都没有过错的，依照法律的规定由 双方分担损失。”这句话体现民法的基本原则是（　）。","options":{"A":"公平原则","B":"平等原则","C":"诚实信用原则","D":"辩论原则"},"answer":"A","explanation":"本题考查民法的基本原则。选项A当选，公平原则，是指民事主体从事民 事活动及法官审理民事纠纷案件时，应秉持公平理念，公正、合理地确定各方的权利和义 务，合理分配相应民事责任的原则。题述情形是《民法典》1186条公平责任的原文。"},{"id":"7.2","chapter":7,"chapter_name":"民法总论","type":"单选","question":"根据民法相关理论，下列行为中，属于民事法律行为的是（　）。","options":{"A":"先占","B":"建造房屋","C":"代理行为","D":"拾得遗失物"},"answer":"C","explanation":"本题考查民事法律行为和事实行为的区分。法律行为以意思表示为核心 要素，旨在按照行为人意思表示的内容发生相应民法效果的表意行为；事实行为（非表意 行为）无须表示内心意思即依法发生民法效果的行为，如建造房屋（选项B不当选）、创作 作品、拾得遗失物（选项D不当选）、先占（选项A不当选）、无因管理、侵权行为等。选 项C当选，代理行为属于民事法律行为，在代理过程中，需要代理人向第三人作出独立意思 表示，并根据其意思表示不同产生不同法律效果。"},{"id":"7.3","chapter":7,"chapter_name":"民法总论","type":"单选","question":"根据民法相关理论，下列法律事实中，属于民事法律行为的是（　）。","options":{"A":"甲宽恕曾经遗弃自己的儿子丁","B":"丁免除其债务人的5 万元货款债务","C":"丙将债权让与的事实通知其债务人","D":"乙催告其债务人按时还款"},"answer":"B","explanation":"本题考查民事法律行为的界定。选项A不当选，情感表示即行为人感情的 表达，如被继承人对继承人的宽恕，属于准法律行为，是由法律直接规定民法效果的表意 行为。选项C不当选，观念通知即行为人对客观事实的告知，如承诺迟到通知、债权让与通 知，属于准法律行为，是由法律直接规定民法效果的表意行为。选项D不当选，意思通知即 行为人内心意愿的告知，如要约拒绝、履行催告，属于准法律行为，是由法律直接规定民法 效果的表意行为。选项B当选，对于免除债务行为，需要由债权人向债务人作出免除的意思 表示后，原有的债权债务关系即全部或部分消灭，属于单方民事法律行为。"},{"id":"7.4","chapter":7,"chapter_name":"民法总论","type":"单选","question":"甲因病去世，留有遗嘱。甲的儿子乙依照甲的遗嘱继承了甲的一套房产。乙取得该套房产所 有权的法律原因属于（　）。","options":{"A":"法律事实构成","B":"事实行为","C":"法律行为","D":"事件"},"answer":"A","explanation":"本题考查民事法律事实构成。选项A当选，法律事实构成，是指须同时具 备方能引起某一民事法律关系发生、变更或者消灭的几个法律事实的总和。如有效遗嘱和遗 嘱人死亡两个法律事实结合，即为引起遗嘱继承关系发生的法律事实构成。有效遗嘱和遗嘱 人死亡两个法律事实结合，即为引起遗嘱继承关系发生的法律事实构成。"},{"id":"7.5","chapter":7,"chapter_name":"民法总论","type":"单选","question":"下列关于自然人民事权利能力与民事行为能力的说法中，正确的是（　）。","options":{"A":"自然人的民事权利能力与民事行为能力同时产生","B":"自然人的民事权利能力与民事行为能力同时消灭","C":"自然人的民事权利能力始于出生，终于死亡","D":"自然人之间民事行为能力人人平等，不存在差异"},"answer":"C","explanation":"本题考查自然人的民事权利能力和民事行为能力的辨析。选项AB不当选， 自然人的民事权利能力是民事行为能力的前提，即二者并非同时产生与消灭。选项C当选， 自然人的民事权利能力始于出生，终于死亡。选项D不当选，自然人的民事权利能力一律平 等，而民事行为能力则根据年龄以及精神智力等不同而有所差异，并非人人平等。"},{"id":"7.6","chapter":7,"chapter_name":"民法总论","type":"单选","question":"根据《民法典》的规定，下列有关宣告失踪和宣告死亡的说法中，正确的是（　）。","options":{"A":"张某因意外事件下落不明，其死亡日期为人民法院判决之日","B":"李某既被申请宣告失踪又被申请宣告死亡的，若符合宣告死亡条件，法院应宣告死亡","C":"孙某被宣告死亡，在此期间，其子女被依法收养，则孙某可以以未经本人同意为由主张收养关系无效","D":"陈某被宣告死亡，后死亡宣告被撤销，即使配偶向婚姻登记机关书面声明不愿意恢复婚姻关系，陈某与其原配偶的婚姻关系亦自行恢复"},"answer":"B","explanation":"本题考查宣告失踪与宣告死亡。选项A不当选，因意外事件下落不明，其 因意外事件下落不明，其 死亡日期为意外事件发生之日，而非人民法院判决之日 死亡日期为意外事件发生之日，而非人民法院判决之日。选项B当选，对同一自然人，有的 对同一自然人，有的 利害关系人申请宣告死亡，有的利害关系人申请宣告失踪，若符合宣告死亡条件，人民法 利害关系人申请宣告死亡，有的利害关系人申请宣告失踪，若符合宣告死亡条件，人民法 院应当宣告死亡 院应当宣告死亡。选项C不当选，自然人在宣告死亡期间，其子女被他人依法收养，不得以 自然人在宣告死亡期间，其子女被他人依法收养，不得以 未经本人同意为由主张收养关系无效 未经本人同意为由主张收养关系无效。选项D不当选，死亡宣告被撤销的，婚姻关系自撤销 死亡宣告被撤销的，婚姻关系自撤销 死亡宣告之日起自行恢复，但是，其配偶再婚或者向婚姻登记机关书面声明不愿意恢复的 死亡宣告之日起自行恢复，但是，其配偶再婚或者向婚姻登记机关书面声明不愿意恢复的 除外。"},{"id":"7.7","chapter":7,"chapter_name":"民法总论","type":"单选","question":"下列有关法人特征的说法中，正确的是（　）。","options":{"A":"法人与法定代表人共同承担民事责任","B":"法人民事权利能力受法人财产范围制约","C":"法人的财产属于法人与其出资人共有","D":"法人具有独立的人格"},"answer":"D","explanation":"本题考查法人的特征。选项AC不当选、选项D当选，法人拥有独立的财 产，具有独立的人格和独立承担民事责任的能力。选项B不当选，法人一经成立，法律即赋 予其民事权利能力和民事行为能力，使其取得享有民事权利和承担民事义务的法律资格，不 受法人财产的制约。"},{"id":"7.8","chapter":7,"chapter_name":"民法总论","type":"单选","question":"下列民事主体中，属于特别法人的是（　）。","options":{"A":"特殊的普通合伙企业","B":"民办非营利学校","C":"中国青少年发展基金会","D":"村民委员会"},"answer":"D","explanation":"本题考查特别法人。选项A不当选，特殊的普通合伙企业、有限合伙企 业、个人独资企业均属于非法人组织。选项BC不当选，中国青少年发展基金会和民办非营利 学校属于非营利法人。选项D当选，特别法人，是指机关法人、农村集体经济组织法人、城 镇农村的合作经济组织法人、基层群众性自治组织法人（村民委员会、居民委员会）。"},{"id":"7.9","chapter":7,"chapter_name":"民法总论","type":"单选","question":"根据《民法典》的规定，下列人格权中，自然人和非法人组织均享有的是（　）。","options":{"A":"名称权","B":"荣誉权","C":"隐私权","D":"肖像权"},"answer":"B","explanation":"本题考查民事权利的分类。选项B当选，自然人享有生命权、身体权、健 康权、姓名权、肖像权、名誉权、荣誉权、隐私权、婚姻自主权等权利；法人、非法人组织 享有名称权、名誉权和荣誉权。自然人和法人、非法人组织均享有的是名誉权、荣誉权。"},{"id":"7.10","chapter":7,"chapter_name":"民法总论","type":"单选","question":"甲擅自将乙委托其保管的一幅字画卖给了丙。事后，乙追认甲的行为有效。根据民事权利理 论，乙行使的权利属于（　）。","options":{"A":"支配权","B":"请求权","C":"抗辩权","D":"形成权"},"answer":"D","explanation":"本题考查民事权利的分类。选项D当选，甲未经乙同意擅自出卖乙的字 画，属于无权处分的情形，该合同效力待定。但经乙追认，即成为有效合同。追认权属于形 第七章  民法总论| 答案与解析 成权，仅凭乙单方意思表示即可改变原有合同性质。"},{"id":"7.11","chapter":7,"chapter_name":"民法总论","type":"单选","question":"我国《民法典》规定了承担民事责任的方式，其中不包括（　）。","options":{"A":"赔礼道歉","B":"消除危险","C":"暂扣许可证件","D":"修理、重作、更换"},"answer":"C","explanation":"本题考查民事责任的承担方式。选项C当选，暂扣许可证件属于行政处 罚的一种，是行政责任的承担方式，而不是民事责任的承担方式。民事责任承担方式主要 有：（1）停止侵害；（2）排除妨碍；（3）消除危险（选项B不当选）；（4）返还财产； （5）恢复原状；（6）修理、重作、更换（选项D不当选）；（7）继续履行；（8）赔偿损 失；（9）支付违约金；（10）消除影响、恢复名誉；（11）赔礼道歉（选项A不当选）。"},{"id":"7.12","chapter":7,"chapter_name":"民法总论","type":"单选","question":"下列关于意思表示生效时间的说法中，符合《民法典》规定的是（　）。","options":{"A":"以公告方式作出意思表示，公告到期时生效","B":"以对话方式作出的意思表示，到达相对人时生效","C":"以非对话方式作出的意思表示，相对人知道其内容时生效","D":"采用数据电文形式作出的意思表示，指定特定系统接收数据电文的，数据电文进入该特定系统时生效"},"answer":"D","explanation":"本题考查意思表示的生效时间。选项A不当选，以公告方式作出的意思表 示，公告发布时生效。选项B不当选，以对话方式作出的意思表示，相对人知道其内容时生 以对话方式作出的意思表示，相对人知道其内容时生 效。选项C不当选，以非对话方式作出的意思表示，到达相对人时生效 以非对话方式作出的意思表示，到达相对人时生效。选项D当选，以非对 话方式作出的采用数据电文形式的意思表示，相对人指定特定系统接收数据电文的，该数据 相对人指定特定系统接收数据电文的，该数据 电文进入该特定系统时生效；未指定特定系统的，相对人知道或者应当知道该数据电文进入 电文进入该特定系统时生效；未指定特定系统的，相对人知道或者应当知道该数据电文进入 其系统时 其系统时生效。"},{"id":"7.13","chapter":7,"chapter_name":"民法总论","type":"单选","question":"在某音乐大赛开始前，张某对歌手李某承诺：如果你在本场音乐赛上获得最佳歌手奖，我将 赠送你一辆价值200万元的跑车。根据《民法典》及相关规定，上述法律事实在张某和李某 之间产生了一项（　）。","options":{"A":"附期限法律行为","B":"有偿法律行为","C":"实践性法律行为","D":"附条件法律行为"},"answer":"D","explanation":"本题考查附条件法律行为的界定。选项D当选，附条件民事法律行为，是 指包含条件附款的法律行为。条件，是指由行为人选定、用以控制民事法律行为效果效力 发生或者消灭的、成就与否并不确定的将来事实。本场音乐大赛的结果在赛前是不确定的事 情，因此属于附条件的民事法律行为。"},{"id":"7.14","chapter":7,"chapter_name":"民法总论","type":"单选","question":"下列民事法律行为中，属于附期限法律行为的是（　）。","options":{"A":"甲对乙承诺，如果明年乙获得博士学位，甲即赠给乙汽车一辆","B":"甲、乙约定，如果明天下雪，则甲将其滑雪板租给乙","C":"甲、乙约定，若甲的儿子明年大学毕业回到本市工作，则乙将承租的房屋退还给甲","D":"甲对乙承诺，下次下雨时送给乙一把折叠雨伞"},"answer":"D","explanation":"本题考查附期限法律行为的界定。附条件民事法律行为中所附条件为将 附条件民事法律行为中所附条件为将 来发生的不确定的事实，附期限的民事法律行为中所附期限一定会到来 来发生的不确定的事实，附期限的民事法律行为中所附期限一定会到来。选项ABC不当选， “明年乙能否获得博士学位”“明天是否下雪”“儿子大学毕业是否回本市”都是将来发生 的不确定的事实，租赁、赠与属于法律行为，其所述情形属于附条件的民事法律行为。选 项D当选，“下次下雨时”虽不确定具体哪一天发生，但一定会发生，赠与属于民事法律行 为，故该行为属于附期限法律行为。"},{"id":"7.15","chapter":7,"chapter_name":"民法总论","type":"单选","question":"根据《民法典》的规定，下列行为中，属于可撤销民事法律行为的是（　）。","options":{"A":"甲将朋友托其保管的相机卖给他人","B":"乙用其盗取的某公司空白合同与他人签订合同"},"answer":"C","explanation":"本题考查可撤销民事法律行为。选项A不当选，甲将朋友托其保管的相机 卖给他人，属于无权处分，该行为属效力待定的民事法律行为。选项B不当选，乙用其盗取 的某公司空白合同与他人签订合同，即没有代理权而实施代理行为（狭义无权代理），属 效力待定的民事法律行为。选项C当选，丙误将混纺面料当成纯毛面料高价购买，属于对标 的物的性质存在重大误解，基于重大误解实施的民事法律行为为可撤销民事法律行为。选 项D不当选，所述情形属于订立赠与合同，赠与人在赠与财产的权利转移之前可以撤销赠 与，但不属于可撤销的民事法律行为。 提示：利用盗取的公章以及空白合同等，不属于“有代理权的表象”，不能构成表见代理。"},{"id":"7.16","chapter":7,"chapter_name":"民法总论","type":"单选","question":"根据《民法典》的规定，下列关于撤销权除斥期间的说法中，正确的是（　）。","options":{"A":"因受欺诈实施的民事法律行为，撤销权除斥期间为90 日","B":"因受胁迫实施的民事法律行为，撤销权除斥期间为1 年","C":"因重大误解实施的民事法律行为，撤销权除斥期间为1 年","D":"撤销权除斥期间自可撤销民事法律行为发生之日起算"},"answer":"B","explanation":"本题考查可撤销民事法律行为。可撤销民事法律行为中，有下列情形之 一的，撤销权消灭：（1）当事人自知道或者应当知道撤销事由之日起1年内、重大误解的 当事人自知道或者应当知道撤销事由之日起90日内没有行使撤销权（选项ACD不当选）； （2）当事人受胁迫，自胁迫行为终止之日起1年内没有行使撤销权（选项B当选）；（3）当 事人知道撤销事由后明确表示或者以自己的行为表明放弃撤销权；（4）当事人自民事法律 行为发生之日起5年内没有行使撤销权。"},{"id":"7.17","chapter":7,"chapter_name":"民法总论","type":"单选","question":"根据《民法典》规定，不属于无效民事法律行为的是（　）。","options":{"A":"以虚假的意思表示隐藏的民事法律行为","B":"违背公序良俗的民事法律行为","C":"以虚假的意思表示实施的民事法律行为","D":"无民事行为能力人实施的民事法律行为"},"answer":"A","explanation":"本题考查无效民事法律行为的界定。选项A当选，以虚假的意思表示隐藏 的民事法律行为，需要根据行为内容确定该行为的效力。无效民事法律行为包括：（1）无 民事行为能力人实施的民事法律行为（选项D不当选）；（2）行为人与相对人恶意串通， 损害他人合法权益的民事法律行为；（3）行为人与相对人以虚假的意思表示实施的民事法 律行为（选项C不当选）；（4）违反法律、行政法规的强制性规定的民事法律行为，但该 强制性规定不导致该民事法律行为无效的除外；（5）违背公序良俗的民事法律行为（选 项B不当选）。"},{"id":"7.18","chapter":7,"chapter_name":"民法总论","type":"单选","question":"根据《民法典》的规定，下列关于甲、乙之间订立的合同情形属于效力待定的是（　）。","options":{"A":"甲在醉酒但能辨认自己行为的情况下将自己的摩托车低价卖给乙","B":"甲将汽车以15 万元的价格出卖给16 岁的乙","C":"甲将其一处正在出租的房产赠送给15 岁的乙","D":"甲将价值16 万元的汽车作为生日礼物赠送给7 岁的乙"},"answer":"B","explanation":"本题考查民事法律行为的效力。选项A不当选，其所述情形属于有效的民 事法律行为。选项B当选，16岁的丙为限制民事行为能力人，限制民事行为能力人实施的与 其年龄、智力、精神健康状况不相适应的、有待其法定代理人同意或者追认的法律行为属于 效力待定民事法律行为。选项C不当选，15岁的乙是限制民事行为能力人，限制民事行为能 力人签订的纯获利益的合同是有效的，而不是效力待定。选项D不当选，7岁的乙为无民事行 为能力人，无民事行为能力人实施的民事法律行为属于无效的民事法律行为。 问题：限制民事行为能力人什么情形下订立的合同是有效的？ 解答：（1）限制民事行为能力人实施的纯获利益的民事法律行为有效 限制民事行为能力人实施的纯获利益的民事法律行为有效。纯获利益的 民事法律行为是指无须支付对价或承担任何义务即可获得利益的行为 无须支付对价或承担任何义务即可获得利益的行为，如： ‌接受赠与、‌免除债务。 提示：无民事行为能力人实施的纯获利益的法律行为 无民事行为能力人实施的纯获利益的法律行为无效 无效。 （2）限制民事行为能力人独立实施与其年龄、智力相适应的民事法律行为 有效。 （3）限制民事行为能力人实施的其他民事法律行为由其法定代理人代理或者 征得法定代理人的同意或追认的有效。"},{"id":"7.19","chapter":7,"chapter_name":"民法总论","type":"单选","question":"根据《民法典》的规定，代理可分为委托代理、职务代理和法定代理。下列各项中，仅为法 定代理特有的是（　）。","options":{"A":"需要出示授权书的代理","B":"以未成年人为被代理人的代理","C":"符合法律规定的代理","D":"无须被代理人授权，依法律规定直接确定的代理"},"answer":"D","explanation":"本题考查代理的分类。选项A不当选、选项D当选，委托代理中，需要经 过被代理人的授权。授权行为可以采用口头或书面形式。法定代理是基于法律规定直接取 得代理权所实施的代理，无须被代理人授权。选项B不当选，以未成年人为被代理人的代理 行为多见于法定代理，但委托代理中，亦可以未成年人为被代理人。选项C不当选，委托代 理、法定代理和职务代理都是符合法律规定的代理，该情形并非仅限于法定代理。"},{"id":"7.20","chapter":7,"chapter_name":"民法总论","type":"单选","question":"根据《民法典》的规定，下列关于委托代理的说法中，不正确的是（　）。","options":{"A":"委托代理中的授权行为应当采用书面形式","B":"委托代理中的授权行为是有相对人的单方法律行为","C":"法人对执行其工作任务的人员职权范围的限制，不得对抗善意相对人","D":"结婚不得通过代理实施"},"answer":"A","explanation":"本题考查委托代理。选项A当选、选项B不当选，在委托代理中，代理权 来自被代理人的授权。授权行为 授权行为系有相对人的单方 单方法律行为、不要式 不要式法律行为。选项C不当 选，法人对执行其工作任务的人员职权范围的限制，不得对抗善意相对人。选项D不当选， 结婚、收养、立遗嘱等行为不得通过代理实施。"},{"id":"7.21","chapter":7,"chapter_name":"民法总论","type":"单选","question":"下列债权请求权中，法院不支持当事人提出诉讼时效抗辩的是（　）。","options":{"A":"身体受到伤害的损害赔偿请求权","B":"贷款本金和利息的偿付请求权","C":"存款本金和利息的支付请求权","D":"股息和红利的支付请求权"},"answer":"C","explanation":"本题考查不适用诉讼时效的情形。下列请求权不适用诉讼时效的规定： （1）停止侵害、排除妨碍、消除危险请求权；（2）不动产物权和登记的动产物权的权利人 第七章  民法总论| 答案与解析 的返还财产请求权；（3）支付抚养费、赡养费或者扶养费请求权；（4）支付存款本金及利 息请求权（选项C当选）；（5）兑付国债、金融债券以及向不特定对象发行的企业债券本 息请求权；（6）基于投资关系产生的缴付出资请求权；（7）依法不适用诉讼时效规定的债 权请求权。选项ABD不当选，损害赔偿请求权、贷款本金和利息的偿付请求权以及股息和红 利的支付请求权应适用诉讼时效的规定。"},{"id":"7.22","chapter":7,"chapter_name":"民法总论","type":"单选","question":"下列有关诉讼时效期间的说法中，正确的是（　）。","options":{"A":"商品保质期属于诉讼时效期间","B":"诉讼时效期间届满后，义务人已经自愿履行的，不得请求返还","C":"可撤销民事法律行为中撤销权人的撤销权的行使期限属于诉讼时效期间","D":"合同当事人的法定解除权的行使期限属于诉讼时效期间"},"answer":"B","explanation":"本题考查诉讼时效期间的性质。选项A不当选，诉讼时效期间是债权人行 使权利的法定期间，商品保质期不属于诉讼时效期间。选项B当选，诉讼时效期间届满后， 诉讼时效期间届满后， 义务人同意履行的，不得以诉讼时效期间届满为由抗辩；义务人已经自愿履行的，不得请求 义务人同意履行的，不得以诉讼时效期间届满为由抗辩；义务人已经自愿履行的，不得请求 返还 返还。选项CD不当选，撤销权未在法定期间内行使的，撤销权消灭，合同当事人未在法定期 间内行使解除权的，解除权消灭。该法定期间为除斥期间，并非诉讼时效期间。"},{"id":"7.23","chapter":7,"chapter_name":"民法总论","type":"单选","question":"诉讼时效期间与除斥期间是民法上两项权利行使的限制期间，下列关于二者区别的说法中，正确的是（　）。","options":{"A":"诉讼时效期间届满则实体权利消灭，除斥期间届满则义务人产生抗辩权","B":"诉讼时效期间为不变期间，除斥期间为可变期间","C":"诉讼时效期间适用于请求权，除斥期间适用于形成权","D":"除斥期间适用中止、中断和延长，诉讼时效期间并不适用"},"answer":"C","explanation":"本题考查诉讼时效期间和除斥期间的辨析。选项A不当选，诉讼时效期间 诉讼时效期间 届满，发生义务人永久性抗辩权，而除斥期间届满，实体权利消灭 届满，发生义务人永久性抗辩权，而除斥期间届满，实体权利消灭。选项BD不当选，诉讼时 效期间为可变期间，适用中止、中断和延长的规定。除斥期间为不可变期间，不适用中止、 中断和延长的规定。选项C当选，诉讼时效期间适用于请求权，除斥期间适用于形成权。 问题：如何区分除斥期间与诉讼时效期间？ 解答：除斥期间和诉讼时效均是指时间的经过，可以引起法律关系的变更。 除斥期间像是“权利的倒计时”。如果权利人在这个期间内未行使其权利， 倒计时结束，这个权利就会从这个世界上直接消灭，不复存在。除斥期间保 护的是形成权，如撤销权、解除权等。 诉讼时效更像是一个“权利的保质期”，主要适用于请求权。在诉讼时效期 间内，权利是“新鲜”的，可以得到法律的保护；但如果超过诉讼时效期 间，即保质期过了之后，权利虽然仍然存在，但已经“变质”，权利人有可 能失去国家强制力的保护，不享有胜诉权。 二、多项选择题"},{"id":"7.24","chapter":7,"chapter_name":"民法总论","type":"多选","question":"下列《民法典》的规定中，能够体现绿色原则的有（　）。","options":{"A":"第346 条  设立建设用地使用权，应当符合节约资源、保护生态环境的要求，遵守法律、行政法规关于土地用途的规定，不得损害已经设立的用益物权","B":"第509 条第3 款  当事人在履行合同过程中，应当避免浪费资源、污染环境和破坏生态","C":"第625 条  依照法律、行政法规的规定或者按照当事人的约定，标的物在有效使用年限届满后应予回收的，出卖人负有自行或者委托第三人对标的物予以回收的义务","D":"第666 条  赠与人的经济状况显著恶化，严重影响其生产经营或者家庭生活的，可以不再履行赠与义务","E":"第1186 条受害人和行为人对损害的发生都没有过错的，依照法律的规定由双方分担损失"},"answer":"ABC","explanation":"本题考查民法的基本原则。选项ABC当选，均体现生态环境保护原则， 也称“绿色原则”，是指民事主体从事民事活动，应当有利于节约有限资源、保护生态环境 的原则。选项DE不当选，均体现的是公平原则。"},{"id":"7.25","chapter":7,"chapter_name":"民法总论","type":"多选","question":"根据《民法典》的规定，下列民事法律事实中，属于准法律行为的有（　）。","options":{"A":"债权让与通知","B":"订立遗嘱","C":"建造房屋","D":"无因管理","E":"被继承人对继承人的宽恕"},"answer":"AE","explanation":"本题考查准法律行为。选项AE当选，准法律行为，是指由法律直接规定 民法效果的表意行为，包括意思通知、观念通知和情感表示。意思通知，是指行为人内心意 愿的告知。如要约拒绝、履行催告；观念通知，是指行为人对客观事实的告知。如承诺迟到 通知、债权让与通知；情感表示，是指行为人感情的表达。如被继承人对继承人的宽恕。选 项B不当选，法律行为，是指以意思表示为核心要素，旨在按照行为人意思表示的内容发生 相应民法效果的表意行为，如订立合同、立遗嘱。选项CD不当选，非表意行为，即事实行 为，是指无须表示内心意思即依法发生民法效果的行为，如建造房屋、创作作品、拾得遗失 物、先占、无因管理、侵权行为等。"},{"id":"7.26","chapter":7,"chapter_name":"民法总论","type":"多选","question":"根据《民法典》的规定，法人成立须具备的条件有（　）。","options":{"A":"有自己的名称、组织机构和住所","B":"有自己的财产或者经费","C":"有自己的分支机构","D":"能独立承担民事责任","E":"依法成立"},"answer":"ABE","explanation":"本题考查法人的成立条件。法人成立的条件包括：（1）依法成立（选 项E当选）；（2）有自己的财产或者经费（选项B当选）；（3）有自己的名称、组织机构和 住所（选项A当选）。选项C不当选，法人是否有分支机构不作为法人成立的条件。选项D不 当选，法人独立承担民事责任属于法人的特征。"},{"id":"7.27","chapter":7,"chapter_name":"民法总论","type":"多选","question":"根据《民法典》及相关规定，下列关于法人成立、法人能力及责任承担的说法中，正确的有（　）。","options":{"A":"法人成立必须经有关机关批准","B":"法人的民事权利能力和民事行为能力，自法人成立时产生","C":"法人以其全部财产独立承担民事责任","D":"法人应对法定代表人的职务侵权行为与法定代表人连带承担民事责任","E":"法人须承受法定代表人以法人名义所从事民事活动的法律后果"},"answer":"BCE","explanation":"本题考查法人。选项A不当选，法律、行政法规规定设立法人须经有关 机关批准的，依照其规定，并非所有法人均必须经有关机关批准 并非所有法人均必须经有关机关批准。选项D不当选，法定代表 人因执行职务造成他人损害的，由法人承担民事责任。法人承担民事责任后，依照法律或者 法人章程的规定，可以向有过错的法定代表人追偿。"},{"id":"7.28","chapter":7,"chapter_name":"民法总论","type":"多选","question":"下列关于民事权利属性的说法中，正确的有（　）。","options":{"A":"债权属于请求权","B":"物权属于相对权","C":"人身权属于对人权","D":"著作权属于支配权","E":"追认权属于形成权"},"answer":"ADE","explanation":"本题考查民事权利的分类。选项A当选，债权属于财产权、请求权、相 对权、对人权、非专属权。选项B不当选，物权属于财产权、支配权、绝对权、对世权、非 专属权。选项C不当选，人身权属于支配权、绝对权、对世权、专属权。选项D当选，著作权 属于支配权、绝对权、对世权。选项E当选，形成权中包括撤销权、解除权、抵销权、选择 权、同意权、承认权、追认权等。"},{"id":"7.29","chapter":7,"chapter_name":"民法总论","type":"多选","question":"下列民事法律事实中，属于双方法律行为的有（　）。","options":{"A":"侵权行为","B":"买卖合同","C":"遗嘱行为","D":"赠与合同","E":"无因管理"},"answer":"BD","explanation":"本题考查民事法律行为的分类。选项AE不当选，侵权行为和无因管理是 事实行为，不是法律行为。选项BD当选，双方法律行为要求双方行为人内容相向的意思表示 达成一致方可成立，如买卖合同需要买卖双方意思表示达成一致才可成立，赠与行为需要赠 与人与受赠人意思表示达成一致才可成立。选项C不当选，遗嘱行为仅由行为人一方的意思 表示构成即可，属于单方民事法律行为。"},{"id":"7.30","chapter":7,"chapter_name":"民法总论","type":"多选","question":"根据《民法典》及相关规定，下列所述民事法律行为确定不生效的有（　）。","options":{"A":"附生效期限的法律行为","B":"法律规定必须经批准方能生效的法律行为，终未获得批准","C":"附生效条件的法律行为，已确定所附条件不会成就","D":"违背公序良俗的行为","E":"一方以欺诈手段，使对方在违背真实意思的情况下实施的民事法律行为"},"answer":"BC","explanation":"本题考查尚未完全生效民事法律行为。尚未完全生效民事法律行为， 若其法定或者约定的特别生效要件确定不能成就，则其即转化为“确定不生效民事法律行 为”。前者如法律、行政法规规定须办理批准等手续方能生效的民事法律行为，终未获批 准；后者如附停止条件的民事法律行为，所附停止条件确定不能成就。选项A不当选，附生 效期限的法律行为的生效要件是所附期限届至，因期限将来确定到来，附生效期限的法律 行为确定生效。选项B当选，法律规定须经批准方能生效的法律行为，终未获批准的，确定 不生效。选项C当选，附生效条件的民事法律行为，自条件成就时生效，已确定条件不会成 就，附生效条件的法律行为确定不生效。选项D不当选，违背公序良俗的民事法律行为无 效，无效法律行为从一开始就没有法律效力，自始无效。选项E不当选，一方以欺诈手段， 使对方在违背真实意思的情况下实施的民事法律行为属于可撤销的民事法律行为，可撤销民 事法律行为在被撤销前为生效民事法律行为。"},{"id":"7.31","chapter":7,"chapter_name":"民法总论","type":"多选","question":"根据《民法典》及相关规定，下列法律行为中，可因重大误解而请求撤销的有（　）。","options":{"A":"甲误将真画当成赝品而低价出售","B":"乙误将单价1 800 元的商品以180 元的价格售出","C":"丙不知女友已与他人结婚而到商场购买订婚钻戒","D":"丁误认某人为救命恩人而给其5 000 元以表谢意","E":"戊误以为自己能分到公寓房而按公寓房面积到商场购买地毯"},"answer":"ABD","explanation":"本题考查可撤销的民事法律行为。所谓重大误解是指行为人对行为的 性质、对方当事人或者标的物的品种、质量、规格和数量等产生错误认识，按照通常理解如 果不发生该错误认识行为人就不会作出相应意思表示的，可以认定为重大误解。选项ABD当 选，将真画当成赝品、将1 800元的商品错当成180元的商品属于对标的物的错误认识，误认 某人为救命恩人，属于对对方当事人的错误认识，上述合同均可基于重大误解而撤销。选 第七章  民法总论| 答案与解析 项CE不当选，对购买动机的误解不属于此处的重大误解。不知女友已与他人结婚、误以为自 己能分到公寓等情形属于对动机的错误认识，因此订立的合同不能以重大误解为由撤销。"},{"id":"7.32","chapter":7,"chapter_name":"民法总论","type":"多选","question":"下列行为中，属于无效民事法律行为的有（　）。","options":{"A":"代理人超越代理权限订立的合同","B":"违背公序良俗的民事法律行为","C":"恶意串通损害第三人利益的民事行为","D":"基于重大误解而订立的合同","E":"处分权欠缺的民事行为"},"answer":"BC","explanation":"本题考查无效的民事法律行为的界定。选项A不当选，代理人超越代理 权限订立的合同属于效力待定的民事法律行为。无效的民事法律行为包括：（1）无民事行 为能力人实施的民事法律行为；（2）行为人与相对人恶意串通，损害他人合法权益的民事 法律行为（选项C当选）；（3）行为人与相对人以虚假的意思表示实施的民事法律行为； （4）违反法律、行政法规的强制性规定的民事法律行为，但该强制性规定不导致该民事法 律行为无效的除外；（5）违背公序良俗的民事法律行为（选项B当选）。选项D不当选，基 于重大误解而订立的合同属于可撤销的民事法律行为。选项E不当选，处分权欠缺的民事行 为即为无权处分，无权处分属于效力待定的民事法律行为。"},{"id":"7.33","chapter":7,"chapter_name":"民法总论","type":"多选","question":"根据《民法典》的规定，下列属于效力待定民事法律行为的有（　）。","options":{"A":"因重大误解实施的民事法律行为","B":"无权处分行为","C":"债务承担","D":"13 岁的小王擅自用妈妈的微信充值游戏1 万元","E":"为冲抵成本，签订的虚开增值税专用发票协议"},"answer":"BCD","explanation":"本题考查效力待定民事法律行为。选项A不当选，因重大误解实施的 民事法律行为属于可撤销民事法律行为。效力待定民事法律行为包括：（1）无权处分行为 （选项B当选）；（2）债务承担（选项C当选）；（3）狭义无权代理；（4）限制民事行为 能力人实施的与其年龄、智力、精神健康状况不相适应的、有待其法定代理人同意或者追认 的民事法律行为（选项D当选）。选项E不当选，因违反法律规定而无效。"},{"id":"7.34","chapter":7,"chapter_name":"民法总论","type":"多选","question":"下列事由中，能够引起诉讼时效中止的有（　）。","options":{"A":"债权人提起代位权诉讼","B":"权利被侵害的无民事行为能力人的法定代理人丧失民事行为能力","C":"权利人被义务人控制，无法主张权利","D":"债务人请求延期履行","E":"债务人同意履行债务"},"answer":"BC","explanation":"本题考查诉讼时效的中止和中断。在诉讼时效期间的最后6个月内，因法 定障碍事由的发生使权利人无法行使请求权，从而暂时停止计算诉讼时效期间属于诉讼时效 期间的中止。具体包括：（1）不可抗力；（2）无民事行为能力人或者限制民事行为能力人 没有法定代理人，或者法定代理人死亡、丧失民事行为能力、丧失代理权（选项B当选）； （3）继承开始后未确定继承人或者遗产管理人；（4）权利人被义务人或者其他人控制（选 项C当选）；（5）其他导致权利人不能行使请求权的障碍。选项ADE不当选，其所述情形会 引起诉讼时效的中断。 问题：如何区分诉讼时效中止与中断的法定事由？ 解答：引起诉讼时效中止的事由主要是基于客观原因 客观原因。当在诉讼时效期间的最后6个 月内发生中止的事由，诉讼时效中止，即诉讼时效暂停计算。客观原因消 失，继续计算6 继续计算6个月 个月。 引起诉讼时效中断的事由主要是基于主观原因 主观原因，取决于某方当事人的行为， 诉讼时效中断即诉讼时效停止计算。主观原因消失，重新计算 重新计算3年 3年。"},{"id":"7.35","chapter":7,"chapter_name":"民法总论","type":"多选","question":"下列关于诉讼时效的说法中，正确的有（　）。","options":{"A":"无民事行为能力人对其法定代理人的请求权的诉讼时效期间，自其知道权利受到侵害之日起算","B":"技术进出口合同争议，适用普通诉讼时效","C":"向不特定对象发行的企业债券本息请求权不适用诉讼时效","D":"债务人不得以自愿履行债务后又以诉讼时效期间届满为由提出抗辩","E":"分期履行的债务，诉讼时效期间从第一期履行期限届满之日起算"},"answer":"CD","explanation":"本题考查诉讼时效的起算。选项A不当选，无民事行为能力人或者限制民 事行为能力人对其法定代理人的请求权 对其法定代理人的请求权的诉讼时效期间，自该法定代理终止 法定代理终止之日起计算。选 项B不当选，一般民事法律行为，适用普通的诉讼时效，该期间为3年 3年；某些特定民事法律关 系，如国际货物买卖合同和技术进出口合同争议，适用特殊的诉讼时效，该期间为4年 4年。选 项C当选，兑付国债、金融债券以及向不特定对象发行的企业债券本息请求权，不适用诉讼 时效的规定。选项D当选，诉讼时效期间届满后，义务人同意履行的，不得以诉讼时效期间 届满为由抗辩；义务人已经自愿履行的，不得请求返还。选项E不当选，当事人约定同一债 务分期履行的，诉讼时效自最后一期履行期限届满之日起计算。 第八章  物权法律制度 答案与解析 一、单项选择题"},{"id":"8.1","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"物权的客体是物，依不同标准可将物划分为若干类型。下列各类物中，属于天然孳息物的是 （　）。","options":{"A":"母牛腹中的小牛","B":"借款所取得的利息","C":"从香蕉树上摘下的香蕉","D":"房屋的门窗"},"answer":"C","explanation":"本题考查原物和孳息。选项A不当选、选项C当选，原物和孳息是两个独立 物，小牛还在母牛腹中，仍属一物，故仍在腹中的小牛不属于孳息；但从香蕉树上摘下的香 蕉，是原物基于自然法则所产生的，属于天然孳息。选项B不当选，借款所取得的利息，是 依据法律关系所产生的，属于法定孳息。选项D不当选，房屋和门窗不存在产出与被产出的 关系，门窗不属于孳息。"},{"id":"8.2","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"下列物权中，属于从物权的是（　）。","options":{"A":"所有权","B":"建设用地使用权","C":"宅基地使用权","D":"留置权"},"answer":"D","explanation":"本题考查物权的分类。选项AB不当选，主物权，是指不依赖其他权利而 可以单独存在的物权，如所有权、建设用地使用权。选项C不当选，宅基地使用权是指农村 集体经济组织成员依法享有的占有、使用集体所有的土地用作住宅基地的权利，也属于主物 权。选项D当选，从物权，是指不能单独存在、须依赖其他权利的存在而存在的物权。担保 物权（包含抵押权、质权、留置权），不能脱离所担保的债权单独转让。 提示：地役权由于不能离开需役地单独存在，所以属于从物权。"},{"id":"8.3","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"物权客体特定原则是物权法律制度的基本原则之一，其含义是（　）。","options":{"A":"多人不能共有一物所有权","B":"同一动产上可以同时设立两个以上留置权","C":"禁止在同一动产上同时设立抵押权和质权","D":"不得在同一物上同时设立两个以上内容相冲突的物权"},"answer":"D","explanation":"本题考查物权法的基本原则。选项A不当选，一物之上只有一个所有权， 但多人可以共有一物所有权。选项BC不当选、选项D当选，“一物一权原则”，指一个物上 只能有一个所有权，不允许同时存在两个以上互不相容的物权。本题中，留置权的设立以合 法占有为要件，同一物不可能同时为不同的主体占有，故禁止在同一物上同时设立两个以上 留置权。但两个以上抵押权、抵押权和质权可在同一物上同时并存，并不冲突。"},{"id":"8.4","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"下列不动产登记类型中，限制所有权人的处分权的是（　）。","options":{"A":"居住权登记","B":"抵押权登记","C":"预告登记","D":"异议登记"},"answer":"C","explanation":"本题考查不同类型不动产登记的法律效力。选项A不当选，居住权设立登 记后，所有权人仍可转让其不动产，居住权对受让人具有约束力，但所有权人的处分权本身 不受限制。选项B不当选，抵押权设立后，所有权人仍可转让抵押财产，抵押权原则上不受 影响。选项C当选，预告登记后，未经预告登记的权利人同意，处分该不动产的，不发生物 权效力。选项D不当选，异议登记旨在警示第三人该不动产存在权利争议，并不能直接限制 所有权人的处分权。"},{"id":"8.5","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"下列物权变动中，以登记作为对抗要件的是（　）。","options":{"A":"以正在建造的建筑物设定抵押权","B":"转让汽车所有权","C":"以建设用地使用权设定抵押权","D":"设立建设用地使用权"},"answer":"B","explanation":"本题考查物权变动的公示方式。选项AC不当选，以不动产抵押的（包括正 在建造的建筑物、建设用地使用权），抵押权自登记时设立，登记为其设立要件而非对抗要 件。选项B当选，机动车、船舶、航空器的所有权变动以交付时生效，未经登记，不得对抗 善意第三人，登记为其对抗要件。选项D不当选，建设用地使用权自登记时设立，登记为其 设立要件而非对抗要件。"},{"id":"8.6","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"下列物权变动中，未经登记，不得对抗善意第三人的是（　）。","options":{"A":"甲在其原有的房屋基础上加盖了一层楼房","B":"甲将其珍藏的古董赠与好友乙","C":"甲将厂房内的机器设备质押给银行","D":"甲将小汽车卖给乙"},"answer":"D","explanation":"本题考查物权变动的公示方式。选项A不当选，因合法建造、拆除房屋等 因合法建造、拆除房屋等 事实行为设立或者消灭物权的，自事实行为成就时发生效力 事实行为设立或者消灭物权的，自事实行为成就时发生效力。甲在其原有的房屋基础上加 盖一层楼房，在其建造行为完成时即取得所有权，并非登记取得所有权。选项B不当选、选 项D当选，交付为动产物权变动的生效要件，无须登记。但是对特殊动产（船舶、航空器、 交付为动产物权变动的生效要件，无须登记。但是对特殊动产（船舶、航空器、 机动车等）来说，未经登记，不得对抗善意第三人 机动车等）来说，未经登记，不得对抗善意第三人。选项C不当选，交付是动产质权的设立 要件，无须登记。"},{"id":"8.7","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"2024年8月15日，赵某借用朋友李某的相机，双方约定借用期为两周。8月22日，赵某决定 购买这台相机，于是发短信告知李某。8月23日，李某回复表示同意转让相机。8月26日， 赵某通过银行转账向李某付款。根据物权法律制度的规定，赵某取得该相机所有权的时间是 （　）。","options":{"A":"8 月22 日","B":"8 月23 日","C":"8 月26 日","D":"8 月15 日"},"answer":"B","explanation":"本题考查观念交付之简易交付。选项B当选，动产所有权转让之前，受 让人已经占有该动产的，属于简易交付，物权自民事法律行为生效时发生效力 简易交付，物权自民事法律行为生效时发生效力。本题中， 8月23日，李某同意卖出相机，双方意思表示达成一致，法律行为（合同）生效。"},{"id":"8.8","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"下列所有权的取得方式中，属于继受取得的是（　）。","options":{"A":"先占","B":"建造","C":"添附","D":"赠与"},"answer":"D","explanation":"本题考查所有权取得的方式。选项ABC不当选，先占、建造、添附是非基 于他人既存的权利和意志而取得，属于原始取得。选项D当选，继受取得是基于他人既存的 权利和意志而取得物权，受赠人基于赠与人既存的权利和意志取得赠与物的所有权，属于继 受取得。 第八章  物权法律制度| 答案与解析"},{"id":"8.9","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"甲向乙借款并将其一副字画质押给乙，乙又将字画交给丙保管，丙因为自身债务问题，将该 字画以市价售与不知情的丁并完成交付。下列说法正确的是（　）。","options":{"A":"甲可向丙主张返还原物","B":"乙仍享有该字画的质权","C":"丁取得该字画的所有权","D":"该字画应当返还给甲"},"answer":"C","explanation":"本题考查善意取得制度。选项C当选，根据《民法典》规定，保管人丙无 权处分质押物，但丁善意、支付合理对价且完成交付，符合善意取得要件，依法取得所有 权。选项A不当选，丁善意取得后，甲丧失字画所有权，无法主张返还原物。选项B不当选， 乙对字画的质权以占有为前提，乙将字画交由丙保管，乙对该字画间接占有。后随着丙无权 处分字画，丁善意取得字画所有权，乙对该字画丧失占有，质权消灭。选项D不当选，丁善 意取得所有权，无须返还。"},{"id":"8.10","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"下列物可以适用先占取得的是（　）。","options":{"A":"遗失的金项链","B":"山上挖出一箱唐朝古董","C":"房屋","D":"所有人抛弃的旧衣服"},"answer":"D","explanation":"本题考查先占。遗失物 遗失物（选项A不当选）、漂流物、埋藏物 漂流物、埋藏物（选项B不当 选）、隐藏物，自发布招领公告之日起 隐藏物，自发布招领公告之日起1年 1年内无人认领的，归国家所有，不能适用先占 内无人认领的，归国家所有，不能适用先占。 选项C不当选、选项D当选，先占，是指以所有的意思，先于他人占有无主动产（而非不动 产）而取得其所有权的法律事实。先占的标的物须为非法律禁止占有的无主动产。所有人抛 弃的动产属于无主动产，可以适用先占，且是先占制度的主要适用对象。"},{"id":"8.11","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"下列导致所有权消灭的法律事实中，属于民事法律行为的是（　）。","options":{"A":"将报废的家具抛在路边","B":"公司倒闭注销登记","C":"企业的纳税行为","D":"因山体滑坡导致厂内机器全部毁损，无法使用"},"answer":"A","explanation":"本题考查所有权的消灭。所有权的消灭有以下两类原因： （1）因民事法律行为而消灭。 ①单方民事法律行为：所有权抛弃（选项A当选）。 ②双方民事法律行为：所有权出让，如基于赠与、买卖、互易等合同而出让所有权。 （2）因民事法律行为以外的法律事实而消灭。 ①作为所有权人的自然人死亡或者法人终止（选项B不当选）。 ②标的物灭失（选项D不当选）。 ③判决、强制执行、罚款、没收、纳税等（选项C不当选）。 ④添附。"},{"id":"8.12","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"甲以其高端手表质押给乙并向其借款。质押期间，乙将该手表卖给不知情的丙。后丙不慎将手表遗失，被人捡到后交给失物招领机关。失物招领公告发布1年后，无人认领。失物招领 机关遂依法拍卖该手表，丁拍得该手表。下列关于该手表物权变动方式的说法中，正确的是 （　）。","options":{"A":"乙继受取得对该手表的质权","B":"丙继受取得该手表的所有权","C":"丁原始取得该手表的所有权","D":"甲对该手表的所有权绝对消灭"},"answer":"A","explanation":"本题考查所有权的取得与消灭。选项A当选，继受取得，是指基于他人 既有的权利和意志而取得物权。乙基于手表所有权人甲交付取得质权，属于继受取得。选 项B不当选，乙非手表的所有权人，处分手表的行为属无权处分，丙符合善意取得构成要 件，基于善意取得制度取得手表的所有权。在善意取得中，买受人取得物权不是基于有效的 买卖合同取得物权，而是基于法律的直接规定取得物权，因此善意取得属于原始取得。选 项C不当选，遗失物发布招领公告1年后，无人认领，归国家所有。丁拍得该手表，属于从国 家受让该手表的所有权，属于继受取得。选项D不当选，甲丧失手表所有权，而丙、丁先后 取得该手表所有权，故甲对该手表的所有权相对消灭。 问题：如何区分物权的原始取得和继受取得？ 解答：原始取得，是指不依赖于他人的权利而直接取得物权，通过自然事件或者法律 通过自然事件或者法律 的直接规定产生 的直接规定产生。通常包括善意取得、添附、先占等方式。其中，善意取得是 指在无权处分的情形下，因买受人符合法律规定的善意取得的条件，买受人可 基于法律规定直接取得物权，无须原权利人同意，故善意取得属于原始取得。 继受取得又称传来取得，是指权利自前手继（承）受（让）而来 权利自前手继（承）受（让）而来，通常通过 买卖、继承等方式取得。"},{"id":"8.13","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"甲将自己的房屋出卖给乙，房屋已交付，但未办理过户登记。双方约定在房款付清前，甲保留该房屋的所有权。后来，甲因急需资金周转，又将该房屋出卖给丙并办理了过户登记手 续。下列关于房屋所有权的说法中，正确的是（　）。","options":{"A":"甲仍享有房屋的所有权","B":"乙继受取得房屋所有权","C":"丙善意取得房屋所有权","D":"丙继受取得房屋所有权"},"answer":"D","explanation":"本题考查所有权。选项D当选，不动产物权的设定、变更及终止须经登记 生效。甲将房屋卖给乙时未办理过户登记，因此乙尚未取得该房屋的所有权。嗣后，甲将房 屋出卖给丙的行为属于有权处分，办理转移登记后，丙继受取得房屋所有权。 提示：所有权保留买卖合同仅适用于动产，不适用于不动产，故本题中，双方关于所有权保 留的约定无效。"},{"id":"8.14","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"甲、乙、丙三人共有一套房屋，分别持1/3份额。为提高房屋的价值，甲主张将该房屋地面铺上实木地板，乙表示赞同，但丙反对。根据物权法律制度的规定，下列关于本案是否可以 铺实木地板的说法中，正确的是（　）。","options":{"A":"未经全体共有人同意，甲、乙不得铺实木地板","B":"因甲、乙所占份额合计为2/3，故甲、乙可以铺实木地板","C":"甲、乙只能在自己的应有部分之上铺实木地板","D":"若甲、乙坚持铺实木地板，则须先分割共有房屋"},"answer":"B","explanation":"本题考查按份共有。选项B当选，对按份共有的不动产或者动产作重大 对按份共有的不动产或者动产作重大 修缮的，应当经占份额2/ 修缮的，应当经占份额2/3以 3以上的按份共有人同意，但是共有人之间另有约定的除外 上的按份共有人同意，但是共有人之间另有约定的除外。本题 中，甲、乙二人所占份额合计为2/3，且甲、乙、丙之间并无另外约定，即使丙反对，也可 以在该房屋铺上实木地板。"},{"id":"8.15","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"甲、乙、丙按3∶2∶1的出资比例共同购买1头耕牛，约定3人共同饲养管理，轮流使用。在乙使用耕牛期间，耕牛将同村村民丁承包地中的庄稼践踏损毁。根据《民法典》规定，下列 关于丁应如何向甲、乙、丙请求赔偿的说法中，正确的是（　）。","options":{"A":"丁只能请求乙承担全部赔偿责任","B":"丁只能请求乙承担1/3 的赔偿责任"},"answer":"C","explanation":"本题考查共有债务的承担。选项ABD不当选、选项C当选，按份共有人对 外享有连带债权、承担连带债务。甲、乙、丙三人共有的耕牛对丁造成损失，丁可以请求其 中任何一个人承担全部责任。"},{"id":"8.16","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"下列关于建筑物区分所有权的说法中，正确的是（　）。","options":{"A":"建筑区划内的道路，属于业主共有","B":"建筑区划内的绿地，属于业主共有","C":"建筑区划内的物业服务用房，属于物业公司和业主共有","D":"占用业主共有的道路用于停放汽车的车位，属于业主共有"},"answer":"D","explanation":"本题考查业主的建筑物区分所有权。选项A不当选，建筑区划内的道路属 于业主共有，但是属于城镇公共道路的除外。选项B不当选，建筑区划内的绿地属于业主共 有，但是属于城镇公共绿地或者明示属于个人的除外。选项C不当选，建筑区划内的其他公 共场所、公用设施和物业服务用房，属于业主共有。选项D当选，占用业主共有的道路或者 其他场地用于停放汽车的车位，属于业主共有。"},{"id":"8.17","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"下列关于用益物权的说法中，正确的是（　）。","options":{"A":"用益物权是自物权","B":"行使用益物权通常以占有为前提","C":"用益物权的客体仅限于动产","D":"用益物权自登记设立"},"answer":"B","explanation":"本题考查用益物权的特征。选项A不当选，用益物权属于对他人之物享有 的物权，为他物权。选项B当选、选项C不当选，用益物权是指对他人所有的不动产或动产， 依法享有占有、使用和收益的权利，其所享有和行使通常以对物之占有为前提。选项D不当 选，用益物权中，建设用地使用权、居住权自登记时设立；而土地承包经营权、地役权自合 建设用地使用权、居住权自登记时设立；而土地承包经营权、地役权自合 同生效时设立，未经登记，不得对抗善意第 同生效时设立，未经登记，不得对抗善意第三人。"},{"id":"8.18","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"甲公司依法取得编号为009号地块的建设用地使用权，用于开发商业综合体。国有土地使用权证书颁发后，甲公司以009号建设用地使用权向乙银行抵押贷款2 000万元，并利用这笔资 金在该地块上建设大型商场并通过竣工验收。根据物权法律制度的规定，下列关于乙银行抵 押权的说法中，正确的是（　）。","options":{"A":"根据“房地一体”原则，商场自动成为抵押物的一部分","B":"新增的商场不得成为抵押物的一部分","C":"抵押权实现时，法院只能拍卖009 号建设用地使用权","D":"抵押权实现时，银行有权申请人民法院将009 号建设用地使用权和商场一同拍卖，对全部拍卖所得价款，银行有权优先受偿"},"answer":"B","explanation":"本题考查建设用地使用权。选项A不当选、选项B当选，“房地一体”原 则，是指以建筑物抵押的，该建筑物占用范围内的建设用地使用权一并抵押；以建设用地使 用权抵押的，该土地上的建筑物一并抵押，但土地上的新增建筑物不作为抵押财产。本题中 大型商场为新增建筑物，故不作为抵押财产。选项CD不当选，根据“房地一体”原则，抵押 权实现时，应当依法将该土地上新增的房屋与建设用地使用权一并处分，但对新增房屋拍卖 所得款项，抵押权人无权优先受偿。"},{"id":"8.19","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"下列关于居住权的说法中，正确的是（　）。","options":{"A":"居住权没有期限限制","B":"居住权必须无偿设立","C":"设立居住权的住宅不得出租，另有约定除外","D":"居住权可以继承"},"answer":"C","explanation":"本题考查居住权。选项A不当选，居住权具有期限性。选项B不当选，居住 居住 权无偿设立，但是当事人另有约定的除外 权无偿设立，但是当事人另有约定的除外。选项C当选、选项D不当选，居住权不得转让、继 承。设立居住权的住宅不得出租，但是当事人另有约定的除外。"},{"id":"8.20","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"李某在自己承包的土地上出入不便，遂与张某书面约定在张某承包的土地上开辟一条道路供李某通行，李某每年支付给张某2万元，但未向登记机构申请登记。下列说法中，错误的是 （　）。","options":{"A":"该约定属于有关邻地通行权的相邻权约定","B":"该约定属于地役权合同","C":"如果李某将其承包的土地经营权转移给他人，受让人有权在张某承包的土地上通行","D":"如果张某将其土地承包经营权转移给他人，则善意的受让人有权拒绝李某在自己的土地上通行"},"answer":"A","explanation":"本题考查地役权、相邻权。选项A当选、选项B不当选，地役权和相邻权 的产生方式和取得对价不同。相邻权基于法律的直接规定而产生，其取得和行使通常是无偿 的；地役权则基于当事人之间的约定而产生，其取得通常是有偿的。本题中，李某和张某订 立有偿的通行合同，其属于地役权合同。选项C不当选，地役权从属于需役地所有权或者使 用权，不得与需役地分离而单独让与；土地承包经营权、建设用地使用权等转让的，地役权 一并转让。本题中，李某将其土地承包经营权转移给他人的，地役权随需役地的转让一并转 第八章  物权法律制度| 答案与解析 让给受让人，其有权在张某承包的土地上通行。选项D不当选，地役权自地役权合同生效时 地役权自地役权合同生效时 设立。当事人要求登记的，可以向登记机构申请地役权登记；未经登记，不得对抗善意第三 设立。当事人要求登记的，可以向登记机构申请地役权登记；未经登记，不得对抗善意第三 人。本题中，供役地人张某将供役地权转让给他人的，因地役权并未进行登记，故善意的受 让人有权拒绝李某在自己的土地上通行。"},{"id":"8.21","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"下列关于抵押权的说法中，正确的是（　）。","options":{"A":"抵押权属于主物权","B":"抵押权具有物上代位性","C":"抵押权的客体限于不动产","D":"抵押权是以使用、收益为目的的物权"},"answer":"B","explanation":"本题考查抵押权的性质。选项A不当选，抵押权是从属于主债权而存在 的，属于从物权。选项B当选，担保物权具有物上代位性，担保期间，担保财产毁损、灭失 或者被征收等，担保物权人可以就获得的保险金、赔偿金或者补偿金等优先受偿。选项C不 当选，抵押权的客体包括动产，也包括不动产。选项D不当选，担保物权不以担保财产之利 用为目的，而是以取得担保财产之交换价值为目的，属于价值权。"},{"id":"8.22","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"下列说法中属于担保物权的特征的是（　）。","options":{"A":"担保物权的设立以物的利用为目的","B":"担保物权是一种主权利","C":"担保物权具有物上代位性","D":"担保物权是为确保物权的实现而设立"},"answer":"C","explanation":"本题考查担保物权的特征。选项A不当选，担保物权不以担保财产之利用 为目的，而是以取得担保财产之交换价值为目的，属于价值权。选项BD不当选，担保物权 具有从属性，担保物权是为确保债权的实现而设立，其存在以债权的存在为前提。选项C当 选，担保物权具有物上代位性，担保期间，担保财产毁损、灭失或者被征收等，担保物权人 可以就获得的保险金、赔偿金或者补偿金等优先受偿。"},{"id":"8.23","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"下列各项中，属于法定担保物权的是（　）。","options":{"A":"抵押权","B":"留置权","C":"动产质权","D":"权利质权"},"answer":"B","explanation":"本题考查担保物权的性质。选项ACD不当选，意定担保物权，是指基于当 事人的约定而成立的担保物权，如抵押权和质权。选项B当选，法定担保物权，是指基于法 律规定而于一定条件下当然发生的担保物权，如留置权。"},{"id":"8.24","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"张某因生病住院急需用钱，以其价值10 000元的电脑作抵押，分别向李某借款6 000元，向赵某借款4 000元。张某与李某于5月8日签订了电脑抵押合同，双方未办理抵押登记；张某 与赵某于5月9日签订了电脑抵押合同，双方亦未办理抵押登记。后因张某无力偿还借款，李 某、赵某行使抵押权，依法拍卖张某的电脑，拍卖所得款6 000元。下列关于李某、赵某对 电脑拍卖所得款的分配方案中，正确的是（　）。","options":{"A":"李某分得3 600 元，赵某分得2 400 元","B":"李某分得4 000 元，赵某分得2 000 元","C":"李某分得3 000 元，赵某分得3 000 元","D":"李某分得5 000 元，赵某分得1 000 元"},"answer":"A","explanation":"本题考查数个抵押权的清偿顺序。选项A当选，同一财产向两个以上债权 同一财产向两个以上债权 人抵押的，抵押权的清偿顺序如下 人抵押的，抵押权的清偿顺序如下：（1）抵押权已经登记的，按照登记的时间先后确定清 抵押权已经登记的，按照登记的时间先后确定清 偿顺序 偿顺序；（2）抵押权已经登记的先于未登记的受偿 抵押权已经登记的先于未登记的受偿；（3）抵押权均未登记的，按照债权比 抵押权均未登记的，按照债权比 例清偿 例清偿。本题中，李某、赵某的抵押权均未登记，应当按照债权比例清偿，李某的债权比例 为60%，赵某的债权比例为40%，因此，在6 000元的拍卖价款中，李某应分得3 600元，赵 某应分得2 400元。"},{"id":"8.25","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"2024年3月6日，甲向乙借款10万元，借款期限为3个月，以其1辆轿车为乙设定抵押权。双方于借款当日签订了抵押合同，并于3月16日完成轿车抵押登记。4月5日，甲将该轿车卖给丙 并完成交付。根据《民法典》及相关规定，下列关于甲、丙间买卖合同效力及轿车物权变动 的说法中，正确的是（　）。","options":{"A":"3 月16 日，乙对轿车的抵押权设立","B":"4 月5 日，丙受让取得轿车所有权","C":"因轿车已抵押给乙，故甲无权转让轿车所有权","D":"因轿车已抵押给乙，故甲、丙间关于轿车的买卖合同无效"},"answer":"B","explanation":"本题考查抵押权。选项A不当选，以动产抵押的，抵押权自抵押合同生效 时设立；未经登记，不得对抗善意第三人。3月6日，乙对轿车的抵押权设立。选项B当选、 选项CD不当选，抵押期间，抵押人可以转让抵押财产。当事人另有约定的，按照其约定。本 题中，甲将轿车抵押给乙，但并不妨碍甲处分其对轿车的所有权，即甲仍然有权处分抵押的 轿车。此外，买卖合同的标的是否是抵押物并不影响买卖合同的效力。甲、丙间的买卖合同 有效，并且在4月5日甲将轿车交付给丙，丙继受取得轿车所有权。"},{"id":"8.26","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"甲为顺利得到借款，拟向出借人提供质押担保。根据《民法典》及相关规定，下列甲拟设立质押担保的财产中，交付时设立质权的是（　）。","options":{"A":"可转让的基金份额","B":"没有权利凭证的存款单","C":"有权利凭证的债券","D":"应收账款"},"answer":"C","explanation":"本题考查质押财产。选项AD不当选，以可以转让的基金份额、股权和现有 的以及将有的应收账款出质的，质权自办理出质登记时设立。选项B不当选、选项C当选，以 汇票、本票、支票、债券、存款单、仓单、提单（ 汇票、本票、支票、债券、存款单、仓单、提单（“三票三单一债券 三票三单一债券”）出质的，有权利凭 ）出质的，有权利凭 证的，质权自权利凭证交付质权人时设立；没有权利凭证的，质权自办理出质登记时设立。 证的，质权自权利凭证交付质权人时设立；没有权利凭证的，质权自办理出质登记时设立。 法律另有规定的，依照其 法律另有规定的，依照其规定。"},{"id":"8.27","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"甲公司为生产经营需要向乙合伙企业借款300万元，由丙个人独资企业提供价值200万元的房屋作抵押。乙合伙企业、丙个人独资企业签订了房屋抵押合同，但未办理抵押登记。另外， 甲公司又以一张汇票出质，与乙合伙企业签订了质押合同。甲公司将汇票交付给乙合伙企 业，但未办理出质登记。根据《民法典》的规定，下列关于本案合同效力和担保物权设立效 力的说法中，正确的是（　）。","options":{"A":"质押合同无效","B":"抵押权未设立","C":"质权未设立","D":"抵押合同无效"},"answer":"B","explanation":"本题考查抵押权和质权。选项AD不当选，抵押权和质权是否设立不影响 抵押和质押合同的效力。选项B当选，以不动产（建筑物和其他土地附着物、建设用地使用 权、海域使用权、正在建造的建筑物）抵押的，抵押权自登记时设立，未办理抵押登记的， 抵押权不能设立。本题中，丙提供的房屋抵押未办理抵押登记，抵押权未设立。选项C不当 选，以汇票出质的，质权自交付权利凭证时设立，本题中，甲公司已经将汇票交付给了乙企 业，质权已经设立。"},{"id":"8.28","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"甲将其电动自行车借给乙使用，乙在使用时发生故障，遂将电动自行车交给丙修理中心修理。丙修理中心将电动自行车修好后，乙却以电动自行车非其所有为由拒付维修费。因乙在 催告期内仍未支付维修费，丙修理中心遂变卖该电动自行车以实现其维修费债权。根据《民 法典》的规定，下列关于丙修理中心权利行使及行为效力的说法中，正确的是（　）。","options":{"A":"丙修理中心不能对电动自行车行使留置权，因乙对电动自行车无处分权","B":"丙修理中心变卖电动自行车的行为效力待定","C":"丙修理中心变卖电动自行车的行为对甲构成侵权","D":"丙修理中心可以对电动自行车行使留置权"},"answer":"D","explanation":"本题考查留置权。选项A不当选、选项D当选，债务人不履行到期债务， 债权人可以留置因同一法律关系而合法占有的动产，本题中，丙修理中心将电动自行车修好 后，乙拒付维修费，因此丙修理中心对该自行车享有留置权。选项BC不当选，债权人留置动 产后，债务人在催告期内仍不履行债务，债权人可行使变价处分权，因此，丙修理中心变卖 自行车的行为有效。 问题：如何区分占有的分类？举例说明。 解答： 分类 举例 善意占有 将别人的东西误以为是自己的而占有 恶意占有 非法占有，如小偷对偷盗物的占有 自主占有 以所有的意思而为的占有，如先占人对无主动产的占有 他主占有 不以所有的意思而为的占有，如借用人对借用物的占有 直接占有 保管人对保管物的占有（直接对物有事实上的管控力） 间接占有 寄存人对保管物的占有（间接对物有事实上的管控力）"},{"id":"8.29","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"甲卖给乙一批电脑，在运输途中遗落了一台，被丙拾到据为己有，后丙租给不知情的丁。丁对该电脑的占有状态为（　）。","options":{"A":"自主占有","B":"恶意占有","C":"直接占有","D":"善意占有"},"answer":"C","explanation":"本题考查占有的分类。选项A不当选，自主占有是指以所有的意思而为的 占有。本题中，丁租用电脑，并非以所有的意思占有，属于他主占有。选项BD不当选，区分 区分 善意占有和恶意占有的前提是占有人无权占有 善意占有和恶意占有的前提是占有人无权占有，有权占有中不分善意或恶意。而有权占有是 指基于本权（物权、债权、监护权等权利）而产生的占有。本题中，丁是基于其与丙之间的 租赁合同占有该电脑。对丙而言，丁属于有权占有。选项C当选，丁事实上占有租赁物，所 以丁对租赁物的占有属于直接占有。"},{"id":"8.30","chapter":8,"chapter_name":"物权法律制度","type":"单选","question":"甲将1幅字画交给乙保管。保管期间乙将字画送交丙装裱。装裱期间甲将该字画出售给丁，双方约定待装裱完成后由丁直接向丙请求返还字画。根据民法理论，下列关于各当事人对字 画占有状态的说法中，正确的是（　）。","options":{"A":"甲无权占有","B":"乙自主占有","C":"丙善意占有","D":"丁间接占有"},"answer":"D","explanation":"本题考查占有的分类。选项A不当选，甲在将字画出售给丁前为字画所有 权人，其对字画的占有为有权占有。选项B不当选，乙受甲所托保管该字画，为他主占有。 选项C不当选，乙将该字画送交丙装裱，此时丙基于法律上的原因对字画具有管理和控制的 事实，故丙为有权占有。而只有在无权占有的情况下，才会谈及善意占有或恶意占有。选 项D当选，在字画装裱完成时，丁基于与甲的买卖关系有权向丙请求返还字画，属于间接 占有。 第八章  物权法律制度| 答案与解析 二、多项选择题"},{"id":"8.31","chapter":8,"chapter_name":"物权法律制度","type":"多选","question":"根据《民法典》的规定，下列民事法律事实中，能引起不动产和动产物权变动的原因有（　）。","options":{"A":"先占","B":"法院判决","C":"继承","D":"赠与","E":"善意取得"},"answer":"BCDE","explanation":"本题考查物权变动。物权变动的原因，是指能够引起物权设立、变更 或者终止的法律事实。选项A不当选，先占制度只适用于动产，不适用于不动产，不能引起 不动产的物权变动。选项BCDE当选，所述情形均属于引起不动产和动产物权变动的原因。 提示：民事法律事实是引起民事法律关系的产生、变更、消灭的原因。民事法律事实包括自 然事实和行为（包括法律行为、准法律行为和事实行为）。"},{"id":"8.32","chapter":8,"chapter_name":"物权法律制度","type":"多选","question":"下列不动产物权登记中，属于发生物权变动效力的登记有（　）。","options":{"A":"甲将继承所得房屋登记到自己名下","B":"乙在其房屋上为再婚老伴设立居住权并办理登记","C":"丙将其继承的房屋卖给同事并办理过户登记","D":"丁在自己承包地上为同村村民设立通行地役权并办理登记","E":"戊以其建造中的房屋抵押向银行贷款并办理抵押登记"},"answer":"BCE","explanation":"本题考查不动产物权变动的公示方式。选项A不当选、选项C当选，因 继承取得物权的，自继承开始时取得房屋所有权 继承取得物权的，自继承开始时取得房屋所有权，因此，继承是导致物权变动的原因，而继 承以后的登记不会导致物权变动。但是继承房屋之后，再转让的，受让人取得房屋时应以登 记为物权变动的要件。选项B当选，设立居住权的，应当向登记机构申请居住权登记，居住 权自登记时设立。选项D不当选，地役权自地役权合同生效时设立。当事人要求登记的，可 以向登记机构申请地役权登记；未经登记，不得对抗善意第三人。因此，地役权的登记只是 对抗要件，而非生效要件，不会导致物权变动。选项E当选，以不动产抵押的，抵押权自办 理抵押登记时设立。抵押权也是物权的一种，抵押权从无到有，本质上也是物权的变动。"},{"id":"8.33","chapter":8,"chapter_name":"物权法律制度","type":"多选","question":"2026年5月3日，甲、乙签订汽车买卖合同，约定甲以20万元的价格将其汽车卖给乙。5月8日，甲向乙交付汽车，并与乙约定：乙于6月6日付清全部车款，甲于6月8日协助乙办理 机动车过户登记。5月20日，乙为筹措购车款将该车质押向丙借款10万元。双方签订了借款 合同和质押合同，但事后乙并未将汽车交付给丙。根据《民法典》的规定，下列关于汽车所 有权归属和物权变动的说法中，正确的有（　）。","options":{"A":"6 月6 日，付清全部车款时，乙取得汽车所有权","B":"5 月8 日，甲交付汽车时，乙取得汽车所有权","C":"5 月3 日，汽车所有权归属于甲","D":"5 月20 日，乙、丙间质押合同有效，但质权未设立","E":"6 月8 日，办理完过户登记手续时，乙取得汽车所有权"},"answer":"BCD","explanation":"本题考查物权变动的公示方式和质权。选项AE不当选、选项BC当选， 动产物权的设立和转让，自交付时发生效力，但法律另有规定的除外。本题中，甲向乙交付 汽车的时间是5月8日，交付时，乙取得所有权。选项D当选，动产质权自出质人交付质押财 产时设立，但质权未设立不影响质押合同的效力，本题中，乙丙之间虽订立了质押合同，但 是未交付汽车，丙公司对小汽车的质权未设立。"},{"id":"8.34","chapter":8,"chapter_name":"物权法律制度","type":"多选","question":"张甲立下遗嘱，将其名下某住宅指定由残疾的女儿张乙继承。张甲去世后，其儿子张丙伪造遗嘱，并办理了该房屋所有权登记，成为登记簿中记载的所有权人。张乙知情后，要求张丙 进行更正登记遭到拒绝，遂向登记机构提出异议登记申请，登记机构予以记载。在张乙、张 丙就房屋归属诉讼期间，张丙将该房屋出售给王某，王某查阅登记簿时未注意到异议登记信 息。下列说法中，正确的有（　）。","options":{"A":"在诉讼期间，张丙对该房屋的处分权不受限制","B":"诉讼期间，张丙无权处分该房屋","C":"王某为善意第三人，可以取得房屋所有权","D":"张乙应在异议登记之日起15 日内提起诉讼，否则异议登记失效","E":"若法院认定遗嘱有效，张乙将取得房屋所有权"},"answer":"ADE","explanation":"本题考查异议登记与物权变动规则。选项A当选、选项BC不当选，异议 登记是一种临时性保护措施，其并不限制登记簿记载的名义权利人对不动产的处分权。只是 名义权利人处分不动产的，即便事后证明其确无处分权，因异议登记的存在，受让人也不得 主张善意取得。选项D当选，登记机构予以异议登记，申请人自异议登记之日起15日 15日内不提 起诉讼的，异议登记失效。选项E当选，遗嘱确认有效后真实权利人可主张所有权。"},{"id":"8.35","chapter":8,"chapter_name":"物权法律制度","type":"多选","question":"甲在山上采到1棵野生灵芝，即可基于先占而取得该灵芝的所有权。下列关于先占的说法中，正确的有（　）。","options":{"A":"先占人须具有相应的民事行为能力","B":"先占既适用于动产，亦适用于不动产","C":"先占是一种非基于法律行为的物权取得方式","D":"先占的成立须先占人具有自主占有的意思","E":"我国《民法典》未规定先占规则"},"answer":"CDE","explanation":"本题考查先占。选项AB不当选、选项CD当选，先占，是指以所有的意 思，先于他人占有无主动产（不动产不适用）而取得其所有权的法律事实。因事实行为的法 律效果由法律直接规定，与行为人意思表示无关。因此，法律对行为人的主体资格并无严 格要求，即完全民事行为能力人、限制民事行为能力人、无民事行为能力人皆可实施。选 项E当选，我国《民法典》未规定先占规则。"},{"id":"8.36","chapter":8,"chapter_name":"物权法律制度","type":"多选","question":"原始取得所有权的方式包括（　）。","options":{"A":"因违法所得而没收财产","B":"继承家族企业","C":"接受遗赠","D":"善意取得","E":"收取房租利息"},"answer":"ADE","explanation":"本题考查所有权的原始取得。原始取得，指非依他人既存的权利和意志 而是基于法律规定直接取得所有权，如基于先占、生产、收取孳息（选项E当选）、添附、 无主物和罚没物的法定归属、善意取得（选项D当选）、没收（选项A当选）等法律事实而 取得所有权。选项BC不当选，继承、受遗赠等是基于他人既存的权利和意志而取得，属于继 受取得。"},{"id":"8.37","chapter":8,"chapter_name":"物权法律制度","type":"多选","question":"甲和乙签订房屋买卖合同，但并未办理权属转移登记。之后，甲为丙在该房屋上设立了居住权，并且办理了登记。之后甲与乙去办理了房屋权属的变更登记。下列关于本题的说法中， 正确的有（　）。","options":{"A":"乙取得了负担居住权的房屋的所有权","B":"丙是基于继受取得了居住权","C":"若丙对甲、乙之间买卖房屋的事项不知情，则丙基于善意取得而获得居住权","D":"甲是无权处分，居住权并未设立","E":"若广告公司要在房屋外墙印刷广告，则该广告取得的收益归丙享有"},"answer":"AB","explanation":"本题考查所有权、居住权。选项AB当选，不动产物权的设立、变更、转 让和消灭，经依法登记，发生效力；未经登记，不发生效力，但是法律另有规定的除外。丙 是基于甲既存的所有权而取得居住权，居住权自登记时设立。题述情形中，甲在为乙办理房 屋过户登记前，为丙办理了居住权登记，故丙已经继受取得居住权。之后甲与乙办理了房屋 权属的变更登记，故乙取得了负担居住权的房屋的所有权。选项CD不当选，善意取得的前提 是无权处分，而甲在为乙办理房屋权属的变更登记前是该房屋的所有权人，有权为丙设立居 住权，故不适用善意取得。选项E不当选，居住权人有权按照合同约定，对他人的住宅享有 占有、使用的用益物权，以满足生活居住的需要，一般情况下，居住权人不得利用房屋进行 一般情况下，居住权人不得利用房屋进行 收益。"},{"id":"8.38","chapter":8,"chapter_name":"物权法律制度","type":"多选","question":"根据民法上的共有理论，下列有关共有的说法中，正确的有（　）。","options":{"A":"共有可以存在于动产之上，也能存在于不动产之上","B":"按份共有的共有人不可以在其份额上设定担保物权","C":"共同共有人有重大理由需要分割时可以请求分割"},"answer":"AC","explanation":"本题考查共有的性质。选项A当选、选项D不当选，共有是多人共享同一 个所有权，无论是动产还是不动产，共有是所有权的联合，而不是所有权排他性的例外。选 项B不当选，按份共有的共有人对其份额享有自由处分权，可以在其份额上设定担保物权。 选项C当选，在共同共有关系存续期间，共同共有人原则上无分割请求权。仅在共有的基础 丧失或者有重大理由需要分割时可以请求分割。选项E不当选，按份共有人对共有的不动产 按份共有人对共有的不动产 或动产的处分行为，应当经占份额2/ 或动产的处分行为，应当经占份额2/3以 3以上的按份共有人同意，但是另有约定的除外 上的按份共有人同意，但是另有约定的除外；共同 共有人对共有的不动产或动产的处分行为应经全体共同共有人同意，另有约定除外。"},{"id":"8.39","chapter":8,"chapter_name":"物权法律制度","type":"多选","question":"下列事项中，须经参与表决专有部分面积3/4以上的业主且参与表决人数3/4以上的业主同意的有（　）。","options":{"A":"使用建筑物及其附属设施的维修资金","B":"筹集建筑物及其附属设施的维修资金","C":"改变共有部分的用途或者利用共有部分从事经营活动","D":"改建、重建建筑物及其附属设施","E":"选聘和解聘物业服务企业或者其他管理人"},"answer":"BCD","explanation":"本题考查业主的建筑物区分所有权。选项BCD当选，由业主共同决定 的事项包括：（1）制定和修改业主大会议事规则。（2）制定和修改管理规约。（3）选 举业主委员会或者更换业主委员会成员。（4）选聘和解聘物业服务企业或者其他管理 人。（5）使用建筑物及其附属设施的维修资金。（6）筹集建筑物及其附属设施的维修资 金。（7）改建、重建建筑物及其附属设施。（8）改变共有部分的用途或者利用共有部 分从事经营活动。（9）有关共有和共同管理权利的其他重大事项。业主共同决定事项， 应当由专有部分面积占比2/3以上的业主且人数占比2/3以上的业主参与表决。决定上述第 （6）～（8）项规定的事项，应当经参与表决专有部分面积3/4以上的业主且参与表决人数 3/4以上的业主同意。"},{"id":"8.40","chapter":8,"chapter_name":"物权法律制度","type":"多选","question":"下列有关用益物权的说法中，错误的有（　）。","options":{"A":"用益物权是完全物权","B":"用益物权属于对人权","C":"用益物权的客体包括不动产和动产","D":"用益物权以取得物的交换价值为目的","E":"用益物权以使用收益为目的"},"answer":"ABD","explanation":"本题考查用益物权的特征。选项A当选，完全物权是集占有、使用、 收益、处分于一身的权利。用益物权人对他人之物只能占有、使用和收益，无权处分，因 此，用益物权是定限物权 用益物权是定限物权。选项B当选，用益物权属于物权的一种，物权是对世权，而非对 人权。选项C不当选，用益物权的客体既包括不动产，也包括动产。选项D当选、选项E不当 选，价值权以取得物的交换价值为目的，用益物权是以使用收益为目的。"},{"id":"8.41","chapter":8,"chapter_name":"物权法律制度","type":"多选","question":"下列有关地役权的说法中，正确的有（　）。","options":{"A":"地役权是自物权","B":"设定地役权应当签订书面合同","C":"地役权自地役权合同生效时设立","D":"地役权属于用益物权","E":"地役权是供役地所有人或者使用人享有的权利"},"answer":"BCD","explanation":"本题考查地役权。选项A不当选、选项D当选，自物权只有所有权，地 役权属于用益物权，属于他物权。选项BC当选，设立地役权，当事人应当采用书面形式订立 地役权合同，地役权自地役权合同生效时设立。选项E不当选，地役权是需役地所有人或使 用人享有的权利。"},{"id":"8.42","chapter":8,"chapter_name":"物权法律制度","type":"多选","question":"甲、乙的承包地相邻。3月9日，甲与乙签订地役权合同，约定甲在自己承包地上为乙设立取水地役权。3月16日，双方办理了地役权登记。5月10日，甲将自己的土地承包经营权转让于 丙。5月25日，乙将自己的土地承包经营权转让于丁。根据《民法典》及相关规定，下列关 于乙的地役权变动及效力的说法中，正确的有（　）。","options":{"A":"5 月25 日之后，丙有权拒绝丁在其受让的承包地上行使取水地役权","B":"乙的取水地役权于3 月16 日地役权登记完成时设立","C":"乙的取水地役权于3 月9 日地役权合同生效时设立","D":"5 月25 日之前，乙有权在丙受让的承包地上行使取水地役权","E":"5 月10 日之后，丙有权拒绝乙在其受让的承包地上行使取水地役权"},"answer":"CD","explanation":"本题考查地役权。选项A不当选，土地承包经营权、建设用地使用权等转 让的，地役权一并转让。乙将自己的土地承包经营权转让于丁，无论地役权是否登记，丁法 定取得地役权。因此，5月25日之后，丙无权拒绝丁在其受让的承包地上行使取水地役权。 选项B不当选、选项C当选，地役权自地役权合同生效时设立。乙的取水地役权于3月9日地役 权合同生效时设立。选项D当选、选项E不当选，甲将土地承包经营权转让给丙，该项地役权 第八章  物权法律制度| 答案与解析 已经登记，丙法定负担为乙设立的地役权，因此，5月25日之前，乙有权在丙受让的承包地 上行使取水地役权。 提示：地役权自地役权合同生效时设立。当事人要求登记的，可以向登记机构申请地役权登 记；未经登记，不得对抗善意第三人。本题中已经登记，且未提及丁对登记事项是否已知， 无法判断丁是否属于善意第三人，故不适用此法条，切勿混淆。"},{"id":"8.43","chapter":8,"chapter_name":"物权法律制度","type":"多选","question":"抵押担保的债权范围可以由当事人自由约定，如果没有约定，抵押担保的范围除了主债权外，还应包括（　）。","options":{"A":"抵押权实现前的抵押物保管费用","B":"损害赔偿金","C":"违约金","D":"实现抵押权的费用","E":"利息"},"answer":"BCDE","explanation":"本题考查抵押担保的债权范围。选项A不当选、选项BCDE当选，担保 物权的担保范围可由当事人约定。若无约定，则应当包括主债权及其利息、违约金、损害赔 偿金、保管担保财产和实现担保物权的费用，此为原则性规定，但是抵押权不同于质权和留 置权，设立抵押权不转移抵押物的占有 设立抵押权不转移抵押物的占有，抵押权人更不会因此而发生保管抵押物的费用，因 此，抵押担保的债权范围不包括保管抵押物的费用。"},{"id":"8.44","chapter":8,"chapter_name":"物权法律制度","type":"多选","question":"甲公司向乙信用社借款20万元，以甲公司现有的及将有的生产设备、原材料和产品设立抵押。根据《民法典》的规定，下列关于该抵押的说法中，正确的有（　）。","options":{"A":"抵押合同应当采取书面形式订立","B":"抵押权自抵押登记完成之时设立","C":"抵押权设立后，甲公司不得再使用抵押财产","D":"抵押担保方式属于动产浮动抵押","E":"抵押担保方式不属于动产浮动抵押"},"answer":"AD","explanation":"本题考查浮动抵押。选项A当选，设立抵押权，当事人应当采用书面形 式订立抵押合同。选项B不当选，以动产抵押的，抵押权自抵押合同生效时设立，而非完成 抵押登记时设立。选项C不当选，抵押人在其特定财产上为债权人设定抵押权之后，仍可保 有对抵押财产之占有，且可对其进行使用和收益。选项D当选、选项E不当选，以现有及将有 的设备等设定抵押，意味着抵押时抵押财产的范围尚未确定，处于浮动之中，此种抵押为动 产浮动抵押。"},{"id":"8.45","chapter":8,"chapter_name":"物权法律制度","type":"多选","question":"甲向乙借款10万元，甲的朋友丙以其价值15万元的轿车提供担保，乙与丙签订了抵押合同，但未办理抵押登记。后丙向丁借款8万元，以该车设定质押。丙与丁签订了质押合同，并于 次日向丁交付了轿车。因甲和丙均未清偿各自到期债务，遂发生纠纷。下列关于本题担保物 权设立及效力的说法中，正确的有（　）。","options":{"A":"丁优先于乙就轿车变价款受偿","B":"乙和丁应当就轿车变价款按照债权比例受偿","C":"丁的质权自丙向其交付轿车时设立","D":"丁的质权自质押合同签订时设立","E":"乙的抵押权自抵押合同生效时设立"},"answer":"ACE","explanation":"本题考查抵押权和质权。选项A当选、选项B不当选，同一财产既设立 抵押权又设立质权的，拍卖、变卖该财产所得的价款按照登记、交付的时间先后确定清偿顺 序，本题中，乙的抵押权未登记，因此，丁的质权优先。选项CE当选、选项D不当选，动产 抵押权自抵押合同生效时设立，而动产质押自交付质押财产时设立。"},{"id":"8.46","chapter":8,"chapter_name":"物权法律制度","type":"多选","question":"2025年3月1日，家电经销商李某向王某借款7万元，借期3个月，以其店内价值8万元的高端冰箱作为抵押物，并于同日签订书面抵押合同。3月8日，双方办理抵押登记手续。4月1日， 赵某在李某的店铺看中该高端冰箱，并以8万元的价格购得。6月1日，因李某拒绝偿还借 款，王某向赵某主张行使抵押权，被赵某拒绝。根据《民法典》及相关规定，下列关于王某 之抵押权设立及效力的说法中，正确的有（　）。","options":{"A":"王某对高端冰箱的抵押权不能对抗赵某","B":"王某对高端冰箱的抵押权于3 月8 日完成抵押登记时设立","C":"王某可基于物权的追及效力向赵某主张行使对高端冰箱的抵押权","D":"王某对高端冰箱的抵押权于3 月1 日抵押合同生效时设立","E":"王某对高端冰箱的抵押权自3 月8 日起可以对抗善意第三人"},"answer":"ADE","explanation":"本题考查抵押权的设立与动产抵押的正常买受人规则。选项A当选、选 项C不当选，以动产抵押的，不得对抗正常经营活动中已经支付合理价款并取得抵押财产的 买受人，本题中，正常经营中的买受人（赵某）支付合理价款并取得抵押财产后，抵押权对 其不得对抗。选项B不当选、选项DE当选，以动产抵押的，抵押权自抵押合同生效时设立， 未经登记，不得对抗善意第三人。3月8日办理抵押登记后，乙可以对抗善意第三人。 提示：“正常经营买受人规则”作用于买受人，“登记对抗”作用于善意第三人，不同法条 适用不同情形，并不相悖，现实生活中善意第三人和买受人并不一定是同一人。"},{"id":"8.47","chapter":8,"chapter_name":"物权法律制度","type":"多选","question":"根据《民法典》的规定，下列财产权利中，可以出质的有（　）。","options":{"A":"建设用地使用权","B":"可以转让的股权","C":"土地经营权","D":"将有的应收账款","E":"现有的应收账款"},"answer":"BDE","explanation":"本题考查质权的客体。选项AC不当选，只有动产与权利可设立质权 只有动产与权利可设立质权， 建设用地使用权和土地经营权可以抵押，但是不能出质。债务人或者第三人有权处分的下列 权利可以出质：（1）汇票、本票、支票；（2）债券、存款单；（3）仓单、提单；（4）可 以转让的基金份额、股权（选项B当选）；（5）可以转让的注册商标专用权、专利权、著 作权等知识产权中的财产权；（6）现有的以及将有的应收账款（选项DE当选）；（7）法 律、行政法规规定可以出质的其他财产权利。"},{"id":"8.48","chapter":8,"chapter_name":"物权法律制度","type":"多选","question":"甲向乙借款，并将其1辆电动三轮车出质给乙。在质押期间，为向丙借款，乙擅自将该三轮车出质给不知情的丙，丙欠丁借款到期，丁多次催讨未果。某日，丁趁丙不在家，将该三轮 车偷偷骑走。之后向丙声称：“如不还借款，就以三轮车抵债。”下列有关三轮车占有的性 质及效力的说法中，符合《民法典》规定的有（　）。","options":{"A":"丙可基于占有返还请求权请求丁返还三轮车","B":"丙可基于物权请求权请求丁返还三轮车","C":"乙因甲的出质而善意占有三轮车","D":"丁对三轮车的占有属于恶意占有","E":"丁基于对三轮车的占有而取得留置权"},"answer":"ABD","explanation":"本题考查占有和担保物权。选项AB当选，乙擅自将三轮车出质给丙属 于无权处分，而丙对该三轮车不属于乙一事并不知情，丙可以善意取得质权，故丙对三轮车 的占有属于有权占有，而丁偷偷骑走了该三轮车，侵害了丙的占有，丙可基于占有返还请求 权请求丁返还三轮车，也可基于其善意取得质权的物权请求权请求丁返还三轮车。选项C不 当选，区分善意占有和恶意占有的前提是无权占有，本题中，乙对三轮车的占有属于有权占 有，无善意或恶意之分。选项D当选，丁对三轮车的占有属于明知无权占有却仍然占有，属 于恶意占有。选项E不当选，合法占有为留置权成立的条件之一，丁对三轮车的占有属于非 法占有，不能取得留置权。 第九章  债权法律制度 答案与解析 一、单项选择题"},{"id":"9.1","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"根据债的基本理论，下列选项中属于意定之债的是（　）。","options":{"A":"缔约过失之债","B":"不当得利之债","C":"单方允诺之债","D":"无因管理之债"},"answer":"C","explanation":"本题考查债的发生原因及债的分类。选项C当选，意定之债，是指债的发 生及其内容由当事人依其自由意思而决定的债，如合同之债、单方允诺之债。选项ABD不当 选，法定之债，是指债的发生及其内容均由法律直接规定的债，包括缔约过失之债、侵权行 为之债、无因管理之债、不当得利之债。"},{"id":"9.2","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"根据《民法典》及相关规定，下列选项中，能够在甲、乙之间产生关于侵权行为的债权债务 关系的是（　）。","options":{"A":"甲由于丢失宠物犬，在当地报纸期刊发布寻狗启事，声明将当面酬谢1 000 元现金给找到宠物犬之人","B":"甲答应同事乙下班后请其吃火锅，但由于临时加班不得不爽约","C":"甲搭乘同事乙的轿车上班，由于下雨导致道路湿滑，乙所驾的汽车不慎撞树，致使甲受伤","D":"甲同意乙于3 日后搭乘其车去郊区开会，因当天甲忘记该约定，致使乙自费打车前往郊区"},"answer":"C","explanation":"本题考查债的发生。选项A不当选，其所述情形属于单方允诺（意定之 债）的悬赏广告。选项BD不当选，其所述情形均为“好意施惠”，并未实质产生相应的债权 债务关系。选项C当选，其所述情形中，乙的行为构成侵权行为。非营运机动车发生交通事 故造成无偿搭乘人损害，属于该机动车一方责任的，应当减轻其赔偿责任，但是机动车使用 人有故意或者重大过失的除外。双方因此形成以损害赔偿为主要内容的债权债务关系，甲有 权请求乙承担侵权责任。"},{"id":"9.3","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"下列关于法律事实的说法中，能够引起不当得利之债发生的是（　）。","options":{"A":"甲池塘的螃蟹因暴雨冲入乙池塘","B":"养子女对亲生父母无赡养义务而赡养","C":"甲不知诉讼时效已过，向债权人乙清偿债务","D":"甲提前清偿欠乙的债务"},"answer":"A","explanation":"本题考查不当得利。不当得利（法定之债）是指没有合法根据，致他人受 损而获得的利益。不当得利发生后，即在得利人与受损人之间依法发生以不当利益返还为内 容的债权债务关系。选项A当选，不当得利的类型分为给付不当得利和非给付不当得利。该 选项所述事项是自然事件，属于因给付之外的法律事实而发生的非给付不当得利。选项B不 当选，为履行道德义务而进行的给付不适用不当得利。选项C不当选，诉讼时效期间届满不 影响债权，乙取得甲清偿的欠款有合法依据，不引起不当得利之债。选项D不当选，债务到 期之前的清偿不适用不当得利。"},{"id":"9.4","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"甲公司得知乙公司正在与丙公司进行商务谈判，甲公司本无意与丙公司签约合作，但为排挤 竞争对手乙公司，就向丙公司提出了更好的交易条件。乙公司退出后，甲公司借故中止谈 判，未与丙公司签约，给丙公司造成了经济损失。甲公司对丙公司依法应承担的民事责任是 （　）。","options":{"A":"侵权责任","B":"违约责任","C":"公平责任","D":"缔约过失责任"},"answer":"D","explanation":"本题考查缔约过失责任。选项D当选，甲公司实施了“假借订立合同，恶 意进行磋商”的行为，给丙公司造成信赖利益损失，应当承担缔约过失责任。"},{"id":"9.5","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"甲、乙因交通事故致行人丙受伤，须连带赔偿丙医药费10万元。但因丙得知乙是其远方 亲戚，遂免除了乙的赔偿债务。根据民法典及相关规定，丙免除乙赔偿债务的法律后果是 （　）。","options":{"A":"甲须一次性向丙支付医药费","B":"甲只需向丙赔偿5 万元医药费","C":"甲应单独向丙赔偿10 万元医药费","D":"甲作为连带债务人，也无须再向丙赔偿5 万元医药费"},"answer":"B","explanation":"本题考查连带之债的细化规定。选项B当选，连带债务人之间的内部份额 连带债务人之间的内部份额 难以确定的，视为份额相同。部分连带债务人的债务被债权人免除的，在该连带债务人应当 难以确定的，视为份额相同。部分连带债务人的债务被债权人免除的，在该连带债务人应当 第九章  债权法律制度| 答案与解析 承担的份额范围内，其他债务人对债权人的债务消灭 承担的份额范围内，其他债务人对债权人的债务消灭。题述情形下，甲、乙对债务承担的份 额难以确定，视为份额相同，即甲、乙各承担5万元。丙免除乙的赔偿5万元，所以甲只需就 剩余的5万元医药费进行赔偿。"},{"id":"9.6","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"下列关于债的类型及效力的说法中，正确的是（　）。","options":{"A":"复数主体之债对应的是简单之债","B":"不真正连带债务的发生须有当事人的约定或者法律规定","C":"种类物之债通常不发生给付不能","D":"非金钱债务的继续履行请求权无排除事由"},"answer":"C","explanation":"本题考查债的分类及债的效力。选项A不当选，根据债的双方主体人数不 同，可将债分为单数主体之债和复数主体之债；根据债的标的可否选择划分，可将债分为 简单之债、选择之债和任意之债。选项B不当选，不真正连带债务的发生是因不同法律关系 的偶然竞合所致，并非法律所规定，各债务人之间亦不可能存在约定。选项C当选，因种类 物可以相互替代，故种类物之债通常不发生给付不能，除非该种类物全部灭失。选项D不当 选，金钱债务均可以直接强制履行；非金钱债务也可以直接强制履行，但下列情形除外： （1）法律上或者事实上不能履行；（2）债务的标的不适于强制履行或者履行费用过高； （3）债权人在合理期限内未请求履行。"},{"id":"9.7","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"根据《民法典》的规定，第三人主张权利的，承租人应当及时通知出租人。该规定中，承租 人负担的“及时通知”义务属于（　）。","options":{"A":"从给付义务","B":"不真正义务","C":"附随义务","D":"后合同义务"},"answer":"B","explanation":"本题考查债务的效力。选项B当选，不真正义务，是指在债之关系中，为 使己方权利或利益完全实现，而由债权人负担的义务或风险。不真正义务的承担人为债权 人。通常，对不真正义务不得请求履行，违反它也不发生损害赔偿责任，仅使债权人遭受权 利减损或丧失的不利益。承租人的通知义务，在性质上属于不真正义务。承租人未履行通知 义务的，不发生对出租人的损害赔偿责任，出租人也不能要求此种义务的强制履行。但违反 此种义务，承租人会产生利益减损或者权利丧失的风险，可能因为未履行及时通知义务而发 生丧失请求出租人承担权利瑕疵担保责任的后果。 问题：如何区分不真正义务与附随义务？ 解答：简单来说，不真正义务是为了保护自己的利益，不履行将影响自己的利益； 附随义务是为了保护对方的利益，不履行将需要对对方承担相应的法律责 任，往往随着债的关系的发展而产生。"},{"id":"9.8","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"王某与甲公司签订了和田玉买卖合同。甲公司如期交付和田玉，但是未交付和田玉的品质鉴 定书。王某催告甲公司交付品质鉴定书后，甲公司仍然没有交付品质鉴定书。下列说法正确 的是（　）。","options":{"A":"因甲公司催告后仍不交付品质鉴定书，故王某可以不支付和田玉的价款","B":"甲公司交付品质鉴定书的义务属于次给付义务","C":"甲公司的行为属于给付迟延，王某能解除合同","D":"甲公司交付品质鉴定书的行为属于从给付义务，王某可以针对此单独提起诉讼"},"answer":"D","explanation":"本题考查债的效力。选项A不当选、选项D当选，从给付义务，是指辅助 主给付义务的义务，它并不决定债的关系类型，但债权人可以就从给付义务独立诉请履行。 题述情形中甲公司交付和田玉的品质鉴定书属于辅助买卖和田玉（主给付义务）的义务， 从给付义务未履行，不影响主给付义务的履行，故王某仍须支付和田玉的价款。选项B不当 选，次给付义务，是指当原给付义务在履行过程中，因特定事由发生变化而产生的义务。题 述情形中交付品质鉴定书是一开始便与主给付义务同时存在的从给付义务，并不是中途才产 生义务，故不属于次给付义务。选项C不当选，给付迟延的效力一般是各种赔偿，不包含解 除合同。 问题：如何区分从给付义务与次给付义务？ 解答：从给付义务是辅助主给付义务的义务，它并不决定债的关系类型（本来就 有）。比如甲将自有汽车卖给乙，交付汽车是主给付义务，交付该车的相关 文件或者资料即为从给付义务。 次给付义务是当原给付义务在履行过程中，因特定事由发生变化而产生的义 务（本来没有）。比如在买卖合同中，卖方交付标的物义务、买方支付价款 义务为原给付义务。因卖方交付的标的物存在瑕疵致买方遭受损害而产生的 损害赔偿义务为次给付义务。"},{"id":"9.9","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"2025年3月1日，甲借给乙200万元，借期1年。后甲得知乙无力偿还，且乙在2022年12月30日 曾借给丙100万元，借期1年，但乙一直未向丙主张该债权。2026年11月，甲欲行使代位权。 下列说法中，正确的是（　）。","options":{"A":"甲应当以自己的名义起诉丙，请求丙向乙履行债务","B":"甲应当以乙的名义向人民法院起诉丙","C":"甲应当以自己的名义起诉丙，请求丙向甲履行债务","D":"甲不能行使代位权，因为乙对丙的债权已过诉讼时效"},"answer":"C","explanation":"本题考查债权人的代位权。选项AB不当选、选项C当选，因债务人怠于 行使其债权，影响债权人到期债权实现的，债权人可以自己的名义代位行使债务人对相对 人的权利。代位权诉讼中，债权人应请求次债务人直接向自己履行债务，而非向原债务 人履行。选项D不当选，乙对丙的债权诉讼时效期间为3年，从2023年12月30日起算，至 2026年12月30日届满。甲在2026年11月行使代位权时，该债权尚未超过诉讼时效。"},{"id":"9.10","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"下列关于撤销权属性、行使期间及适用情形的说法中，正确的是（　）。","options":{"A":"撤销权应自债权人知道或者应当知道撤销事由之日起3 年内行使","B":"撤销权属于债的担保","C":"撤销权应自危害债权的行为发生之日起1 年内行使","D":"撤销权的适用情形包括债务人以明显不合理的低价转让财产"},"answer":"D","explanation":"本题考查债权人撤销权。选项AC不当选，撤销权自债权人知道或者应当知 撤销权自债权人知道或者应当知 道撤销事由之日起 道撤销事由之日起1年 1年内行使，自债务人的行为发生之日起 内行使，自债务人的行为发生之日起5年 5年内没有行使撤销权的，该撤销 内没有行使撤销权的，该撤销 权消灭 权消灭。选项B不当选，撤销权属于债的保全，而非债的担保。选项D当选，债权人撤销权的 适用情形包括：放弃债权、放弃债权担保、无偿转让财产等方式无偿处分财产权益，或者恶 意延长其到期债权的履行期限，以明显不合理的低价转让财产、以明显不合理的高价受让他 人财产或者为他人的债务提供担保。"},{"id":"9.11","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"甲借款给乙，约定于2021年3月1日前还清本息，丙承担连带责任保证。借款到期后，乙没有还款，甲也一直没有催乙还款。2024年4月1日，因乙一直未还款，甲遂要求丙承担保证责 任。根据民法典及相关规定，下列关于丙保证责任承担的说法中，正确的是（　）。","options":{"A":"甲必须先起诉乙，经强制执行未果后，才能要求丙承担保证责任","B":"若甲、乙变更主债权债务合同的履行期限，保证期间也随之发生变更","C":"丙有权拒绝向甲承担保证责任","D":"乙所负债务虽已超过诉讼时效期间，但丙仍应向甲承担保证责任"},"answer":"C","explanation":"本题考查保证。选项A不当选，丙提供的是连带责任保证，不享有先诉抗 辩权，甲有权直接请求丙承担保证责任。选项B不当选，债权人与债务人变更主债权债务合 同的履行期限，未经保证人书面同意的，保证期间不受影响。选项C当选、选项D不当选， 保证期间，是指确定保证人承担保证责任的期间。债权人与保证人对保证期间没有约定或 债权人与保证人对保证期间没有约定或 约定不明确的，保证期间为主债务履行期限届满之日起 约定不明确的，保证期间为主债务履行期限届满之日起6个 6个月。本题中，保证期间届满日为 2021年9月1日（主债务履行期限届满日2021年3月1日起6个月）。甲未在保证期间内请求丙 承担保证责任，因此甲对丙不享有保证债权，也不存在诉讼时效的问题。"},{"id":"9.12","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"根据合同法律制度的规定，下列关于定金类型和定金罚则的适用的说法中，错误的是（　）。","options":{"A":"当事人交付了订约金、订金等，即使未约定定金性质的，仍适用定金罚则","B":"当事人约定了定金性质，但未约定定金类型或约定不明确的，按照违约定金处理","C":"当事人约定定金性质为解约定金的，交付定金的一方有权主张以丧失定金为代价解除合同","D":"双方当事人均具有致使不能实现合同目的的违约行为，双方均无权请求适用定金罚则"},"answer":"A","explanation":"本题考查定金类型和定金罚则。选项A当选，当事人交付留置金、担保 金、保证金、订约金、押金或者订金等，但是没有约定定金性质，一方主张适用定金罚则 的，人民法院不予支持。选项B不当选，当事人约定了定金性质，但是未约定定金类型或者 约定不明，一方主张为违约定金的，人民法院应予支持。选项C不当选，当事人约定定金性 质为解约定金，交付定金的一方主张以丧失定金为代价解除合同的，或者收受定金的一方主 张以双倍返还定金为代价解除合同的，人民法院应予支持。选项D不当选，双方当事人均具 有致使不能实现合同目的的违约行为，其中一方请求适用定金罚则的，人民法院不予支持。 第九章  债权法律制度| 答案与解析 提示：当事人一方仅有轻微违约，对方具有致使不能实现合同目的的违约行为，轻微违约 方主张适用定金罚则，对方以轻微违约方也构成违约为由抗辩的，人民法院对该抗辩不予 支持。"},{"id":"9.13","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"根据《民法典》及相关规定，下列关于定金和预付款的说法中，正确的是（　）。","options":{"A":"定金合同自合同订立时成立","B":"预付款具有担保性质","C":"定金合同是实践合同","D":"定金等同于预付款"},"answer":"C","explanation":"本题考查定金和预付款。选项A不当选、选项C当选，定金合同属于实践合 同，自实际交付定金时成立。选项BD不当选，定金不同于预付款，定金属于债的担保的一 种，具有担保性质，预付款属于合同价款的一部分，不具有担保性质。"},{"id":"9.14","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"根据《民法典》的规定，下列关于债的移转的说法中，正确的是（　）。","options":{"A":"债权人转让债权，应当取得债务人同意","B":"当事人约定非金钱债权不得转让的，不得对抗第三人","C":"建设工程主体结构的施工必须由承包人自行完成，不得转包给他人","D":"债务人转让全部债务的，通知到达债权人时即可对其发生效力"},"answer":"C","explanation":"本题考查债的移转。选项A不当选，债权人可以将债权的全部或者部分转 让给第三人。债权人转让债权，未通知债务人的，该转让对债务人不发生效力。选项B不当 选，当事人约定非金钱债权不得转让的，不得对抗善意第三人；当事人约定金钱债权不得转 当事人约定非金钱债权不得转让的，不得对抗善意第三人；当事人约定金钱债权不得转 让的，不得对抗第三人 让的，不得对抗第三人。选项D不当选，债务人将债务的全部或者部分转移给第三人的，应 当经债权人同意。"},{"id":"9.15","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"下列给付义务中，应由债务人亲自履行的是（　）。","options":{"A":"汽车买卖合同的出卖人向买受人交付汽车","B":"建设工程承包人对建设工程主体结构的施工","C":"借款人将借款偿还贷款人","D":"出租人对出租房屋进行维修"},"answer":"B","explanation":"本题考查债的移转和债务承担。选项ACD不当选，在上述情形中，经债权 人同意，债务人可以转让债务。选项B当选，在不改变债的内容的前提下，债务人可以将其 债务的全部或者部分移转于第三人，但是法律规定不得移转的债务不能移转给第三人，如建 设工程主体结构的施工必须由承包人自行完成。除此之外，根据合同性质不得移转的债务， 如承揽合同中承揽方的义务；以及按照当事人的约定不得移转的债务不得移转。其他债务可 以按照法律规定转让。"},{"id":"9.16","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"张某因资金周转的需要与李某签订买卖合同，合同约定，以100万元的价格将一件藏品出售给李某，但李某无正当理由拒绝受领。于是，张某将该藏品提存。以下关于提存效力的说法 中，正确的是（　）。","options":{"A":"在李某领取提存的藏品之前，藏品的所有权属于张某","B":"自提存之日起，张某和李某的对待给付义务均已消灭","C":"如果提存期间藏品意外毁损、灭失的，李某仍需支付100 万元的价款","D":"不论李某是否付清价款，均可从提存机关领取提存的藏品"},"answer":"C","explanation":"本题考查提存。选项A不当选，提存成立时视为债务人在其提存范围内已 交付标的物，张某提存后，藏品的所有权归属于李某。选项B不当选，自提存之日起，张某 的对待给付义务消灭。因题中未提及李某是否支付价款，故无法确定李某的对待给付义务是 否消灭。选项C当选，提存后，李某应承担藏品毁损灭失的风险，因此，如提存期间藏品意 外毁损、灭失的，李某仍需支付价款。选项D不当选，提存期间，债权人对债务人负有到期 债务的，在债权人未履行债务或者提供担保之前，提存部门根据债务人的要求应当拒绝其领 取提存物。"},{"id":"9.17","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"根据《民法典》的规定，下列合同中，属于单务、无偿合同的是（　）。","options":{"A":"买卖合同","B":"委托合同","C":"赠与合同","D":"租赁合同"},"answer":"C","explanation":"本题考查合同的分类。选项ABD不当选，买卖合同、租赁合同均属于双 务、有偿合同；委托合同可有偿，亦可无偿。选项C当选，赠与合同属于单务、无偿合同。"},{"id":"9.18","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"下列关于承诺的说法中，正确的是（　）。","options":{"A":"承诺由受要约人或第三人向要约人作出","B":"承诺到达要约人时生效","C":"撤回承诺的通知与承诺同时到达要约人的，不发生撤回效力","D":"承诺均须以通知的方式作出"},"answer":"B","explanation":"本题考查承诺。选项A不当选，承诺是由受要约人向要约人作出。选项B当 选，承诺自到达要约人时生效。选项C不当选，撤回承诺的通知在承诺到达要约人前或者与 撤回承诺的通知在承诺到达要约人前或者与 承诺同时到达要约人，均可发生撤回承诺的效力 承诺同时到达要约人，均可发生撤回承诺的效力。选项D不当选，承诺一般应当以通知的方 式作出，但是，根据交易习惯或者要约表明可以通过行为作出承诺的除外。"},{"id":"9.19","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"当事人之间订立有关设立不动产物权的合同，除法律另有规定或者合同另有约定外，自合同成立时生效；未办理物权登记的，其产生的效果是（　）。","options":{"A":"不影响合同效力","B":"合同无效","C":"合同待生效","D":"合同可撤销"},"answer":"A","explanation":"本题考查物权和合同的关系。选项A当选，当事人之间订立有关设立不动 产物权的合同，除法律另有规定或者合同另有约定外，自合同成立时生效；未办理物权登记 的，不影响合同效力。"},{"id":"9.20","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"《民法典》规定：“当事人互负债务，没有先后履行顺序的，应当同时履行。一方在对方履行之前有权拒绝其履行请求。一方在对方履行债务不符合约定时，有权拒绝其相应的履行请 求。”该规定中当事人享有的权利是（　）。","options":{"A":"同时履行抗辩权","B":"不安抗辩权","C":"后履行抗辩权","D":"形成权"},"answer":"A","explanation":"本题考查双务合同履行中的抗辩权。选项A当选，没有先后履行顺序的， 没有先后履行顺序的， 双方应当同时履行，一方不履行的，另一方可以主张同时履行抗辩权 双方应当同时履行，一方不履行的，另一方可以主张同时履行抗辩权。选项BC不当选，不安 抗辩权和后履行抗辩权适用于合同有先后履行顺序的情形，选项D不当选，对请求权的拒绝 体现“抗辩权”，而非“形成权”。 问题：如何区分双务合同履行中的抗辩权？ 解答：没有先后履行顺序（同时 同时履行）的是同时履行抗辩权；有先后履行顺序的， 后履行 后履行一方有权拒绝履行债务的是后履行抗辩权；先履行 先履行一方可以暂时中止 合同履行的是不安抗辩权。"},{"id":"9.21","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"甲从商场购得一台电视机，发现缺少遥控器，于是向商场索要，商场称：“遥控器需另外购买。”双方因此产生纠纷。下列关于本案纠纷处理及商场行为性质的说法中，正确的是 （　）。","options":{"A":"商场的行为构成缔约过失","B":"商场应当在交付电视机的同时交付遥控器","C":"商场拒绝交付遥控器的行为合法，因为遥控器和电视机是两个不同的物","D":"本案中的合同关系属于选择之债，商场有选择交付标的物的权利"},"answer":"B","explanation":"本题考查买卖合同与债的分类。选项A不当选，缔约过失责任产生于缔约 阶段，即合同订立过程中，本题中合同已经成立，不涉及缔约过失。选项B当选、选项C不 当选，遥控器对于电视机来说起辅助配合作用，故电视机和遥控器分别属于主物和从物。一 般情况下，主物所有权转移的，从物所有权也随之转移，即对主物的处分及于从物，因此， 商场应当在交付电视机的同时交付遥控器。选项D不当选，选择之债，指债的标的有数宗， 当事人可以选择其中之一为履行标的。可供选择的数宗给付须是内容相异、并列待选的。本 题中的电视与遥控器并不属于并列待选的标的，商场应当交付电视机及遥控器，并无选择的 权利。"},{"id":"9.22","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"甲、乙在干洗机买卖合同中约定，在乙付清全部货款之前，干洗机所有权仍属于甲。随后，甲将干洗机交付给乙。根据《民法典》的规定，下列关于甲、乙约定的效力及干洗机所有权 归属的说法中，正确的是（　）。","options":{"A":"甲、乙约定无效，在货款付清之前，干洗机所有权归属于乙","B":"甲、乙约定可撤销，在货款付清之前，乙可以撤销","C":"甲、乙约定效力待定，在货款付清之时确定生效","D":"甲、乙约定有效，在货款付清之前，干洗机所有权归属于甲"},"answer":"D","explanation":"本题考查所有权保留买卖合同。选项D当选，当事人可以在买卖合同中约 定买受人未履行支付价款或者其他义务的，标的物所有权属于出卖人。该等合同为所有权保 留买卖合同。此类约定有效，货款付清之前，干洗机所有权仍归属于债权人甲。"},{"id":"9.23","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"2024年6月3日，甲演艺公司向乙乐器店购买10把某品牌吉他，约定1周后付款。次日，甲演艺公司运回吉他途中遭遇泥石流，10把吉他全部报废。下列关于甲演艺公司、乙乐器店之间 债的类型、买卖合同生效时间及风险负担的说法中，正确的是（　）。","options":{"A":"因10 把吉他已全部报废，故甲演艺公司无须向乙乐器店支付货款","B":"因泥石流属于不可抗力，故乙乐器店无权请求甲演艺公司支付货款","C":"6 月3 日，甲演艺公司、乙乐器店所签买卖合同属于种类物之债","D":"6 月3 日，甲演艺公司、乙乐器店所签买卖合同于1 周后甲付清货款时生效"},"answer":"C","explanation":"本题考查买卖合同的风险负担。选项AB不当选，标的物毁损灭失的风险， 在标的物交付之前由出卖人承担，交付之后由买受人承担。法律另有规定或者当事人另有约 定除外。题述情形下，吉他已交付甲演艺公司，同时风险也转移给甲演艺公司，即使吉他因 在运输途中遭遇泥石流报废，甲演艺公司也应当支付价款。选项C当选，种类物之债，是指 以种类物为标的的债，即标的物在债之关系成立时未加特定，因此是可以替代的。6月3日， 订立买卖合同时，甲演艺公司并未指定乙乐器店交付特定的10把吉他。因此，甲演艺公司和 乙乐器店之间所订立买卖合同属于种类物之债。选项D不当选，依法成立的合同一般成立即 生效。 提示：所有权保留买卖合同中的风险承担问题同样遵循“标的物毁损灭失的风险，在标的物 交付之前由出卖人承担，交付之后由买受人承担 付之前由出卖人承担，交付之后由买受人承担”的原则。"},{"id":"9.24","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"下列关于保证及保证合同特征的说法中，错误的是（　）。","options":{"A":"保证属于人的担保","B":"保证合同属于不要式合同","C":"保证属于信用担保","D":"保证合同属于从合同"},"answer":"B","explanation":"本题考查保证及保证合同。选项A不当选，保证，是指第三人和债权人约 定，当债务人不履行到期债务或者发生当事人约定的情形时，由第三人按照约定履行债务或 者承担责任，属于人的担保。选项B当选、选项D不当选，保证合同属于单务、无偿、诺成、 要式合同，也属于从合同。选项C不当选，保证属于信用担保。"},{"id":"9.25","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"下列关于民间借贷合同成立及效力的说法中，正确的是（　）。","options":{"A":"自然人之间的借款合同自合同订立时成立","B":"公司之间的借款合同自借款交付时成立"},"answer":"C","explanation":"本题考查民间借贷合同。选项AB不当选，民间借贷合同包括自然人之间 的借款合同和其他借款合同，自然人之间的借款合同属于践成合同，自贷款人提供借款时成 自然人之间的借款合同属于践成合同，自贷款人提供借款时成 立；其他借款合同属于诺成合同，自合同成立时生效。选项C当选，民间借贷合同约定利率 民间借贷合同约定利率 的上限为合同成立时一年期贷款市场报价利率的 的上限为合同成立时一年期贷款市场报价利率的4倍 4倍，超过部分无效 ，超过部分无效。选项D不当选，民间借 民间借 第九章  债权法律制度| 答案与解析 贷合同的借款的利息不得预先在本金中扣除。利息预先在本金中扣除的，应当按照实际借款 贷合同的借款的利息不得预先在本金中扣除。利息预先在本金中扣除的，应当按照实际借款 数额返还借款并计算 数额返还借款并计算利息。"},{"id":"9.26","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"根据《民法典》的规定，下列关于租赁合同的说法中，正确的是（　）。","options":{"A":"承租人应当履行租赁物的维修义务","B":"未采用书面形式的租赁合同无效","C":"租赁期限超过20 年的，超过部分无效","D":"租赁合同是双务、有偿、实践合同"},"answer":"C","explanation":"本题考查租赁合同。选项A不当选，租赁合同中，出租人应当履行租赁物 的维修义务，但当事人另有约定的除外。选项B不当选，租赁合同是不要式合同，租赁期限 租赁合同是不要式合同，租赁期限 6个 6个月以上的，应当采用书面形式；当事人未采用书面形式，无法确定租赁期限的，视为不 月以上的，应当采用书面形式；当事人未采用书面形式，无法确定租赁期限的，视为不 定期租赁 定期租赁。该等事由不会影响租赁合同效力。选项C当选，租赁期限可由当事人约定，但约 定的租赁期限不得超过20年，超过20年的，超过部分无效。选项D不当选，租赁合同是双 务、有偿、诺成合同，而非实践合同。"},{"id":"9.27","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"甲大学与乙公司签订合同，定作70年校庆纪念杯5 000只，双方约定于校庆日前交付。下列关于甲大学、乙公司所签合同特点及效力的说法中，正确的是（　）。","options":{"A":"乙公司制作纪念杯的原材料应由甲大学提供","B":"若乙公司违约，甲大学可请求强制履行","C":"乙公司可以自行将纪念杯的制作任务交由他人完成","D":"在乙公司交付纪念杯之前，甲大学可以随时解除合同"},"answer":"D","explanation":"本题考查承揽合同。选项A不当选，题述情形下，甲大学、乙公司签订的 合同为定作合同（承揽合同），即承揽人按照定作人的具体指定，用自己的材料制成成品交 付定作人，取得定作物价金的合同，因此，制作材料应由乙公司提供。选项B不当选，承揽 人交付的工作成果不符合质量要求的，应当承担修理、重作、减少报酬、赔偿损失等违约责 任，甲大学不得请求强制履行。选项C不当选，承揽人应当以自己的设备、技术和劳力，完 成主要工作，但当事人另有约定的除外。选项D当选，定作人享有任意解除权，但定作人应 定作人享有任意解除权，但定作人应 当赔偿因解除造成的承揽人 当赔偿因解除造成的承揽人损失。 提示：加工合同中，定作人提供材料或半成品，由承揽人加工；在定作合同中，承揽人提供 材料并制成成品交付定作人。"},{"id":"9.28","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"甲委托乙房产中介公司（以下简称“乙公司”）帮其寻找合适的房源。乙公司经筛选发现丙的待售房屋满足甲的要求，遂告知甲。之后，甲与丙约定10日内签订房屋买卖合同。丙因意 外事故未能在10日内从国外返回，导致甲、丙房屋买卖合同未能签订。根据《民法典》的规 定，下列关于乙公司报酬及费用请求权的说法中，正确的是（　）。","options":{"A":"乙公司可以请求丙支付其从事中介活动产生的全部必要费用","B":"因未促成甲、丙签订房屋买卖合同，乙公司不能请求甲支付报酬","C":"乙公司可以请求甲与丙各支付一半报酬","D":"乙公司可以请求甲支付其从事中介活动的报酬及产生的必要费用"},"answer":"B","explanation":"本题考查中介合同。选项B当选，中介人促成合同成立的，委托人应当按 照约定支付报酬。中介人未促成合同成立的，虽不得请求支付报酬，可以按照约定请求委托 人支付从事中介活动支出的必要费用。题述情形中，合同未订立，交易未促成，因此，乙不 能请求甲支付报酬。至于是否支付必要费用，题中未提及是否有约定，则不予考虑。"},{"id":"9.29","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"根据《民法典》的规定，下列关于合同性质及效力认定的说法中，正确的是（　）。","options":{"A":"甲拟购买乙一套价值500 万元的商品房，并按约定向乙支付定金150 万元，该定金合同因定金数额超过合同标的额20% 而无效","B":"甲向乙购买一辆轿车，合同约定分两次付款，该合同属于分期付款买卖合同","C":"甲、乙经磋商签订一份意向书，约定半年内根据双方业务发展情况签订正式合同，未约定将来所要订立合同的主体、标的等内容，该意向书不构成预约合同","D":"甲赠送乙一辆轿车，同时约定乙负责接送一名残疾儿童上下学一个月，该合同属于双务合同"},"answer":"C","explanation":"本题考查合同性质及效力。选项A不当选，定金的数额由当事人约定；但 是，不得超过主合同标的额的20%，超过部分不产生定金的效力；并非使定金合同无效。选 项B不当选，分期付款买卖合同要求买受人将应付的总价款在一定期限内至少分 分期付款买卖合同要求买受人将应付的总价款在一定期限内至少分3次 3次向出卖人 向出卖人 支付 支付。选项C当选，当事人通过签订意向书或者备忘录等方式，仅表达交易的意向，未约定 在将来一定期限内订立合同，或者虽然有约定但是难以确定将来所要订立合同的主体、标的 等内容，一方主张预约合同成立的，人民法院不予支持。选项D不当选，赠与合同是诺成合 同、无偿合同、单务合同、不要式合同。赠与合同可以附义务，赠与附义务的，受赠人应当 按照约定履行义务。但这并不影响赠与合同的无偿、单务合同的性质，因为赠与合同中所负 的“义务”不能等同于赠与财产的“对价”。"},{"id":"9.30","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"根据《民法典》的规定，下列选项中不属于侵权责任的归责原则中过错责任的构成要件的是（　）。","options":{"A":"损害","B":"违反合同义务","C":"加害行为违法","D":"行为人的过错"},"answer":"B","explanation":"本题考查侵权责任的归责原则。过错责任，即行为人因其过错而承担责 任，其构成要件有：（1）损害（选项A不当选）；（2）加害行为违法（选项C不当选）； （3）加害行为与损害之间存在因果关系；（4）行为人的过错（选项D不当选）。选项B当 选，违反合同义务并不属于过错责任的构成要件。"},{"id":"9.31","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"甲在自家开放式阳台上养了数盆花，一日刮大风，一盆花被风吹落，将楼下路过的行人乙头部砸伤，乙到医院缝了5针，支付医药费若干。此案中，若追究甲的赔偿责任，应适用的归 责原则是（　）。","options":{"A":"过错责任原则","B":"过错推定责任原则","C":"无过错责任原则","D":"公平责任原则"},"answer":"B","explanation":"本题考查建筑物和物件损害责任的归责原则。选项B当选，建筑物的搁置 建筑物的搁置 物坠落造成他人损害，所有人、管理人或者使用人不能证明自己没有过错的，应当承担侵权 物坠落造成他人损害，所有人、管理人或者使用人不能证明自己没有过错的，应当承担侵权 责任 责任。因此，该等情形适用过错推定原则。 提示：无过错责任原则与过错推定原则不同的是，不论行为人有无过错（无须“自证清 白”），法律规定应承担侵权责任的，即承担。"},{"id":"9.32","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"甲公司铺设燃气管道，在路中挖一条深沟，设置了明显路障和警示标志。乙驾车撞倒全部标志，致丙骑摩托车路经该地时避让不及而驶向人行道，撞伤行人丁。根据《民法典》规定， 丁所受损害应当（　）。","options":{"A":"由甲、乙共同承担连带赔偿责任","B":"由甲、乙、丙共同承担连带赔偿责任","C":"由乙承担赔偿责任","D":"由乙、丙共同承担连带赔偿责任"},"answer":"C","explanation":"本题考查物件致损与侵权责任的免责。在公共场所或者道路上挖掘、修缮 安装地下设施等造成他人损害，施工人不能证明已经设置明显标志和采取安全措施的，应当 承担侵权责任。选项AB不当选，本题中甲公司已经在路上设置了明显路障和警示标志，因 此，甲公司不承担责任。选项D不当选、选项C当选，因为乙驾车撞倒已设置好的明显路障和 警示标志，导致丙紧急情况下避让不及才驶向人行道，撞伤行人丁，该情形属于紧急避险。 因紧急避险造成损害的，由引起险情发生的人（乙）承担民事责任，避险人（丙）不承担 责任。"},{"id":"9.33","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"旅游公司司机简某在送旅客前往旅游景点途中违章行驶，发生交通事故，致使游客张某受伤。下列关于旅游公司与简某对张某的责任承担的说法中，正确的是（　）。","options":{"A":"由旅游公司对张某承担赔偿责任","B":"由旅游公司与简某对张某承担按份赔偿责任","C":"由简某对张某承担赔偿责任","D":"由旅游公司与简某对张某承担连带赔偿责任"},"answer":"A","explanation":"本题考查雇主责任。选项A当选，与用人单位形成劳动关系的工作人员、 执行用人单位工作任务的其他人员，因执行工作任务造成他人损害，由用人单位承担侵权责 任。本题中，司机简某是在送旅客前往景点途中致游客张某受伤，即因执行工作任务造成的 他人损害，应由旅游公司对张某承担赔偿责任。"},{"id":"9.34","chapter":9,"chapter_name":"债权法律制度","type":"单选","question":"甲公司和业主乙签订承揽合同，乙委托甲公司拆除其房屋内的一面墙。乙在合同中明确要求甲必须采用静力切割方式拆除，避免震动影响邻居。但甲为节省成本，违规使用大锤砸墙， 导致墙体倒塌，不仅砸坏邻居丙的家具还造成丙重伤，丙损失共计10万元。经调查发现，甲 公司并无装修资质，乙对甲公司是否具备装修资质的事实未进行审查确认。下列对丙损害的 责任承担说法中，正确的是（　）。","options":{"A":"应由甲公司承担全部赔偿责任，乙不承担责任","B":"应由乙承担全部赔偿责任，甲公司不承担责任","C":"甲公司和乙均有过错，应就10 万元赔偿额承担连带责任","D":"甲公司承担全部责任，乙在其过错范围内与甲公司共同承担责任"},"answer":"D","explanation":"本题考查特殊主体侵权责任。承揽人、定作人责任均属于过错责任。承 揽人在完成工作过程中因过错造成第三人损害，由承揽人承担侵权人应承担的全部责任；定 作人在定作、指示或者选任过错范围内与承揽人共同承担责任，但责任主体实际支付的赔偿 费用总和不应超出被侵权人应受偿的损失数额。定作人先行支付赔偿费用后，就超过自己相 应责任的部分可以向承揽人追偿。选项D当选、选项ABC不当选，本题中，甲公司作为承揽 人无装修资质且采用大锤砸墙方式拆除墙体导致倒塌，存在过错，应承担侵权赔偿的全部责 任。乙作为定作人未审查确认甲公司是否具有装修资质，存在选任过错，应在其选任过错范 围内与承揽人甲公司共同承担责任。 二、多项选择题"},{"id":"9.35","chapter":9,"chapter_name":"债权法律制度","type":"多选","question":"根据《民法典》的规定，下列能引起债发生的法律事实有（　）。","options":{"A":"甲盗用乙的设计图发布在权威网站获奖","B":"甲公司缴纳企业所得税","C":"甲、乙两个鱼塘相邻，下雨后水位上涨，甲鱼塘的鱼游到了乙鱼塘","D":"甲公司生产毛绒玩具","E":"甲在河边散步时捡到一颗好看的石头"},"answer":"AC","explanation":"本题考查债的发生原因。债发生的原因包括合同、缔约过失、单方允 诺、侵权行为、无因管理以及不当得利。选项A当选，甲盗用乙的设计图属于侵权行为。 选项C当选，由于天气原因，甲鱼塘的鱼游到乙鱼塘，乙获得了财产利益而甲受到了损失， 属于不当得利。选项BDE不当选，所述情形分别属于纳税、生产和先占，均不会引起债的 发生。"},{"id":"9.36","chapter":9,"chapter_name":"债权法律制度","type":"多选","question":"根据债的基本理论，属于给付迟延的构成要件的有（　）。","options":{"A":"给付须为可能","B":"债务人有拒绝给付的意思表示","C":"债务未届履行期"},"answer":"AE","explanation":"本题考查债务违反之给付迟延。给付迟延的构成要件包括：（1）债务已 届满履行期（选项C不当选）；（2）给付须为可能（选项A当选）；（3）须有可归责于债 务人的事由（选项E当选）；（4）债务人未为给付。选项B不当选，债务人拒绝给付可能构 成给付拒绝，而非给付迟延。选项D不当选，标的物灭失会导致不可能给付，构成的是给付 不能，而非给付迟延。"},{"id":"9.37","chapter":9,"chapter_name":"债权法律制度","type":"多选","question":"甲公司将一艘货船卖给乙公司。下列关于给付义务类型的说法中，正确的有（　）。","options":{"A":"甲公司、乙公司完成交易后对交易所涉商业秘密的保密义务属于后合同义务","B":"甲公司在订立合同前将货船有关情况向乙公司如实告知的义务属于合同的从给付义务","C":"乙公司支付货款的义务属于合同的主给付义务","D":"甲公司将货船的有关文件或者资料交与乙公司的义务属于合同的附随义务","E":"甲公司交付货船的义务属于合同的主给付义务"},"answer":"ACE","explanation":"本题考查给付义务的类型。选项A当选，后合同义务和前合同义务相 对，前合同义务是合同生效前的义务，后合同义务是合同关系消灭后的义务，甲、乙完成交 易后对交易所涉商业秘密的保密义务属于后合同义务。选项B不当选，当事人为订立合同而 进行接触、磋商阶段所负担的说明、告知、保护、注意等义务属于前合同义务，不属于从给 第九章  债权法律制度| 答案与解析 付义务。选项CE当选，甲公司交付货船的义务和乙公司支付货款的义务属于主给付义务。选 项D不当选，交付货船相关文件或者资料为从给付义务，而非附随义务。 问题：关于债务的效力的辨析。 解答：（1）前合同义务是合同生效前 生效前的义务，后合同义务是合同关系消灭后 消灭后的义 务；附随义务是在合同订立后 订立后，合同终止前 终止前，随着发展情形产生的。 （2）从给付义务与附随义务辨析。 从给付义务强调给付 给付动作；附随义务随债的关系发展情形而发生，并非自始 确定。 （3）附随义务与不真正义务的辨析。 附随义务强调“为他人好 为他人好”，如宾馆保障旅客财产安全；不真正义务强调 “为自己好 为自己好”，如非违约方采取必要措施防止损失扩大。"},{"id":"9.38","chapter":9,"chapter_name":"债权法律制度","type":"多选","question":"债务人对第三人享有的下列权利中，债权人可以代位行使的有（　）。","options":{"A":"人身损害赔偿请求权","B":"货款给付请求权","C":"扶养费请求权","D":"租金给付请求权","E":"运费给付请求权"},"answer":"BDE","explanation":"本题考查债权人的代位权。债权人不得就专属于债务人自身的债权行使 代位权。专属于债务人自身的债权包括：（1）抚养费、赡养费或者扶养费请求权（选项C不 当选）；（2）人身损害赔偿请求权（选项A不当选）；（3）劳动报酬请求权，但是超过 债务人及其所扶养家属的生活必需费用的部分除外；（4）请求支付基本养老保险金、失业 保险金、最低生活保障金等保障当事人基本生活的权利；（5）其他专属于债务人自身的权 利。选项BDE当选，货款给付请求权、租金给付请求权以及运费给付请求权非专属于债务人 自身的债权，债权人可以代位行使。"},{"id":"9.39","chapter":9,"chapter_name":"债权法律制度","type":"多选","question":"甲将其对乙的债权先后转让给了丙和丁。1月1日，甲通知乙将债权转让给了丁。2月1日，甲通知乙将债权转让给了丙。根据合同法律制度的规定，下列说法中，正确的有（　）。","options":{"A":"债权因多重转让，转让均不发生效力","B":"因为丁属于最先通知的受让人，故乙应向丁履行债务","C":"因为甲的债权先转让给了丙，故乙应向丙履行债务","D":"若乙向丙履行了债务，丁有权请求乙继续向其履行债务","E":"若乙向丙履行了债务，丁有权请求丙返还其接受的财产"},"answer":"BD","explanation":"本题考查债权的多重转让。选项AC不当选、选项B当选，让与人将同一 债权转让给两个以上受让人，债务人以已经向最先通知的受让人履行为由主张其不再履行债 债务人以已经向最先通知的受让人履行为由主张其不再履行债 务的，人民法院应予支持 务的，人民法院应予支持。本题中，债权多重转让的，转让人和受让人的合同均有效，即甲 与丙、甲与丁的转让合同均有效。甲于1月1日通知乙将债权转让给了丁；于2月1日通知乙将 债权转让给了丙，因此丁属于最先通知的受让人，乙应向丁履行债务。选项D当选、选项E不 当选，债务人明知接受履行的受让人不是最先通知的受让人，最先通知的受让人请求债务人 继续履行债务或者依据债权转让协议请求让与人承担违约责任的，人民法院应予支持；选 项E不当选，最先通知的受让人请求接受履行的受让人返还其接受的财产的，人民法院不予 支持，但是接受履行的受让人明知该债权在其受让前已经转让给其他受让人的除外。"},{"id":"9.40","chapter":9,"chapter_name":"债权法律制度","type":"多选","question":"甲公司欠乙公司货款5万元到期未还。乙公司逾期未付甲公司5万元加工费。下列有关甲、乙公司主张抵销的说法中，正确的有（　）。","options":{"A":"甲、乙公司均不可以单方主张抵销","B":"若甲公司主张抵销，须经乙公司同意方可","C":"若甲公司主张抵销，通知乙公司即可","D":"若乙公司主张抵销，通知甲公司即可","E":"若乙公司主张抵销，须经甲公司同意方可"},"answer":"CD","explanation":"本题考查法定抵销。法定抵销应具备下列条件：（1）须双方互享债权、 互负债务；（2）须双方互负债务属于同一种类；（3）须主动债权已届至清偿期；（4）须 债权债务依其性质或者法律规定可以为抵销。选项A不当选，本题中，甲公司和乙公司互享 债权、互负债务，双方互负的债务均属于金钱之债，属于同一种类，甲公司欠乙公司的货款 与乙公司欠甲公司的加工费均已至清偿期，且该债权债务非禁止抵销的债权债务，因此，当 事人双方均可以主张抵销。选项BE不当选、选项CD当选，对于法定抵销，当事人一方主张 抵销的，应当通知对方，无须对方同意。通知自到达对方时生效，双方对等数额的债权债务 即归于消灭。根据题干可知，甲公司欠乙公司的货款已到期，乙公司欠甲公司的加工费也已 到期。因此双方均可主动抵销，且只需要通知对方即可。"},{"id":"9.41","chapter":9,"chapter_name":"债权法律制度","type":"多选","question":"根据《民法典》的规定，下列关于招投标环节属性的说法中，正确的有（　）。","options":{"A":"招标是要约邀请","B":"投标是要约邀请","C":"招标是要约","D":"投标是要约","E":"定标是承诺"},"answer":"ADE","explanation":"本题考查要约和要约邀请。选项A当选、选项C不当选，招标是招标人 向数个相对人公开发出缔约的愿望，即希望他人向自己发出要约的意思表示，属于要约邀 请。选项B不当选、选项D当选，投标是受招标人许可的人以接受标书为条件向招标人发出缔 约意思表示，即希望与他人订立合同的意思表示，属于要约。选项E当选，定标是招标人对 所有投标进行评估，选择最优投标人承诺与之缔约，属于承诺。"},{"id":"9.42","chapter":9,"chapter_name":"债权法律制度","type":"多选","question":"下列关于格式条款法律规定的说法中，正确的有（　）。","options":{"A":"对格式条款有两种以上解释的，应当作出有利于提供格式条款一方的解释","B":"格式条款的提供者对与对方有重大利害关系的异常条款负有提请注意义务和说明义务","C":"对格式条款理解发生争议的，应当按照通常理解予以解释","D":"格式条款与非格式条款不一致的，应当采用非格式条款","E":"格式条款排除对方权利的一律无效"},"answer":"BCD","explanation":"本题考查格式条款。选项A不当选、选项C当选，对格式条款的理解发 生争议的，应当按照通常理解予以解释；对格式条款有两种以上解释的，应当作出不利于提 供格式条款一方的解释。选项B当选，提供格式条款的一方在合同订立时应当采用通常足以 引起对方注意的文字、符号、字体等明显标识，提示对方注意免除或者减轻其责任、排除或 者限制对方权利等与对方有重大利害关系的异常条款，并且应当按照对方的要求，就与对方 有重大利害关系的异常条款的概念、内容及其法律后果以书面或者口头形式向对方作出通常 能够理解的解释说明。提供格式条款的一方未履行提示或者说明义务，致使对方没有注意 或者理解与其有重大利害关系的条款的，对方可以主张该条款不成为合同的内容。选项D当 选，格式条款和非格式条款不一致的，应当采用非格式条款。选项E不当选，提供格式条款 一方排除对方主要权利的条款无效，而不是一律无效。"},{"id":"9.43","chapter":9,"chapter_name":"债权法律制度","type":"多选","question":"甲将其房屋卖给乙，房屋买卖合同签订3天后，双方结清房款并办理过户登记。乙装修过程中，邻居告诉乙，该房屋内之前发生过非正常死亡事件。乙查证属实，遂找甲要求退房并请 求赔偿损失，甲拒绝。根据《民法典》的规定，下列关于甲、乙之间房屋买卖合同生效时间 及效力状态的说法中，正确的有（　）。","options":{"A":"房屋买卖合同因欺诈而自始无效","B":"房屋买卖合同属于可撤销合同","C":"房屋买卖合同生效与否与登记无关","D":"房屋买卖合同自办理登记手续时生效","E":"房屋买卖合同自成立时生效"},"answer":"BCE","explanation":"本题考查民事法律行为的效力及买卖合同的成立等。选项A不当选、选 项B当选，题述情形下，甲未向乙披露（无论是甲不清楚该房屋为“凶宅”，抑或是故意未 披露），该合同均可撤销。只不过若甲故意不披露，则构成欺诈；而甲不知情则可能构成重 大误解。该等情形均属于可撤销合同。可撤销合同被撤销前为生效合同，撤销后自始无效 可撤销合同被撤销前为生效合同，撤销后自始无效。 选项CE当选、选项D不当选，一般情况下，当事人意思表示一致合同即成立并生效。登记不 影响合同生效与否，而是会产生物权变动的效力。 提示：如果甲不知情，就把凶宅卖出去，会构成重大误解，属于可撤销合同；如果甲知情， 还隐瞒着把凶宅卖出去，则构成欺诈，依然属于可撤销合同。"},{"id":"9.44","chapter":9,"chapter_name":"债权法律制度","type":"多选","question":"甲、乙约定：若乙考上音乐学院，甲即将其珍藏的一把小提琴以1.5万元的价格卖给对该琴心仪已久的乙。后甲因急需用钱将该小提琴以1万元的价格卖给了丙（丙不知甲、乙间的约 定），且钱货两清。乙考上音乐学院后，向甲求购小提琴未果。双方遂发生纠纷。下列有关 小提琴买卖合同效力及乙的请求权的说法中，正确的有（　）。","options":{"A":"甲、乙间买卖合同先于甲、丙间买卖合同生效","B":"甲、丙间买卖合同有效","C":"甲、乙间买卖合同有效","D":"乙有权请求甲承担违约责任","E":"乙无权请求丙返还小提琴，因丙已经善意取得小提琴所有权"},"answer":"BCD","explanation":"本题考查合同的效力等。选项A不当选、选项BC当选，乙能否考上音 乐学院是一件不确定的事情，甲和乙之间的合同属于附条件的买卖合同，附条件的合同自条 件成就时生效，因此，甲和乙之间的买卖合同在乙考上音乐学院后才生效；而甲和丙之间的 买卖合同为一般买卖合同，成立即生效。故甲、丙之间的买卖合同先于甲、乙之间的买卖合 同生效。选项D当选，甲和乙之间的买卖合同有效，但是甲未能按约将小提琴交付给乙，甲 应承担违约责任。选项E不当选，甲将小提琴卖给丙时属于有权处分，不涉及善意取得的问 题，丙基于买卖合同而继受取得小提琴所有权。"},{"id":"9.45","chapter":9,"chapter_name":"债权法律制度","type":"多选","question":"根据《民法典》的规定，以标的物的交付作为成立要件的合同有（　）。","options":{"A":"保管合同","B":"租赁合同","C":"定金合同","D":"自然人之间借款合同","E":"仓储合同"},"answer":"ACD","explanation":"本题考查合同性质。选项ACD当选，以标的物的交付作为成立要件的 合同为践成合同，其主要包括保管合同、定金合同、自然人之间的借款合同、借用合同。选 项BE不当选，租赁合同、仓储合同为诺成合同。"},{"id":"9.46","chapter":9,"chapter_name":"债权法律制度","type":"多选","question":"下列关于债权人受领迟延及其构成要件的说法中，正确的有（　）。","options":{"A":"受领迟延是指债务人违反诚信原则","B":"构成受领迟延须债务人已按债的内容提出给付，使债权人处于可受领状态","C":"受领迟延是债权人对协助义务的违反","D":"构成受领迟延须债权人未予受领，包括不能受领和拒绝受领","E":"受领迟延是指债务人超过时间未予给付"},"answer":"BCD","explanation":"本题考查受领迟延。选项AE不当选、选项C当选，受领迟延，是债权 人对债务人已提出的给付，未受领或者未为给付完成提供必要协助的事实，是债权人（而非 第九章  债权法律制度| 答案与解析 债务人）对协助义务的违反。债权人受领迟延的构成要件包括：（1）须有履行上需要债权 人协助的债务；（2）须债务人已按债的内容提出给付，使债权人处于可予受领的状态（选 项B当选）；（3）须债权人未予受领，包括不能受领和拒绝受领两种情况（选项D当选）。"},{"id":"9.47","chapter":9,"chapter_name":"债权法律制度","type":"多选","question":"因周转资金，甲将一件珍藏品以50万元价格卖给乙，后乙无正当理由拒绝受领，甲遂将该藏品提存。下列关于提存效力的说法中，正确的有（　）。","options":{"A":"在乙领取提存的藏品之前，藏品的所有权归甲","B":"自提存之日起，甲、乙双方对待给付义务均已消灭","
